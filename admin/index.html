  if (pending.isApprox) {
    lines.push("");
    lines.push("* Pode haver itens (de pedidos ou de compras de estoque) cujo produto foi removido do cadastro depois — esses não entram nesta nota nem no total acima.");
  }
  return lines.join("\n");
}

// Mensagem do "Fazer pedido" — pede um novo lote de produtos pro
// fornecedor, com o detalhamento completo (produto, modelo, quantidade e,
// se já souber, o custo unitário) pra não dar margem a erro no que vai
// ser entregue. Bem diferente da nota de itens pendentes acima: aqui NÃO
// tem linguagem de "pendente"/"dívida"/"falta pagar" — é só o pedido em
// si, nada foi comprado nem lançado no Caixa ainda.
function buildOrderMessage(supplier, items, notes) {
  const lines = [];
  lines.push(`${STORE_NAME} - ${STORE_SUBTITLE}`);
  lines.push(`CNPJ: ${STORE_CNPJ}`);
  lines.push("");
  lines.push(`Pedido de compra — ${supplier.name}`);
  lines.push(`Gerado em ${formatDateTime(new Date().toISOString())}`);
  lines.push("");
  lines.push("Itens do pedido:");
  const allHaveCost = items.length > 0 && items.every((it) => it.unitCost != null);
  let total = 0;
  items.forEach((it) => {
    lines.push(`• ${it.quantity}x ${it.productName}${it.variantName ? ` (${it.variantName})` : ""}`);
    if (it.unitCost != null) {
      lines.push(`  Custo unit.: ${formatBRL(it.unitCost)} · Subtotal: ${formatBRL(it.unitCost * it.quantity)}`);
      total += it.unitCost * it.quantity;
    }
  });
  if (allHaveCost) {
    lines.push("");
    lines.push(`TOTAL ESTIMADO: ${formatBRL(total)}`);
  }
  if (notes && notes.trim()) {
    lines.push("");
    lines.push("Observações:");
    lines.push(notes.trim());
  }
  return lines.join("\n");
}

// Nome de arquivo a partir do nome do fornecedor (sem acento, sem
// espaço) — usado tanto na nota em PDF quanto na nota em imagem.
function supplierFileSlug(supplier) {
  return supplier.name.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // tira acento
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "fornecedor";
}

// Quebra um texto em várias linhas pra caber numa largura máxima (em
// px) — mesma ideia do doc.splitTextToSize() do jsPDF, só que pro
// Canvas 2D (que não tem esse helper pronto).
function wrapCanvasText(ctx, text, maxWidth) {
  const words = String(text).split(" ");
  const lines = [];
  let current = "";
  words.forEach((word) => {
    const test = current ? `${current} ${word}` : word;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });
  lines.push(current);
  return lines;
}

// Mesma nota de fornecedor (pendências pra ele), só que desenhada num
// <canvas> em vez de um PDF — gera uma IMAGEM (JPG), bem mais fácil de
// mandar pelo WhatsApp direto do celular do que um PDF (abre direto
// como foto, sem precisar de app de leitor de PDF).
function buildSupplierNoteCanvas(supplier, pending) {
  const width = 900;
  const margin = 40;
  const usableWidth = width - margin * 2;
  const cols = {
    pedido: { x: margin, w: 80 },
    data: { x: margin + 80, w: 80 },
    item: { x: margin + 160, w: 330 },
    qtd: { x: margin + 490, w: 50 },
    entregue: { x: margin + 540, w: 70 },
    unit: { x: margin + 610, w: 100 },
    subtotal: { x: margin + 710, w: 100 },
  };
  const tableHeaderHeight = 40;
  // A legenda do "Entreg." ganha uma segunda linha só quando existe pelo
  // menos um item de compra de estoque (fornecedorEntregou === null) —
  // por isso a altura reservada pra ela varia (1 ou 2 linhas), e isso
  // PRECISA entrar certinho no cálculo da altura total do canvas abaixo
  // (senão o texto fica cortado, já que o canvas não "cresce sozinho").
  const hasEstoqueRows = pending.rows.some((r) => r.fornecedorEntregou === null);
  const legendHeight = pending.rows.length > 0 ? (hasEstoqueRows ? 42 : 22) : 0;

  // Usa um canvas provisório só pra medir o texto (fonte precisa bater
  // com a usada no desenho final) — o Canvas 2D não tem como calcular a
  // altura total ANTES de existir um canvas com contexto configurado.
  const measure = document.createElement("canvas").getContext("2d");
  measure.font = "13px Arial, sans-serif";
  const rowsLayout = pending.rows.map((r) => {
    const itemLabel = `${r.productName}${r.variantName ? ` (${r.variantName})` : ""}`;
    const wrapped = wrapCanvasText(measure, itemLabel, cols.item.w - 12);
    const rowHeight = Math.max(36, wrapped.length * 18 + 14);
    return { ...r, wrapped, rowHeight };
  });
  measure.font = "italic 12px Arial, sans-serif";
  const approxLines = pending.isApprox
    ? wrapCanvasText(measure, "* Pode haver itens (de pedidos ou de compras de estoque) cujo produto foi removido do cadastro depois — esses não entram nesta nota nem no total acima.", usableWidth)
    : [];

  const headerBlockHeight = 150 + (supplier.phone ? 24 : 0);
  const rowsHeight = rowsLayout.length > 0 ? rowsLayout.reduce((sum, r) => sum + r.rowHeight, 0) : 44;
  const footerHeight = 70 + legendHeight + (approxLines.length ? approxLines.length * 16 + 10 : 0);
  const height = Math.round(margin + headerBlockHeight + tableHeaderHeight + rowsHeight + footerHeight);

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, height);

  let y = margin;
  ctx.fillStyle = "#0f1a3c";
  ctx.font = "bold 28px Arial, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(STORE_NAME, margin, y + 22);
  y += 38;
  ctx.fillStyle = "#444444";
  ctx.font = "15px Arial, sans-serif";
  ctx.fillText(`${STORE_SUBTITLE} · CNPJ ${STORE_CNPJ}`, margin, y + 12);
  y += 34;

  ctx.fillStyle = "#0f1a3c";
  ctx.font = "bold 21px Arial, sans-serif";
  ctx.fillText(`Nota de itens pendentes — ${supplier.name}`, margin, y + 16);
  y += 32;
  ctx.fillStyle = "#444444";
  ctx.font = "14px Arial, sans-serif";
  ctx.fillText(`Gerado em ${formatDateTime(new Date().toISOString())}`, margin, y + 12);
  y += 22;
  if (supplier.phone) {
    ctx.fillText(`Telefone: ${supplier.phone}`, margin, y + 12);
    y += 24;
  }
  y += 14;

  function drawTableHeader() {
    ctx.fillStyle = "#141e46";
    ctx.fillRect(margin, y, usableWidth, tableHeaderHeight);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13px Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Origem", cols.pedido.x + 8, y + 25);
    ctx.fillText("Data", cols.data.x + 8, y + 25);
    ctx.fillText("Item", cols.item.x + 8, y + 25);
    ctx.textAlign = "right";
    ctx.fillText("Qtd", cols.qtd.x + cols.qtd.w - 8, y + 25);
    ctx.textAlign = "center";
    ctx.fillText("Entreg.", cols.entregue.x + cols.entregue.w / 2, y + 25);
    ctx.textAlign = "right";
    ctx.fillText("Custo unit.", cols.unit.x + cols.unit.w - 8, y + 25);
    ctx.fillText("Subtotal", cols.subtotal.x + cols.subtotal.w - 8, y + 25);
    y += tableHeaderHeight;
  }

  drawTableHeader();

  if (rowsLayout.length === 0) {
    ctx.fillStyle = "#555555";
    ctx.font = "italic 14px Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Nenhum item pendente pra este fornecedor no momento.", margin, y + 26);
    y += 44;
  }

  rowsLayout.forEach((r, idx) => {
    if (idx % 2 === 1) {
      ctx.fillStyle = "#f4f5f9";
      ctx.fillRect(margin, y, usableWidth, r.rowHeight);
    }
    const textY = y + 24;
    ctx.fillStyle = "#141414";
    ctx.font = "13px Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(r.kind === "estoque" ? "Estoque" : `Nº ${String(r.orderNumber ?? "").padStart(6, "0")}`, cols.pedido.x + 8, textY);
    ctx.fillText(formatDate(r.date), cols.data.x + 8, textY);
    r.wrapped.forEach((line, i) => ctx.fillText(line, cols.item.x + 8, textY + i * 18));
    ctx.textAlign = "right";
    ctx.fillText(r.quantity != null ? String(r.quantity) : "—", cols.qtd.x + cols.qtd.w - 8, textY);
    ctx.textAlign = "center";
    ctx.font = "bold 13px Arial, sans-serif";
    ctx.fillStyle = r.fornecedorEntregou === null ? "#8a8a8a" : (r.fornecedorEntregou ? "#107a4a" : "#b42828");
    ctx.fillText(r.fornecedorEntregou === null ? "—" : (r.fornecedorEntregou ? "S" : "N"), cols.entregue.x + cols.entregue.w / 2, textY);
    ctx.fillStyle = "#141414";
    ctx.font = "13px Arial, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(r.unitCost != null ? formatBRL(r.unitCost) : "—", cols.unit.x + cols.unit.w - 8, textY);
    ctx.fillText(formatBRL(r.subtotal), cols.subtotal.x + cols.subtotal.w - 8, textY);
    y += r.rowHeight;
  });

  y += 16;
  ctx.strokeStyle = "#999999";
  ctx.beginPath();
  ctx.moveTo(margin, y);
  ctx.lineTo(margin + usableWidth, y);
  ctx.stroke();
  y += 30;
  ctx.fillStyle = "#141414";
  ctx.font = "bold 19px Arial, sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(`TOTAL: ${formatBRL(pending.total)}`, margin + usableWidth, y);
  ctx.textAlign = "left";

  if (rowsLayout.length > 0) {
    y += 24;
    ctx.fillStyle = "#777777";
    ctx.font = "12px Arial, sans-serif";
    ctx.fillText('"Entreg." = fornecedor já entregou o item pra loja: S = sim, N = ainda não.', margin, y);
    if (hasEstoqueRows) {
      y += 20;
      ctx.fillText('"—" = item de compra de estoque (já está na loja, só falta pagar).', margin, y);
    }
  }

  if (approxLines.length > 0) {
    y += 22;
    ctx.fillStyle = "#777777";
    ctx.font = "italic 12px Arial, sans-serif";
    approxLines.forEach((line, i) => ctx.fillText(line, margin, y + i * 16));
  }

  return canvas;
}

// Acha o cliente cadastrado cujo WhatsApp bate com o do pedido, comparando
// só os dígitos (assim funciona mesmo se um tiver "+55" e o outro não).
function findCustomerByPhone(phone) {
  const digits = String(phone ?? "").replace(/\D/g, "");
  if (!digits) return null;
  return state.customers.find((c) => String(c.whatsapp ?? "").replace(/\D/g, "") === digits) ?? null;
}

// Resumo de "já comprou antes" pra mostrar direto no card do pedido, sem
// precisar ir até a aba Clientes procurar. Mesma fonte de dado da aba
// Clientes (cash_entries do tipo "entrada" vinculadas ao cliente) — só
// conta compras ANTERIORES a este pedido (exclui o lançamento deste
// próprio pedido, se já existir um). Retorna null quando não tem
// cliente cadastrado com esse WhatsApp ou quando é a primeira compra
// dele, pra não poluir o card de todo mundo com "0 compras anteriores".
function customerHistorySummary(order) {
  const customer = findCustomerByPhone(order.customer_whatsapp);
  if (!customer) return null;
  const previousPurchases = state.cashEntries.filter(
    (e) => e.customer_id === customer.id && e.entry_type === "entrada" && e.order_id !== order.id
  );
  if (previousPurchases.length === 0) return null;
  const total = previousPurchases.reduce((sum, e) => sum + Number(e.amount), 0);
  return { count: previousPurchases.length, total };
}

// Confere se o pedido mudou no banco desde a última vez que a lista foi
// carregada, ANTES de aplicar uma ação rápida (Aceitar, Cancelar, marcar
// Pago, etc.) — como só vocês dois mexem no painel ao mesmo tempo, a
// chance de colisão é pequena, mas sem essa checagem quem salva por
// último "vence" calado (ex: um aceita enquanto o outro cancela). Se
// detectar que mudou, avisa e recarrega a lista em vez de sobrescrever
// o que o outro admin acabou de fazer. Mesma ideia já usada no "Editar
// pedido" (comparação de updated_at antes de salvar).
async function checkOrderNotStale(orderId) {
  const local = state.orders.find((o) => o.id === orderId);
  if (!local) return true;
  const { data, error } = await supabaseClient.from("orders").select("updated_at").eq("id", orderId).single();
  if (error || !data) return true;
  if (data.updated_at !== local.updated_at) {
    alert("Esse pedido foi alterado (por você em outra aba ou pelo outro admin) enquanto a tela estava aberta. A lista foi atualizada com a versão mais recente — confira e repita a ação se ainda for o caso.");
    await loadOrders();
    renderApp();
    return false;
  }
  return true;
}

// "Iniciar venda": gera o lançamento correspondente no Caixa a partir de
// um pedido do Catálogo (evita ter que digitar tudo de novo à mão). Se o
// pedido tinha embalagem de presente escolhida, já vincula o material
// usado também (o que dá baixa automática no estoque).
async function iniciarVenda(order) {
  if (state.cashEntries.some((e) => e.order_id === order.id)) {
    alert("Esse pedido já tem uma venda registrada no Caixa.");
    return;
  }

  const itemsDesc = [
    ...(order.items ?? []).map((it) => `${it.quantity}x ${it.product_name}${it.variant_name ? ` (${it.variant_name})` : ""}`),
    ...(order.giftWraps ?? []).map((g) => `${g.quantity}x ${g.material_name} (embalagem)`),
  ].join(", ");
  const customer = findCustomerByPhone(order.customer_whatsapp);

  const payload = {
    entry_type: "entrada",
    entry_date: todayISO(),
    amount: order.total,
    category: "Venda",
    description: `Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")} — ${itemsDesc}`,
    payment_method: order.payment_method,
    customer_id: customer ? customer.id : null,
    order_id: order.id,
    // Reflete o "Pago" de verdade do próprio pedido — antes isso vinha
    // sempre preenchido com a data de agora, então o Caixa mostrava o
    // dinheiro como recebido mesmo quando o pedido ainda estava marcado
    // como "Não pago". Se o pedido for marcado como pago depois, o
    // lançamento continua "Não pago" até alguém marcar manualmente na
    // aba Caixa (os dois campos são independentes, igual antes).
    paid_at: order.paid_at ? new Date().toISOString() : null,
    created_by: state.currentUser.id,
  };

  const { data: inserted, error } = await supabaseClient.from("cash_entries").insert(payload).select("id").single();
  if (error) { alert("Não foi possível registrar a venda no Caixa: " + error.message); return; }

  // Junto com a entrada, lança também a saída do custo (produto +
  // embalagem de presente) desse pedido — assim o Caixa reflete o lucro
  // de verdade, não só o valor cobrado do cliente. NÃO inclui o custo de
  // materiais "Essenciais": esse já vira saída no Caixa quando o
  // material é COMPRADO (em Materiais, ao aumentar o estoque) — somar de
  // novo aqui descontaria o mesmo gasto duas vezes do saldo do Caixa.
  // Sem lançar se der zero (a tabela não aceita saída de R$ 0,00).
  const cost = orderCost(order);
  if (cost.costExcludingEssentials > 0) {
    const custoPayload = {
      entry_type: "saida",
      entry_date: todayISO(),
      amount: Math.round(cost.costExcludingEssentials * 100) / 100,
      category: "Custo do pedido",
      description: `Custo (produto + embalagem) do Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")}${cost.isApprox ? " (estimado — produto ou material não está mais cadastrado)" : ""}`,
      payment_method: null,
      customer_id: customer ? customer.id : null,
      order_id: order.id,
      paid_at: new Date().toISOString(),
      created_by: state.currentUser.id,
    };
    const { error: custoError } = await supabaseClient.from("cash_entries").insert(custoPayload);
    if (custoError) console.error("iniciarVenda custo:", custoError.message);
  }

  const giftWrapRows = (order.giftWraps ?? [])
    .filter((g) => g.material_id && state.materials.some((m) => m.id === g.material_id))
    .map((g) => {
      const material = state.materials.find((m) => m.id === g.material_id);
      return { cash_entry_id: inserted.id, material_id: material.id, quantity: g.quantity, unit_cost: material.unit_cost };
    });
  if (giftWrapRows.length > 0) {
    const { error: linkError } = await supabaseClient.from("cash_entry_materials").insert(giftWrapRows);
    if (linkError) console.error("iniciarVenda materiais:", linkError.message);
  }

  // "Iniciar venda" já registra o recebimento no Caixa — nesse ponto o
  // pedido está finalizado, então também marca como "Concluído" na hora
  // (não precisa mais clicar em "Marcar como concluído" à parte depois).
  // IMPORTANTE: checa o erro aqui (igual os outros botões de status) —
  // sem isso, se essa atualização falhar (ex: sessão expirada), o Caixa
  // recebe o lançamento normalmente mas o pedido fica preso em "Novo"
  // sem nenhum aviso na tela.
  const { error: statusError } = await supabaseClient.from("orders").update({
    status: "concluido", updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
  }).eq("id", order.id);
  if (statusError) {
    console.error("iniciarVenda status:", statusError.message);
    alert("A venda foi registrada no Caixa, mas não foi possível marcar o pedido como 'Concluído': " + statusError.message + "\n\nUse o campo de status do pedido pra marcar manualmente.");
  }

  await Promise.all([loadCashEntries(), loadMaterials(), loadOrders()]);
  renderPedidos(document.getElementById("main-content"));
}

function renderPedidos(container) {
  // Ordenação da lista, por aba:
  //   - "Em andamento": ordem CRONOLÓGICA (mais antigo primeiro) — é a
  //     fila de produção/entrega: mostra qual pedido foi recebido
  //     primeiro e, portanto, deve ser entregue primeiro.
  //   - Outras abas: pedidos NÃO pagos ficam em evidência, no topo da
  //     lista — o resto mantém a ordem normal (mais recente primeiro,
  //     como já vem de loadOrders). Array.prototype.sort é estável em
  //     todo navegador moderno, então essa ordenação secundária é
  //     preservada.
  const visible = state.orders
    .filter((o) => o.status === pedidosState.tab)
    .sort((a, b) => pedidosState.tab === "em_andamento"
      ? new Date(a.created_at) - new Date(b.created_at)
      : Number(!!a.paid_at) - Number(!!b.paid_at));
  // A seleção pertence à aba atual. Remove itens que ficaram selecionados
  // numa aba anterior (ou que já não existem), evitando totais e ações
  // sobre pedidos invisíveis na tela.
  [...pedidosState.selected].forEach((id) => { if (!visible.some((o) => o.id === id)) pedidosState.selected.delete(id); });
  const selectedCount = pedidosState.selected.size;
  const allVisibleSelected = visible.length > 0 && visible.every((o) => pedidosState.selected.has(o.id));

  // Custo (não confundir com o valor cobrado do cliente) de cada pedido
  // visível, calculado uma vez só aqui e reaproveitado tanto no card
  // individual quanto na soma dos pedidos selecionados.
  const orderCosts = new Map(visible.map((o) => [o.id, orderCost(o)]));
  const deliveryDeadlines = new Map(visible.map((o) => [o.id, orderDeliveryDeadline(o)]));
  const customerHistories = new Map(visible.map((o) => [o.id, customerHistorySummary(o)]));
  const selectedIds = [...pedidosState.selected];
  // Mantém a lista de pedidos selecionados disponível para todos os cálculos
  // abaixo. Na V7.1, selectedProfitEstimate referenciava selectedOrders sem
  // declarar a variável, gerando ReferenceError e interrompendo toda a tela
  // de Pedidos antes mesmo de o HTML ser desenhado.
  const selectedOrders = visible.filter((o) => pedidosState.selected.has(o.id));
  const selectedProductCostTotal = selectedIds.reduce((sum, id) => sum + (orderCosts.get(id)?.productCost ?? 0), 0);
  const selectedMaterialsCostTotal = selectedIds.reduce((sum, id) => sum + (orderCosts.get(id)?.materialsCost ?? 0), 0);
  const selectedCostTotal = selectedProductCostTotal + selectedMaterialsCostTotal;
  const selectedProductHasApprox = selectedIds.some((id) => orderCosts.get(id)?.isProductApprox);
  const selectedMaterialsHasApprox = selectedIds.some((id) => orderCosts.get(id)?.isMaterialsApprox);
  const selectedHasApprox = selectedProductHasApprox || selectedMaterialsHasApprox;
  // "Entrada" = o valor que o pedido gera de receita (o que o cliente
  // paga), pra comparar lado a lado com o custo dos pedidos selecionados.
  const selectedEntradaTotal = selectedIds.reduce((sum, id) => sum + Number(state.orders.find((o) => o.id === id)?.total ?? 0), 0);
  const selectedProfitEstimate = selectedOrders.reduce((sum, o) => {
    const c = orderCosts.get(o.id) || orderCost(o);
    return sum + orderMoneySplit(o, c).profit;
  }, 0);

  // ---- Resumo geral (independe de aba/status e de qualquer seleção) ----
  // Pedidos cancelados ficam de fora das quatro contas: não viraram venda
  // real, então não entram em lucro, valor recebido/a receber nem despesas.
  //   - Lucro real: soma de (valor cobrado − custo) só dos pedidos já
  //     PAGOS — dinheiro que já entrou, descontado o custo.
  //   - Valores recebidos: soma do valor cobrado (o.total) dos pedidos já
  //     PAGOS — a entrada PURA, sem descontar custo (diferente do Lucro
  //     real, que já é depois do custo).
  //   - Valores a receber: soma do valor cobrado dos pedidos NÃO pagos —
  //     quanto ainda falta receber dos clientes.
  //   - Despesas: soma do custo (produto + materiais) de TODOS os
  //     pedidos, pagos ou não — o custo já é real assim que o produto é
  //     feito/vendido, independente de o cliente já ter pago. NÃO é o
  //     saldo de saídas do Caixa (que mistura outras coisas, tipo compra
  //     de material essencial em lote antes de virar venda).
  //   - Falta pagar (fornecedor): soma só do custo do PRODUTO (sem
  //     materiais — embalagem/essencial são gasto interno da loja, não
  //     do fornecedor) dos pedidos cujo "Fornecedor pago" ainda não foi
  //     marcado. Independe de o cliente já ter pago ou não.
  const statsOrders = state.orders.filter((o) => o.status !== "cancelado");
  let lucroReal = 0;
  let lucroRealHasApprox = false;
  let valoresRecebidos = 0;
  let valoresAReceber = 0;
  // "Despesas" é seccionada em 3 números: só produto, só materiais
  // (embalagem de presente + essenciais como fio/cola/etiqueta), e o
  // total (soma dos dois) — cada seção com sua própria flag de "≈"
  // (custo aproximado), já que um pedido pode ter só o produto
  // descadastrado, só o material, os dois, ou nenhum.
  let despesasProductTotal = 0;
  let despesasProductHasApprox = false;
  let despesasMaterialsTotal = 0;
  let despesasMaterialsHasApprox = false;
  let despesasTotal = 0;
  let despesasHasApprox = false;
  let faltaPagarFornecedor = 0;
  let faltaPagarHasApprox = false;
  statsOrders.forEach((o) => {
    const c = orderCost(o);
    // Custo (despesas/falta-pagar-fornecedor) continua contando mesmo
    // pra pedidos-brinde — o gasto é real independente de o produto ter
    // sido cobrado do cliente ou dado de presente.
    despesasProductTotal += c.productCost;
    if (c.isProductApprox) despesasProductHasApprox = true;
    despesasMaterialsTotal += c.materialsCost;
    if (c.isMaterialsApprox) despesasMaterialsHasApprox = true;
    despesasTotal += c.cost;
    if (c.isApprox) despesasHasApprox = true;
    orderSupplierUnpaidItems(o).forEach((it) => {
      const product = state.products.find((p) => p.id === it.product_id);
      if (!product) { faltaPagarHasApprox = true; return; }
      faltaPagarFornecedor += effectiveCost(product, variantByName(product, it.variant_name)) * it.quantity;
    });
    // Já os valores de receita (recebidos/a receber/lucro) ficam de fora
    // pra pedidos-brinde: nada foi cobrado do cliente (total = 0), então
    // não faz sentido entrar aqui nem aparecer como "a receber".
    if (o.payment_method === "brinde") return;
    if (o.paid_at) {
      valoresRecebidos += Number(o.total);
      const split = orderMoneySplit(o, c);
      lucroReal += split.profit;
      if (c.isApprox) lucroRealHasApprox = true;
    } else {
      valoresAReceber += Number(o.total);
    }
  });

  // Quebra de "Valores a receber" por cliente (soma quando o mesmo
  // cliente tem mais de um pedido não pago), do maior valor pro menor.
  const receivablesByCustomer = new Map();
  statsOrders.forEach((o) => {
    if (!o.paid_at && o.payment_method !== "brinde") receivablesByCustomer.set(o.customer_name, (receivablesByCustomer.get(o.customer_name) || 0) + Number(o.total));
  });
  const receivablesList = [...receivablesByCustomer.entries()].sort((a, b) => b[1] - a[1]);

  // "Produtos a receber (fornecedor)": pedidos com pelo menos um item
  // ainda pendente do fornecedor/fabricante (não atendido pelo estoque
  // da loja nem já entregue) — do mais antigo pro mais novo, pra
  // destacar o que está esperando há mais tempo primeiro.
  const produtosAReceberOrders = statsOrders
    .filter((o) => orderSupplierPendingItems(o).length > 0)
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  container.innerHTML = `
    <div class="flex flex-col gap-6">
      <div>
        <h1 class="text-xl font-semibold text-navy-900">Pedidos</h1>
        <p class="text-sm text-navy-500">Pedidos feitos pelos clientes no Catálogo público. Em cada pedido, o painel mostra quanto preservar de custo, o lucro e a divisão do lucro entre reinvestimento e sua retirada.</p>
      </div>

      <div id="edit-order-overlay-slot"></div>

      <div class="orders-kpi-grid">
        <div class="orders-kpi-card flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="Soma do valor cobrado (entrada pura, sem descontar custo) dos pedidos já PAGOS, de qualquer status (exceto cancelados).">
          <p class="text-xs font-medium text-navy-500">Valores recebidos (entradas)</p>
          <p class="text-lg font-semibold text-blue-700">${formatBRL(valoresRecebidos)}</p>
        </div>
        <div class="orders-kpi-card flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="${lucroRealHasApprox ? "Inclui custo aproximado — algum produto ou material de um pedido pago não está mais cadastrado. " : ""}Soma de (valor cobrado − custo) só dos pedidos já PAGOS, de qualquer status (exceto cancelados) — dinheiro que já entrou de verdade.">
          <p class="text-xs font-medium text-navy-500">Lucro real (pedidos pagos)</p>
          <p class="text-lg font-semibold text-emerald-700">${lucroRealHasApprox ? "≈ " : ""}${formatBRL(lucroReal)}</p>
        </div>
        <div class="orders-kpi-card flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="Soma do valor dos pedidos NÃO pagos ainda, de qualquer status (exceto cancelados) — quanto falta receber dos clientes.">
          <p class="text-xs font-medium text-navy-500">Valores a receber (não pagos)</p>
          <p class="text-lg font-semibold text-red-600">${formatBRL(valoresAReceber)}</p>
          ${receivablesList.length > 0 ? `
            <div class="mt-1.5 flex flex-col gap-0.5 border-t border-navy-50 pt-1.5">
              ${receivablesList.map(([name, amount]) => `
                <span class="flex items-baseline justify-between gap-2 text-[11px] text-navy-400">
                  <span class="truncate">${escapeHtml(name)}</span>
                  <span class="whitespace-nowrap font-medium text-navy-500">${formatBRL(amount)}</span>
                </span>
              `).join("")}
            </div>
          ` : ""}
        </div>
        <div class="orders-kpi-card flex-1 min-w-[220px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="${despesasHasApprox ? "Inclui custo aproximado — algum produto ou material de um pedido não está mais cadastrado. " : ""}Soma do custo de TODOS os pedidos, pagos ou não (exceto cancelados) — não é o saldo de saídas do Caixa.">
          <p class="text-xs font-medium text-navy-500">Despesas (custo total)</p>
          <p class="text-lg font-semibold text-orange-600">${despesasHasApprox ? "≈ " : ""}${formatBRL(despesasTotal)}</p>
          <div class="mt-1.5 flex flex-col gap-0.5 border-t border-navy-50 pt-1.5 text-[11px] text-navy-400">
            <span class="flex items-baseline justify-between gap-2" title="${despesasProductHasApprox ? "Inclui custo aproximado — algum produto de um pedido não está mais cadastrado." : "Soma do custo dos produtos em si (produtos.cost)."}">
              <span>Produtos</span>
              <span class="whitespace-nowrap font-medium text-navy-500">${despesasProductHasApprox ? "≈ " : ""}${formatBRL(despesasProductTotal)}</span>
            </span>
            <span class="flex items-baseline justify-between gap-2" title="${despesasMaterialsHasApprox ? "Inclui custo aproximado — algum material de um pedido não está mais cadastrado." : "Soma do custo de embalagem de presente + materiais essenciais (fio, cola, etiqueta...) usados em cada venda."}">
              <span>Materiais e embalagens</span>
              <span class="whitespace-nowrap font-medium text-navy-500">${despesasMaterialsHasApprox ? "≈ " : ""}${formatBRL(despesasMaterialsTotal)}</span>
            </span>
          </div>
        </div>
        <div class="orders-kpi-card flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="${faltaPagarHasApprox ? "Inclui custo aproximado — algum produto de um pedido não está mais cadastrado. " : ""}Soma só do custo do PRODUTO (sem materiais, tipo embalagem — isso é gasto interno da loja) dos pedidos cujo 'Fornecedor pago' ainda não foi marcado.">
          <p class="text-xs font-medium text-navy-500">Falta pagar (fornecedor)</p>
          <p class="text-lg font-semibold text-red-700">${faltaPagarHasApprox ? "≈ " : ""}${formatBRL(faltaPagarFornecedor)}</p>
        </div>
        <button id="produtos-a-receber-btn" type="button" class="orders-kpi-card flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 text-left shadow transition hover:border-gold-300 hover:shadow-md" title="Pedidos cujo fornecedor/fabricante ainda não entregou o produto pra loja (checkbox 'Fornecedor entregou' desmarcada). Clique pra ver a lista.">
          <p class="text-xs font-medium text-navy-500">Produtos a receber (fornecedor)</p>
          <p class="text-lg font-semibold ${produtosAReceberOrders.length > 0 ? "text-gold-700" : "text-navy-400"}">${produtosAReceberOrders.length} ${produtosAReceberOrders.length === 1 ? "pedido" : "pedidos"}</p>
        </button>
      </div>

      ${pedidosState.produtosAReceberOpen ? `
        <div id="produtos-a-receber-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
          <div class="flex max-h-[85vh] w-full max-w-2xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
            <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">
              <div>
                <h2 class="text-lg font-semibold text-navy-900">Produtos a receber (fornecedor)</h2>
                <p class="text-xs text-navy-500">Pedidos cujo fornecedor/fabricante ainda não entregou o produto pra loja.</p>
              </div>
              <button id="close-produtos-a-receber-btn" type="button" class="rounded px-2 py-1 text-navy-500 hover:bg-navy-100">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto px-5 py-4">
              ${produtosAReceberOrders.length === 0 ? `
                <p class="py-8 text-center text-sm text-navy-400">Nenhum pedido pendente de entrega do fornecedor no momento.</p>
              ` : `
                <div class="flex flex-col gap-3">
                  ${produtosAReceberOrders.map((o) => `
                    <div class="rounded-lg border border-navy-100 bg-cream-50 px-3 py-2.5">
                      <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <span class="text-sm font-semibold text-navy-900">Pedido Nº ${String(o.order_number ?? "").padStart(6, "0")}</span>
                        <span class="text-xs text-navy-400">${formatDate(toLocalISODate(new Date(o.created_at)))} · ${escapeHtml(o.customer_name)}</span>
                      </div>
                      <div class="mt-1.5 flex flex-col gap-0.5">
                        ${orderSupplierPendingItems(o).map((it) => `
                          <span class="text-xs text-navy-600">• ${it.quantity}x ${escapeHtml(it.product_name)}${it.variant_name ? ` <span class="text-navy-400">(${escapeHtml(it.variant_name)})</span>` : ""}</span>
                        `).join("")}
                      </div>
                    </div>
                  `).join("")}
                </div>
              `}
            </div>
          </div>
        </div>
      ` : ""}

      <div class="orders-tabs flex flex-wrap gap-2 border-b border-navy-100">
        ${PEDIDOS_TABS.map((t) => {
          const count = state.orders.filter((o) => o.status === t.key).length;
          const active = pedidosState.tab === t.key;
          return `
            <button data-pedidos-tab="${t.key}" class="pedidos-tab-btn -mb-px rounded-t-lg border-b-2 px-3 py-2 text-sm font-medium transition ${active ? "border-gold-500 text-navy-900" : "border-transparent text-navy-400 hover:text-navy-600"}">
              ${t.label} <span class="ml-1 rounded-full ${active ? "bg-gold-100 text-gold-800" : "bg-navy-100 text-navy-500"} px-1.5 py-0.5 text-xs font-semibold">${count}</span>
            </button>
          `;
        }).join("")}
      </div>

      <div class="orders-toolbar flex flex-wrap items-center gap-3 rounded-xl border border-navy-100 bg-white px-4 py-3 shadow">
        <label class="flex items-center gap-2 text-sm text-navy-700">
          <input type="checkbox" id="pedidos-select-all" class="h-4 w-4 rounded border-navy-300" ${visible.length === 0 ? "disabled" : ""} ${allVisibleSelected ? "checked" : ""} />
          Selecionar todos os visíveis
        </label>
        <span class="text-sm text-navy-400">${selectedCount} selecionado${selectedCount === 1 ? "" : "s"}</span>
        ${selectedCount > 0 ? `
          <div class="flex flex-col gap-0.5 rounded-lg bg-cream-50 px-3 py-1.5 text-xs font-medium text-navy-700" title="${selectedHasApprox ? "Inclui custo aproximado — algum produto ou material dos pedidos selecionados não está mais cadastrado" : "Resumo dos pedidos selecionados"}">
            <span>Entrada (pedidos): <b class="text-navy-900">${formatBRL(selectedEntradaTotal)}</b></span>
            <span>Custo do produto: <b class="text-navy-900">${selectedProductHasApprox ? "≈ " : ""}${formatBRL(selectedProductCostTotal)}</b></span>
            <span>Custo adicional (materiais): <b class="text-navy-900">${selectedMaterialsHasApprox ? "≈ " : ""}${formatBRL(selectedMaterialsCostTotal)}</b></span>
            <span class="border-t border-navy-200 pt-0.5">Custo total: <b class="text-navy-900">${selectedHasApprox ? "≈ " : ""}${formatBRL(selectedCostTotal)}</b></span>
            <span>Lucro estimado: <b class="text-emerald-700">${selectedHasApprox ? "≈ " : ""}${formatBRL(selectedProfitEstimate)}</b></span>
          </div>
        ` : ""}
        <div class="orders-toolbar-actions ml-auto flex gap-2">
          <button id="pedidos-picking-list-btn" ${state.orders.filter((o) => o.status === "em_andamento").length === 0 ? "disabled" : ""} title="Junta os itens de todos os pedidos 'Em andamento' numa lista só, com a quantidade total de cada produto — pra separar/produzir em lote." class="rounded-lg border border-navy-200 px-3 py-2 text-sm font-medium text-navy-700 transition hover:bg-navy-50 disabled:cursor-not-allowed disabled:opacity-40">🖨 Lista de separação</button>
          <button id="pedidos-download-btn" ${selectedCount === 0 ? "disabled" : ""} class="rounded-lg border border-navy-200 px-3 py-2 text-sm font-medium text-navy-700 transition hover:bg-navy-50 disabled:cursor-not-allowed disabled:opacity-40">🧾 Gerar comprovante</button>
          <button id="pedidos-shipping-labels-btn" ${selectedCount === 0 ? "disabled" : ""} title="Gera uma etiqueta em PDF (nome, WhatsApp, nº do pedido e observações/endereço) pra cada pedido selecionado, prontas pra imprimir e recortar." class="rounded-lg border border-navy-200 px-3 py-2 text-sm font-medium text-navy-700 transition hover:bg-navy-50 disabled:cursor-not-allowed disabled:opacity-40">🏷 Etiqueta de envio</button>
          <button id="pedidos-delete-btn" ${selectedCount === 0 ? "disabled" : ""} class="rounded-lg bg-red-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-40">🗑 Excluir selecionados</button>
        </div>

  container.querySelectorAll(".pedidos-tab-btn").forEach((btn) => {

  container.querySelectorAll(".iniciar-venda-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const order = state.orders.find((o) => o.id === btn.dataset.iniciarVenda);

      btn.disabled = true;
      btn.textContent = "Registrando...";

        await iniciarVenda(order);
      } catch (err) {
        console.error("iniciarVenda:", err);
        alert("Não foi possível iniciar a venda. Tente novamente.");
        btn.disabled = false;
        btn.textContent = "Iniciar venda";
      }
    });
  });
  container.querySelectorAll(".aceitar-pedido-btn").forEach((btn) => {

      btn.disabled = true;
      btn.textContent = "Aceitando...";

      // Aceitar já empurra o pedido de "Novo" pra "Em andamento" sozinho —
      // não precisa mais trocar o status na mão pra isso.
      const { error } = await supabaseClient.from("orders").update({
        accepted_at: new Date().toISOString(), status: "em_andamento",
        updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
      }).eq("id", btn.dataset.aceitarPedido);

        alert("Não foi possível aceitar o pedido: " + error.message);
        btn.disabled = false;
        btn.textContent = "Aceitar";
        return;

      await loadOrders();
      // Re-renderiza o app inteiro pra atualizar os contadores das abas no menu também.
      renderApp();
    });
  });

  container.querySelectorAll(".enviar-fabricante-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const order = state.orders.find((o) => o.id === btn.dataset.enviarFabricante);
      if (!order) return;

      // Antes de montar a mensagem: confere se algum item ainda pendente
      // já tem quantidade suficiente no estoque numérico da própria loja
      // (stock_qty controlado). Se tiver, esse item NÃO vai pro
      // fabricante — baixa o estoque na hora e marca "Em estoque" nele,
      // sem precisar esperar entrega de fornecedor. Só entra nessa conta
      // quem tem controle por QUANTIDADE (stock_qty); o booleano manual
      // "em estoque/esgotado" de sempre não diz quanto tem, então não dá
      // pra saber se cobre a quantidade pedida — esses continuam indo
      // pro fabricante como antes.
      const pending = orderSupplierPendingItems(order);
      const fulfillFromStock = [];
      const stillPending = [];
      pending.forEach((it) => {
        const product = state.products.find((p) => p.id === it.product_id);
        const variant = it.variant_name ? (product?.product_variants ?? []).find((v) => v.name === it.variant_name) : null;

        if (stockQty != null && Number(stockQty) >= it.quantity) fulfillFromStock.push({ item: it, product, variant });
        else stillPending.push(it);
      });

      if (fulfillFromStock.length > 0) {
        for (const { item, product, variant } of fulfillFromStock) {
          await ajustarEstoqueQtd(product.id, variant ? variant.id : null, -item.quantity);
          const { error } = await supabaseClient.from("order_items").update({ fulfilled_from_stock: true }).eq("id", item.id);
          if (error) console.error("marcar item atendido por estoque:", error.message);
        }
        await Promise.all([loadOrders(), loadProducts()]);
      }

      if (stillPending.length === 0) {
        alert(fulfillFromStock.length > 0
          ? "Todos os itens pendentes já estavam em estoque — nada foi enviado ao fabricante. O estoque já foi baixado e os itens marcados como \"Em estoque\"."
          : "Não há itens pendentes do fornecedor nesse pedido.");
        renderPedidos(container);
        return;
      }

      try {
        const message = buildManufacturerMessage(order, stillPending);
        const waUrl = `https://wa.me/${MANUFACTURER_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
        window.open(waUrl, "_blank");
      } catch (err) {
        console.error("enviar ao fabricante:", err);
        alert("Não foi possível montar a mensagem pro fabricante. Tente novamente.");
        return;
      }
      const { error } = await supabaseClient.from("orders").update({
        sent_to_manufacturer_at: new Date().toISOString(), updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
      }).eq("id", order.id);
      if (error) console.error("enviar ao fabricante:", error.message);
      await loadOrders();
      renderPedidos(container);
    });
  });
  container.querySelectorAll(".order-status-select").forEach((sel) => {
    sel.addEventListener("change", async () => {
      sel.disabled = true;
      if (!(await checkOrderNotStale(sel.dataset.order))) return;
      const { error } = await supabaseClient.from("orders").update({
        status: sel.value, updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
      }).eq("id", sel.dataset.order);
      if (error) { alert("Não foi possível atualizar o status: " + error.message); sel.disabled = false; }
      await loadOrders();
      // Re-renderiza o app inteiro (não só a tabela) pra atualizar o contador de "novo" no menu.
      renderApp();
    });
  });
  container.querySelectorAll(".paid-toggle-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.paidToggle;
      cb.disabled = true;
      if (!(await checkOrderNotStale(id))) return;
      const { error } = await supabaseClient.from("orders").update({
        paid_at: cb.checked ? new Date().toISOString() : null,
        updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
      }).eq("id", id);
      if (error) { alert("Não foi possível atualizar o pagamento: " + error.message); }
      await loadOrders();
      renderPedidos(container);
    });
  });
  container.querySelectorAll(".fornecedor-pago-toggle-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.fornecedorPagoToggle;
      const order = state.orders.find((o) => o.id === id);
      if (!order) return;
      cb.disabled = true;
      if (!(await checkOrderNotStale(id))) return;

      if (cb.checked) {
        const unpaidIds = orderSupplierUnpaidItems(order).map((it) => it.id);
        if (unpaidIds.length > 0) {
          const { error } = await supabaseClient.from("order_items").update({ fornecedor_pago_at: new Date().toISOString() }).in("id", unpaidIds);
          if (error) alert("Não foi possível atualizar o pagamento ao fornecedor: " + error.message);
        }
      } else {
        const nonStockIds = (order.items ?? []).filter((it) => !it.fulfilled_from_stock).map((it) => it.id);
        if (nonStockIds.length > 0) {
          const { error } = await supabaseClient.from("order_items").update({ fornecedor_pago_at: null }).in("id", nonStockIds);
          if (error) alert("Não foi possível atualizar o pagamento ao fornecedor: " + error.message);
        }
        if (order.fornecedor_pago_at) {
          await supabaseClient.from("orders").update({ fornecedor_pago_at: null }).eq("id", id);
        }
      }
      await loadOrders();
      renderPedidos(container);
    });
  });
  container.querySelectorAll(".fornecedor-pago-item-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const itemId = cb.dataset.fornecedorPagoItem;
      const orderId = cb.dataset.orderId;
      const order = state.orders.find((o) => o.id === orderId);
      cb.disabled = true;
      if (!(await checkOrderNotStale(orderId))) return;
      if (order?.fornecedor_pago_at) {
        const siblingIds = (order.items ?? [])
          .filter((sib) => sib.id !== itemId && !sib.fulfilled_from_stock && !sib.fornecedor_pago_at)
          .map((sib) => sib.id);
        if (siblingIds.length > 0) {
          await supabaseClient.from("order_items").update({ fornecedor_pago_at: order.fornecedor_pago_at }).in("id", siblingIds);
        }
        await supabaseClient.from("orders").update({ fornecedor_pago_at: null }).eq("id", orderId);
      }
      const { error } = await supabaseClient.from("order_items").update({
        fornecedor_pago_at: cb.checked ? new Date().toISOString() : null,
      }).eq("id", itemId);
      if (error) alert("Não foi possível atualizar o pagamento desse item: " + error.message);
      await loadOrders();
      renderPedidos(container);
    });
  });
  container.querySelectorAll(".fornecedor-entregou-toggle-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.fornecedorEntregouToggle;
      const order = state.orders.find((o) => o.id === id);
      if (!order) return;
      cb.disabled = true;
      if (!(await checkOrderNotStale(id))) return;

      if (cb.checked) {
        // Marca TODOS os itens ainda pendentes desse pedido de uma vez —
        // pra marcar só um item específico, use o checkbox dele em "Ver itens".
        const pendingIds = orderSupplierPendingItems(order).map((it) => it.id);
        if (pendingIds.length > 0) {
          const { error } = await supabaseClient.from("order_items").update({ fornecedor_entregue_at: new Date().toISOString() }).in("id", pendingIds);
          if (error) alert("Não foi possível atualizar a entrega do fornecedor: " + error.message);
        }
      } else {
        // Desmarca todos os itens (que não vieram do estoque) e também o
        // campo antigo do pedido inteiro, se algum pedido anterior à
        // separação por item ainda tiver ele marcado.
        const nonStockIds = (order.items ?? []).filter((it) => !it.fulfilled_from_stock).map((it) => it.id);
        if (nonStockIds.length > 0) {
          const { error } = await supabaseClient.from("order_items").update({ fornecedor_entregue_at: null }).in("id", nonStockIds);
          if (error) alert("Não foi possível atualizar a entrega do fornecedor: " + error.message);
        }
        if (order.fornecedor_entregue_at) {
          await supabaseClient.from("orders").update({ fornecedor_entregue_at: null }).eq("id", id);
        }
      }
      await loadOrders();
      renderPedidos(container);
    });
  });
  container.querySelectorAll(".fornecedor-entregou-item-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const itemId = cb.dataset.fornecedorEntregouItem;
      const orderId = cb.dataset.orderId;
      const order = state.orders.find((o) => o.id === orderId);
      cb.disabled = true;
      if (!(await checkOrderNotStale(orderId))) return;
      // Se esse pedido ainda estava usando o campo antigo (por pedido
      // inteiro, de antes de existir controle por item), mexer num item
      // específico "migra" o pedido pra passar a usar o controle por
      // item dali em diante — sem isso, o campo antigo continuaria
      // fazendo o pedido inteiro parecer "tudo entregue" mesmo depois de
      // desmarcar um item aqui.
      if (order?.fornecedor_entregue_at) {
        // Preserva a data antiga nos OUTROS itens desse pedido (que
        // dependiam só do campo antigo pra contar como "entregues") antes
        // de desligá-lo — senão eles regrediriam pra "pendente" só porque
        // você mexeu no checkbox de um item específico.
        const siblingIds = (order.items ?? [])
          .filter((sib) => sib.id !== itemId && !sib.fulfilled_from_stock && !sib.fornecedor_entregue_at)
          .map((sib) => sib.id);
        if (siblingIds.length > 0) {
          await supabaseClient.from("order_items").update({ fornecedor_entregue_at: order.fornecedor_entregue_at }).in("id", siblingIds);
        }
        await supabaseClient.from("orders").update({ fornecedor_entregue_at: null }).eq("id", orderId);
      }
      const { error } = await supabaseClient.from("order_items").update({
        fornecedor_entregue_at: cb.checked ? new Date().toISOString() : null,
      }).eq("id", itemId);
      if (error) alert("Não foi possível atualizar a entrega desse item: " + error.message);
      await loadOrders();
      renderPedidos(container);
    });
  });

  document.getElementById("pedidos-select-all").addEventListener("change", (e) => {
    if (e.target.checked) visible.forEach((o) => pedidosState.selected.add(o.id));
    else visible.forEach((o) => pedidosState.selected.delete(o.id));
    renderPedidos(container);
  });
  container.querySelectorAll(".order-select-checkbox").forEach((cb) => {
    cb.addEventListener("change", (e) => {
      const id = cb.dataset.selectOrder;
      if (e.target.checked) pedidosState.selected.add(id);
      else pedidosState.selected.delete(id);
      renderPedidos(container);
    });
  });

  const pickingListBtn = document.getElementById("pedidos-picking-list-btn");
  if (pickingListBtn) {
    pickingListBtn.addEventListener("click", () => {
      try {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          alert("Não foi possível gerar a lista: a biblioteca de PDF não carregou. Recarregue a página e tente novamente.");
          return;
        }
        const rows = buildPickingListRows();
        const doc = buildPickingListPdf(rows);
        const now = new Date();
        const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        doc.save(`lista-separacao-luz-mariana-${stamp}.pdf`);
      } catch (err) {
        console.error("Erro ao gerar lista de separação:", err);
        alert("Não foi possível gerar a lista de separação. Tente novamente ou avise o suporte.");
      }
    });
  }

  const downloadBtn = document.getElementById("pedidos-download-btn");
  if (downloadBtn) {
    downloadBtn.addEventListener("click", () => {
      try {
        const selectedOrders = state.orders
          .filter((o) => pedidosState.selected.has(o.id))
          .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        if (selectedOrders.length === 0) return;
        if (!window.jspdf || !window.jspdf.jsPDF) {
          alert("Não foi possível gerar o comprovante: a biblioteca de PDF não carregou. Recarregue a página e tente novamente.");
          return;
        }
        const doc = buildOrdersReceiptPdf(selectedOrders);
        const now = new Date();
        const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        doc.save(`pedidos-luz-mariana-${stamp}.pdf`);
      } catch (err) {
        console.error("Erro ao gerar comprovante:", err);
        alert("Não foi possível gerar o comprovante. Tente novamente ou avise o suporte.");
      }
    });
  }

  const shippingLabelsBtn = document.getElementById("pedidos-shipping-labels-btn");
  if (shippingLabelsBtn) {
    shippingLabelsBtn.addEventListener("click", () => {
      try {
        const selectedOrders = state.orders
          .filter((o) => pedidosState.selected.has(o.id))
          .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        if (selectedOrders.length === 0) return;
        if (!window.jspdf || !window.jspdf.jsPDF) {
          alert("Não foi possível gerar as etiquetas: a biblioteca de PDF não carregou. Recarregue a página e tente novamente.");
          return;
        }
        const doc = buildShippingLabelsPdf(selectedOrders);
        const now = new Date();
        const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        doc.save(`etiquetas-envio-luz-mariana-${stamp}.pdf`);
      } catch (err) {
        console.error("Erro ao gerar etiquetas de envio:", err);
        alert("Não foi possível gerar as etiquetas. Tente novamente ou avise o suporte.");
      }
    });
  }

  const deleteBtn = document.getElementById("pedidos-delete-btn");
  if (deleteBtn) {
    deleteBtn.addEventListener("click", async () => {
      const ids = [...pedidosState.selected];
      if (ids.length === 0) return;
      const confirmMsg = ids.length === 1
        ? "Excluir este pedido definitivamente? Essa ação não pode ser desfeita."
        : `Excluir estes ${ids.length} pedidos definitivamente? Essa ação não pode ser desfeita.`;
      if (!confirm(confirmMsg)) return;

      deleteBtn.disabled = true;
      deleteBtn.textContent = "Excluindo...";
      const { error } = await supabaseClient.from("orders").delete().in("id", ids);
      if (error) {
        alert("Não foi possível excluir: " + error.message);
        deleteBtn.disabled = false;
        deleteBtn.textContent = "🗑 Excluir selecionados";
        return;
      }
      pedidosState.selected.clear();
      await loadOrders();
      renderApp();
    });
  }

  container.querySelectorAll(".order-flow-chip").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      const ok = await updateOrderChecklist(btn.dataset.orderId, btn.dataset.flowKey, btn.dataset.flowValue === "1");
      if (ok) renderPedidos(container);
    });
  });
  container.querySelectorAll("[data-new-issue-order]").forEach((btn) => {
    btn.addEventListener("click", () => {
      professionalState.issueOrderId = btn.dataset.newIssueOrder;
      state.tab = "ocorrencias";
      renderApp();
    });
  });
  container.querySelectorAll("[data-open-production-order]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.tab = "producao";
      professionalState.productionView = "board";
      renderApp();
    });
  });

  container.querySelectorAll(".edit-order-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const order = state.orders.find((o) => o.id === btn.dataset.editOrder);
      if (order) openEditOrderOverlay(order);
    });
  });
  if (editOrderState.open) renderEditOrderOverlay();
}

/* =====================================================================
   EDITAR PEDIDO (dados do cliente + itens de um pedido já lançado)
   ===================================================================== */
// Sem isso, corrigir um endereço/telefone digitado errado ou trocar um
// item de um pedido já feito exigia cancelar o pedido inteiro e lançar
// tudo de novo manualmente, perdendo o histórico e as observações
// originais. Segue o mesmo padrão visual/estrutural do "Lançar brinde"
// (overlay fixo com formulário + lista de itens adicionar/remover).
let editOrderState = { open: false, orderId: null, items: [], name: "", whatsapp: "", instagram: "", notes: "", discountAmount: 0, couponCode: null, customDeadlineDate: "", _selectedProductId: null, _loadedUpdatedAt: null };

function closeEditOrderOverlay() {
  editOrderState = { open: false, orderId: null, items: [], name: "", whatsapp: "", instagram: "", notes: "", discountAmount: 0, couponCode: null, customDeadlineDate: "", _selectedProductId: null, _loadedUpdatedAt: null };
  renderEditOrderOverlay();
}

function openEditOrderOverlay(order) {
  editOrderState = {
    open: true,
    orderId: order.id,
    items: order.items.map((it) => ({ product_id: it.product_id, product_name: it.product_name, variant_name: it.variant_name, unit_price: Number(it.unit_price), quantity: it.quantity })),
    name: order.customer_name || "",
    whatsapp: order.customer_whatsapp || "",
    instagram: order.customer_instagram || "",
    notes: orderCustomerNotes(order) || "",
    // Preservados como estavam — editar o pedido não deve mexer no
    // desconto/cupom que já foi aplicado na hora da compra.
    discountAmount: Number(order.discount_amount || 0),
    couponCode: order.coupon_code || null,
    // Prazo combinado manualmente com o cliente (vazio = usa o cálculo
    // automático a partir do prazo de fabricação do produto, como sempre).
    customDeadlineDate: order.custom_deadline_date || "",
    _selectedProductId: null,
    _loadedUpdatedAt: order.updated_at,
  };
  renderEditOrderOverlay();
}

function editOrderItemsTotal() {
  return editOrderState.items.reduce((sum, it) => sum + it.unit_price * it.quantity, 0);
}

function renderEditOrderOverlay() {
  const slot = document.getElementById("edit-order-overlay-slot");
  if (!slot) return;
  if (!editOrderState.open) { slot.innerHTML = ""; return; }

  const activeProducts = state.products.filter((p) => p.active);
  const selectedProduct = activeProducts.find((p) => p.id === editOrderState._selectedProductId);
  const selectedVariants = selectedProduct?.product_variants ?? [];
  const giftWrapTotal = (state.orders.find((o) => o.id === editOrderState.orderId)?.giftWraps ?? []).reduce((s, g) => s + g.unit_price * g.quantity, 0);
  const newTotal = Math.max(0, editOrderItemsTotal() + giftWrapTotal - editOrderState.discountAmount);

  slot.innerHTML = `
    <div id="edit-order-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
      <div class="flex max-h-[90vh] w-full max-w-3xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">
          <div>
            <h2 class="text-lg font-semibold text-navy-900">✎ Editar pedido</h2>
            <p class="text-xs text-navy-500">Corrige dados do cliente e os itens deste pedido, sem precisar cancelar e lançar de novo. Embalagem de presente e cupom aplicado não mudam aqui.</p>
          </div>
          <button id="edit-order-close-btn" type="button" class="rounded px-2 py-1 text-navy-500 hover:bg-navy-100">✕</button>

          <form id="edit-order-form" class="flex flex-col gap-4">
            <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
              <p class="mb-2 text-sm font-medium text-navy-800">Dados do cliente</p>
              <div class="flex flex-wrap gap-3">
                <div class="min-w-[200px] flex-1">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Nome</label>
                  <input id="edit-order-name" value="${escapeHtml(editOrderState.name)}" required class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
                <div class="min-w-[160px]">
                  <label class="mb-1 block text-xs font-medium text-navy-700">WhatsApp</label>
                  <input id="edit-order-whatsapp" value="${escapeHtml(editOrderState.whatsapp)}" required class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
                <div class="min-w-[160px]">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Instagram (opcional)</label>
                  <input id="edit-order-instagram" value="${escapeHtml(editOrderState.instagram)}" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
                <div class="min-w-[220px] flex-1">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Observações (endereço, pedidos especiais...)</label>
                  <input id="edit-order-notes" value="${escapeHtml(editOrderState.notes)}" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
              </div>
            </div>

            <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
              <p class="mb-2 text-sm font-medium text-navy-800">Prazo de entrega</p>
              <p class="mb-2 text-xs text-navy-500">Prazo automático deste pedido (pelo cadastro do produto): <b>${(() => {
                const order = state.orders.find((o) => o.id === editOrderState.orderId);
                if (!order) return "—";
                const days = orderMadeToOrderDays(order);
                if (days == null) return "pronta entrega";
                const d = addBusinessDays(order.created_at, days);
                return `até ${formatDate(toLocalISODate(d))}`;
              })()}</b>. Combine uma data diferente com o cliente só se for o caso — fica valendo pro pedido inteiro (Catálogo, comprovantes e mensagem pro fabricante passam a usar essa data).</p>
              <div class="flex flex-wrap items-end gap-3">
                <div>
                  <label class="mb-1 block text-xs font-medium text-navy-700">Data combinada (opcional)</label>
                  <input id="edit-order-deadline" type="date" value="${editOrderState.customDeadlineDate}" class="rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
                ${editOrderState.customDeadlineDate ? `<button type="button" id="edit-order-deadline-clear" class="rounded-lg border border-navy-300 px-3 py-2 text-xs font-medium text-navy-700 hover:bg-navy-100">Voltar ao prazo automático</button>` : ""}
              </div>
            </div>

            <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
              <p class="mb-2 text-sm font-medium text-navy-800">Itens</p>
              <div class="flex flex-wrap items-end gap-3">
                <div class="min-w-[200px] flex-1">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Produto</label>
                  <select id="edit-order-product-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                    <option value="">— selecione —</option>
                    ${activeProducts.map((p) => `<option value="${p.id}" ${p.id === editOrderState._selectedProductId ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("")}
                  </select>
                </div>
                ${selectedVariants.length > 0 ? `
                  <div class="min-w-[160px]">
                    <label class="mb-1 block text-xs font-medium text-navy-700">Modelo</label>
                    <select id="edit-order-variant-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                      <option value="">— selecione —</option>
                      ${[...selectedVariants].sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0)).map((v) => `<option value="${v.id}">${escapeHtml(v.name)}${v.esgotado ? " (esgotado)" : ""}</option>`).join("")}
                    </select>
                  </div>
                ` : ""}
                <div class="w-24">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Qtd.</label>
                  <input id="edit-order-item-qty" value="1" inputmode="numeric" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
                <button type="button" id="edit-order-item-add" class="rounded-lg border border-navy-300 px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100">+ Adicionar</button>
              </div>
              <div class="mt-3 flex flex-col gap-1">

async function submeterEdicaoPedido(e) {
  e.preventDefault();
  const errorEl = document.getElementById("edit-order-error");
  const name = editOrderState.name.trim();
  const whatsapp = editOrderState.whatsapp.trim();
  const instagram = editOrderState.instagram.trim().replace(/^@/, "");
  const notes = editOrderState.notes.trim();

  if (editOrderState.items.length === 0) { errorEl.textContent = "O pedido precisa ter ao menos um item."; return; }
  if (!name) { errorEl.textContent = "Informe o nome do cliente."; return; }
  if (!whatsapp) { errorEl.textContent = "Informe o WhatsApp do cliente."; return; }
  errorEl.textContent = "";

  const submitBtn = document.getElementById("edit-order-submit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Salvando...";

  // Checagem otimista: se outra pessoa (o outro admin) alterou esse
  // mesmo pedido depois que essa tela de edição foi aberta, avisa em
  // vez de sobrescrever silenciosamente por cima da mudança dela.
  const { data: currentRow, error: currentError } = await supabaseClient.from("orders").select("updated_at").eq("id", editOrderState.orderId).single();
  if (currentError) {
    errorEl.textContent = "Não foi possível confirmar o pedido antes de salvar: " + currentError.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Salvar alterações";
    return;
  }
  if (currentRow && editOrderState._loadedUpdatedAt && currentRow.updated_at !== editOrderState._loadedUpdatedAt) {
    errorEl.textContent = "Esse pedido foi alterado por outra pessoa enquanto você editava (ex: status ou pagamento). Feche e abra a edição de novo pra ver a versão mais recente antes de salvar.";
    submitBtn.disabled = false;
    submitBtn.textContent = "Salvar alterações";
    return;
  }

  const giftWrapTotal = (state.orders.find((o) => o.id === editOrderState.orderId)?.giftWraps ?? []).reduce((s, g) => s + g.unit_price * g.quantity, 0);
  const newTotal = Math.max(0, editOrderItemsTotal() + giftWrapTotal - editOrderState.discountAmount);

  const { error: orderError } = await supabaseClient.from("orders").update({
    customer_name: name,
    customer_whatsapp: whatsapp,
    customer_instagram: instagram || null,
    notes: composeOrderNotes(notes, normalizedOrderOpsMeta(state.orders.find((o) => o.id === editOrderState.orderId))),
    total: newTotal,
    custom_deadline_date: editOrderState.customDeadlineDate || null,
    updated_by: state.currentUser.id,
    updated_at: new Date().toISOString(),
  }).eq("id", editOrderState.orderId);
  if (orderError) {
    errorEl.textContent = "Não foi possível salvar o pedido: " + orderError.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Salvar alterações";
    return;
  }

  // Itens: mais simples e seguro apagar os antigos e inserir o conjunto
  // final de novo, em vez de tentar calcular um diff — ninguém mais
  // referencia o id de uma linha de order_items diretamente.
  const { error: deleteItemsError } = await supabaseClient.from("order_items").delete().eq("order_id", editOrderState.orderId);
  if (deleteItemsError) {
    errorEl.textContent = "Pedido salvo, mas não foi possível atualizar os itens: " + deleteItemsError.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Salvar alterações";
    return;
  }
  const itemRows = editOrderState.items.map((it) => ({
    order_id: editOrderState.orderId,
    product_id: it.product_id,
    product_name: it.product_name,
    variant_name: it.variant_name,
    unit_price: it.unit_price,
    quantity: it.quantity,
  }));
  const { error: insertItemsError } = await supabaseClient.from("order_items").insert(itemRows);
  if (insertItemsError) {
    errorEl.textContent = "Pedido salvo, mas não foi possível atualizar os itens: " + insertItemsError.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Salvar alterações";
    return;
  }

  closeEditOrderOverlay();
  await loadOrders();
  renderApp();
}

// Filtra os lançamentos do Caixa dentro do período escolhido (inclusive
// nas duas pontas) — mesma base de dados da aba Caixa, só que recortada
// por data em vez de mostrar tudo.
function relatoriosEntriesInRange() {
  const { startDate, endDate } = relatoriosState;
  return state.cashEntries.filter((e) => e.entry_date >= startDate && e.entry_date <= endDate);
}

// Soma/subtrai dias numa data "AAAA-MM-DD" sem passar por Date com fuso
// horário de verdade — só aritmética de calendário (UTC usado aqui é só
// um truque de cálculo, não representa hora nenhuma).
function addDaysISO(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, "0")}-${String(dt.getUTCDate()).padStart(2, "0")}`;
}
function daysBetweenISO(a, b) {
  const [ay, am, ad] = a.split("-").map(Number);
  const [by, bm, bd] = b.split("-").map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
}

// Quebra as vendas do período em "baldes" pra desenhar o gráfico de
// barras — por dia se o período é curto (até 31 dias), por semana se
// médio (até 180 dias) ou por mês se for um período bem longo. Sem isso,
// um período de 1 ano viraria 365 barrinhas ilegíveis.
function relatoriosSalesByBucket(vendaEntries) {
  const { startDate, endDate } = relatoriosState;
  const totalDays = daysBetweenISO(startDate, endDate) + 1;
  const bucketDays = totalDays <= 31 ? 1 : totalDays <= 180 ? 7 : 30;
  const buckets = [];
  let cursor = startDate;
  while (cursor <= endDate) {
    const bucketEnd = addDaysISO(cursor, bucketDays - 1);
    const clampedEnd = bucketEnd > endDate ? endDate : bucketEnd;
    const total = vendaEntries
      .filter((e) => e.entry_date >= cursor && e.entry_date <= clampedEnd)
      .reduce((s, e) => s + Number(e.amount), 0);
    buckets.push({ start: cursor, end: clampedEnd, total });
    cursor = addDaysISO(clampedEnd, 1);
  }
  return buckets;
}

// Total de vendas no MESMO NÚMERO DE DIAS imediatamente anterior ao
// período escolhido — pra comparar "como estamos indo" com o pedaço de
// tempo equivalente antes (não com o mês civil anterior, que pode ter
// número de dias diferente).
function relatoriosPreviousPeriodTotal() {
  const { startDate, endDate } = relatoriosState;
  const totalDays = daysBetweenISO(startDate, endDate) + 1;
  const prevEnd = addDaysISO(startDate, -1);
  const prevStart = addDaysISO(prevEnd, -(totalDays - 1));
  const total = state.cashEntries
    .filter((e) => e.entry_type === "entrada" && e.category === "Venda" && e.entry_date >= prevStart && e.entry_date <= prevEnd)
    .reduce((s, e) => s + Number(e.amount), 0);
  return { prevStart, prevEnd, total };
}

// Desenha o gráfico de barras em SVG puro (sem lib externa) — cada barra
// é o total vendido num "balde" (dia/semana/mês, ver relatoriosSalesByBucket).
function renderSalesChartSvg(buckets) {
  const width = 720, height = 220;
  const padding = { top: 10, right: 10, bottom: 26, left: 10 };
  const chartWidth = width - padding.left - padding.right;
  const chartHeight = height - padding.top - padding.bottom;
  const maxVal = Math.max(1, ...buckets.map((b) => b.total));
  const barGap = buckets.length > 20 ? 1.5 : 4;
  const barWidth = buckets.length > 0 ? Math.max(1, (chartWidth - barGap * (buckets.length - 1)) / buckets.length) : chartWidth;
  const showLabels = buckets.length <= 31;

  const bars = buckets.map((b, i) => {
    const barHeight = (b.total / maxVal) * chartHeight;
    const x = padding.left + i * (barWidth + barGap);
    const y = padding.top + (chartHeight - barHeight);
    const label = b.start === b.end ? formatDate(b.start).slice(0, 5) : `${formatDate(b.start).slice(0, 5)}–${formatDate(b.end).slice(0, 5)}`;
    return `
      <g>
        <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${Math.max(0.5, barHeight).toFixed(1)}" rx="1.5" fill="#E8A000">
          <title>${escapeHtml(label)}: ${formatBRL(b.total)}</title>
        </rect>
        ${showLabels ? `<text x="${(x + barWidth / 2).toFixed(1)}" y="${height - 8}" font-size="8" text-anchor="middle" fill="#5b6b8c">${escapeHtml(label)}</text>` : ""}
      </g>
    `;
  }).join("");

  return `<svg viewBox="0 0 ${width} ${height}" class="h-auto w-full" role="img" aria-label="Gráfico de vendas por período">${bars}</svg>`;
}

// Quebra as vendas do período por categoria de produto, cruzando cada
// lançamento de venda (que tem order_id) com os itens do pedido
// correspondente e a categoria cadastrada de cada produto. Lançamentos de
// venda sem order_id (ex: lançados à mão, sem vir de um pedido do
// catálogo) entram como "Outros" porque não tem como saber os itens.
function relatoriosCategoriaBreakdown(vendaEntries) {
  const byCategory = {};
  vendaEntries.forEach((e) => {
    const order = e.order_id ? state.orders.find((o) => o.id === e.order_id) : null;
    if (!order || !(order.items ?? []).length) {
      byCategory["Outros"] = (byCategory["Outros"] || 0) + Number(e.amount);
      return;
    }
    order.items.forEach((it) => {
      const product = state.products.find((p) => p.id === it.product_id);
      const cat = (product && product.category && product.category.trim()) || "Outros";
      byCategory[cat] = (byCategory[cat] || 0) + Number(it.unit_price) * Number(it.quantity);
    });
  });
  return Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
}

// Produtos mais vendidos no período (por quantidade), na mesma lógica de
// cruzamento acima.
function relatoriosProdutosMaisVendidos(vendaEntries) {
  const byProduct = {}; // { nome: { qty, total } }
  vendaEntries.forEach((e) => {
    const order = e.order_id ? state.orders.find((o) => o.id === e.order_id) : null;
    (order?.items ?? []).forEach((it) => {
      const label = it.product_name + (it.variant_name ? ` (${it.variant_name})` : "");
      if (!byProduct[label]) byProduct[label] = { qty: 0, total: 0 };
      byProduct[label].qty += Number(it.quantity);
      byProduct[label].total += Number(it.unit_price) * Number(it.quantity);
    });
  });
  return Object.entries(byProduct).sort((a, b) => b[1].qty - a[1].qty).slice(0, 10);
}

function renderRelatorios(container) {
  const inRange = relatoriosEntriesInRange();
  const vendaEntries = inRange.filter((e) => e.entry_type === "entrada" && e.category === "Venda");
  const totalEntradas = inRange.filter((e) => e.entry_type === "entrada").reduce((sum, e) => sum + Number(e.amount), 0);
  const totalSaidas = inRange.filter((e) => e.entry_type === "saida").reduce((sum, e) => sum + Number(e.amount), 0);
  const totalVendas = vendaEntries.reduce((sum, e) => sum + Number(e.amount), 0);
  const numVendas = vendaEntries.length;
  const ticketMedio = numVendas > 0 ? totalVendas / numVendas : 0;

  const porPagamento = {};
  vendaEntries.forEach((e) => {
    const key = e.payment_method || "—";
    porPagamento[key] = (porPagamento[key] || 0) + Number(e.amount);
  });
  const porPagamentoList = Object.entries(porPagamento).sort((a, b) => b[1] - a[1]);

  const porCategoria = relatoriosCategoriaBreakdown(vendaEntries);

// ★ preenchidas até a nota, ☆ vazias no resto — nota inteira de 1 a 5
// (não tem meia-estrela no formulário do cliente).
function starDisplay(rating) {
  const n = Math.max(0, Math.min(5, Math.round(Number(rating) || 0)));
  return "★".repeat(n) + "☆".repeat(5 - n);
}

function renderAvaliacoes(container) {
  const pending = state.reviews.filter((r) => !r.approved).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  const approved = state.reviews.filter((r) => r.approved).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const productName = (id) => state.products.find((p) => p.id === id)?.name ?? "(produto removido)";

  const reviewCard = (r, { pendingActions }) => `
    <div class="rounded-xl border border-navy-100 bg-white p-4 shadow" data-review-card="${r.id}">
      <div class="flex flex-wrap items-start justify-between gap-2">
        <div>
          <p class="text-sm font-semibold text-navy-900">${escapeHtml(r.customer_name)}</p>
          <p class="text-xs text-navy-400">${escapeHtml(productName(r.product_id))} · ${formatDateTime(r.created_at)}</p>
        </div>
        <span class="text-amber-500" title="${r.rating}/5">${starDisplay(r.rating)}</span>
      </div>
      ${r.comment ? `<p class="mt-2 text-sm text-navy-600">${escapeHtml(r.comment)}</p>` : `<p class="mt-2 text-sm italic text-navy-300">Sem comentário, só a nota.</p>`}
      <div class="mt-3 flex justify-end gap-2">
        ${pendingActions ? `<button data-approve-review="${r.id}" class="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-emerald-700">Aprovar</button>` : ""}
        <button data-delete-review="${r.id}" class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-semibold text-red-600 transition hover:bg-red-50">Excluir</button>
      </div>
    </div>
  `;

  container.innerHTML = `
    <div class="flex flex-col gap-6">
      <div>
        <h1 class="text-xl font-semibold text-navy-900">Avaliações de produtos</h1>
        <p class="text-sm text-navy-500">Comentários e notas enviados pelos clientes no catálogo — só aparecem lá depois de aprovados aqui.</p>
      </div>

      <div>
        <h2 class="mb-3 text-sm font-semibold text-navy-900">Pendentes de aprovação ${pending.length > 0 ? `<span class="ml-1 rounded-full bg-red-500 px-1.5 py-0.5 text-[10px] font-bold text-white">${pending.length}</span>` : ""}</h2>
        ${pending.length === 0 ? `
          <p class="rounded-xl border border-navy-100 bg-white px-4 py-6 text-center text-sm text-navy-400 shadow">Nenhuma avaliação esperando aprovação.</p>
        ` : `
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            ${pending.map((r) => reviewCard(r, { pendingActions: true })).join("")}
          </div>
        `}
      </div>

      <div>
        <h2 class="mb-3 text-sm font-semibold text-navy-900">Aprovadas (visíveis no catálogo)</h2>
        ${approved.length === 0 ? `
          <p class="rounded-xl border border-navy-100 bg-white px-4 py-6 text-center text-sm text-navy-400 shadow">Nenhuma avaliação aprovada ainda.</p>
        ` : `
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            ${approved.map((r) => reviewCard(r, { pendingActions: false })).join("")}
          </div>
        `}
      </div>
    </div>
  `;

  container.querySelectorAll("[data-approve-review]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Aprovando...";
      const { error } = await supabaseClient.from("product_reviews")
        .update({ approved: true, reviewed_by: state.currentUser.id, reviewed_at: new Date().toISOString() })
        .eq("id", btn.dataset.approveReview);
      if (error) { alert("Não foi possível aprovar: " + error.message); btn.disabled = false; btn.textContent = "Aprovar"; return; }
      await loadReviews();
      // Re-renderiza o app inteiro pra atualizar o contador na aba do menu também.
      renderApp();
    });
  });
  container.querySelectorAll("[data-delete-review]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Excluir esta avaliação? Essa ação não pode ser desfeita.")) return;
      const { error } = await supabaseClient.from("product_reviews").delete().eq("id", btn.dataset.deleteReview);
      if (error) { alert("Não foi possível excluir: " + error.message); return; }
      await loadReviews();
      renderApp();
    });
  });
}
