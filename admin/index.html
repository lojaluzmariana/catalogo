/* =====================================================================
   REGRAS DE PRECIFICAÇÃO (mesma lógica validada contra os 13 produtos
   originais da Luz Mariana — ver scripts/verify_pricing.mjs no projeto)
   ===================================================================== */
const CARD_FEE = 0.05;
const CREDIT_DIVISOR = (1 - 0.45) * (1 - CARD_FEE); // 0.5225 — margem mín. 45% no crédito
const PROMO_DIVISOR = 1 - 0.40; // 0.60 — margem mín. 40% no pix/promo

function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function niceFloor(raw) {
  const base = Math.floor(raw);
  const candidates = [base - 1 + 0.9, base + 0.0, base + 0.5, base + 0.9];
  let best = null;
  for (const c of candidates) if (c <= raw + 1e-9 && (best === null || c > best)) best = c;
  return round2(best);
}

function niceCeil(raw) {
  const base = Math.floor(raw);
  const candidates = [base + 0.0, base + 0.5, base + 0.9, base + 1.0];
  let best = null;
  for (const c of candidates) if (c >= raw - 1e-9 && (best === null || c < best)) best = c;
  return round2(best);
}

function calculatePricing(cost) {
  const creditPrice = niceFloor(cost / CREDIT_DIVISOR);
  const creditNet = round2(creditPrice * (1 - CARD_FEE));
  const creditProfit = round2(creditNet - cost);
  const creditMarkup = cost > 0 ? round2(creditNet / cost) : 0;
  const creditMargin = creditNet > 0 ? round2(creditProfit / creditNet) : 0;

  const promoPrice = niceCeil(cost / PROMO_DIVISOR);
  const promoProfit = round2(promoPrice - cost);
  const promoMargin = promoPrice > 0 ? round2(promoProfit / promoPrice) : 0;

  return {
    cost, creditPrice, creditNet, creditProfit, creditMarkup, creditMargin,
    promoPrice, promoProfit, promoMargin,
  };
}

function formatBRL(v) {
  return (v ?? 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function formatPercent(v) {
  return (v ?? 0).toLocaleString("pt-BR", { style: "percent", minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
// Data de um Date em texto "AAAA-MM-DD" no fuso do Brasil (GMT-3, sem
// horário de verão) — SEMPRE nesse fuso, não importa o fuso configurado
// no computador/celular que estiver rodando o painel. Duas armadilhas
// aqui, já vistas na prática:
//   1) ".toISOString().slice(0, 10)" sozinho converte pra UTC primeiro:
//      perto da meia-noite (ex: 23h de Brasília = já é madrugada em UTC),
//      isso silenciosamente troca o dia pro seguinte.
//   2) Calcular a partir do fuso do APARELHO (Date.getTimezoneOffset())
//      também não é confiável: se o computador/celular estiver com o
//      fuso mal configurado (ex: em UTC, ou em outro fuso por engano), o
//      mesmo problema volta a acontecer mesmo com a correção do item 1.
// Por isso aqui usa Intl.DateTimeFormat travado em "America/Fortaleza"
// (GMT-3 o ano todo) — sempre a data certa do Brasil, isolada de
// qualquer configuração do aparelho.
function toLocalISODate(d) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Fortaleza", year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(d);
  const get = (type) => parts.find((p) => p.type === type).value;
  return `${get("year")}-${get("month")}-${get("day")}`;
}
function todayISO() {
  return toLocalISODate(new Date());
}
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function formatKB(bytes) {
  return `${Math.round(bytes / 1024)} KB`;
}

/* ---------------------------------------------------------------------
   Redimensiona/comprime uma foto no navegador antes de enviar — evita
   fotos de celular de vários MB deixando o catálogo pesado. Reduz pro
   maior lado caber em maxDim (mantendo proporção) e exporta como JPEG.
   --------------------------------------------------------------------- */
function resizeImageToBlob(file, maxDim = 1000, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; // fundo branco (fotos com transparência viram JPEG)
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => {
        if (blob) resolve(blob); else reject(new Error("Não foi possível processar a imagem."));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Não foi possível ler a imagem.")); };
    img.src = url;
  });
}

/* ---------------------------------------------------------------------
   Depois de logar: busca o nome do admin e os dados, entra no app.
   --------------------------------------------------------------------- */
async function enterApp() {
  const { data: authData } = await supabaseClient.auth.getUser();
  const uid = authData?.user?.id;

  const { data: profile } = await supabaseClient.from("admin_users").select("id, name").eq("id", uid).single();
  state.currentUser = profile ? { id: profile.id, name: profile.name } : { id: uid, name: state.selectedName };

  state.screen = "app";
  state.error = null;
  await loadAllData();
  render();
}

// Recarrega todos os dados do app de uma vez (usado ao entrar, no botão
// "Atualizar" e na atualização automática em segundo plano).
async function loadAllData() {
  await Promise.all([loadMaterials(), loadSuppliers(), loadProducts(), loadCustomers(), loadCoupons(), loadCouponAllowedPhones(), loadOrders(), loadCashEntries(), loadAdminUsers()]);
  state.lastRefreshedAt = new Date();
}

// Se algum formulário estiver aberto, pula a atualização automática pra
// não apagar o que a pessoa está digitando (o botão "Atualizar" manual
// continua funcionando normalmente, já que aí é a própria pessoa que pediu).
function isAnyFormOpen() {
  return !!(precifState.formOpen || materiaisState.formOpen || fornecedoresState.formOpen || clientesState.formOpen || cuponsState.formOpen || caixaState.formOpen || caixaState.stockDebtOpen || couponPhonesState.open || brindeState.open || stockPurchaseState.open);
}

async function loadAdminUsers() {
  const { data, error } = await supabaseClient.from("admin_users").select("id, name");
  if (!error) state.adminUsers = data;
  else console.error("loadAdminUsers:", error.message);
}

/* Nome do administrador dono desse id (ex: pra mostrar "Vendido por: Bob"). */
function adminName(id) {
  if (!id) return null;
  const found = state.adminUsers.find((a) => a.id === id);
  return found ? found.name : null;
}

async function logout() {
  await supabaseClient.auth.signOut();
  Object.assign(state, {
    screen: "login", selectedName: null, currentUser: null, tab: "precificacao",
    products: [], materials: [], customers: [], coupons: [], couponAllowedPhones: [], orders: [], cashEntries: [], error: null,
  });
  render();
}

  const { data, error } = await supabaseClient
    .from("products")
    .select("*, product_materials(id, quantity, material_id, materials(id, name, unit, unit_cost)), product_variants(id, name, photo_url, sort_order, in_stock, esgotado), suppliers(id, name, phone, instagram, address)")
    .order("active", { ascending: false })
    .order("name", { ascending: true });
  if (!error) state.products = data;
  else console.error("loadProducts:", error.message);
}

// Badge de estoque na listagem de produtos. Produto SEM modelo cadastrado
// usa o campo de estoque do produto, como sempre. Produto COM modelos
// usa o estoque de cada modelo — mostra "todos em estoque" só se todos
// estiverem marcados, "sob encomenda" só se nenhum estiver, e "parcial"
// quando é uma mistura (aí o cliente vê o prazo certo pra cada modelo
// que escolher lá no Catálogo).
function stockBadge(p) {
  const variants = p.product_variants ?? [];
  if (variants.length === 0) {
    return p.in_stock
      ? `<span title="Em estoque — pronta entrega" class="rounded-full bg-emerald-100 px-1 py-0.5 text-[9px] font-semibold text-emerald-700">✓ estoque</span>`
      : `<span title="Sob encomenda — catálogo avisa prazo de 2 dias" class="rounded-full bg-navy-100 px-1 py-0.5 text-[9px] font-semibold text-navy-500">sob encomenda</span>`;
  }
  const inStockCount = variants.filter((v) => v.in_stock).length;
  if (inStockCount === variants.length) {
    return `<span title="Todos os modelos em estoque" class="rounded-full bg-emerald-100 px-1 py-0.5 text-[9px] font-semibold text-emerald-700">✓ estoque (todos)</span>`;
  }
  if (inStockCount === 0) {
    return `<span title="Nenhum modelo em estoque — catálogo avisa prazo de 2 dias" class="rounded-full bg-navy-100 px-1 py-0.5 text-[9px] font-semibold text-navy-500">sob encomenda (todos)</span>`;
  }
  return `<span title="${inStockCount} de ${variants.length} modelos em estoque — veja qual em Modelos" class="rounded-full bg-gold-100 px-1 py-0.5 text-[9px] font-semibold text-gold-700">estoque parcial (${inStockCount}/${variants.length})</span>`;
}

// Badge de "Esgotado" na listagem — só aparece quando faz sentido (não
// polui a linha de um produto que nunca esgotou nada). Produto com
// modelo usa o esgotado de cada um; produto sem modelo usa o dele.
function esgotadoBadge(p) {
  const variants = p.product_variants ?? [];
  if (variants.length === 0) {
    return p.esgotado
      ? `<span title="Esgotado — não aparece pra compra no Catálogo" class="rounded-full bg-red-100 px-1 py-0.5 text-[9px] font-semibold text-red-700">⛔ esgotado</span>`
      : "";
  }
  const esgotadoCount = variants.filter((v) => v.esgotado).length;
  if (esgotadoCount === 0) return "";
  if (esgotadoCount === variants.length) {
    return `<span title="Todos os modelos esgotados" class="rounded-full bg-red-100 px-1 py-0.5 text-[9px] font-semibold text-red-700">⛔ esgotado (todos)</span>`;
  }
  return `<span title="${esgotadoCount} de ${variants.length} modelos esgotados — veja qual em Modelos" class="rounded-full bg-red-100 px-1 py-0.5 text-[9px] font-semibold text-red-700">⛔ esgotado (${esgotadoCount}/${variants.length})</span>`;
}

            <select id="pf-material-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
              <option value="">— selecione —</option>
              ${activeMaterials.map((m) => `<option value="${m.id}">${escapeHtml(m.name)} (${formatBRL(m.unit_cost)}/${escapeHtml(m.unit)})</option>`).join("")}
            </select>
          </div>
          <div class="w-full sm:w-32">
            <label class="mb-1 block text-xs font-medium text-navy-700">Quantidade</label>
            <input id="pf-material-qty" inputmode="decimal" placeholder="1" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
          </div>
          <button type="button" id="pf-material-add" class="w-full rounded-lg border border-navy-300 px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100 sm:w-auto">+ Adicionar</button>
        </div>
        <div id="pf-materials-list" class="mt-3 flex flex-col gap-1"></div>
      </div>

      <div id="pf-preview" class="flex flex-wrap gap-x-6 gap-y-1 rounded-lg bg-cream-50 px-4 py-2 text-xs text-navy-600"></div>
      <div id="pf-error" class="text-sm text-red-600"></div>
      <div class="flex gap-2">
        <button type="submit" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">Salvar</button>
        <button type="button" id="pf-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
      </div>
    </form>
  `;

  const baseCostField = document.getElementById("pf-base-cost");
  const materialSelect = document.getElementById("pf-material-select");
  const materialQtyField = document.getElementById("pf-material-qty");
  const materialsListEl = document.getElementById("pf-materials-list");
  const preview = document.getElementById("pf-preview");
  const photoInput = document.getElementById("pf-photo-input");
  const photoPreview = document.getElementById("pf-photo-preview");
  const photoStatus = document.getElementById("pf-photo-status");
  const photoRemoveBtn = document.getElementById("pf-photo-remove");
  const categorySelect = document.getElementById("pf-category-select");
  const categoryNewField = document.getElementById("pf-category-new");
  const materialTagSelect = document.getElementById("pf-material-tag-select");
  const materialTagNewField = document.getElementById("pf-material-tag-new");
  const supplierSelect = document.getElementById("pf-supplier-select");
  const supplierNewBlock = document.getElementById("pf-supplier-new");
  const variantsListEl = document.getElementById("pf-variants-list");

  // Estado local da foto: null = não mexeu, "remove" = tirar a foto atual,
  // ou um Blob já redimensionado/comprimido, pronto pra enviar.
  let pendingPhoto = null;

  categoryNewField.classList.toggle("hidden", categorySelect.value !== "__new__");
  categorySelect.addEventListener("change", () => {
    categoryNewField.classList.toggle("hidden", categorySelect.value !== "__new__");
    if (categorySelect.value === "__new__") {
      categoryNewField.focus();
    } else {
      categoryNewField.value = "";
    }
  });

  materialTagNewField.classList.toggle("hidden", materialTagSelect.value !== "__new__");
  materialTagSelect.addEventListener("change", () => {
    materialTagNewField.classList.toggle("hidden", materialTagSelect.value !== "__new__");
    if (materialTagSelect.value === "__new__") {
      materialTagNewField.focus();
    } else {
      materialTagNewField.value = "";
    }
  });

  supplierNewBlock.classList.toggle("hidden", supplierSelect.value !== "__new__");
  if (supplierSelect.value === "__new__") supplierNewBlock.classList.add("flex");
  supplierSelect.addEventListener("change", () => {
    const isNew = supplierSelect.value === "__new__";
    supplierNewBlock.classList.toggle("hidden", !isNew);
    supplierNewBlock.classList.toggle("flex", isNew);
    if (isNew) {
      document.getElementById("pf-supplier-new-name").focus();
    } else {
      document.getElementById("pf-supplier-new-name").value = "";
      document.getElementById("pf-supplier-new-phone").value = "";
      document.getElementById("pf-supplier-new-instagram").value = "";
      document.getElementById("pf-supplier-new-address").value = "";
    }
  });

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files?.[0];
    if (!file) return;
    photoStatus.textContent = "Processando imagem...";
    try {
      const originalKB = file.size;
      const blob = await resizeImageToBlob(file);
      pendingPhoto = blob;
      photoPreview.src = URL.createObjectURL(blob);
      photoPreview.classList.remove("hidden");
      photoRemoveBtn.classList.remove("hidden");
      photoStatus.textContent = `Pronta pra enviar: ${formatKB(originalKB)} → ${formatKB(blob.size)} depois de comprimida.`;
    } catch (err) {
      photoStatus.textContent = "Não foi possível processar essa imagem: " + err.message;
      pendingPhoto = null;
    }
  });

  photoRemoveBtn.addEventListener("click", () => {
    pendingPhoto = "remove";
    photoInput.value = "";
    photoPreview.classList.add("hidden");
    photoRemoveBtn.classList.add("hidden");
    photoStatus.textContent = "A foto será removida ao salvar.";
  });

  const inStockBlock = document.getElementById("pf-in-stock-block");
  const inStockVariantNote = document.getElementById("pf-in-stock-variant-note");

  // Quando o produto tem modelo cadastrado, o estoque é controlado por
  // modelo (logo abaixo) — o checkbox de estoque do produto some, pra
  // não dar a entender que ele ainda faz alguma coisa.
  function updateInStockBlockVisibility() {
    const hasVariants = formVariants.length > 0;
    inStockBlock.classList.toggle("hidden", hasVariants);
    inStockVariantNote.classList.toggle("hidden", !hasVariants);
  }

  function renderVariantsList() {
    variantsListEl.innerHTML = formVariants.length === 0
      ? `<p class="text-xs text-navy-400">Nenhum modelo cadastrado — deixe em branco se este produto não tiver variações.</p>`
      : formVariants.map((v, idx) => `
          <div class="flex flex-col gap-2 rounded-lg bg-white p-3 shadow-sm sm:flex-row sm:items-center">
            <img data-variant-preview="${idx}" src="${v.photoUrl ?? ""}" class="h-14 w-14 flex-shrink-0 rounded-lg border border-navy-200 bg-cream-50 object-cover ${v.photoUrl ? "" : "hidden"}" />
            <div class="flex-1">
              <input data-variant-name="${idx}" value="${escapeHtml(v.name)}" placeholder="Ex: Azul, Modelo P..."
                class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
              <label class="mt-1.5 flex items-center gap-1.5 text-xs text-navy-700">
                <input type="checkbox" data-variant-in-stock="${idx}" ${v.inStock ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
                Em estoque (pronta entrega)
              </label>
              <label class="mt-1 flex items-center gap-1.5 text-xs text-navy-700">
                <input type="checkbox" data-variant-esgotado="${idx}" ${v.esgotado ? "checked" : ""} class="rounded border-navy-300 text-red-600 focus:ring-red-400" />
                Esgotado
              </label>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <input type="file" data-variant-photo="${idx}" accept="image/*" class="text-xs text-navy-700" />
              <button type="button" data-variant-remove-photo="${idx}" class="text-xs text-red-600 hover:underline ${v.photoUrl ? "" : "hidden"}">remover foto</button>
              <button type="button" data-variant-remove="${idx}" class="rounded border border-red-200 px-2 py-1 text-xs font-medium text-red-600 hover:bg-red-50">Remover modelo</button>
            </div>
          </div>
        `).join("");
    wireVariantRowEvents();
    updateInStockBlockVisibility();
  }

  function wireVariantRowEvents() {
    variantsListEl.querySelectorAll("[data-variant-name]").forEach((input) => {
      input.addEventListener("input", () => {
        formVariants[Number(input.dataset.variantName)].name = input.value;
      });
    });
    variantsListEl.querySelectorAll("[data-variant-in-stock]").forEach((input) => {
      input.addEventListener("change", () => {
        formVariants[Number(input.dataset.variantInStock)].inStock = input.checked;
      });
    });
    variantsListEl.querySelectorAll("[data-variant-esgotado]").forEach((input) => {
      input.addEventListener("change", () => {
        formVariants[Number(input.dataset.variantEsgotado)].esgotado = input.checked;
      });
    });
    variantsListEl.querySelectorAll("[data-variant-photo]").forEach((input) => {
      input.addEventListener("change", async () => {
        const idx = Number(input.dataset.variantPhoto);
        const file = input.files?.[0];
        if (!file) return;
        try {
          const blob = await resizeImageToBlob(file);
          formVariants[idx].pendingPhoto = blob;
          formVariants[idx].photoUrl = URL.createObjectURL(blob);
          const previewImg = variantsListEl.querySelector(`[data-variant-preview="${idx}"]`);
          previewImg.src = formVariants[idx].photoUrl;
          previewImg.classList.remove("hidden");
          variantsListEl.querySelector(`[data-variant-remove-photo="${idx}"]`).classList.remove("hidden");
        } catch (err) {
          document.getElementById("pf-error").textContent = "Não foi possível processar a foto desse modelo: " + err.message;
        }
      });
    });
    variantsListEl.querySelectorAll("[data-variant-remove-photo]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.variantRemovePhoto);
        formVariants[idx].pendingPhoto = "remove";
        formVariants[idx].photoUrl = null;
        renderVariantsList();
      });
    });
    variantsListEl.querySelectorAll("[data-variant-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.variantRemove);
        if (formVariants[idx].originalPhotoUrl) deletedVariantPhotoUrls.push(formVariants[idx].originalPhotoUrl);
        formVariants.splice(idx, 1);
        renderVariantsList();
      });
    });
  }

  renderVariantsList();
  document.getElementById("pf-variant-add").addEventListener("click", () => {
    formVariants.push({ id: null, name: "", photoUrl: null, originalPhotoUrl: null, pendingPhoto: null, inStock: false, esgotado: false });
    renderVariantsList();
  });

  function materialsTotal() {
    return formMaterials.reduce((sum, m) => sum + m.unit_cost * m.quantity, 0);
  }

  function renderMaterialsList() {
    materialsListEl.innerHTML = formMaterials.length === 0
      ? `<p class="text-xs text-navy-400">Nenhum material vinculado ainda.</p>`
      : formMaterials.map((m, idx) => `
          <div class="flex items-center justify-between rounded-lg bg-white px-3 py-1.5 text-sm shadow-sm">
            <span>${escapeHtml(m.name)} — ${m.quantity} ${escapeHtml(m.unit)} × ${formatBRL(m.unit_cost)}</span>
            <span class="flex items-center gap-3">
              <b class="text-navy-900">${formatBRL(m.unit_cost * m.quantity)}</b>
              <button type="button" data-remove-idx="${idx}" class="pf-remove-material text-red-600 hover:underline">remover</button>
            </span>
          </div>
        `).join("");
    materialsListEl.querySelectorAll(".pf-remove-material").forEach((btn) => {
      btn.addEventListener("click", () => {
        formMaterials.splice(Number(btn.dataset.removeIdx), 1);
        renderMaterialsList();
        updatePreview();
      });
    });
  }

  function updatePreview() {
    const baseCost = Number(baseCostField.value.replace(",", "."));
    if (!Number.isFinite(baseCost) || baseCost < 0) { preview.innerHTML = ""; return; }
    const totalCost = round2(baseCost + materialsTotal());
    const p = calculatePricing(totalCost);
    preview.innerHTML = `
      <span>Custo total: <b class="text-navy-900">${formatBRL(totalCost)}</b></span>
      <span>Crédito: <b class="text-navy-900">${formatBRL(p.creditPrice)}</b> (${formatPercent(p.creditMargin)})</span>
      <span>Promo/Pix: <b class="text-navy-900">${formatBRL(p.promoPrice)}</b> (${formatPercent(p.promoMargin)})</span>
    `;
  }

  baseCostField.addEventListener("input", updatePreview);
  renderMaterialsList();
  updatePreview();

  document.getElementById("pf-material-add").addEventListener("click", () => {
    const materialId = materialSelect.value;
    const qty = Number(materialQtyField.value.replace(",", "."));
    const errorEl = document.getElementById("pf-error");
    if (!materialId) { errorEl.textContent = "Escolha um material."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Informe uma quantidade válida."; return; }
    errorEl.textContent = "";

    const material = state.materials.find((m) => m.id === materialId);
    const existing = formMaterials.find((m) => m.material_id === materialId);
    if (existing) {
      existing.quantity = qty;
    } else {
      formMaterials.push({ material_id: material.id, name: material.name, unit: material.unit, unit_cost: Number(material.unit_cost), quantity: qty });
    }
    materialSelect.value = "";
    materialQtyField.value = "";
    renderMaterialsList();
    updatePreview();
  });

  document.getElementById("pf-cancel").addEventListener("click", () => {
    precifState.formOpen = false;
    renderPrecificacao(document.getElementById("main-content"));
  });

  document.getElementById("product-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("pf-name").value.trim();
    const baseCost = Number(baseCostField.value.replace(",", "."));
    const errorEl = document.getElementById("pf-error");
    if (!name) { errorEl.textContent = "Informe o nome do produto."; return; }
    if (!Number.isFinite(baseCost) || baseCost < 0) { errorEl.textContent = "Custo base inválido."; return; }

    const totalCost = round2(baseCost + materialsTotal());
    const pricing = calculatePricing(totalCost);
    const showInCatalog = document.getElementById("pf-show-catalog").checked;
    const featured = document.getElementById("pf-featured").checked;
    const inStock = document.getElementById("pf-in-stock").checked;
    const esgotado = document.getElementById("pf-esgotado").checked;
    const categorySelected = categorySelect.value;
    if (categorySelected === "__new__" && !categoryNewField.value.trim()) {
      errorEl.textContent = "Digite o nome da nova categoria.";
      return;
    }
    const category = categorySelected === "__new__" ? categoryNewField.value.trim() : categorySelected;
    const materialTagSelected = materialTagSelect.value;
    if (materialTagSelected === "__new__" && !materialTagNewField.value.trim()) {
      errorEl.textContent = "Digite o nome da nova tag de material.";
      return;
    }
    const materialTag = materialTagSelected === "__new__" ? materialTagNewField.value.trim() : materialTagSelected;
    const description = document.getElementById("pf-description").value.trim();

    if (formVariants.some((v) => !v.name.trim())) {
      errorEl.textContent = "Preencha o nome de todos os modelos (ou remova a linha vazia).";
      return;
    }

    // Fornecedor: usa o selecionado, ou cadastra um novo antes de salvar o
    // produto (nome e telefone são obrigatórios pro fornecedor).
    let supplierId = supplierSelect.value === "__new__" ? null : (supplierSelect.value || null);
    if (supplierSelect.value === "__new__") {
      const newSupplierName = document.getElementById("pf-supplier-new-name").value.trim();
      const newSupplierPhone = document.getElementById("pf-supplier-new-phone").value.trim();
      const newSupplierInstagram = document.getElementById("pf-supplier-new-instagram").value.trim();
      const newSupplierAddress = document.getElementById("pf-supplier-new-address").value.trim();
      if (!newSupplierName || !newSupplierPhone) {
        errorEl.textContent = "Pro novo fornecedor, informe nome e telefone.";
        return;
      }
      const supplierResult = await supabaseClient.from("suppliers").insert({
        name: newSupplierName, phone: newSupplierPhone,
        instagram: newSupplierInstagram || null, address: newSupplierAddress || null,
        created_by: state.currentUser.id,
      }).select("id").single();
      if (supplierResult.error) { errorEl.textContent = "Não foi possível cadastrar o fornecedor: " + supplierResult.error.message; return; }
      supplierId = supplierResult.data.id;
    }

    // Envia a foto nova (se houver) antes de salvar o produto.
    const oldPhotoUrl = product?.photo_url ?? null;
    let newPhotoUrl = oldPhotoUrl;
    if (pendingPhoto === "remove") {
      newPhotoUrl = null;
    } else if (pendingPhoto instanceof Blob) {
      const path = `${crypto.randomUUID()}.jpg`;
      const { error: uploadError } = await supabaseClient.storage.from("product-photos").upload(path, pendingPhoto, { contentType: "image/jpeg", upsert: false });
      if (uploadError) { errorEl.textContent = "Não foi possível enviar a foto: " + uploadError.message; return; }
      newPhotoUrl = supabaseClient.storage.from("product-photos").getPublicUrl(path).data.publicUrl;
    }

    // Envia as fotos novas dos modelos (se houver) antes de salvar o produto.
    for (const v of formVariants) {
      if (v.pendingPhoto === "remove") {
        v.finalPhotoUrl = null;
      } else if (v.pendingPhoto instanceof Blob) {
        const path = `variante-${crypto.randomUUID()}.jpg`;
        const { error: variantUploadError } = await supabaseClient.storage.from("product-photos").upload(path, v.pendingPhoto, { contentType: "image/jpeg", upsert: false });
        if (variantUploadError) { errorEl.textContent = `Não foi possível enviar a foto do modelo "${v.name}": ` + variantUploadError.message; return; }
        v.finalPhotoUrl = supabaseClient.storage.from("product-photos").getPublicUrl(path).data.publicUrl;
      } else {
        v.finalPhotoUrl = v.originalPhotoUrl;
      }
      if (v.originalPhotoUrl && v.originalPhotoUrl !== v.finalPhotoUrl) {
        deletedVariantPhotoUrls.push(v.originalPhotoUrl);
      }
    }

    const payload = {
      name, base_cost: baseCost, cost: pricing.cost,
      credit_price: pricing.creditPrice, credit_net: pricing.creditNet, credit_profit: pricing.creditProfit,
      credit_markup: pricing.creditMarkup, credit_margin: pricing.creditMargin,
      promo_price: pricing.promoPrice, promo_profit: pricing.promoProfit, promo_margin: pricing.promoMargin,
      photo_url: newPhotoUrl, show_in_catalog: showInCatalog, category: category || null, featured,
      in_stock: inStock, esgotado,
      description: description || null, material_tag: materialTag || null, supplier_id: supplierId,
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let productId = product?.id;
    if (product) {
      const result = await supabaseClient.from("products").update(payload).eq("id", product.id);
      if (result.error) { errorEl.textContent = result.error.message; return; }
    } else {
      const result = await supabaseClient.from("products").insert({ ...payload, created_by: state.currentUser.id }).select("id").single();
      if (result.error) { errorEl.textContent = result.error.message; return; }
      productId = result.data.id;
    }

    // Se trocou ou removeu a foto, apaga o arquivo antigo do Storage (evita acumular lixo).
    if (oldPhotoUrl && oldPhotoUrl !== newPhotoUrl) {
      const oldPath = oldPhotoUrl.split("/product-photos/")[1];
      if (oldPath) await supabaseClient.storage.from("product-photos").remove([oldPath]);
    }

    // Sincroniza os materiais vinculados: apaga os antigos e grava a lista atual.
    await supabaseClient.from("product_materials").delete().eq("product_id", productId);
    if (formMaterials.length > 0) {
      const rows = formMaterials.map((m) => ({ product_id: productId, material_id: m.material_id, quantity: m.quantity }));
      const { error: linkError } = await supabaseClient.from("product_materials").insert(rows);
      if (linkError) { errorEl.textContent = linkError.message; return; }
    }

    // Sincroniza os modelos/variações: apaga os antigos e grava a lista atual.
    await supabaseClient.from("product_variants").delete().eq("product_id", productId);
    if (formVariants.length > 0) {
      const variantRows = formVariants.map((v, idx) => ({ product_id: productId, name: v.name.trim(), photo_url: v.finalPhotoUrl ?? null, sort_order: idx, in_stock: v.inStock, esgotado: v.esgotado }));
      const { error: variantError } = await supabaseClient.from("product_variants").insert(variantRows);
      if (variantError) { errorEl.textContent = variantError.message; return; }
    }

    // Apaga do Storage as fotos de modelos que foram trocadas ou removidas.
    for (const url of deletedVariantPhotoUrls) {
      const oldPath = url.split("/product-photos/")[1];
      if (oldPath) await supabaseClient.storage.from("product-photos").remove([oldPath]);
    }

    precifState.formOpen = false;
    if (supplierSelect.value === "__new__") await loadSuppliers();
    await loadProducts();
    renderPrecificacao(document.getElementById("main-content"));
  });
}

/* =====================================================================
   ABA: MATERIAIS / INSUMOS
   ===================================================================== */
async function loadMaterials() {
  const { data, error } = await supabaseClient.from("materials").select("*").order("active", { ascending: false }).order("name", { ascending: true });
  if (!error) state.materials = data;
  else console.error("loadMaterials:", error.message);
}

let materiaisState = { showInactive: false, formOpen: false, editingId: null };

function renderMateriais(container) {
  const visible = state.materials.filter((m) => materiaisState.showInactive || m.active);

  container.innerHTML = `
    <div class="flex flex-col gap-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-xl font-semibold text-navy-900">Materiais / Insumos</h1>
          <p class="text-sm text-navy-500">Embalagens, fitas, pérolas etc. — o custo unitário sai sozinho a partir do preço da embalagem. Depois, vincule os materiais aos produtos na aba Precificação.</p>
        </div>
        <div class="flex items-center gap-3">
          <label class="flex items-center gap-2 text-sm text-navy-600">
            <input type="checkbox" id="show-inactive-materials" ${materiaisState.showInactive ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
            Mostrar inativos
          </label>
          <button id="new-material-btn" class="rounded-lg bg-gold-500 px-4 py-2 text-sm font-semibold text-navy-900 shadow transition hover:bg-gold-400">+ Novo material</button>
        </div>
      </div>

      <div id="material-form-slot"></div>

      <div class="overflow-x-auto rounded-xl border border-navy-100 bg-white shadow">
        <table class="w-full min-w-[700px] text-sm">
          <thead>
            <tr class="border-b border-navy-100 bg-navy-900 text-left text-xs uppercase tracking-wide text-cream-50">
              <th class="px-3 py-3">Material</th>
              <th class="px-3 py-3">Tipo</th>
              <th class="px-3 py-3 text-right">Preço da embalagem</th>
              <th class="px-3 py-3 text-right">Quantidade</th>
              <th class="px-3 py-3">Unidade</th>
              <th class="px-3 py-3 text-right">Custo unitário</th>
              <th class="px-3 py-3 text-right">Estoque</th>
              <th class="px-3 py-3 text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            ${visible.length === 0 ? `<tr><td colspan="8" class="px-4 py-8 text-center text-navy-400">Nenhum material cadastrado.</td></tr>` : visible.map((m) => `
              <tr class="border-b border-navy-50 last:border-0 hover:bg-cream-50 ${!m.active ? "opacity-50" : ""}">
                <td class="px-3 py-3 font-medium text-navy-900">${escapeHtml(m.name)}</td>
                <td class="px-3 py-3 text-navy-600">
                  ${m.type ? `<span class="rounded-full bg-cream-100 px-2 py-0.5 text-xs font-medium text-navy-600 ring-1 ring-navy-100">${escapeHtml(m.type)}</span>` : ""}
                  ${isEssencial(m) && m.qty_per_order ? `<span class="mt-1 block text-[11px] font-medium text-red-500">−${Number(m.qty_per_order)} ${escapeHtml(m.unit)}/venda</span>` : ""}
                  ${isEmbalagem(m) && m.fixed_price != null ? `<span class="mt-1 block text-[11px] font-medium text-emerald-700" title="Preço fixo cobrado do cliente (não é calculado automaticamente)">Cliente: ${formatBRL(m.fixed_price)} (fixo)</span>` : ""}
                </td>
                <td class="px-3 py-3 text-right">${formatBRL(m.package_price)}</td>
                <td class="px-3 py-3 text-right">${Number(m.package_qty)}</td>
                <td class="px-3 py-3">${escapeHtml(m.unit)}</td>
                <td class="px-3 py-3 text-right font-semibold text-navy-900">${formatBRL(m.unit_cost)}</td>
                <td class="px-3 py-3 text-right ${Number(m.stock_qty) <= 0 ? "text-red-600 font-semibold" : "text-navy-700"}">${Number(m.stock_qty)} ${escapeHtml(m.unit)}</td>
                <td class="px-3 py-3 text-center">
                  <div class="flex justify-center gap-2">

                    <button data-toggle="${m.id}" data-active="${m.active}" class="toggle-material-btn rounded px-2 py-1 text-xs font-medium ${m.active ? "text-red-600" : "text-emerald-700"} hover:bg-navy-100">${m.active ? "Desativar" : "Reativar"}</button>
                  </div>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById("show-inactive-materials").addEventListener("change", (e) => {
    materiaisState.showInactive = e.target.checked;
    renderMateriais(container);
  });
  document.getElementById("new-material-btn").addEventListener("click", () => {
    materiaisState.editingId = null;
    materiaisState.formOpen = true;
    renderMaterialForm();
  });
  container.querySelectorAll(".edit-material-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      materiaisState.editingId = btn.dataset.edit;
      materiaisState.formOpen = true;
      renderMaterialForm();
    });
  });
  container.querySelectorAll(".toggle-material-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.toggle;
      const active = btn.dataset.active === "true";
      await supabaseClient.from("materials").update({ active: !active, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadMaterials();
      renderMateriais(container);
    });
  });

  if (materiaisState.formOpen) renderMaterialForm();
}

function renderMaterialForm() {
  const slot = document.getElementById("material-form-slot");
  const material = materiaisState.editingId ? state.materials.find((m) => m.id === materiaisState.editingId) : null;

  slot.innerHTML = `
    <form id="material-form" class="flex flex-col gap-4 rounded-xl border border-gold-300 bg-white p-5 shadow sm:flex-row sm:flex-wrap sm:items-end">
      <div class="min-w-[220px] flex-1">
        <label class="mb-1 block text-sm font-medium text-navy-800">Nome do material</label>
        <input id="mf-name" value="${material ? escapeHtml(material.name) : ""}" required
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="Ex: Saco transparente 25x37 c/50" />
      </div>
      <div class="w-full sm:w-40">
        <label class="mb-1 block text-sm font-medium text-navy-800">Preço da embalagem (R$)</label>
        <input id="mf-price" value="${material ? material.package_price : ""}" required inputmode="decimal"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="0,00" />
      </div>
      <div class="w-full sm:w-32">
        <label class="mb-1 block text-sm font-medium text-navy-800">Quantidade</label>
        <input id="mf-qty" value="${material ? material.package_qty : ""}" required inputmode="decimal"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="Ex: 50" />
      </div>
      <div class="w-full sm:w-28">
        <label class="mb-1 block text-sm font-medium text-navy-800">Unidade</label>
        <select id="mf-unit" class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
          ${["un", "g", "m", "cm", "kg", "l"].map((u) => `<option value="${u}" ${material?.unit === u ? "selected" : ""}>${u}</option>`).join("")}
        </select>
      </div>
      <div class="w-full sm:w-32">
        <label class="mb-1 block text-sm font-medium text-navy-800">Estoque atual</label>
        <input id="mf-stock" value="${material ? Number(material.stock_qty) : "0"}" required inputmode="decimal"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="0" />
        <p class="mt-1 text-xs text-navy-400">Some aqui quando comprar mais.</p>
      </div>
      <div class="w-full sm:w-56">
        <label class="mb-1 block text-sm font-medium text-navy-800">Tipo (opcional)</label>
        <select id="mf-type-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
          <option value="">— sem tipo —</option>
          ${[...new Set(state.materials.map((m) => m.type).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR")).map((t) => `<option value="${escapeHtml(t)}" ${material?.type === t ? "selected" : ""}>${escapeHtml(t)}</option>`).join("")}
          <option value="__new__">+ Novo tipo...</option>
        </select>
        <input id="mf-type-new" class="mt-2 hidden w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="Ex: Embalagem" />
        <p class="mt-1 text-xs text-navy-400">Marque como "Embalagem" pra aparecer como opção de embalagem de presente no Catálogo, ou como "Essencial" pra insumos usados em toda venda (fio, cola, etiqueta...) que não são cobrados à parte do cliente.</p>
      </div>
      <div id="mf-qty-per-order-field" class="hidden w-full sm:w-56">
        <label class="mb-1 block text-sm font-medium text-navy-800">Quantidade usada por venda</label>
        <input id="mf-qty-per-order" value="${material && material.qty_per_order != null ? Number(material.qty_per_order) : ""}" inputmode="decimal"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="Ex: 0,5" />
        <p class="mt-1 text-xs text-navy-400">Quanto desse material é gasto, em média, em cada venda. Esse custo entra automaticamente em "Custo adicional (materiais)" de todo pedido.</p>
      </div>
      <div id="mf-fixed-price-field" class="hidden w-full sm:w-56">
        <label class="mb-1 block text-sm font-medium text-navy-800">Preço fixo pro cliente (opcional)</label>
        <input id="mf-fixed-price" value="${material && material.fixed_price != null ? Number(material.fixed_price) : ""}" inputmode="decimal"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="Ex: 2,50" />
        <p class="mt-1 text-xs text-navy-400">Deixe em branco pra calcular sozinho (custo + 30%). Se preencher, é esse valor certinho que o Catálogo cobra do cliente por essa embalagem.</p>
      </div>
      <div id="mf-preview" class="flex flex-1 min-w-[180px] items-center rounded-lg bg-cream-50 px-4 py-2 text-xs text-navy-600"></div>
      <div id="mf-error" class="w-full text-sm text-red-600"></div>
      <div class="flex gap-2">
        <button type="submit" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">Salvar</button>
        <button type="button" id="mf-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
      </div>
    </form>
  `;

  const priceField = document.getElementById("mf-price");
  const qtyField = document.getElementById("mf-qty");
  const preview = document.getElementById("mf-preview");
  const unitSelect = document.getElementById("mf-unit");
  const typeSelect = document.getElementById("mf-type-select");
  const typeNewField = document.getElementById("mf-type-new");
  const qtyPerOrderField = document.getElementById("mf-qty-per-order-field");
  const fixedPriceField = document.getElementById("mf-fixed-price-field");
  const fixedPriceInput = document.getElementById("mf-fixed-price");

  function currentTypeValue() {
    return typeSelect.value === "__new__" ? typeNewField.value.trim() : typeSelect.value;
  }
  function updateQtyPerOrderVisibility() {
    qtyPerOrderField.classList.toggle("hidden", !isEssencialTypeText(currentTypeValue()));
  }
  function updateFixedPriceVisibility() {
    fixedPriceField.classList.toggle("hidden", !isEmbalagemTypeText(currentTypeValue()));
  }

  typeNewField.classList.toggle("hidden", typeSelect.value !== "__new__");
  updateQtyPerOrderVisibility();
  updateFixedPriceVisibility();
  typeSelect.addEventListener("change", () => {
    typeNewField.classList.toggle("hidden", typeSelect.value !== "__new__");
    if (typeSelect.value === "__new__") {
      typeNewField.focus();
    } else {
      typeNewField.value = "";
    }
    updateQtyPerOrderVisibility();
    updateFixedPriceVisibility();
    updatePreview();
  });
  typeNewField.addEventListener("input", () => {
    updateQtyPerOrderVisibility();
    updateFixedPriceVisibility();
    updatePreview();
  });

  function updatePreview() {
    const price = Number(priceField.value.replace(",", "."));
    const qty = Number(qtyField.value.replace(",", "."));
    if (!Number.isFinite(price) || !Number.isFinite(qty) || qty <= 0) { preview.innerHTML = ""; return; }
    const unitCost = price / qty;
    let html = `Custo unitário: <b class="text-navy-900">${formatBRL(unitCost)}</b> / ${escapeHtml(unitSelect.value)}`;
    if (isEmbalagemTypeText(currentTypeValue())) {
      const fixedPrice = Number(fixedPriceInput.value.replace(",", "."));
      const customerPrice = Number.isFinite(fixedPrice) && fixedPriceInput.value.trim() ? fixedPrice : unitCost * (1 + GIFT_WRAP_MARKUP);
      html += ` &nbsp;·&nbsp; Preço pro cliente: <b class="text-navy-900">${formatBRL(customerPrice)}</b>${fixedPriceInput.value.trim() ? " (fixo)" : " (calculado: custo + 30%)"}`;
    }
    preview.innerHTML = html;
  }
  priceField.addEventListener("input", updatePreview);
  qtyField.addEventListener("input", updatePreview);
  unitSelect.addEventListener("change", updatePreview);
  fixedPriceInput.addEventListener("input", updatePreview);
  updatePreview();

  document.getElementById("mf-cancel").addEventListener("click", () => {
    materiaisState.formOpen = false;
    renderMateriais(document.getElementById("main-content"));
  });

  document.getElementById("material-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("mf-name").value.trim();
    const price = Number(priceField.value.replace(",", "."));
    const qty = Number(qtyField.value.replace(",", "."));
    const unit = unitSelect.value;
    const stock = Number(document.getElementById("mf-stock").value.replace(",", "."));
    const errorEl = document.getElementById("mf-error");
    if (!name) { errorEl.textContent = "Informe o nome do material."; return; }
    if (!Number.isFinite(price) || price < 0) { errorEl.textContent = "Preço inválido."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Quantidade inválida."; return; }
    if (!Number.isFinite(stock) || stock < 0) { errorEl.textContent = "Estoque inválido."; return; }

    const type = typeSelect.value === "__new__" ? typeNewField.value.trim() : typeSelect.value;
    if (typeSelect.value === "__new__" && !type) { errorEl.textContent = "Informe o nome do novo tipo, ou volte pra opção \"— sem tipo —\"."; return; }

    const isEssencialType = isEssencialTypeText(type);
    let qtyPerOrder = null;
    if (isEssencialType) {
      const qtyPerOrderRaw = document.getElementById("mf-qty-per-order").value.trim();
      if (qtyPerOrderRaw) {
        qtyPerOrder = Number(qtyPerOrderRaw.replace(",", "."));
        if (!Number.isFinite(qtyPerOrder) || qtyPerOrder < 0) { errorEl.textContent = "Quantidade usada por venda inválida."; return; }
      }
    }

    const isEmbalagemType = isEmbalagemTypeText(type);
    let fixedPrice = null;
    if (isEmbalagemType) {
      const fixedPriceRaw = fixedPriceInput.value.trim();
      if (fixedPriceRaw) {
        fixedPrice = Number(fixedPriceRaw.replace(",", "."));
        if (!Number.isFinite(fixedPrice) || fixedPrice < 0) { errorEl.textContent = "Preço fixo pro cliente inválido."; return; }
      }
    }

    const unitCost = Math.round((price / qty) * 10000) / 10000; // 4 casas de precisão
    // Captura o estoque ANTERIOR antes de disparar o update — depois de
    // salvo, "material" não deve mais ser usado pra isso (o registro
    // local pode não refletir mais o valor de antes da edição).
    const previousStock = material ? Number(material.stock_qty) : 0;
    const payload = {
      name, package_price: price, package_qty: qty, unit, stock_qty: stock,
      type: type || null,
      qty_per_order: qtyPerOrder,
      fixed_price: fixedPrice,
      unit_cost: unitCost,
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let result;
    if (material) {
      result = await supabaseClient.from("materials").update(payload).eq("id", material.id);
    } else {
      result = await supabaseClient.from("materials").insert({ ...payload, created_by: state.currentUser.id });
    }

    if (result.error) { errorEl.textContent = result.error.message; return; }

    // Material "Essencial" cujo estoque AUMENTOU: é uma compra nossa (não
    // uma cobrança ao cliente), então lança automaticamente uma "saída"
    // no Caixa no valor da compra. Só quando aumenta — reduzir estoque
    // (uso normal, correção de contagem etc.) não lança nada sozinho.
    const stockIncrease = stock - previousStock;
    if (isEssencialType && stockIncrease > 0) {
      const { error: cashError } = await supabaseClient.from("cash_entries").insert({
        entry_type: "saida",
        entry_date: todayISO(),
        amount: Math.round(stockIncrease * unitCost * 100) / 100,
        category: "Material essencial",
        description: `Compra de ${name} (+${stockIncrease} ${unit})`,
        payment_method: null,
        paid_at: new Date().toISOString(),
        created_by: state.currentUser.id,
      });
      if (cashError) {
        errorEl.textContent = `Material salvo, mas não foi possível lançar a despesa no Caixa: ${cashError.message}`;
      }
    }

    materiaisState.formOpen = false;
    await loadMaterials();
    await loadCashEntries();
    renderMateriais(document.getElementById("main-content"));
  });
}

async function loadSuppliers() {
  const { data, error } = await supabaseClient.from("suppliers").select("*").order("active", { ascending: false }).order("name", { ascending: true });
  if (!error) state.suppliers = data;
  else console.error("loadSuppliers:", error.message);
}

let fornecedoresState = { showInactive: false, formOpen: false, editingId: null };

function renderFornecedores(container) {
  const visible = state.suppliers.filter((s) => fornecedoresState.showInactive || s.active);

  container.innerHTML = `
    <div class="flex flex-col gap-6">
      <div class="flex flex-wrap items-center justify-between gap-3">

          <thead>
            <tr class="border-b border-navy-100 bg-navy-900 text-left text-xs uppercase tracking-wide text-cream-50">
              <th class="px-3 py-3">Nome</th>
              <th class="px-3 py-3">Telefone</th>
              <th class="px-3 py-3">Instagram</th>
              <th class="px-3 py-3">Endereço</th>
              <th class="px-3 py-3 text-right">Falta pagar</th>
              <th class="px-3 py-3 text-center">Ações</th>
            </tr>

          <tbody>
            ${visible.length === 0 ? `<tr><td colspan="6" class="px-4 py-8 text-center text-navy-400">Nenhum fornecedor cadastrado.</td></tr>` : visible.map((s) => {

              return `
              <tr class="border-b border-navy-50 last:border-0 hover:bg-cream-50 ${!s.active ? "opacity-50" : ""}">
                <td class="px-3 py-3 font-medium text-navy-900">${escapeHtml(s.name)}</td>

                <td class="px-3 py-3 text-navy-600">${s.instagram ? escapeHtml(s.instagram) : "—"}</td>
                <td class="px-3 py-3 text-navy-600">${s.address ? escapeHtml(s.address) : "—"}</td>
                <td class="px-3 py-3 text-right font-semibold ${pending.total > 0 ? "text-red-700" : "text-navy-400"}" title="Soma do custo dos itens de pedidos ainda não marcados 'Fornecedor pago' que usam produto deste fornecedor.">${formatBRL(pending.total)}</td>
                <td class="px-3 py-3 text-center">
                  <div class="flex flex-wrap justify-center gap-2">
                    <button data-edit="${s.id}" class="edit-supplier-btn rounded px-2 py-1 text-xs font-medium text-navy-700 hover:bg-navy-100">Editar</button>

                    <button data-nota="${s.id}" ${pending.total === 0 ? "disabled" : ""} class="nota-fornecedor-btn rounded px-2 py-1 text-xs font-medium ${pending.total === 0 ? "cursor-not-allowed text-navy-300" : "text-navy-700 hover:bg-navy-100"}" title="${pending.total === 0 ? "Nenhum item pendente pra este fornecedor" : "Gerar nota em PDF com os itens pendentes"}">Nota (PDF)</button>
                    <button data-nota-imagem="${s.id}" ${pending.total === 0 ? "disabled" : ""} class="nota-fornecedor-imagem-btn rounded px-2 py-1 text-xs font-medium ${pending.total === 0 ? "cursor-not-allowed text-navy-300" : "text-navy-700 hover:bg-navy-100"}" title="${pending.total === 0 ? "Nenhum item pendente pra este fornecedor" : "Gerar nota em imagem (JPG) — mais fácil de compartilhar no WhatsApp pelo celular"}">Nota (JPG)</button>

    fornecedoresState.showInactive = e.target.checked;
    renderFornecedores(container);
  });
  document.getElementById("new-supplier-btn").addEventListener("click", () => {
    fornecedoresState.editingId = null;
    fornecedoresState.formOpen = true;
    renderSupplierForm();
  });

    btn.addEventListener("click", () => {
      fornecedoresState.editingId = btn.dataset.edit;
      fornecedoresState.formOpen = true;
      renderSupplierForm();
    });

      renderFornecedores(container);
    });
  });
  container.querySelectorAll(".nota-fornecedor-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const supplier = state.suppliers.find((s) => s.id === btn.dataset.nota);
      if (!supplier) return;
      try {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          alert("Não foi possível gerar a nota: a biblioteca de PDF não carregou. Recarregue a página e tente novamente.");
          return;
        }
        const pending = pendingSupplierItems(supplier.id);
        const doc = buildSupplierNotePdf(supplier, pending);
        doc.save(`nota-fornecedor-${supplierFileSlug(supplier)}-${todayISO()}.pdf`);
      } catch (err) {
        console.error("Erro ao gerar nota de fornecedor:", err);
        alert("Não foi possível gerar a nota. Tente novamente ou avise o suporte.");
      }
    });
  });
  container.querySelectorAll(".nota-fornecedor-imagem-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const supplier = state.suppliers.find((s) => s.id === btn.dataset.notaImagem);
      if (!supplier) return;
      try {
        const pending = pendingSupplierItems(supplier.id);
        const canvas = buildSupplierNoteCanvas(supplier, pending);
        canvas.toBlob((blob) => {
          if (!blob) { alert("Não foi possível gerar a imagem da nota. Tente novamente."); return; }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `nota-fornecedor-${supplierFileSlug(supplier)}-${todayISO()}.jpg`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }, "image/jpeg", 0.92);
      } catch (err) {
        console.error("Erro ao gerar imagem da nota de fornecedor:", err);
        alert("Não foi possível gerar a imagem da nota. Tente novamente ou avise o suporte.");
      }
    });
  });

  if (fornecedoresState.formOpen) renderSupplierForm();
}

      </div>
      <div class="w-full sm:w-52">
        <label class="mb-1 block text-sm font-medium text-navy-800">Instagram (opcional)</label>
        <input id="sf-instagram" value="${supplier?.instagram ? escapeHtml(supplier.instagram) : ""}"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="@fornecedor" />
      </div>
      <div class="min-w-[220px] flex-1">
        <label class="mb-1 block text-sm font-medium text-navy-800">Endereço (opcional)</label>
        <input id="sf-address" value="${supplier?.address ? escapeHtml(supplier.address) : ""}"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="Rua, número, bairro, cidade" />
      </div>
      <div id="sf-error" class="w-full text-sm text-red-600"></div>
      <div class="flex gap-2">
        <button type="submit" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">Salvar</button>
        <button type="button" id="sf-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
      </div>
    </form>
  `;

  document.getElementById("sf-cancel").addEventListener("click", () => {
    fornecedoresState.formOpen = false;
    renderFornecedores(document.getElementById("main-content"));
  });

  document.getElementById("supplier-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("sf-name").value.trim();
    const phone = document.getElementById("sf-phone").value.trim();
    const instagram = document.getElementById("sf-instagram").value.trim();
    const address = document.getElementById("sf-address").value.trim();
    const errorEl = document.getElementById("sf-error");
    if (!name) { errorEl.textContent = "Informe o nome do fornecedor."; return; }
    if (!phone) { errorEl.textContent = "Informe o telefone do fornecedor."; return; }

    const payload = {
      name, phone, instagram: instagram || null, address: address || null,
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let result;
    if (supplier) {
      result = await supabaseClient.from("suppliers").update(payload).eq("id", supplier.id);
    } else {
      result = await supabaseClient.from("suppliers").insert({ ...payload, created_by: state.currentUser.id });
    }

    if (result.error) { errorEl.textContent = result.error.message; return; }

    fornecedoresState.formOpen = false;
    await loadSuppliers();
    renderFornecedores(document.getElementById("main-content"));
  });
}

/* =====================================================================
   ABA: CUPONS
   ===================================================================== */
async function loadCoupons() {
  const { data, error } = await supabaseClient.from("coupons").select("*").order("active", { ascending: false }).order("created_at", { ascending: false });
  if (!error) state.coupons = data;
  else console.error("loadCoupons:", error.message);
}

// Números de telefone com direito a algum cupom restrito (ver
// "Números autorizados" em cada cupom, na aba Cupons) — carregado de
// uma vez só pra todos os cupons, filtrado por cupom na hora de exibir.
async function loadCouponAllowedPhones() {
  const { data, error } = await supabaseClient.from("coupon_allowed_phones").select("*").order("created_at", { ascending: false });
  if (!error) state.couponAllowedPhones = data;
  else console.error("loadCouponAllowedPhones:", error.message);
}

/* Resumo legível do desconto pra mostrar na tabela, ex: "5% (máx. R$ 15,00)" ou "R$ 10,00". */
function couponDiscountLabel(c) {
  if (c.discount_type === "percentual") {
    const pct = `${Number(c.discount_value)}%`;
    return c.max_discount_amount != null ? `${pct} (máx. ${formatBRL(c.max_discount_amount)})` : pct;
  }
  return formatBRL(c.discount_value);
}

let cuponsState = { showInactive: false, formOpen: false, editingId: null };
let couponPhonesState = { open: false, couponId: null, phone: "", note: "" };

function renderCupons(container) {
  const visible = state.coupons.filter((c) => cuponsState.showInactive || c.active);

  container.innerHTML = `
    <div class="flex flex-col gap-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>

          <label class="flex items-center gap-2 text-sm text-navy-600">

          <button id="new-coupon-btn" class="rounded-lg bg-gold-500 px-4 py-2 text-sm font-semibold text-navy-900 shadow transition hover:bg-gold-400">+ Novo cupom</button>

              <th class="px-3 py-3 text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            ${visible.length === 0 ? `<tr><td colspan="7" class="px-4 py-8 text-center text-navy-400">Nenhum cupom cadastrado.</td></tr>` : visible.map((c) => `

                <td class="px-3 py-3 font-mono font-semibold text-navy-900">${escapeHtml(c.code)}</td>
                <td class="px-3 py-3 text-navy-600">${c.description ? escapeHtml(c.description) : "—"}</td>
                <td class="px-3 py-3 text-navy-600">${couponDiscountLabel(c)}</td>
                <td class="px-3 py-3 text-center text-navy-600">${c.first_purchase_only ? "Sim" : "Não"}</td>
                <td class="px-3 py-3 text-center text-navy-600">${c.single_use_per_customer ? "Sim" : "Não"}</td>
                <td class="px-3 py-3 text-center">
                  <span class="rounded-full px-2 py-0.5 text-xs font-medium ${c.active ? "bg-emerald-100 text-emerald-700" : "bg-navy-100 text-navy-500"}">${c.active ? "Ativo" : "Inativo"}</span>
                </td>
                <td class="px-3 py-3 text-center">
                  <div class="flex flex-wrap justify-center gap-2">
                    <button data-edit="${c.id}" class="edit-coupon-btn rounded px-2 py-1 text-xs font-medium text-navy-700 hover:bg-navy-100">Editar</button>
                    <button data-manage-phones="${c.id}" class="manage-phones-btn rounded px-2 py-1 text-xs font-medium text-navy-700 hover:bg-navy-100" title="Restringir este cupom a números de telefone específicos (ex: compensação por atraso), com aplicação automática no checkout">📱 Números${state.couponAllowedPhones.filter((p) => p.coupon_id === c.id).length > 0 ? ` (${state.couponAllowedPhones.filter((p) => p.coupon_id === c.id).length})` : ""}</button>
                    <button data-toggle="${c.id}" data-active="${c.active}" class="toggle-coupon-btn rounded px-2 py-1 text-xs font-medium ${c.active ? "text-red-600" : "text-emerald-700"} hover:bg-navy-100">${c.active ? "Desativar" : "Reativar"}</button>
                  </div>

              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>

      <div id="coupon-phones-slot"></div>
    </div>
  `;

  document.getElementById("show-inactive-coupons").addEventListener("change", (e) => {
    cuponsState.showInactive = e.target.checked;
    renderCupons(container);
  });
  document.getElementById("new-coupon-btn").addEventListener("click", () => {
    cuponsState.editingId = null;
    cuponsState.formOpen = true;
    renderCouponForm();
  });
  container.querySelectorAll(".edit-coupon-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      cuponsState.editingId = btn.dataset.edit;
      cuponsState.formOpen = true;
      renderCouponForm();
    });
  });
  container.querySelectorAll(".toggle-coupon-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.toggle;
      const active = btn.dataset.active === "true";
      await supabaseClient.from("coupons").update({ active: !active, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadCoupons();
      renderCupons(container);
    });
  });
  container.querySelectorAll(".manage-phones-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      couponPhonesState = { open: true, couponId: btn.dataset.managePhones, phone: "", note: "" };
      renderCouponPhonesModal();
    });
  });

  if (cuponsState.formOpen) renderCouponForm();
  if (couponPhonesState.open) renderCouponPhonesModal();
}

function renderCouponForm() {
  const slot = document.getElementById("coupon-form-slot");
  const coupon = cuponsState.editingId ? state.coupons.find((c) => c.id === cuponsState.editingId) : null;
  const type = coupon ? coupon.discount_type : "percentual";

  slot.innerHTML = `
    <form id="coupon-form" class="flex flex-col gap-4 rounded-xl border border-gold-300 bg-white p-5 shadow sm:flex-row sm:flex-wrap sm:items-end">

        <label class="mb-1 block text-sm font-medium text-navy-800">Código</label>
        <input id="cf-code" value="${coupon ? escapeHtml(coupon.code) : ""}" required maxlength="30"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 uppercase outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="Ex: BEMVINDA5" />
      </div>
      <div class="min-w-[220px] flex-1">
        <label class="mb-1 block text-sm font-medium text-navy-800">Descrição (opcional)</label>
        <input id="cf-description" value="${coupon?.description ? escapeHtml(coupon.description) : ""}"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="Ex: 5% na primeira compra" />
      </div>
      <div class="w-full sm:w-44">
        <label class="mb-1 block text-sm font-medium text-navy-800">Tipo de desconto</label>
        <select id="cf-type" class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
          <option value="percentual" ${type === "percentual" ? "selected" : ""}>Percentual (%)</option>
          <option value="valor_fixo" ${type === "valor_fixo" ? "selected" : ""}>Valor fixo (R$)</option>
        </select>
      </div>
      <div class="w-full sm:w-32">
        <label id="cf-value-label" class="mb-1 block text-sm font-medium text-navy-800">${type === "percentual" ? "Desconto (%)" : "Desconto (R$)"}</label>
        <input id="cf-value" type="number" step="0.01" min="0.01" value="${coupon ? Number(coupon.discount_value) : ""}" required
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
      </div>
      <div class="w-full sm:w-44">
        <label class="mb-1 block text-sm font-medium text-navy-800">Desconto máx. (R$, opcional)</label>
        <input id="cf-max" type="number" step="0.01" min="0.01" value="${coupon?.max_discount_amount != null ? Number(coupon.max_discount_amount) : ""}"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="Ex: 15,00" />
        <p class="mt-1 text-[11px] text-navy-400">Trava o desconto num valor máximo, mesmo em % — útil pra proteger sua margem.</p>

      <div class="flex flex-col gap-1.5 pb-2">
        <label class="flex items-center gap-2 text-sm text-navy-700">

          Só na 1ª compra do cliente
        </label>
        <label class="flex items-center gap-2 text-sm text-navy-700" title="Cada cliente (pelo WhatsApp) só consegue usar esse cupom uma vez — mesmo não sendo a 1ª compra dele. O cupom continua valendo normalmente pra outros clientes diferentes.">
          <input type="checkbox" id="cf-single-use" ${coupon?.single_use_per_customer ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
          Uso único por cliente
        </label>
      </div>
      <div id="cf-error" class="w-full text-sm text-red-600"></div>
      <div class="flex gap-2">
        <button type="submit" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">Salvar</button>
        <button type="button" id="cf-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>

  `;

  document.getElementById("cf-type").addEventListener("change", (e) => {
    document.getElementById("cf-value-label").textContent = e.target.value === "percentual" ? "Desconto (%)" : "Desconto (R$)";
  });

  document.getElementById("cf-cancel").addEventListener("click", () => {
    cuponsState.formOpen = false;
    renderCupons(document.getElementById("main-content"));
  });

  document.getElementById("coupon-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = document.getElementById("cf-code").value.trim().toUpperCase();
    const description = document.getElementById("cf-description").value.trim();
    const discountType = document.getElementById("cf-type").value;
    const discountValueRaw = document.getElementById("cf-value").value;
    const maxRaw = document.getElementById("cf-max").value;
    const firstPurchaseOnly = document.getElementById("cf-first-purchase").checked;
    const singleUsePerCustomer = document.getElementById("cf-single-use").checked;
    const errorEl = document.getElementById("cf-error");

    if (!code) { errorEl.textContent = "Informe o código do cupom."; return; }
    const discountValue = Number(discountValueRaw);
    if (!discountValueRaw || !(discountValue > 0)) { errorEl.textContent = "Informe um valor de desconto maior que zero."; return; }
    if (discountType === "percentual" && discountValue > 100) { errorEl.textContent = "O desconto percentual não pode passar de 100%."; return; }
    let maxDiscount = null;
    if (maxRaw.trim() !== "") {
      maxDiscount = Number(maxRaw);
      if (!(maxDiscount > 0)) { errorEl.textContent = "O desconto máximo deve ser maior que zero (ou deixe em branco)."; return; }
    }

    const payload = {
      code, description: description || null,
      discount_type: discountType, discount_value: discountValue,
      max_discount_amount: maxDiscount,
      first_purchase_only: firstPurchaseOnly,
      single_use_per_customer: singleUsePerCustomer,
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let result;
    if (coupon) {
      result = await supabaseClient.from("coupons").update(payload).eq("id", coupon.id);
    } else {
      result = await supabaseClient.from("coupons").insert({ ...payload, created_by: state.currentUser.id, active: true });
    }

    if (result.error) {
      errorEl.textContent = (result.error.message || "").toLowerCase().includes("duplicate") || (result.error.message || "").toLowerCase().includes("unique")
        ? "Já existe um cupom com esse código."
        : result.error.message;
      return;
    }

    cuponsState.formOpen = false;
    await loadCoupons();
    renderCupons(document.getElementById("main-content"));
  });
}

/* ---------------------------------------------------------------------
   Cupom: números de telefone autorizados (restrição pontual, ex:
   compensação por atraso na entrega) — ver migration_cupom_telefones.sql.
   Assim que um número é cadastrado aqui, o cupom passa a valer SÓ pra
   esses números (ignorando "só na 1ª compra"), e o catálogo aplica ele
   automático assim que o cliente digita esse WhatsApp no checkout.
   --------------------------------------------------------------------- */
function renderCouponPhonesModal() {
  const slot = document.getElementById("coupon-phones-slot");
  if (!slot) return;
  if (!couponPhonesState.open) { slot.innerHTML = ""; return; }

  const coupon = state.coupons.find((c) => c.id === couponPhonesState.couponId);
  if (!coupon) { couponPhonesState = { open: false, couponId: null, phone: "", note: "" }; slot.innerHTML = ""; return; }
  const phones = state.couponAllowedPhones
    .filter((p) => p.coupon_id === coupon.id)
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  slot.innerHTML = `
    <div id="coupon-phones-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
      <div class="flex max-h-[85vh] w-full max-w-lg flex-col overflow-hidden rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">
          <div>
            <h2 class="text-lg font-semibold text-navy-900">📱 Números autorizados — ${escapeHtml(coupon.code)}</h2>
            <p class="text-xs text-navy-500">${phones.length === 0
              ? "Sem restrição: qualquer cliente pode usar este cupom (respeitando \"só na 1ª compra\", se marcado)."
              : "Restrito: SÓ os números abaixo podem usar este cupom (ignora \"só na 1ª compra\" pra eles). Aplica sozinho assim que o cliente digita o WhatsApp no checkout."}</p>
          </div>
          <button id="coupon-phones-close-btn" type="button" class="rounded px-2 py-1 text-navy-500 hover:bg-navy-100">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-4">
          <form id="coupon-phone-add-form" class="flex flex-col gap-2 rounded-lg border border-navy-100 bg-cream-50 p-3">
            <div class="w-full">
              <label class="mb-1 block text-xs font-medium text-navy-700">Puxar de um cliente já cadastrado (opcional)</label>
              <select id="cp-customer-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                <option value="">— digitar o WhatsApp manualmente —</option>
                ${[...state.customers].filter((c) => c.active).sort((a, b) => a.name.localeCompare(b.name)).map((c) => `<option value="${c.id}">${escapeHtml(c.name)} — ${escapeHtml(c.whatsapp ?? "")}</option>`).join("")}
              </select>
            </div>
            <div class="flex flex-wrap items-end gap-2">
              <div class="min-w-[160px] flex-1">
                <label class="mb-1 block text-xs font-medium text-navy-700">WhatsApp</label>
                <input id="cp-phone" value="${escapeHtml(couponPhonesState.phone)}" required class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="(11) 91234-5678" />
              </div>
              <div class="min-w-[180px] flex-1">
                <label class="mb-1 block text-xs font-medium text-navy-700">Motivo (opcional)</label>
                <input id="cp-note" value="${escapeHtml(couponPhonesState.note)}" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="Ex: pedido Nº000123 atrasado" />
              </div>
              <button type="submit" class="rounded-lg bg-gold-500 px-3 py-2 text-sm font-semibold text-navy-900 transition hover:bg-gold-400">+ Adicionar</button>
            </div>
          </form>
          <div id="cp-error" class="mt-2 text-sm text-red-600"></div>

          <div class="mt-4 flex flex-col gap-2">
            ${phones.length === 0 ? `<p class="text-sm text-navy-400">Nenhum número cadastrado ainda.</p>` : phones.map((p) => `
              <div class="flex items-center justify-between gap-3 rounded-lg border border-navy-100 bg-white px-3 py-2 shadow-sm">
                <div>
                  <p class="text-sm font-medium text-navy-900">${escapeHtml(p.phone_digits)}</p>
                  ${p.note ? `<p class="text-xs text-navy-500">${escapeHtml(p.note)}</p>` : ""}
                  <p class="text-xs ${p.used_at ? "text-navy-400" : "text-emerald-700"}">${p.used_at ? `✓ Já usado em ${formatDate(p.used_at.slice(0, 10))}` : "Disponível"}</p>
                </div>
                <button type="button" data-remove-phone="${p.id}" class="remove-coupon-phone-btn text-xs text-red-600 hover:underline">remover</button>
              </div>
            `).join("")}
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById("coupon-phones-close-btn").addEventListener("click", () => {
    couponPhonesState = { open: false, couponId: null, phone: "", note: "" };
    renderCouponPhonesModal();
  });
  document.getElementById("coupon-phones-overlay").addEventListener("click", (e) => {
    if (e.target.id === "coupon-phones-overlay") {
      couponPhonesState = { open: false, couponId: null, phone: "", note: "" };
      renderCouponPhonesModal();
    }
  });
  document.getElementById("cp-phone").addEventListener("input", (e) => { couponPhonesState.phone = e.target.value; });
  document.getElementById("cp-note").addEventListener("input", (e) => { couponPhonesState.note = e.target.value; });
  document.getElementById("cp-customer-select").addEventListener("change", (e) => {
    const customer = state.customers.find((c) => c.id === e.target.value);
    if (!customer) return;
    couponPhonesState.phone = customer.whatsapp || "";
    document.getElementById("cp-phone").value = couponPhonesState.phone;
  });

  document.getElementById("coupon-phone-add-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("cp-error");
    const phoneDigits = document.getElementById("cp-phone").value.trim().replace(/\D/g, "");
    const note = document.getElementById("cp-note").value.trim();
    if (!phoneDigits) { errorEl.textContent = "Informe um número de WhatsApp válido."; return; }
    errorEl.textContent = "";

    const { error } = await supabaseClient.from("coupon_allowed_phones").insert({
      coupon_id: coupon.id, phone_digits: phoneDigits, note: note || null, created_by: state.currentUser.id,
    });
    if (error) {
      errorEl.textContent = (error.message || "").toLowerCase().includes("duplicate") || (error.message || "").toLowerCase().includes("unique")
        ? "Este número já está cadastrado neste cupom."
        : error.message;
      return;
    }

    couponPhonesState.phone = "";
    couponPhonesState.note = "";
    await loadCouponAllowedPhones();
    renderCouponPhonesModal();
  });

  document.querySelectorAll(".remove-coupon-phone-btn").forEach((btn) => {
