<!-- CSS do Tailwind PRÉ-COMPILADO (../tailwind-built.css, na raiz do
     site), no lugar do script da CDN (cdn.tailwindcss.com) — ver o
     mesmo comentário no index.html do catálogo. Esse arquivo é
     COMPARTILHADO entre o catálogo e o painel (mesmas cores/config), por
     isso mora na raiz e não dentro de /admin. -->
<link rel="stylesheet" href="../tailwind-built.css" />
<!-- Aplica o modo escuro (se a pessoa tinha escolhido da última vez)
     ANTES do resto da página carregar/desenhar — sem isso, a tela
     apareceria clara por uma fração de segundo e "piscaria" pra escura
     assim que o script principal rodasse. -->
<script>
  try {
    if (localStorage.getItem("luz-mariana-admin-dark") === "1") {
      document.documentElement.classList.add("dark");
    }
  } catch (err) { /* localStorage indisponível (ex: modo privado) — segue no claro */ }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="jspdf.umd.min.js"></script>
<!-- SheetJS (biblioteca xlsx), arquivo local — mesma lógica do jsPDF

     nenhum serviço externo nem enviar dado nenhum pra fora. Usado no
     botão "Baixar como Excel" dos Relatórios. -->
<script src="xlsx.full.min.js"></script>
<!-- Gerador de QR Code (arquivo local, sem dependências) — usado só na
     tela de ativar a autenticação em duas etapas (2FA), pra desenhar o
     QR que o app autenticador (Google Authenticator, Authy etc.) lê. -->
<script src="qrcode.js"></script>

<style>
  body { font-family: Arial, Helvetica, sans-serif; }
  .pin-input { font-variant-numeric: tabular-nums; letter-spacing: 0.5em; }
  table { border-collapse: collapse; }
  /* Campos com pelo menos 16px evitam o zoom automático do iPhone ao tocar
     num input — dá pra digitar sem a tela "pular". O !important garante
     que vale mesmo em campos com classes de fonte menor (text-sm etc). */
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px !important; }

  /* Campos numéricos da Calculadora 3D: tira as setinhas de
     incrementar/decrementar do navegador — só digita o número direto,
     sem ficar clicando. */
  .calc3d-no-spinner::-webkit-outer-spin-button,
  .calc3d-no-spinner::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .calc3d-no-spinner { -moz-appearance: textfield; }

  /* =====================================================================
     MODO ESCURO — em vez de recompilar o tailwind-built.css com uma
     variante "dark:" em cada classe (o que exigiria regenerar o CSS pré-
     compilado toda vez que uma tela nova for escrita), sobrescrevemos
     aqui as MESMAS classes utilitárias do Tailwind já usadas no painel,
     só quando a tag <html> tem a classe "dark". Cobre exatamente as
     cores (navy/gold/cream/emerald/red/amber) que o painel já usa — não
     precisa mexer no HTML de tela nenhuma. Ativado pelo botão 🌙 no
     cabeçalho, e a escolha fica salva no localStorage do navegador.
     ===================================================================== */
  html.dark body { background-color: #0b1120; color: #e9edf9; }
  html.dark .bg-cream-50 { background-color: #0b1120 !important; }
  html.dark .bg-cream-100 { background-color: #141b2e !important; }
  html.dark .bg-white { background-color: #151d30 !important; }
  html.dark .bg-navy-50 { background-color: #17213a !important; }
  html.dark .bg-navy-100 { background-color: #1c2740 !important; }

  html.dark .text-navy-900 { color: #f1f4fc !important; }
  html.dark .text-navy-800 { color: #dde3f6 !important; }
  html.dark .text-navy-700 { color: #c7d0ef !important; }
  html.dark .text-navy-600 { color: #aab6e2 !important; }
  html.dark .text-navy-500 { color: #8f9dd2 !important; }
  html.dark .text-navy-400 { color: #7683b3 !important; }
  html.dark .text-navy-300 { color: #5d6997 !important; }

  html.dark .border-navy-50 { border-color: #1c2740 !important; }
  html.dark .border-navy-100 { border-color: #232f4d !important; }
  html.dark .border-navy-200 { border-color: #2c3a5e !important; }
  html.dark .border-navy-300 { border-color: #3a4a72 !important; }
  html.dark .ring-navy-100 { --tw-ring-color: #232f4d !important; }

  /* Header/nav (bg-navy-900/950, border-navy-700/800) já são escuros nas
     duas versões — não precisam mudar. */

  /* Faixas de aviso (estoque baixo, aniversário, erro de carregamento) e
     selos de status — fundo claro vira fundo escuro da mesma cor, com o
     texto claro em vez de escuro, mantendo o significado (âmbar=aviso,
     vermelho=alerta, esmeralda=sucesso, dourado=destaque). */
  html.dark .bg-amber-50 { background-color: #2e2405 !important; }
  html.dark .bg-amber-100 { background-color: #3a2e08 !important; }
  html.dark .border-amber-200 { border-color: #55440f !important; }
  html.dark .border-amber-300 { border-color: #6b5613 !important; }
  html.dark .text-amber-700 { color: #f0c766 !important; }
  html.dark .text-amber-800 { color: #f5d788 !important; }

  html.dark .bg-red-50 { background-color: #2e1010 !important; }
  html.dark .bg-red-100 { background-color: #3d1515 !important; }
  html.dark .border-red-200 { border-color: #5c2323 !important; }
  html.dark .ring-red-400 { --tw-ring-color: #7a3030 !important; }
  html.dark .text-red-500 { color: #ff8a8a !important; }
  html.dark .text-red-600 { color: #ff8a8a !important; }
  html.dark .text-red-700 { color: #ffa3a3 !important; }

  html.dark .bg-emerald-50 { background-color: #0c2620 !important; }
  html.dark .bg-emerald-100 { background-color: #103a2e !important; }
  html.dark .border-emerald-200 { border-color: #1c5741 !important; }
  html.dark .border-emerald-300 { border-color: #226b4f !important; }
  html.dark .ring-emerald-400 { --tw-ring-color: #2f8a63 !important; }
  html.dark .text-emerald-600 { color: #5fd6a8 !important; }
  html.dark .text-emerald-700 { color: #7fe0ba !important; }
  html.dark .text-emerald-800 { color: #9beac9 !important; }

  html.dark .bg-gold-50 { background-color: #2e2405 !important; }
  html.dark .bg-gold-100 { background-color: #3a2e08 !important; }
  html.dark .border-gold-300 { border-color: #6b5613 !important; }
  html.dark .border-gold-400 { border-color: #7a6216 !important; }
  html.dark .ring-gold-200 { --tw-ring-color: #4a3b0c !important; }
  html.dark .ring-gold-400 { --tw-ring-color: #7a6216 !important; }
  /* Cartões de resumo dos Pedidos ("Valores recebidos", "Despesas") usam
     azul/laranja do Tailwind puro (fora da paleta navy/gold/cream) — sem
     isso ficavam escuros demais em cima do fundo escuro do cartão. */
  html.dark .text-blue-700 { color: #8ab4ff !important; }
  html.dark .text-orange-600 { color: #ffab66 !important; }

  html.dark .text-gold-300 { color: #f2d98a !important; }
  html.dark .text-gold-600 { color: #f0c766 !important; }
  html.dark .text-gold-700 { color: #f0c766 !important; }
  html.dark .text-gold-800 { color: #f5d788 !important; }
  html.dark .text-gold-900 { color: #f9e6ac !important; }
  /* bg-gold-500 continua igual nos dois temas (botões principais) —
     dourado sobre texto navy-900 tem contraste bom em qualquer fundo. */

  /* Campos de formulário: sem isso, ficariam com fundo escuro (herdado
     de .bg-white sobrescrito acima) mas texto continuando escuro por
     padrão do navegador — ilegível. */
  html.dark input, html.dark select, html.dark textarea {
    background-color: #151d30;
    color: #f1f4fc;
    border-color: #2c3a5e;
  }
  html.dark input::placeholder, html.dark textarea::placeholder { color: #5d6997; }
  html.dark input:disabled, html.dark select:disabled { opacity: 0.6; }

  /* Linhas de item inativo (produto/material/fornecedor/cliente
     desativado) usam opacity-50 pra ficarem "apagadas" — em cima de
     fundo BRANCO isso ainda sobra contraste suficiente pra ler, mas em
     cima do fundo escuro do modo escuro o texto (que já virou bem claro)
     some quase por completo (duas "meias-luzes" somadas ficam ilegíveis).
     Só nas LINHAS de tabela (não mexe no disabled:opacity-50 dos botões
     de formulário, que continuam ok do jeito que estão). */
  html.dark tr.opacity-50 { opacity: 0.8 !important; }

  /* ESTADOS hover:/focus: — são classes DIFERENTES das classes normais
     (ex: "hover:bg-cream-50" não é a mesma coisa que "bg-cream-50" pro
     CSS, cada uma vira seu próprio seletor no Tailwind), então os
     overrides acima não cobriam elas. Era EXATAMENTE isso que causava o
     fundo branco aparecendo em cima da linha da tabela ao passar o mouse
     (ou parar o cursor) por cima dela no modo escuro — o hover continuava
     pintando um fundo clarinho de propósito (pensado pro modo claro),
     por cima de um texto já reescrito pra cor clara do modo escuro. */
  html.dark .hover\:bg-cream-50:hover { background-color: #1c2740 !important; }
  html.dark .hover\:bg-navy-50:hover { background-color: #1c2740 !important; }
  html.dark .hover\:bg-navy-100:hover { background-color: #232f4d !important; }
  html.dark .hover\:bg-red-50:hover { background-color: #3d1515 !important; }
  html.dark .hover\:bg-emerald-50:hover { background-color: #103a2e !important; }
  html.dark .hover\:bg-amber-100:hover { background-color: #3a2e08 !important; }
  html.dark .hover\:bg-gold-100:hover { background-color: #3a2e08 !important; }
  html.dark .hover\:bg-gold-50:hover { background-color: #2e2405 !important; }
  html.dark .hover\:text-navy-600:hover { color: #aab6e2 !important; }
  html.dark .hover\:text-navy-700:hover { color: #c7d0ef !important; }

  /* Orçamentos — linha de itens responsiva, integrada ao painel. */
  .orc-item-row {
    display: grid;
    grid-template-columns: minmax(260px, 1.9fr) 90px 180px 150px 44px;
    gap: 10px;
    align-items: end;
  }
  .orc-product-search { position: relative; }
  .orc-product-suggestions {
    position: absolute;
    z-index: 40;
    left: 0;
    right: 0;
    top: calc(100% + 4px);
    max-height: 290px;
    overflow-y: auto;
    border: 1px solid #d7dbe2;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 12px 28px rgba(12,44,120,.15);
  }
  .orc-product-suggestion {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    border: 0;
    border-bottom: 1px solid #eef0f4;
    background: #fff;
    color: #202534;
    text-align: left;
    cursor: pointer;
  }
  .orc-product-suggestion:last-child { border-bottom: 0; }
  .orc-product-suggestion:hover, .orc-product-suggestion:focus { background: #fbf8ef; outline: none; }
  .orc-product-meta { min-height: 18px; margin-top: 4px; font-size: 11px; color: #6f7683; }
  html.dark .orc-product-suggestions { background:#151d30; border-color:#2c3a5e; }
  html.dark .orc-product-suggestion { background:#151d30; color:#f1f4fc; border-color:#232f4d; }
  html.dark .orc-product-suggestion:hover, html.dark .orc-product-suggestion:focus { background:#1c2740; }
  @media (max-width: 760px) {
    .orc-item-row { grid-template-columns: 1fr 90px 1fr; }
    .orc-item-row .orc-total-wrap { grid-column: 1 / 3; }
    .orc-item-row .orc-remove { grid-column: 3; }
  }
  @media print {
    body * { visibility: hidden !important; }
    #orcamento-print-area, #orcamento-print-area * { visibility: visible !important; }
    #orcamento-print-area { position: absolute; left: 0; top: 0; width: 100%; }
    #orcamento-print-area .orc-no-print { display: none !important; }
  }

    list-style:none; cursor:pointer; min-height:40px; display:inline-flex; align-items:center; gap:7px;
    border:1px solid #cfd5e4; border-radius:10px; padding:8px 12px; background:#fff; color:#28375f;
    font-size:12px; font-weight:750;
  }
  .admin-actions-menu summary::-webkit-details-marker { display:none; }
  .admin-actions-popover {
    position:absolute; right:0; top:calc(100% + 7px); z-index:30; min-width:240px;
    padding:8px; border:1px solid #dfe3ed; border-radius:12px; background:#fff;
    box-shadow:0 15px 36px rgba(16,30,69,.16);
  }
  .admin-actions-popover button, .admin-actions-popover label {
    width:100%; min-height:40px; display:flex; align-items:center; gap:9px; border:0;
    border-radius:9px; padding:8px 10px; background:transparent; color:#28375f; font-size:12px; font-weight:650;
    text-align:left; cursor:pointer; box-shadow:none;

  /* Central de notificações */
  .admin-notification-overlay {
    position:fixed; inset:0; z-index:79; background:rgba(4,12,38,.38);
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .admin-notification-overlay.is-open { opacity:1; pointer-events:auto; }

  .admin-notification-panel {
    position:fixed; z-index:80; top:0; right:0; width:min(390px, calc(100vw - 28px)); height:100vh;
    display:flex; flex-direction:column; background:#fff;
    border-left:1px solid #e2e5ed; box-shadow:-18px 0 48px rgba(3,16,55,.20);
    transform:translateX(102%); transition:transform .22s ease;
  }
  .admin-notification-panel.is-open { transform:translateX(0); }
  .admin-notification-head {
    display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
    padding:20px 18px 16px; border-bottom:1px solid #edf0f5;
  }
  .admin-notification-head h2 { margin:0; color:#001868; font-size:18px; font-weight:800; }
  .admin-notification-head p { margin:3px 0 0; color:#7c869f; font-size:11px; }
  .admin-notification-close {
    width:38px; height:38px; flex:none; border:1px solid #e1e5ee; border-radius:10px;
    background:#fff; color:#56627f; font-size:18px; cursor:pointer;
  }
  .admin-notification-body { flex:1; overflow-y:auto; padding:12px; }
  .admin-notification-summary {
    margin-bottom:10px; padding:11px 12px; border-radius:11px; background:#f7f8fc;
    color:#59647e; font-size:11px; line-height:1.45;
  }
  .admin-notification-item {
    width:100%; display:flex; gap:11px; align-items:flex-start; margin-bottom:8px;
    padding:12px; border:1px solid #e8ebf2; border-radius:12px;
    background:#fff; color:#27345b; text-align:left; cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .admin-notification-item:hover { border-color:#d7ad36; background:#fffaf0; }
  .admin-notification-icon {
    width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center;
    border-radius:10px; background:#f1f3f9; font-size:16px;
  }
  .admin-notification-copy { min-width:0; flex:1; }
  .admin-notification-copy strong { display:block; color:#142653; font-size:12px; line-height:1.35; }
  .admin-notification-copy span { display:block; margin-top:3px; color:#7c869f; font-size:10px; line-height:1.45; }
  .admin-notification-count {
    min-width:24px; height:22px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:999px; padding:0 7px; background:#e9aa00; color:#001868;
    font-size:10px; font-weight:900;
  }
  .admin-notification-item.urgent .admin-notification-icon { background:#fff0f0; }
  .admin-notification-item.warning .admin-notification-icon { background:#fff7dc; }
  .admin-notification-item.good .admin-notification-icon { background:#edf9f3; }
  .admin-notification-empty {
    display:flex; min-height:260px; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; text-align:center; color:#7c869f;
  }
  .admin-notification-empty b { margin-top:10px; color:#20315d; font-size:14px; }
  .admin-notification-foot {
    padding:12px; border-top:1px solid #edf0f5; background:#fbfcff;
  }
  .admin-notification-foot button {
    width:100%; min-height:42px; border:1px solid #d9deea; border-radius:10px;
    background:#fff; color:#26355e; font-size:12px; font-weight:750; cursor:pointer;
  }

  html.dark .admin-notification-panel { background:#151d30; border-color:#2c3a5e; }
  html.dark .admin-notification-head,
  html.dark .admin-notification-foot { border-color:#2c3a5e; background:#151d30; }
  html.dark .admin-notification-head h2,
  html.dark .admin-notification-copy strong,
  html.dark .admin-notification-empty b { color:#f1f4fc; }
  html.dark .admin-notification-summary,
  html.dark .admin-notification-item,
  html.dark .admin-notification-close,
  html.dark .admin-notification-foot button { background:#1b263f; border-color:#2c3a5e; color:#dce4f8; }
  html.dark .admin-notification-item:hover { background:#2e2405; border-color:#6b5613; }
  html.dark .admin-notification-icon { background:#25324f; }

  @media (max-width:640px) {
    .admin-notification-panel { width:calc(100vw - 18px); }
  }


  /* =====================================================================
     V7 PROFISSIONAL — operação, produção, busca, fechamento e gestão
     ===================================================================== */
  .admin-search-trigger {
    min-width:260px; min-height:40px; display:flex; align-items:center; gap:9px;
    border:1px solid #2b438f; border-radius:11px; padding:8px 11px;
    background:#0a2476; color:#dfe6ff; cursor:pointer; text-align:left;
  }
  .admin-search-trigger:hover { background:#123084; }
  .admin-search-trigger .search-copy { flex:1; font-size:12px; color:#dfe6ff; }
  .admin-search-trigger kbd {
    border:1px solid #5368aa; border-bottom-width:2px; border-radius:6px; padding:2px 6px;
    background:#071c63; color:#bfc9ef; font-size:9px; font-family:inherit;
  }

  .command-overlay {
    position:fixed; inset:0; z-index:95; display:none; align-items:flex-start; justify-content:center;
    padding:9vh 16px 16px; background:rgba(2,10,36,.55); backdrop-filter:blur(3px);
  }
  .command-overlay.is-open { display:flex; }
  .command-box {
    width:min(720px,100%); overflow:hidden; border:1px solid #d9deea; border-radius:17px;
    background:#fff; box-shadow:0 28px 80px rgba(1,13,48,.28);
  }
  .command-input-wrap { display:flex; align-items:center; gap:10px; padding:13px 15px; border-bottom:1px solid #edf0f5; }
  .command-input {
    flex:1; min-width:0; border:0; outline:0; background:transparent; color:#152653;
    font-size:16px; font-weight:600;
  }
  .command-results { max-height:min(62vh,520px); overflow:auto; padding:8px; }
  .command-group-label {
    padding:8px 10px 5px; color:#8a93aa; font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  }
  .command-result {
    width:100%; display:flex; align-items:center; gap:11px; border:0; border-radius:11px;
    padding:10px 11px; background:transparent; color:#27345b; text-align:left; cursor:pointer;
  }
  .command-result:hover, .command-result:focus { background:#f6f8fc; outline:none; }
  .command-result-icon {
    width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center;
    border-radius:9px; background:#eef1f9; font-size:16px;
  }
  .command-result-copy { min-width:0; flex:1; }
  .command-result-copy strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#142653; font-size:12px; }
  .command-result-copy span { display:block; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#8790a6; font-size:10px; }
  .command-shortcut-hint { padding:11px 14px; border-top:1px solid #edf0f5; color:#8a93aa; font-size:10px; }

  .pro-page-header {
    display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px;
  }
  .pro-page-header h1 { color:#001868; font-size:23px; font-weight:800; letter-spacing:-.02em; }
  .pro-page-header p { margin-top:4px; max-width:760px; color:#737e99; font-size:12px; line-height:1.5; }
  .pro-pill {
    display:inline-flex; align-items:center; gap:5px; min-height:28px; border-radius:999px; padding:5px 9px;
    background:#eef1f8; color:#44547d; font-size:10px; font-weight:750;
  }
  .pro-pill.urgent { background:#fff0f0; color:#b02635; }
  .pro-pill.warning { background:#fff6d9; color:#8c6800; }
  .pro-pill.good { background:#edf9f2; color:#1d7254; }
  .pro-pill.navy { background:#e9edfa; color:#001868; }

  .pro-kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .pro-kpi {
    border:1px solid #e2e6ef; border-radius:14px; background:#fff; padding:14px 15px;
    box-shadow:0 4px 15px rgba(19,34,78,.045);
  }
  .pro-kpi .label { color:#7b859d; font-size:10px; font-weight:750; text-transform:uppercase; letter-spacing:.06em; }
  .pro-kpi .value { margin-top:7px; color:#001868; font-size:22px; font-weight:850; line-height:1.05; }
  .pro-kpi .hint { margin-top:6px; color:#939bb0; font-size:10px; line-height:1.35; }

  .pro-tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px; }
  .pro-tab {
    min-width:max-content; border:1px solid #dde2ec; border-radius:10px; padding:8px 11px;
    background:#fff; color:#4d5b7c; font-size:11px; font-weight:750; cursor:pointer;
  }
  .pro-tab.active { border-color:#001868; background:#001868; color:#fff; }

  .production-board { display:grid; grid-template-columns:repeat(5,minmax(240px,1fr)); gap:12px; align-items:start; overflow-x:auto; }
  .production-column {
    min-width:240px; border:1px solid #e3e6ee; border-radius:14px; background:#f8f9fc; padding:10px;
  }
  .production-column-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:3px 4px 9px; }
  .production-column-head strong { color:#233158; font-size:11px; }
  .production-column-count {
    min-width:22px; height:20px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:999px; background:#e4e9f5; color:#44547d; font-size:9px; font-weight:850;
  }
  .production-card {
    margin-bottom:8px; border:1px solid #e0e4ed; border-radius:12px; background:#fff; padding:11px;
    box-shadow:0 3px 10px rgba(22,36,76,.04);
  }
  .production-card.urgent { border-color:#efb9bf; box-shadow:0 3px 10px rgba(175,38,53,.06); }
  .production-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .production-card h3 { color:#142653; font-size:12px; font-weight:800; line-height:1.35; }
  .production-card .sub { margin-top:3px; color:#7e879f; font-size:10px; line-height:1.35; }
  .production-progress {
    margin-top:9px; height:7px; overflow:hidden; border-radius:999px; background:#edf0f6;
  }
  .production-progress > span { display:block; height:100%; border-radius:999px; background:#e9aa00; }
  .production-progress-label { display:flex; justify-content:space-between; gap:8px; margin-top:4px; color:#75809a; font-size:9px; }
  .production-actions { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .production-actions button {
    min-height:32px; border:1px solid #dce1eb; border-radius:8px; padding:6px 8px;
    background:#fff; color:#33446e; font-size:9px; font-weight:750; cursor:pointer;
  }
  .production-actions button.primary { border-color:#001868; background:#001868; color:#fff; }
  .production-actions button.gold { border-color:#e9aa00; background:#e9aa00; color:#001868; }
  .production-actions button.good { border-color:#b6dbc9; background:#eff9f4; color:#1c6e51; }
  .production-actions button:disabled { opacity:.45; cursor:not-allowed; }

  .production-list-card {
    display:grid; grid-template-columns:minmax(0,1.6fr) 100px 110px 120px 120px; gap:10px; align-items:center;
    border-bottom:1px solid #eef0f5; padding:11px 8px; font-size:10px;
  }
  .production-list-card:last-child { border-bottom:0; }
  .production-list-card strong { color:#182956; font-size:11px; }
  .production-list-card small { display:block; margin-top:2px; color:#8992a8; }
  .production-list-card .num { color:#001868; font-weight:800; }

  .checklist-row {
    display:flex; flex-wrap:wrap; gap:6px; margin-top:9px;
  }
  .checklist-chip {
    border:1px solid #dfe3eb; border-radius:999px; padding:5px 8px; background:#fff; color:#69748e;
    font-size:9px; font-weight:700; cursor:pointer;
  }
  .checklist-chip.done { border-color:#b8dfce; background:#edf9f3; color:#1b7454; }

  .month-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
  .management-card {
    border:1px solid #e3e6ef; border-radius:15px; background:#fff; padding:16px;
    box-shadow:0 4px 14px rgba(18,35,78,.045);
  }
  .management-card h2 { color:#001868; font-size:14px; font-weight:800; }
  .management-card .caption { margin-top:3px; color:#858ea5; font-size:10px; line-height:1.4; }
  .finance-lines { margin-top:12px; }
  .finance-line { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid #f0f2f6; font-size:11px; }
  .finance-line:last-child { border-bottom:0; }
  .finance-line span { color:#6d7891; }
  .finance-line strong { color:#001868; }
  .finance-line.total { margin-top:3px; padding-top:11px; border-top:2px solid #e2e6ef; border-bottom:0; }
  .finance-line.total span, .finance-line.total strong { color:#001868; font-size:13px; font-weight:850; }

  .rank-table { width:100%; border-collapse:collapse; }
  .rank-table th { padding:9px 8px; border-bottom:1px solid #e7eaf1; color:#7b859c; font-size:9px; text-align:left; text-transform:uppercase; letter-spacing:.05em; }
  .rank-table td { padding:10px 8px; border-bottom:1px solid #f0f2f6; color:#3d4b70; font-size:10px; }
  .rank-table td strong { color:#132554; font-size:11px; }
  .rank-table tr:last-child td { border-bottom:0; }

  .event-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .event-card {
    border:1px solid #e2e6ee; border-radius:14px; background:#fff; padding:14px; cursor:pointer;
    box-shadow:0 4px 14px rgba(18,35,78,.045);
  }
  .event-card:hover { border-color:#d4ad42; }
  .event-card h3 { color:#001868; font-size:13px; font-weight:800; }
  .event-card .event-money { margin-top:9px; color:#001868; font-size:20px; font-weight:850; }
  .event-card .event-meta { margin-top:5px; color:#8891a6; font-size:10px; }

  .activity-list { display:flex; flex-direction:column; gap:8px; }
  .activity-item {
    display:flex; gap:10px; align-items:flex-start; border:1px solid #e9ecf2; border-radius:11px; padding:10px 11px; background:#fff;
  }
  .activity-dot {
    width:30px; height:30px; flex:none; display:flex; align-items:center; justify-content:center;
    border-radius:9px; background:#f0f3f9; font-size:14px;
  }
  .activity-item strong { display:block; color:#1a2b58; font-size:11px; }
  .activity-item span { display:block; margin-top:2px; color:#8790a6; font-size:9px; line-height:1.4; }

  .settings-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .settings-field { display:flex; flex-direction:column; gap:5px; margin-top:10px; }
  .settings-field label { color:#55617f; font-size:10px; font-weight:750; }
  .settings-field input, .settings-field select {
    min-height:40px; border:1px solid #dbe0ea; border-radius:9px; padding:8px 10px; background:#fff; color:#1d2d59; font-size:12px;
  }

  .today-strip {
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; margin-top:14px;
  }
  .today-chip {
    border:1px solid rgba(255,255,255,.17); border-radius:12px; padding:10px 11px; background:rgba(255,255,255,.08);
    color:#fff; cursor:pointer; text-align:left;
  }
  .today-chip b { display:block; font-size:18px; line-height:1; }
  .today-chip span { display:block; margin-top:5px; color:#cbd5f4; font-size:9px; line-height:1.3; }

  .goal-bar { margin-top:8px; height:8px; overflow:hidden; border-radius:999px; background:#e9edf5; }
  .goal-bar > span { display:block; height:100%; background:#e9aa00; border-radius:999px; }

  .mobile-card-table { overflow-x:auto; }

  html.dark .command-box,
  html.dark .pro-kpi,
  html.dark .production-card,
  html.dark .production-list-card,
  html.dark .management-card,
  html.dark .event-card,
  html.dark .activity-item,
  html.dark .settings-field input,
  html.dark .settings-field select { background:#151d30; border-color:#2c3a5e; color:#e9eefb; }
  html.dark .command-input,
  html.dark .command-result-copy strong,
  html.dark .pro-page-header h1,
  html.dark .pro-kpi .value,
  html.dark .production-card h3,
  html.dark .management-card h2,
  html.dark .finance-line strong,
  html.dark .rank-table td strong,
  html.dark .event-card h3,
  html.dark .event-card .event-money,
  html.dark .activity-item strong { color:#f1f4fc; }
  html.dark .production-column { background:#101827; border-color:#2b3858; }
  html.dark .production-actions button,
  html.dark .checklist-chip { background:#1a243a; border-color:#34415f; color:#dfe7f8; }
  html.dark .rank-table td, html.dark .rank-table th, html.dark .finance-line { border-color:#27344f; }

  @media (max-width:1150px) {
    .admin-search-trigger { min-width:180px; }
    .pro-kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .month-grid { grid-template-columns:1fr; }
    .event-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }

/* =====================================================================
   REGRAS DE PRECIFICAÇÃO (mesma lógica validada contra os 13 produtos
   originais da Luz Mariana — ver scripts/verify_pricing.mjs no projeto)
   ===================================================================== */
const CARD_FEE = 0.05;
const CREDIT_DIVISOR = (1 - 0.45) * (1 - CARD_FEE); // 0.5225 — margem mín. 45% no crédito
const PROMO_DIVISOR = 1 - 0.40; // 0.60 — margem mín. 40% no pix/promo

function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function niceFloor(raw) {
  const base = Math.floor(raw);
  const candidates = [base - 1 + 0.9, base + 0.0, base + 0.5, base + 0.9];
  let best = null;
  for (const c of candidates) if (c <= raw + 1e-9 && (best === null || c > best)) best = c;
  return round2(best);
}

function niceCeil(raw) {
  const base = Math.floor(raw);
  const candidates = [base + 0.0, base + 0.5, base + 0.9, base + 1.0];
  let best = null;
  for (const c of candidates) if (c >= raw - 1e-9 && (best === null || c < best)) best = c;
  return round2(best);
}

function calculatePricing(cost) {
  const creditPrice = niceFloor(cost / CREDIT_DIVISOR);
  const creditNet = round2(creditPrice * (1 - CARD_FEE));
  const creditProfit = round2(creditNet - cost);
  const creditMarkup = cost > 0 ? round2(creditNet / cost) : 0;
  const creditMargin = creditNet > 0 ? round2(creditProfit / creditNet) : 0;

  const promoPrice = niceCeil(cost / PROMO_DIVISOR);
  const promoProfit = round2(promoPrice - cost);
  const promoMargin = promoPrice > 0 ? round2(promoProfit / promoPrice) : 0;

  return {
    cost, creditPrice, creditNet, creditProfit, creditMarkup, creditMargin,
    promoPrice, promoProfit, promoMargin,
  };
}

// Quando o Promo/Pix é digitado manualmente (ex: preço de consignação já
// combinado com o fornecedor), o Crédito continua sendo calculado a partir
// dele — usando a mesma proporção predefinida que normalmente liga os dois
// preços (a razão entre PROMO_DIVISOR e CREDIT_DIVISOR). Lucro e margem,
// porém, são sempre calculados em cima do custo REAL registrado, pra
// continuar refletindo a rentabilidade de verdade — não a "implícita" no
// valor manual.
function calculatePricingFromManualPromo(cost, manualPromo) {
  const promoPrice = round2(manualPromo);
  const promoProfit = round2(promoPrice - cost);
  const promoMargin = promoPrice > 0 ? round2(promoProfit / promoPrice) : 0;

  const creditPrice = niceFloor(promoPrice * (PROMO_DIVISOR / CREDIT_DIVISOR));
  const creditNet = round2(creditPrice * (1 - CARD_FEE));
  const creditProfit = round2(creditNet - cost);
  const creditMarkup = cost > 0 ? round2(creditNet / cost) : 0;
  const creditMargin = creditNet > 0 ? round2(creditProfit / creditNet) : 0;

  return {
    cost, creditPrice, creditNet, creditProfit, creditMarkup, creditMargin,
    promoPrice, promoProfit, promoMargin,
  };
}

// nele (ver cadastro de produto, "Esse modelo tem preço diferente") —
// sem isso, o modelo continua herdando custo/preço do produto inteiro,
// exatamente como sempre foi.
function effectiveCost(product, variant) {
  if (variant && variant.cost != null) return Number(variant.cost);
  return Number(product?.cost ?? 0);
}

  if (variant && variant.cost != null) {
    return variant.promo_manual_price != null
      ? calculatePricingFromManualPromo(Number(variant.cost), Number(variant.promo_manual_price))
      : calculatePricing(Number(variant.cost));
  }
  return {
    cost: Number(product?.cost ?? 0),
    creditPrice: Number(product?.credit_price ?? 0), promoPrice: Number(product?.promo_price ?? 0),
    creditNet: Number(product?.credit_net ?? 0), creditProfit: Number(product?.credit_profit ?? 0),
    creditMarkup: Number(product?.credit_markup ?? 0), creditMargin: Number(product?.credit_margin ?? 0),
    promoProfit: Number(product?.promo_profit ?? 0), promoMargin: Number(product?.promo_margin ?? 0),
  };
}
// Acha o objeto do modelo a partir do NOME salvo num item de pedido —
// order_items guarda variant_name (texto), não o id, então é assim que
// todo o código já resolve "qual modelo era esse item" (ver

function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
// Data de um Date em texto "AAAA-MM-DD" no fuso do Brasil (GMT-3, sem
// horário de verão) — SEMPRE nesse fuso, não importa o fuso configurado
// no computador/celular que estiver rodando o painel. Duas armadilhas
// aqui, já vistas na prática:
//   1) ".toISOString().slice(0, 10)" sozinho converte pra UTC primeiro:
//      perto da meia-noite (ex: 23h de Brasília = já é madrugada em UTC),
//      isso silenciosamente troca o dia pro seguinte.
//   2) Calcular a partir do fuso do APARELHO (Date.getTimezoneOffset())

//      fuso mal configurado (ex: em UTC, ou em outro fuso por engano), o

function toLocalISODate(d) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Fortaleza", year: "numeric", month: "2-digit", day: "2-digit",

function downloadCSV(filename, rows) {
  const csv = rows.map((row) => row.map(csvEscape).join(";")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function formatKB(bytes) {
  return `${Math.round(bytes / 1024)} KB`;
}

/* ---------------------------------------------------------------------
   Redimensiona/comprime uma foto no navegador antes de enviar — evita
   fotos de celular de vários MB deixando o catálogo pesado. Reduz pro
   maior lado caber em maxDim (mantendo proporção) e exporta como JPEG.

   Além disso, se mesmo depois do resize + qualidade padrão o arquivo
   ainda sair pesado (fotos muito detalhadas/texturizadas comprimem pior
   que fotos "lisas" na MESMA qualidade), reduz a qualidade em passos até
   caber num teto de tamanho ou bater no piso de qualidade — garante que
   nenhuma foto sai fora do padrão só por ser mais "difícil" de comprimir,
   sem precisar abrir mão de nitidez nas fotos normais (que já cabem no
   teto na primeira tentativa, sem perder qualidade nenhuma).
   --------------------------------------------------------------------- */
const IMAGE_TARGET_MAX_BYTES = 350 * 1024; // ~350 KB
const IMAGE_MIN_QUALITY = 0.5; // não desce daqui pra não aparecer artefato visível
function resizeImageToBlob(file, maxDim = 1000, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; // fundo branco (fotos com transparência viram JPEG)
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);

      const tryQuality = (q) => {
        canvas.toBlob((blob) => {
          if (!blob) { reject(new Error("Não foi possível processar a imagem.")); return; }
          if (blob.size <= IMAGE_TARGET_MAX_BYTES || q <= IMAGE_MIN_QUALITY) { resolve(blob); return; }
          tryQuality(Math.round((q - 0.1) * 100) / 100);
        }, "image/jpeg", q);
      };
      tryQuality(quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Não foi possível ler a imagem.")); };
    img.src = url;
  });
}

/* ---------------------------------------------------------------------
   Proteção genérica contra duplo-clique/duplo-envio: um clique num botão
   (ou "submit" de um formulário) repetido no MESMO elemento em menos de
   DOUBLE_SUBMIT_GUARD_MS da vez anterior é ignorado. Instalada UMA VEZ,
   na fase de CAPTURA (roda antes de qualquer handler específico da tela
   atual) — cobre todo botão e formulário do painel de uma vez só, sem
   precisar mexer individualmente em cada um dos handlers espalhados
   pelo arquivo (incluindo os que ainda vierem a ser escritos). Cada
   render() troca os elementos do DOM por novos, então esse "cooldown"
   nunca fica travado numa tela — o próximo botão já nasce liberado.
   --------------------------------------------------------------------- */
// 120ms é de propósito CURTO: cobre um clique duplo/duplo-toque
// mecânico de verdade (as duas dispatches chegam praticamente juntas —
// no mesmo tick, na prática), sem atrapalhar o fluxo normal de "corrigir
// e clicar Salvar de novo rapidinho depois de um erro de validação",
// que passa longe disso mesmo quando feito rápido (~200ms+ na prática).
// A proteção contra clique duplo COM ESPERA de rede em andamento
// continua sendo o "botão.disabled = true" já usado nos handlers mais
// sensíveis — isso aqui é só uma rede de segurança pro que sobrou.
const DOUBLE_SUBMIT_GUARD_MS = 120;
function installDoubleSubmitGuard() {
  const lastActionAt = new WeakMap();
  function guardEl(el, e) {
    if (!el) return;
    const now = Date.now();
    const last = lastActionAt.get(el) || 0;
    if (now - last < DOUBLE_SUBMIT_GUARD_MS) {
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    lastActionAt.set(el, now);
  }
  // "click": só conta clique NUM BOTÃO em si (closest("button") apenas —
  // NÃO inclui "form"). Se incluísse "form", clicar em QUALQUER outro
  // campo de dentro do formulário (ex: marcar um checkbox) já "gastaria"
  // o cooldown do formulário inteiro por engano, e o clique de verdade
  // no Salvar logo depois seria bloqueado sem nenhum duplo-clique ter
  // acontecido — bug real, pego no teste antes de entregar.
  document.addEventListener("click", (e) => guardEl(e.target.closest("button"), e), true);
  // "submit": o target do evento já É o próprio <form> (não borbulha de
  // um filho clicado) — por isso aqui pode usar e.target direto.
  document.addEventListener("submit", (e) => guardEl(e.target, e), true);
}
installDoubleSubmitGuard();

              class="pin-input w-full rounded-lg border border-navy-100 bg-white px-4 py-3 text-center text-2xl text-navy-900 shadow-sm outline-none transition focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
              placeholder="••••••" />
          </label>
          <label class="block">
            <span class="mb-1.5 block text-sm font-medium text-navy-800">Confirme a senha</span>
            <input id="confirm-pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6"
              class="pin-input w-full rounded-lg border border-navy-100 bg-white px-4 py-3 text-center text-2xl text-navy-900 shadow-sm outline-none transition focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
              placeholder="••••••" />
          </label>
          ${state.error ? `<p class="text-sm text-red-600">${escapeHtml(state.error)}</p>` : ""}
          <button type="submit" id="submit-btn" class="mt-2 rounded-lg bg-navy-900 px-4 py-3 font-medium text-white transition hover:bg-navy-800 disabled:opacity-50">
            Salvar nova senha e entrar
          </button>
        </form>
      </div>
    </main>
  `;

  ["new-pin", "confirm-pin"].forEach((id) => {
    const field = document.getElementById(id);
    field.addEventListener("input", () => { field.value = field.value.replace(/\D/g, "").slice(0, 6); });
  });

  document.getElementById("reset-password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pin = document.getElementById("new-pin").value;
    const confirm = document.getElementById("confirm-pin").value;
    if (!/^\d{6}$/.test(pin)) { state.error = "A senha deve ter 6 números."; return render(); }
    if (pin !== confirm) { state.error = "As senhas não conferem."; return render(); }

    const submitBtn = document.getElementById("submit-btn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Salvando...";

    // A sessão temporária de recuperação já foi estabelecida sozinha pelo
    // supabase-js a partir do link do e-mail (ver isPasswordRecoveryLink
    // lá em cima) — não precisa logar de novo, só trocar a senha mesmo.
    const { data: sessionCheck } = await supabaseClient.auth.getSession();
    if (!sessionCheck?.session) {
      state.error = "Esse link de redefinição expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\".";
      submitBtn.disabled = false;
      submitBtn.textContent = "Salvar nova senha e entrar";
      return render();
    }

    const { error } = await supabaseClient.auth.updateUser({
      password: pin,
      data: { must_change_password: false },
    });

    if (error) {
      state.error = "Não foi possível salvar a senha: " + error.message;
      submitBtn.disabled = false;
      submitBtn.textContent = "Salvar nova senha e entrar";
      return render();
    }

    await enterApp();
  });
}

async function enterApp() {
  const { data: authData } = await supabaseClient.auth.getUser();
  const uid = authData?.user?.id;

  const { data: profile } = await supabaseClient.from("admin_users").select("id, name").eq("id", uid).single();
  state.currentUser = profile ? { id: profile.id, name: profile.name } : { id: uid, name: state.selectedName };

  // Segundo fator (2FA/TOTP): se o admin já tiver ativado, o e-mail+senha
  // sozinho não é suficiente — pede o código do app autenticador (ou um
  // código de recuperação) antes de liberar o painel de verdade.
  const { data: twoFactorEnabled, error: twoFactorErr } = await supabaseClient.rpc("totp_status");
  if (!twoFactorErr && twoFactorEnabled) {
    state.screen = "twoFactor";
    state.error = null;
    render();
    return;
  }

  await finishAppEntry();
}

async function finishAppEntry() {
  state.screen = "app";
  state.error = null;
  await loadAllData();
  render();
}

// Recarrega todos os dados do app de uma vez (usado ao entrar, no botão
// "Atualizar" e na atualização automática em segundo plano).

// Antes, quando um carregamento em segundo plano falhava (sessão caiu,
// sem internet, etc.), o único sinal era um console.error que ninguém
// via — o painel ficava mostrando dado desatualizado/vazio sem
// nenhum aviso na tela. Cada função de load chama isto com um nome em
// português: soma numa lista (state.dataLoadWarnings) quando dá erro, e
// tira da lista quando volta a funcionar — vira um aviso visível no
// topo do painel (ver renderApp) enquanto durar o problema.
function noteLoadResult(label, error) {
  const idx = state.dataLoadWarnings.indexOf(label);
  if (error) {
    console.error(label + ":", error.message);
    if (idx === -1) state.dataLoadWarnings.push(label);
  } else if (idx !== -1) {
    state.dataLoadWarnings.splice(idx, 1);
  }
}

// Se algum formulário estiver aberto, pula a atualização automática pra
// não apagar o que a pessoa está digitando (o botão "Atualizar" manual
// continua funcionando normalmente, já que aí é a própria pessoa que pediu).
function isAnyFormOpen() {
  // A tela de orçamento funciona como um formulário contínuo. Enquanto ela
  // estiver aberta, a atualização automática de 60s não pode chamar render(),
  // porque isso reconstruiria os campos e apagaria o orçamento que está sendo digitado.
  if (state.tab === "orcamentos") return true;

  // Proteção genérica: se a pessoa estiver digitando/selecionando alguma
  // coisa, não reconstruímos a tela por atualização automática. Isso cobre
  // também formulários novos que venham a ser adicionados ao ERP.
  const active = document.activeElement;
  if (active && (active.matches?.("input, textarea, select, [contenteditable='true']") || active.isContentEditable)) return true;

  return !!(
    precifState.formOpen || materiaisState.formOpen || fornecedoresState.formOpen ||
    clientesState.formOpen || cuponsState.formOpen || caixaState.formOpen ||
    estoqueState.stockDebtOpen || couponPhonesState.open || brindeState.open ||
    stockPurchaseState.open || stockEntryEditState.open || pedidoState.open ||
    editOrderState.open || calc3dState.open || simulateState.open ||
    eventoVendaState.open || vendaManualState.open || securityState.open ||
    priceHistoryState.open
  );
}

/* =====================================================================
   V7 — METADADOS OPERACIONAIS SINCRONIZADOS NO PRÓPRIO PEDIDO
   Sem migration: usa um bloco técnico ao final de orders.notes.
   O bloco é sempre removido antes de mostrar/imprimir/enviar observações.
   ===================================================================== */
const LM_ADMIN_META_RE = /\n?\n?\[\[LM_ADMIN_META:([A-Za-z0-9+/=]+)\]\]\s*$/;

function encodeUtf8Base64(value) {
  try {
    const bytes = new TextEncoder().encode(JSON.stringify(value));
    let binary = "";
    bytes.forEach((b) => binary += String.fromCharCode(b));
    return btoa(binary);
  } catch (_err) { return ""; }
}
function decodeUtf8Base64(value) {
  try {
    const binary = atob(value);
    const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch (_err) { return {}; }
}
function splitOrderNotes(raw) {
  const value = String(raw || "");
  const match = value.match(LM_ADMIN_META_RE);
  if (!match) return { customer: value.trim(), meta: {} };
  return {
    customer: value.replace(LM_ADMIN_META_RE, "").trim(),
    meta: decodeUtf8Base64(match[1]) || {},
  };
}
function orderCustomerNotes(order) {
  return splitOrderNotes(order?.notes).customer;
}
function orderAdminMeta(order) {
  return splitOrderNotes(order?.notes).meta || {};
}
function composeOrderNotes(customerText, meta) {
  const customer = String(customerText || "").trim();
  const cleanMeta = meta && typeof meta === "object" ? meta : {};
  const hasMeta = Object.keys(cleanMeta).length > 0;
  if (!hasMeta) return customer || null;
  const encoded = encodeUtf8Base64(cleanMeta);
  return `${customer}${customer ? "\n\n" : ""}[[LM_ADMIN_META:${encoded}]]`;
}
function productionItemKey(item) {
  return `${item?.product_id || item?.product_name || "item"}::${item?.variant_name || ""}`;
}
function defaultOrderOpsMeta() {
  return { v: 1, production: {}, checklist: {}, priority: null };
}
function normalizedOrderOpsMeta(order) {
  return { ...defaultOrderOpsMeta(), ...orderAdminMeta(order), production: { ...(orderAdminMeta(order).production || {}) }, checklist: { ...(orderAdminMeta(order).checklist || {}) } };
}
async function saveOrderOpsMeta(orderId, updater) {
  const order = state.orders.find((o) => o.id === orderId);
  if (!order) return { error: new Error("Pedido não encontrado") };
  const current = normalizedOrderOpsMeta(order);
  const next = typeof updater === "function" ? (updater(structuredClone(current)) || current) : updater;
  next.v = 1;
  next.updatedAt = new Date().toISOString();
  next.updatedBy = state.currentUser?.id || null;

  const notes = composeOrderNotes(orderCustomerNotes(order), next);
  const { error } = await supabaseClient.from("orders").update({
    notes,
    updated_at: new Date().toISOString(),
    updated_by: state.currentUser?.id || null,
  }).eq("id", orderId);

  if (!error) order.notes = notes;
  return { error };
}

const LM_PRO_CONFIG_KEY = "luz-mariana-professional-config-v1";
const LM_MONTH_CLOSE_KEY = "luz-mariana-month-close-v1";
const LM_BACKUP_DATE_KEY = "luz-mariana-last-backup-v1";

function daysUntil(dateValue) {
  if (!dateValue) return null;
  const end = new Date(dateValue);
  if (Number.isNaN(end.getTime())) return null;
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(end.getFullYear(), end.getMonth(), end.getDate());
  return Math.ceil((b - a) / 86400000);
}
function orderDeadlineInfo(order) {
  const resolved = orderDeliveryDeadline(order);
  if (!resolved || resolved.ready) return { date: null, days: null, label: resolved?.ready ? "Pronta entrega" : "Sem prazo" };
  const date = resolved.date;
  const days = daysUntil(date);
  return { date, days, label: formatDate(toLocalISODate(date)) };
}
function orderOperationalPriority(order) {
  const meta = normalizedOrderOpsMeta(order);
  if (meta.priority === "urgent") return { key:"urgent", label:"Urgente", rank:0 };
  if (meta.priority === "high") return { key:"high", label:"Alta", rank:1 };
  const d = orderDeadlineInfo(order).days;
  if (d != null && d < 0) return { key:"urgent", label:"Atrasado", rank:0 };
  if (d != null && d <= 1) return { key:"urgent", label:"Urgente", rank:0 };
  if (d != null && d <= 3) return { key:"high", label:"Atenção", rank:1 };
  return { key:"normal", label:"Normal", rank:2 };
}
function productionProfileFor(productId) {
  return professionalState.config.productionProfiles?.[productId] || {};
}
function productionSourceForItem(item) {
  if (item.fulfilled_from_stock) return "stock";
  const product = state.products.find((p) => p.id === item.product_id);
  if (product?.supplier_id) return "supplier";
  return "own";
}
function productionTaskFor(order, item) {
  const key = productionItemKey(item);
  const meta = normalizedOrderOpsMeta(order);
  const saved = meta.production?.[key] || {};
  const qty = Math.max(0, Number(item.quantity || 0));
  const done = Math.min(qty, Math.max(0, Number(saved.done || 0)));
  let stage = saved.stage || "todo";
  if (done >= qty && qty > 0 && ["todo","printing","finishing"].includes(stage)) stage = "ready";
  if (order.status === "concluido") { stage = "separated"; }
  const product = state.products.find((p) => p.id === item.product_id);
  const profile = productionProfileFor(item.product_id);
  const remaining = Math.max(0, qty - done);
  const priority = orderOperationalPriority(order);
  const deadline = orderDeadlineInfo(order);
  return {
    order, item, key, product, source: productionSourceForItem(item),
    qty, done, remaining, stage, priority, deadline,
    minutesPerUnit: Math.max(0, Number(profile.minutesPerUnit || 0)),
    gramsPerUnit: Math.max(0, Number(profile.gramsPerUnit || 0)),
    color: profile.color || "",
    lot: saved.lot || "",
    machine: saved.machine || "",
    estimatedMinutes: Math.max(0, Number(profile.minutesPerUnit || 0)) * remaining,
    estimatedGrams: Math.max(0, Number(profile.gramsPerUnit || 0)) * remaining,
  };
}
function allProductionTasks({ includeCompleted = false } = {}) {
  const validOrders = state.orders.filter((o) =>
    o.status !== "cancelado" &&
    (includeCompleted || o.status !== "concluido")
  );
  const rows = [];
  validOrders.forEach((o) => (o.items || []).forEach((it) => rows.push(productionTaskFor(o, it))));
  return rows;
}
function ownProductionTasks() {
  return allProductionTasks().filter((t) => t.source === "own" && (t.order.accepted_at || t.order.status === "em_andamento"));
}
function productionMetrics() {
  const own = ownProductionTasks();
  const remainingUnits = own.reduce((s,t) => s + t.remaining, 0);
  const printing = own.filter((t) => t.stage === "printing").length;
  const finishing = own.filter((t) => t.stage === "finishing").length;
  const ready = own.filter((t) => ["ready","separated"].includes(t.stage)).length;
  const minutes = own.reduce((s,t) => s + t.estimatedMinutes, 0);
  const grams = own.reduce((s,t) => s + t.estimatedGrams, 0);
  const urgent = own.filter((t) => t.priority.rank <= 1 && t.remaining > 0).length;
  return { own, remainingUnits, printing, finishing, ready, minutes, grams, urgent };
}
function formatDurationMinutes(mins) {
  const m = Math.max(0, Math.round(Number(mins || 0)));
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return `${r} min`;
  return `${h}h${r ? String(r).padStart(2,"0") : ""}`;
}
function reservedStockFor(productId, variantName = "") {
  return state.orders
    .filter((o) => !["cancelado","concluido"].includes(o.status))
    .flatMap((o) => o.items || [])
    .filter((it) => it.product_id === productId && (it.variant_name || "") === (variantName || "") && it.fulfilled_from_stock)
    .reduce((s,it) => s + Number(it.quantity || 0), 0);
}
function productPhysicalStock(product, variantName = "") {
  const variant = variantName ? (product?.product_variants || []).find((v) => v.name === variantName) : null;
  return Number(variant?.stock_qty ?? product?.stock_qty ?? 0);
}
function stockAvailability(product, variantName = "") {
  const physical = productPhysicalStock(product, variantName);
  const reserved = reservedStockFor(product?.id, variantName);
  return { physical, reserved, available: Math.max(0, physical - reserved) };
}

function productionMaterialNeeds() {
  const map = new Map();
  ownProductionTasks().forEach((t) => {
    if (t.remaining <= 0 || !t.product) return;
    (t.product.product_materials || []).forEach((pm) => {
      const material = pm.materials || state.materials.find((m) => m.id === pm.material_id);
      if (!material) return;
      const required = Number(pm.quantity || 0) * t.remaining;
      const row = map.get(material.id) || {
        material,
        required:0,
        orders:new Set(),
        products:new Set(),
      };
      row.required += required;
      row.orders.add(t.order.order_number);
      row.products.add(t.product.name);
      map.set(material.id,row);
    });
  });
  return [...map.values()].map((r) => ({
    ...r,
    required:round2(r.required),
    stock:Number(r.material.stock_qty || 0),
    shortage:round2(Math.max(0, r.required - Number(r.material.stock_qty || 0))),
  })).sort((a,b) => b.shortage - a.shortage || b.required - a.required);
}

function defaultCostCenterForCategory(category) {
  const c = String(category || "").toLowerCase();
  if (c.includes("estoque") || c.includes("fornecedor")) return "Compras e estoque";
  if (c.includes("material") || c.includes("custo do pedido") || c.includes("custo do evento") || c.includes("custo do brinde")) return "Produção";
  if (c.includes("retirada")) return "Sócios";
  if (c.includes("marketing") || c.includes("anúncio") || c.includes("instagram")) return "Marketing";
  if (c.includes("frete") || c.includes("entrega") || c.includes("motoboy")) return "Logística";
  return "Administrativo / Outros";
}
function costCenterForEntry(entry) {
  const map = professionalState.config.costCenterMap || {};

function costCenterSummary(month) {
  const groups = {};
  state.cashEntries.filter((e) =>
    e.entry_type === "saida" &&
    !!e.paid_at &&
    String(e.entry_date).slice(0,7) === month
  ).forEach((e) => {

  });
  return Object.entries(groups).map(([center,total]) => ({ center, total:round2(total) })).sort((a,b)=>b.total-a.total);

function monthManagementData(month) {
  const paidOrders = state.orders.filter((o) =>
    o.status !== "cancelado" &&
    o.payment_method !== "brinde" &&
    !!o.paid_at &&
    String(o.paid_at).slice(0,7) === month
  );
  let gross = 0, costs = 0, fees = 0, profitBeforeOps = 0, approx = false;
  paidOrders.forEach((o) => {
    const c = orderCost(o);
    const split = orderMoneySplit(o, c);
    gross += Number(o.total || 0);
    costs += split.costToKeep;
    fees += split.cardFee;
    profitBeforeOps += split.profit;
    if (c.isApprox) approx = true;
  });
  const excludedExpenseCategories = new Set(["Custo do pedido","Custo do evento","Custo do brinde","Material essencial","Compra de estoque","Retirada do proprietário"]);
  const operatingExpenses = state.cashEntries.filter((e) =>
    e.entry_type === "saida" &&
    !!e.paid_at &&
    String(e.entry_date).slice(0,7) === month &&
    !excludedExpenseCategories.has(e.category)
  ).reduce((s,e) => s + Number(e.amount || 0), 0);

  const ownerWithdrawn = state.cashEntries.filter((e) =>
    e.entry_type === "saida" &&
    e.category === "Retirada do proprietário" &&
    !!e.paid_at &&
    String(e.entry_date).slice(0,7) === month
  ).reduce((s,e) => s + Number(e.amount || 0), 0);

  const settings = caixaState.reserveSettings || loadProfitSplitSettings();
  const distributable = Math.max(0, profitBeforeOps - operatingExpenses);
  const ownerTarget = round2(distributable * Number(settings.ownerPercent || 0) / 100);
  const reinvestment = round2(distributable - ownerTarget);

  const receivable = state.orders.filter((o) =>
    o.status !== "cancelado" && o.payment_method !== "brinde" && !o.paid_at
  ).reduce((s,o) => s + Number(o.total || 0), 0);

  const supplierPayable = state.orders.filter((o) => o.status !== "cancelado")
    .reduce((sum,o) => sum + orderSupplierUnpaidItems(o).reduce((ss,it) => {
      const product = state.products.find((p) => p.id === it.product_id);
      if (!product) return ss;
      const variant = variantByName(product, it.variant_name);
      return ss + effectiveCost(product, variant) * Number(it.quantity || 0);
    },0), 0);

  const stockPayable = state.cashEntries.filter((e) =>
    e.category === "Compra de estoque" && !e.paid_at
  ).reduce((s,e) => s + Number(e.amount || 0), 0);

  return {
    month, paidOrders, gross:round2(gross), costs:round2(costs), fees:round2(fees),
    profitBeforeOps:round2(profitBeforeOps), operatingExpenses:round2(operatingExpenses),
    result:round2(profitBeforeOps - operatingExpenses), ownerTarget, reinvestment,
    ownerWithdrawn:round2(ownerWithdrawn), receivable:round2(receivable),
    supplierPayable:round2(supplierPayable + stockPayable), approx,
  };
}

function productProfitabilityRows() {
  const map = new Map();
  state.orders.filter((o) => o.status !== "cancelado" && o.payment_method !== "brinde" && !!o.paid_at).forEach((o) => {
    const itemSubtotal = (o.items || []).reduce((s,it) => s + Number(it.unit_price || 0) * Number(it.quantity || 0), 0);
    const factor = itemSubtotal > 0 ? Number(o.total || 0) / itemSubtotal : 1;
    const cardFactor = o.payment_method === "credito" ? (1 - CARD_FEE) : 1;
    (o.items || []).forEach((it) => {
      const key = `${it.product_id || it.product_name}::${it.variant_name || ""}`;
      const product = state.products.find((p) => p.id === it.product_id);
      const variant = variantByName(product, it.variant_name);
      const qty = Number(it.quantity || 0);
      const revenue = Number(it.unit_price || 0) * qty * factor * cardFactor;
      const cost = product ? effectiveCost(product, variant) * qty : 0;
      const row = map.get(key) || {
        key, productId:it.product_id, name:it.product_name, variant:it.variant_name || "",
        qty:0, revenue:0, cost:0, orders:new Set(),
      };
      row.qty += qty;
      row.revenue += revenue;
      row.cost += cost;
      row.orders.add(o.id);
      map.set(key,row);
    });
  });
  return [...map.values()].map((r) => ({
    ...r,
    ordersCount:r.orders.size,
    revenue:round2(r.revenue),
    cost:round2(r.cost),
    profit:round2(r.revenue - r.cost),
    margin:r.revenue > 0 ? (r.revenue - r.cost) / r.revenue : 0,
  }));
}

function todayManagementTasks() {
  const tasks = [];
  const own = ownProductionTasks();
  const overdue = own.filter((t) => t.deadline.days != null && t.deadline.days < 0 && t.remaining > 0);
  const dueSoon = own.filter((t) => t.deadline.days != null && t.deadline.days >= 0 && t.deadline.days <= 1 && t.remaining > 0);
  const unpaid = state.orders.filter((o) => o.status !== "cancelado" && o.payment_method !== "brinde" && !o.paid_at);
  const supplierPending = state.orders.filter((o) => o.status !== "cancelado").reduce((n,o) => n + orderSupplierPendingItems(o).length, 0);
  if (overdue.length) tasks.push({ tab:"producao", count:overdue.length, label:"produção atrasada", tone:"urgent" });
  if (dueSoon.length) tasks.push({ tab:"producao", count:dueSoon.length, label:"vence até amanhã", tone:"warning" });
  if (unpaid.length) tasks.push({ tab:"pedidos", count:unpaid.length, label:"pedido(s) a receber", tone:"warning" });
  if (supplierPending) tasks.push({ tab:"fornecedores", count:supplierPending, label:"item(ns) aguardando fornecedor", tone:"warning" });
  return tasks;
}

function allOrderIssues() {
  const rows = [];

    (meta.issues || []).forEach((issue) => rows.push({ ...issue, order:o }));

  return rows.sort((a,b) => Number(a.resolved)-Number(b.resolved) || new Date(b.createdAt||0)-new Date(a.createdAt||0));
}
async function addOrderIssue(orderId, type, description) {
  return saveOrderOpsMeta(orderId, (meta) => {
    meta.issues ||= [];
    meta.issues.push({
      id:`ISS-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
      type,
      description,
      resolved:false,
      createdAt:new Date().toISOString(),
      createdBy:state.currentUser?.name || "",

    return meta;
  });
}
async function setOrderIssueResolved(orderId, issueId, resolved) {
  return saveOrderOpsMeta(orderId, (meta) => {

    return meta;
  });

function postSaleRows() {
  const now = new Date();
  return state.orders
    .filter((o) => o.status === "concluido" && o.payment_method !== "brinde")
    .map((o) => {
      const baseDate = o.updated_at || o.paid_at || o.created_at;
      const days = Math.max(0, Math.floor((now - new Date(baseDate)) / 86400000));
      const meta = normalizedOrderOpsMeta(o);
      const itemProductIds = new Set((o.items || []).map((it) => it.product_id).filter(Boolean));
      const hasReview = state.reviews.some((r) =>
        itemProductIds.has(r.product_id) &&
        String(r.customer_name || "").trim().toLowerCase() === String(o.customer_name || "").trim().toLowerCase()
      );
      return { order:o, days, done:!!meta.checklist?.postSale, hasReview };
    })
    .filter((r) => r.days >= 2 && r.days <= 60)
    .sort((a,b) => Number(a.done)-Number(b.done) || b.days-a.days);
}

async function updateProductionTask(orderId, itemKey, patch) {
  const { error } = await saveOrderOpsMeta(orderId, (meta) => {
    meta.production ||= {};
    const current = meta.production[itemKey] || {};
    meta.production[itemKey] = { ...current, ...patch, updatedAt:new Date().toISOString(), updatedBy:state.currentUser?.id || null };
    return meta;
  });
  if (error) alert("Não foi possível atualizar a produção: " + error.message);
  return !error;
}
async function updateOrderChecklist(orderId, key, value) {
  const { error } = await saveOrderOpsMeta(orderId, (meta) => {
    meta.checklist ||= {};
    meta.checklist[key] = !!value;
    return meta;
  });
  if (error) alert("Não foi possível atualizar o checklist: " + error.message);
  return !error;
}
function productionStageLabel(stage) {
  return ({ todo:"A fazer", printing:"Em produção", finishing:"Acabamento", ready:"Pronto", separated:"Separado" })[stage] || "A fazer";
}
function productionStageTone(stage) {
  return ({ todo:"navy", printing:"warning", finishing:"warning", ready:"good", separated:"good" })[stage] || "navy";
}

    </div>
  `;

  container.querySelectorAll("[data-production-view]").forEach((btn) => btn.addEventListener("click", () => {
    professionalState.productionView = btn.dataset.productionView;
    renderProducao(container);
  }));
  container.querySelectorAll("[data-production-filter]").forEach((btn) => btn.addEventListener("click", () => {
    professionalState.productionFilter = btn.dataset.productionFilter;
    renderProducao(container);
  }));
  container.querySelectorAll("[data-create-production-lot]").forEach((btn) => btn.addEventListener("click", async () => {
    const groupKey = btn.dataset.createProductionLot;
    const tasks = productionMetrics().own.filter((t) => `${t.item.product_name}::${t.item.variant_name || ""}` === groupKey && t.remaining > 0);
    if (!tasks.length) return;
    const lot = `LM-${todayISO().replace(/-/g,"")}-${String(Date.now()).slice(-4)}`;
    let machine = "";
    const machines = professionalState.config.machines || [];
    if (machines.length === 1) machine = machines[0].name || "";
    else if (machines.length > 1) {
      const suggested = machines.map((m,i) => `${i+1}. ${m.name}`).join("\n");
      const answer = prompt(`Qual máquina vai produzir este lote?\n\n${suggested}\n\nDigite o número ou deixe em branco:`);
      const n = Number(answer);
      if (Number.isInteger(n) && n >= 1 && n <= machines.length) machine = machines[n-1].name || "";
    }
    if (!confirm(`Criar o lote ${lot} com ${tasks.reduce((s,t)=>s+t.remaining,0)} unidade(s) e marcar esses itens como "Em produção"?`)) return;
    btn.disabled = true;
    for (const t of tasks) {
      await updateProductionTask(t.order.id, t.key, { stage:"printing", lot, machine });
    }
    renderProducao(container);
  }));

  container.querySelectorAll("[data-prod-priority]").forEach((btn) => btn.addEventListener("click", async () => {
    btn.disabled = true;
    const orderId = btn.dataset.prodPriority;
    const current = btn.dataset.currentPriority || "";
    const { error } = await saveOrderOpsMeta(orderId, (meta) => {
      meta.priority = current === "urgent" ? null : "urgent";
      return meta;
    });
    if (error) alert("Não foi possível alterar a prioridade: " + error.message);
    renderProducao(container);
  }));
  container.querySelectorAll("[data-prod-stage]").forEach((btn) => btn.addEventListener("click", async () => {
    btn.disabled = true;
    const ok = await updateProductionTask(btn.dataset.orderId, btn.dataset.itemKey, { stage:btn.dataset.prodStage });
    if (ok) renderProducao(container);
  }));
  container.querySelectorAll("[data-prod-done]").forEach((btn) => btn.addEventListener("click", async () => {
    const order = state.orders.find((o) => o.id === btn.dataset.orderId);
    const item = (order?.items || []).find((it) => productionItemKey(it) === btn.dataset.itemKey);
    const t = item ? productionTaskFor(order,item) : null;
    if (!t) return;
    btn.disabled = true;
    const nextDone = Math.min(t.qty, t.done + 1);
    const ok = await updateProductionTask(order.id, t.key, { done:nextDone, stage:nextDone >= t.qty ? "ready" : "finishing" });
    if (ok) renderProducao(container);
  }));
  container.querySelectorAll("[data-prod-complete]").forEach((btn) => btn.addEventListener("click", async () => {
    const order = state.orders.find((o) => o.id === btn.dataset.orderId);
    const item = (order?.items || []).find((it) => productionItemKey(it) === btn.dataset.itemKey);
    if (!item) return;
    btn.disabled = true;
    const ok = await updateProductionTask(order.id, btn.dataset.itemKey, { done:Number(item.quantity || 0), stage:"ready" });
    if (ok) renderProducao(container);
  }));
  container.querySelectorAll("[data-checklist-key]").forEach((btn) => btn.addEventListener("click", async () => {
    btn.disabled = true;
    const ok = await updateOrderChecklist(btn.dataset.orderId, btn.dataset.checklistKey, btn.dataset.checklistValue === "1");
    if (ok) renderProducao(container);
  }));
}

/* =====================================================================
   V7 — CONTAS A PAGAR E A RECEBER
   ===================================================================== */
function renderContas(container) {
  const receivables = state.orders
    .filter((o) => o.status !== "cancelado" && o.payment_method !== "brinde" && !o.paid_at)
    .map((o) => ({
      order:o,
      amount:Number(o.total || 0),
      age:Math.max(0, daysBetweenISO(String(o.created_at).slice(0,10), todayISO())),
    }))
    .sort((a,b) => b.age-a.age || b.amount-a.amount);

  const payables = [];
  state.orders.filter((o) => o.status !== "cancelado").forEach((o) => {
    orderSupplierUnpaidItems(o).forEach((it) => {
      const product = state.products.find((p) => p.id === it.product_id);
      if (!product) return;
      const variant = variantByName(product,it.variant_name);
      payables.push({
        type:"supplier",
        order:o,
        item:it,
        supplier:product.suppliers?.name || "Fornecedor",
        amount:round2(effectiveCost(product,variant) * Number(it.quantity || 0)),
        date:String(o.created_at).slice(0,10),
      });
    });
  });
  state.cashEntries.filter((e) => e.category === "Compra de estoque" && !e.paid_at).forEach((e) => {
    payables.push({
      type:"stock",
      entry:e,
      supplier:e.description || "Compra de estoque",
      amount:Number(e.amount || 0),
      date:e.entry_date,
    });
  });
  payables.sort((a,b) => String(a.date||"").localeCompare(String(b.date||"")));

  const totalReceive = round2(receivables.reduce((s,r)=>s+r.amount,0));
  const totalPay = round2(payables.reduce((s,r)=>s+r.amount,0));
  const currentBalance = Number(state.cashEntries[0]?.running_balance ?? 0);
  const projected = round2(currentBalance + totalReceive - totalPay);
  const overdueReceive = receivables.filter((r) => r.age >= 7);

  container.innerHTML = `
    <div>
      <div class="pro-page-header">
        <div>
          <span class="admin-kicker">Financeiro</span>
          <h1>Contas a pagar e a receber</h1>
          <p>O que ainda deve entrar e o que ainda precisa sair. Isso evita confundir saldo em conta com dinheiro realmente livre.</p>
        </div>
      </div>

      <div class="pro-kpi-grid">
        <div class="pro-kpi"><div class="label">A receber</div><div class="value">${formatBRL(totalReceive)}</div><div class="hint">${receivables.length} pedido(s) sem pagamento.</div></div>
        <div class="pro-kpi"><div class="label">A pagar</div><div class="value">${formatBRL(totalPay)}</div><div class="hint">${payables.length} compromisso(s) conhecido(s).</div></div>
        <div class="pro-kpi"><div class="label">Saldo atual</div><div class="value">${formatBRL(currentBalance)}</div><div class="hint">Saldo acumulado do Caixa.</div></div>
        <div class="pro-kpi"><div class="label">Saldo projetado</div><div class="value">${formatBRL(projected)}</div><div class="hint">Saldo + recebíveis − compromissos.</div></div>
      </div>

      <div class="month-grid">
        <section class="management-card mobile-card-table">
          <div class="admin-section-heading">
            <div><h2>Contas a receber</h2><p>${overdueReceive.length ? `${overdueReceive.length} pedido(s) aguardando há 7 dias ou mais.` : "Nenhum recebível antigo."}</p></div>
          </div>
          <table class="rank-table">
            <thead><tr><th>Pedido</th><th>Cliente</th><th>Valor</th><th>Há</th><th>Ação</th></tr></thead>
            <tbody>
              ${receivables.length ? receivables.map((r)=>`<tr>
                <td><strong>${String(r.order.order_number ?? "").padStart(6,"0")}</strong></td>
                <td>${escapeHtml(r.order.customer_name)}</td>
                <td><strong>${formatBRL(r.amount)}</strong></td>
                <td>${r.age} dia(s)</td>
                <td><button class="admin-order-open" data-conta-order="${r.order.id}">Abrir pedido</button>${waLink(r.order.customer_whatsapp) ? ` · <a class="text-emerald-700" target="_blank" rel="noopener" href="${waLink(r.order.customer_whatsapp)}">WhatsApp</a>` : ""}</td>
              </tr>`).join("") : `<tr><td colspan="5">Nenhuma conta a receber.</td></tr>`}
            </tbody>
          </table>
        </section>

        <section class="management-card mobile-card-table">
          <div class="admin-section-heading">
            <div><h2>Contas a pagar</h2><p>Fornecedor de pedido + compras de estoque ainda não marcadas como pagas.</p></div>
          </div>
          <table class="rank-table">
            <thead><tr><th>Origem</th><th>Fornecedor / descrição</th><th>Valor</th><th>Data</th></tr></thead>
            <tbody>
              ${payables.length ? payables.map((r)=>`<tr>
                <td>${r.type === "supplier" ? `Pedido ${String(r.order.order_number ?? "").padStart(6,"0")}` : "Estoque"}</td>
                <td><strong>${escapeHtml(r.supplier)}</strong>${r.type === "supplier" ? `<br><span class="text-[9px] text-navy-400">${escapeHtml(r.item.product_name)}${r.item.variant_name ? ` · ${escapeHtml(r.item.variant_name)}` : ""}</span>` : ""}</td>
                <td><strong>${formatBRL(r.amount)}</strong></td>
                <td>${r.date ? formatDate(r.date) : "—"}</td>
              </tr>`).join("") : `<tr><td colspan="4">Nenhuma conta a pagar conhecida.</td></tr>`}
            </tbody>
          </table>
        </section>
      </div>
    </div>
  `;

  container.querySelectorAll("[data-conta-order]").forEach((btn) => btn.addEventListener("click", () => {
    state.tab = "pedidos";
    pedidosState.expandedId = btn.dataset.contaOrder;
    renderApp();
  }));
}

/* =====================================================================

function renderRentabilidade(container) {
  const rows = productProfitabilityRows();

    profit:(a,b) => b.profit - a.profit,
    revenue:(a,b) => b.revenue - a.revenue,

    margin:(a,b) => b.margin - a.margin,
    lowmargin:(a,b) => a.margin - b.margin,

        <div class="pro-kpi"><div class="label">Mais lucrativo</div><div class="value" style="font-size:16px">${top ? escapeHtml(top.name) : "—"}</div><div class="hint">${top ? formatBRL(top.profit) : "Sem vendas pagas."}</div></div>
        <div class="pro-kpi"><div class="label">Margem mais baixa</div><div class="value" style="font-size:16px">${low ? escapeHtml(low.name) : "—"}</div><div class="hint">${low ? `${Math.round(low.margin*100)}%` : "Sem dados."}</div></div>
      </div>

      <section class="management-card mobile-card-table">
        <table class="rank-table">
          <thead><tr><th>#</th><th>Produto / modelo</th><th>Unidades</th><th>Pedidos</th><th>Receita líquida</th><th>Custo</th><th>Lucro</th><th>Margem</th></tr></thead>
          <tbody>
            ${rows.length ? rows.map((r,i) => `<tr>
              <td>${i+1}</td>
              <td><strong>${escapeHtml(r.name)}${r.variant ? ` · ${escapeHtml(r.variant)}` : ""}</strong></td>
              <td>${r.qty}</td><td>${r.ordersCount}</td>
              <td>${formatBRL(r.revenue)}</td><td>${formatBRL(r.cost)}</td>
              <td><strong>${formatBRL(r.profit)}</strong></td>
              <td>${r.margin < .25 ? `<span class="pro-pill urgent">${Math.round(r.margin*100)}%</span>` : r.margin < .4 ? `<span class="pro-pill warning">${Math.round(r.margin*100)}%</span>` : `<span class="pro-pill good">${Math.round(r.margin*100)}%</span>`}</td>
            </tr>`).join("") : `<tr><td colspan="8">Ainda não há vendas pagas suficientes para analisar.</td></tr>`}
          </tbody>
        </table>
      </section>
    </div>
  `;
  document.getElementById("profit-sort")?.addEventListener("change", (e) => {

    renderRentabilidade(container);
  });

function renderCommandResults() {
  const resultsEl = document.getElementById("command-results");
  const input = document.getElementById("command-search-input");
  if (!resultsEl || !input) return;
  professionalState.searchQuery = input.value;
  const results = globalSearchResults(input.value);

  if (!input.value.trim()) {
    resultsEl.innerHTML = `
      <div class="command-group-label">Atalhos</div>
      ${[
        ["producao","⚙","Produção","Fila de fabricação e acabamento"],
        ["pedidos","🧾","Pedidos","Novos, em andamento e concluídos"],
        ["contas","⇄","A pagar / receber","Recebíveis e compromissos em aberto"],
        ["fechamento","📅","Fechamento mensal","DRE gerencial e retirada"],
        ["rentabilidade","↗","Rentabilidade","Lucro e margem por produto"],
        ["caixa","💰","Caixa","Entradas e saídas"],
      ].map(([tab,icon,title,detail]) => `<button class="command-result" data-command-tab="${tab}"><span class="command-result-icon">${icon}</span><span class="command-result-copy"><strong>${title}</strong><span>${detail}</span></span></button>`).join("")}
    `;
  } else if (!results.length) {
    resultsEl.innerHTML = `<div class="p-8 text-center text-sm text-navy-400">Nenhum resultado para “${escapeHtml(input.value)}”.</div>`;
  } else {
    const grouped = {};
    results.forEach((r) => (grouped[r.type] ||= []).push(r));
    resultsEl.innerHTML = Object.entries(grouped).map(([type,list]) => `
      <div class="command-group-label">${escapeHtml(type)}</div>
      ${list.map((r) => `<button class="command-result" data-command-tab="${r.tab}" data-command-id="${r.id || ""}" data-command-type="${r.type}">
        <span class="command-result-icon">${r.icon}</span>
        <span class="command-result-copy"><strong>${escapeHtml(r.title)}</strong><span>${escapeHtml(r.detail)}</span></span>
      </button>`).join("")}
    `).join("");
  }

  resultsEl.querySelectorAll("[data-command-tab]").forEach((btn) => btn.addEventListener("click", () => {
    professionalState.searchOpen = false;
    state.tab = btn.dataset.commandTab;
    if (btn.dataset.commandType === "Pedido" && btn.dataset.commandId) pedidosState.expandedId = btn.dataset.commandId;
    renderApp();
  }));
}

function renderActiveSection(container) {
  const renderers = {
    inicio: renderInicio,
    producao: renderProducao,
    eventos: renderEventos,
    posvenda: renderPosVenda,
    ocorrencias: renderOcorrencias,
    contas: renderContas,
    fechamento: renderFechamento,
    rentabilidade: renderRentabilidade,
    atividade: renderAtividade,
    configuracoes: renderConfiguracoes,
    precificacao: renderPrecificacao,
    materiais: renderMateriais,
    fornecedores: renderFornecedores,
    clientes: renderClientes,
    cupons: renderCupons,
    orcamentos: renderOrcamentos,
    pedidos: renderPedidos,
    estoque: renderEstoque,
    relatorios: renderRelatorios,
    avaliacoes: renderAvaliacoes,
    caixa: renderCaixa,
  };
  const renderer = renderers[state.tab] || renderCaixa;
  try {
    renderer(container);
  } catch (err) {
    console.error(`Falha ao renderizar a seção ${state.tab}:`, err);
    container.innerHTML = `
      <section class="management-card" role="alert">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <span class="admin-kicker">Falha de exibição</span>
            <h1 class="mt-1 text-xl font-semibold text-navy-900">Não foi possível abrir esta área</h1>
            <p class="mt-2 text-sm text-navy-500">Os dados não foram apagados. O painel interceptou um erro de interface para evitar uma tela vazia.</p>
          </div>
          <button id="section-render-retry" type="button" class="rounded-lg bg-navy-900 px-3 py-2 text-sm font-semibold text-white">Tentar novamente</button>
        </div>
        <p class="mt-3 rounded-lg bg-red-50 px-3 py-2 text-xs text-red-700">${escapeHtml(err?.message || "Erro inesperado")}</p>
      </section>`;
    document.getElementById("section-render-retry")?.addEventListener("click", async () => {
      try { await loadAllData(); } catch (refreshErr) { console.error("Falha ao atualizar após erro de seção:", refreshErr); }
      renderApp();
    });
  }
}

function renderApp() {
