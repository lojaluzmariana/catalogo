  const pendingReviewsCount = state.reviews.filter((r) => !r.approved).length;
  const unpaidStockCount = state.cashEntries.filter((e) => e.category === "Compra de estoque" && !e.paid_at).length;
  const birthdaysThisWeek = customersWithBirthdayThisWeek();
  const birthdayCount = birthdaysThisWeek.length;

/* =====================================================================
   PAINEL "SEGURANÇA" — ativar/desativar a verificação em duas etapas
   (2FA/TOTP) da PRÓPRIA conta (não existe "gerenciar o 2FA de outro
   admin" — cada um cuida do seu, coerente com não ter papéis/permissões
   de multi-usuário nesse painel).
   ===================================================================== */
/* =====================================================================
   HISTÓRICO DE PREÇOS — lê a tabela alimentada pelo gatilho do banco
   (product_price_history, ver migration_historico_precos.sql). Só
   leitura: o painel nunca escreve nessa tabela diretamente, quem grava é
   o próprio Postgres sempre que um UPDATE muda custo/crédito/promo de um
   produto, então o histórico é fiel mesmo se um dia existir outro
   caminho de edição que a gente esqueça de "avisar" o painel.
   ===================================================================== */
async function loadPriceHistory() {
  priceHistoryState.loading = true;
  priceHistoryState.error = null;
  renderPriceHistoryOverlay();
  const { data, error } = await supabaseClient
    .from("product_price_history")
    .select("*")
    .order("changed_at", { ascending: false })
    .limit(200);
  priceHistoryState.loading = false;
  if (error) {
    priceHistoryState.error = error.message;
    renderPriceHistoryOverlay();
    return;
  }
  priceHistoryState.rows = data ?? [];
  renderPriceHistoryOverlay();
}

function renderPriceHistoryOverlay() {
  const slot = document.getElementById("price-history-overlay-slot");
  if (!slot) return;
  if (!priceHistoryState.open) { slot.innerHTML = ""; return; }

  const filter = priceHistoryState.filter.trim().toLowerCase();
  const rows = filter ? priceHistoryState.rows.filter((r) => r.product_name.toLowerCase().includes(filter)) : priceHistoryState.rows;

  // Alta = vermelho, queda = verde — é só uma indicação visual de
  // direção (subiu/desceu), não um julgamento de "bom ou ruim": um custo
  // subindo é diferente de um preço de venda subindo, mas a cor ajuda a
  // bater o olho e ver o que mudou sem precisar comparar os números.
  const fmtDelta = (oldV, newV) => {
    if (oldV == null || newV == null) return "—";
    const diff = Number(newV) - Number(oldV);
    const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "•";
    const cls = diff > 0 ? "text-red-600" : diff < 0 ? "text-emerald-700" : "text-navy-400";
    return `${formatBRL(oldV)} → ${formatBRL(newV)} <span class="${cls}">${arrow}</span>`;
  };

  slot.innerHTML = `
    <div id="price-history-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
      <div class="flex max-h-[90vh] w-full max-w-3xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">
          <div>
            <h2 class="text-lg font-semibold text-navy-900">📜 Histórico de alterações de preço</h2>
            <p class="text-xs text-navy-500">Registro automático de mudanças de custo, preço no crédito e preço promo/pix — as ${priceHistoryState.rows.length} mais recentes.</p>
          </div>
          <button id="close-price-history-btn" type="button" class="rounded px-2 py-1 text-navy-500 hover:bg-navy-100">✕</button>
        </div>
        <div class="border-b border-navy-100 px-5 py-3">
          <input id="price-history-filter" value="${escapeHtml(priceHistoryState.filter)}" placeholder="Filtrar por nome do produto..." class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-4">
          ${priceHistoryState.loading ? `<p class="text-sm text-navy-400">Carregando...</p>`
            : priceHistoryState.error ? `<p class="text-sm text-red-600">Não foi possível carregar: ${escapeHtml(priceHistoryState.error)}</p>`
            : rows.length === 0 ? `<p class="text-sm text-navy-400">${priceHistoryState.rows.length === 0 ? "Nenhuma alteração de preço registrada ainda." : "Nenhum resultado pro filtro."}</p>`
            : `
              <div class="overflow-x-auto">
                <table class="w-full min-w-[640px] text-xs">
                  <thead>
                    <tr class="border-b border-navy-100 text-left uppercase tracking-wide text-navy-400">
                      <th class="py-2 pr-2">Data</th>
                      <th class="py-2 pr-2">Produto</th>
                      <th class="py-2 pr-2">Custo</th>
                      <th class="py-2 pr-2">Crédito</th>
                      <th class="py-2 pr-2">Promo/Pix</th>
                      <th class="py-2">Quem</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rows.map((r) => `
                      <tr class="border-b border-navy-50 last:border-0">
                        <td class="py-2 pr-2 whitespace-nowrap text-navy-600">${formatDateTime(r.changed_at)}</td>
                        <td class="py-2 pr-2 font-medium text-navy-900">${escapeHtml(r.product_name)}</td>
                        <td class="py-2 pr-2 whitespace-nowrap">${fmtDelta(r.old_cost, r.new_cost)}</td>
                        <td class="py-2 pr-2 whitespace-nowrap">${fmtDelta(r.old_credit_price, r.new_credit_price)}</td>
                        <td class="py-2 pr-2 whitespace-nowrap">${fmtDelta(r.old_promo_price, r.new_promo_price)}</td>
                        <td class="py-2 text-navy-500">${escapeHtml(adminName(r.changed_by) || "—")}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            `}
        </div>
      </div>
    </div>
  `;

  document.getElementById("close-price-history-btn").addEventListener("click", () => {
    priceHistoryState.open = false;
    renderPriceHistoryOverlay();
  });
  const filterInput = document.getElementById("price-history-filter");
  if (filterInput) {
    filterInput.addEventListener("input", (e) => {
      priceHistoryState.filter = e.target.value;
      renderPriceHistoryOverlay();
    });
  }
}

async function loadSecurityStatus() {
  const [{ data: enabled }, { data: remaining }] = await Promise.all([
    supabaseClient.rpc("totp_status"),
    supabaseClient.rpc("totp_backup_codes_remaining"),
  ]);
  securityState.enabled = !!enabled;
  securityState.backupCodesRemaining = remaining ?? 0;
  securityState.step = "status";
  renderSecurityOverlay();
}

      </div>

    return;
  }

  if (securityState.step === "status") {
    slot.innerHTML = `
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
        <div class="w-full max-w-md rounded-xl bg-white shadow-xl">
          <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">

          </div>
          <div class="flex flex-col gap-4 px-5 py-4">
            <p class="text-sm text-navy-600">Pede um segundo código (do app autenticador, além do usuário e senha) toda vez que ${escapeHtml(state.currentUser?.name ?? "você")} entrar no painel — protege mesmo se alguém descobrir a senha.</p>
            ${securityState.enabled ? `
              <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">
                <p class="font-semibold">✓ Ativada</p>
                <p class="mt-1 text-xs ${securityState.backupCodesRemaining <= 2 ? "font-semibold text-amber-700" : "text-emerald-700"}">${securityState.backupCodesRemaining} código(s) de recuperação restante(s)${securityState.backupCodesRemaining <= 2 ? " — considere desativar e ativar de novo pra gerar códigos novos." : ""}</p>
              </div>
              <button id="disable-2fa-btn" class="rounded-lg border border-red-200 px-4 py-2 text-sm font-medium text-red-700 transition hover:bg-red-50">Desativar verificação em duas etapas</button>

        </div>

      securityState.open = false;

        if (!confirm("Desativar a verificação em duas etapas? Da próxima vez, só o usuário e senha vão bastar pra entrar.")) return;
        await supabaseClient.rpc("totp_disable");
        await loadSecurityStatus();
      });
    } else {
      document.getElementById("start-2fa-setup-btn").addEventListener("click", async () => {
        const { data, error } = await supabaseClient.rpc("totp_generate_secret");
        if (error || !data) { alert("Não foi possível iniciar a ativação. Tente de novo."); return; }
        securityState.newSecret = data.secret;
        securityState.newBackupCodes = data.backup_codes;
        securityState.step = "setup";
        renderSecurityOverlay();
      });
    }
    return;
  }

  if (securityState.step === "setup") {
    const issuer = "Luz Mariana";
    const label = `${issuer}:${state.currentUser?.name ?? "admin"}`;
    const otpauthUrl = `otpauth://totp/${encodeURIComponent(label)}?secret=${securityState.newSecret}&issuer=${encodeURIComponent(issuer)}&digits=6&period=30`;
    let qrSvg = "";
    try {
      const qr = qrcode(0, "M");
      qr.addData(otpauthUrl);
      qr.make();
      qrSvg = qr.createSvgTag(4, 0);
    } catch (err) {
      console.error("Erro ao gerar QR do 2FA:", err);
    }

    slot.innerHTML = `
      <div class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-navy-950/50 p-4">
        <div class="my-8 w-full max-w-md rounded-xl bg-white shadow-xl">

              <div class="flex justify-center rounded-lg border border-navy-100 bg-white p-3">${qrSvg}</div>
              <p class="mt-2 text-center text-xs text-navy-400">Ou digite manualmente: <span class="font-mono font-semibold text-navy-700">${securityState.newSecret}</span></p>
            </div>
            <div>
              <p class="mb-2 text-sm font-medium text-navy-800">2. Guarde estes códigos de recuperação num lugar seguro</p>
              <p class="mb-2 text-xs text-navy-500">Cada um serve pra entrar UMA VEZ caso perca o acesso ao app autenticador. Eles só aparecem aqui agora — não tem como ver de novo depois.</p>
              <div class="grid grid-cols-2 gap-1.5 rounded-lg border border-navy-100 bg-cream-50 p-3 font-mono text-sm text-navy-800">
                ${securityState.newBackupCodes.map((c) => `<span>${c}</span>`).join("")}
              </div>
              <button id="copy-backup-codes-btn" type="button" class="mt-2 w-full rounded-lg border border-navy-200 px-3 py-1.5 text-xs font-medium text-navy-700 transition hover:bg-navy-50">📋 Copiar códigos</button>
            </div>
            <form id="confirm-2fa-form" class="flex flex-col gap-3 border-t border-navy-100 pt-4">
              <label class="block">
                <span class="mb-1.5 block text-sm font-medium text-navy-800">3. Digite o código de 6 dígitos que o app está mostrando agora, pra confirmar</span>
                <input id="confirm-2fa-code" inputmode="numeric" pattern="\\d{6}" maxlength="6" autocomplete="one-time-code"
                  class="pin-input w-full rounded-lg border border-navy-100 bg-white px-4 py-3 text-center text-2xl text-navy-900 shadow-sm outline-none transition focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
                  placeholder="••••••" />
              </label>
              ${securityState.setupError ? `<p class="text-sm text-red-600">${escapeHtml(securityState.setupError)}</p>` : ""}
              <button type="submit" id="confirm-2fa-btn" class="rounded-lg bg-gold-500 px-4 py-2.5 text-sm font-semibold text-navy-900 shadow transition hover:bg-gold-400">Confirmar e ativar</button>
              <button type="button" id="cancel-2fa-setup-btn" class="text-center text-sm text-navy-500 underline decoration-navy-200 underline-offset-2 transition hover:text-navy-700">Cancelar</button>
            </form>
          </div>
        </div>
      </div>
    `;
    document.getElementById("close-security-btn").addEventListener("click", () => {
      securityState.open = false;
      renderApp();
    });
    document.getElementById("cancel-2fa-setup-btn").addEventListener("click", () => {
      securityState.step = "status";
      securityState.setupError = null;
      renderSecurityOverlay();
    });
    document.getElementById("copy-backup-codes-btn").addEventListener("click", async () => {
      const btn = document.getElementById("copy-backup-codes-btn");
      try {
        await navigator.clipboard.writeText(securityState.newBackupCodes.join("\n"));
        const original = btn.textContent;
        btn.textContent = "✓ Copiado!";
        setTimeout(() => { btn.textContent = original; }, 1500);
      } catch (err) {
        console.error("copiar códigos de recuperação:", err);
        alert("Não foi possível copiar automaticamente. Códigos:\n\n" + securityState.newBackupCodes.join("\n"));
      }
    });
    document.getElementById("confirm-2fa-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = document.getElementById("confirm-2fa-code").value.trim();
      if (!/^\d{6}$/.test(code)) { securityState.setupError = "Digite os 6 números do código."; return renderSecurityOverlay(); }

      confirmBtn.disabled = true;
      confirmBtn.textContent = "Confirmando...";
      const { data: ok, error } = await supabaseClient.rpc("totp_confirm_enable", { code });
      if (error || !ok) {
        securityState.setupError = "Código incorreto. Confira no app e tente de novo.";
        return renderSecurityOverlay();
      }
      securityState.setupError = null;
      await loadSecurityStatus();

  }

async function loadProducts() {
  const { data, error } = await supabaseClient
    .from("products")
    .select("*, product_materials(id, quantity, material_id, materials(id, name, unit, unit_cost)), product_variants(id, name, photo_url, sort_order, in_stock, esgotado, stock_qty, cost, promo_manual_price, credit_price, promo_price), product_photos(id, url, sort_order), suppliers(id, name, phone, instagram, address)")
    .order("active", { ascending: false })
    .order("name", { ascending: true });
  if (!error) state.products = data;
  noteLoadResult("produtos", error);
}

// Prazo de fabricação (dias ÚTEIS, sem contar sábado/domingo) de um
// produto — cada produto pode ter o seu, editável no cadastro (campo
// "Prazo de fabricação") ou aplicado de uma vez a todos os produtos
// (botão "Aplicar a todos"). Quando o produto não tem lead_time_days
// definido (registro antigo, de antes dessa coluna existir, ou produto
// que sumiu do cadastro), cai no padrão de 3 dias úteis.
const DEFAULT_LEAD_TIME_DAYS = 3;
function productLeadTimeDays(product) {
  return product && product.lead_time_days != null ? Number(product.lead_time_days) : DEFAULT_LEAD_TIME_DAYS;
}
function leadTimeDaysLabel(days) {
  return `${days} dia${days === 1 ? "" : "s"} útil${days === 1 ? "" : "eis"}`;
}

// Soma dias ÚTEIS a uma data, pulando sábado e domingo — usada em todo
// cálculo de prazo de entrega/fabricação (orderDeliveryDeadline,
// manufacturerDeadline), já que o prazo agora é sempre em dias úteis,
// não corridos.
function addBusinessDays(date, days) {
  const result = new Date(date);
  let remaining = days;
  while (remaining > 0) {
    result.setDate(result.getDate() + 1);
    const weekday = result.getDay(); // 0 = domingo, 6 = sábado
    if (weekday !== 0 && weekday !== 6) remaining--;
  }
  return result;
}

// A partir de quantas unidades um estoque com CONTROLE NUMÉRICO conta
// como "acabando" — mostra um aviso antes de chegar em zero, dando
// tempo de repor/fabricar. Não afeta quem não usa controle numérico
// (stock_qty null): esses continuam só no booleano em estoque/esgotado.
const LOW_STOCK_THRESHOLD = 2;

// Badge de estoque na listagem de produtos. Produto SEM modelo cadastrado
// usa o campo de estoque do produto, como sempre. Produto COM modelos
// usa o estoque de cada modelo — mostra "todos em estoque" só se todos
// estiverem marcados, "sob encomenda" só se nenhum estiver, e "parcial"
// quando é uma mistura (aí o cliente vê o prazo certo pra cada modelo
// que escolher lá no Catálogo).
function stockBadge(p) {
  const variants = p.product_variants ?? [];
  const prazo = leadTimeDaysLabel(productLeadTimeDays(p));
  if (variants.length === 0) {
    return p.in_stock
      ? `<span title="Em estoque — pronta entrega" class="rounded-full bg-emerald-100 px-1 py-0.5 text-[9px] font-semibold text-emerald-700">✓ estoque</span>`
      : `<span title="Sob encomenda — catálogo avisa prazo de ${prazo}" class="rounded-full bg-navy-100 px-1 py-0.5 text-[9px] font-semibold text-navy-500">sob encomenda</span>`;
  }
  const inStockCount = variants.filter((v) => v.in_stock).length;
  if (inStockCount === variants.length) {
    return `<span title="Todos os modelos em estoque" class="rounded-full bg-emerald-100 px-1 py-0.5 text-[9px] font-semibold text-emerald-700">✓ estoque (todos)</span>`;
  }
  if (inStockCount === 0) {
    return `<span title="Nenhum modelo em estoque — catálogo avisa prazo de ${prazo}" class="rounded-full bg-navy-100 px-1 py-0.5 text-[9px] font-semibold text-navy-500">sob encomenda (todos)</span>`;
  }
  return `<span title="${inStockCount} de ${variants.length} modelos em estoque — veja qual em Modelos" class="rounded-full bg-gold-100 px-1 py-0.5 text-[9px] font-semibold text-gold-700">estoque parcial (${inStockCount}/${variants.length})</span>`;
}

// Badge de "Esgotado" na listagem — só aparece quando faz sentido (não
// polui a linha de um produto que nunca esgotou nada). Produto com
// modelo usa o esgotado de cada um; produto sem modelo usa o dele.
function esgotadoBadge(p) {
  const variants = p.product_variants ?? [];
  if (variants.length === 0) {
    return p.esgotado
      ? `<span title="Esgotado — não aparece pra compra no Catálogo" class="rounded-full bg-red-100 px-1 py-0.5 text-[9px] font-semibold text-red-700">⛔ esgotado</span>`
      : "";
  }
  const esgotadoCount = variants.filter((v) => v.esgotado).length;
  if (esgotadoCount === 0) return "";
  if (esgotadoCount === variants.length) {
    return `<span title="Todos os modelos esgotados" class="rounded-full bg-red-100 px-1 py-0.5 text-[9px] font-semibold text-red-700">⛔ esgotado (todos)</span>`;
  }
  return `<span title="${esgotadoCount} de ${variants.length} modelos esgotados — veja qual em Modelos" class="rounded-full bg-red-100 px-1 py-0.5 text-[9px] font-semibold text-red-700">⛔ esgotado (${esgotadoCount}/${variants.length})</span>`;
}

// Aviso de "estoque acabando" (só pra quem usa controle numérico de
// estoque — stock_qty preenchido) — aparece ANTES de chegar a zero,
// diferente do badge de esgotado acima. Produto com modelo mostra
// quantos modelos estão baixos; sem modelo, mostra a quantidade exata.
function lowStockBadge(p) {
  const variants = p.product_variants ?? [];
  if (variants.length === 0) {
    if (p.stock_qty == null || Number(p.stock_qty) <= 0 || Number(p.stock_qty) > LOW_STOCK_THRESHOLD) return "";
    return `<span title="Só restam ${Number(p.stock_qty)} unidade(s) em estoque" class="rounded-full bg-amber-100 px-1 py-0.5 text-[9px] font-semibold text-amber-700">⚠ restam ${Number(p.stock_qty)}</span>`;
  }
  const lowVariants = variants.filter((v) => v.stock_qty != null && Number(v.stock_qty) > 0 && Number(v.stock_qty) <= LOW_STOCK_THRESHOLD);
  if (lowVariants.length === 0) return "";
  return `<span title="${lowVariants.map((v) => `${escapeHtml(v.name)}: ${Number(v.stock_qty)}`).join(", ")} — veja em Modelos" class="rounded-full bg-amber-100 px-1 py-0.5 text-[9px] font-semibold text-amber-700">⚠ acabando (${lowVariants.length})</span>`;
}

// Contagens usadas nos badges de aviso do menu (Precificação/Materiais).
function countLowStockProducts() {
  return state.products.filter((p) => p.active).reduce((count, p) => {
    const variants = p.product_variants ?? [];
    if (variants.length === 0) return count + (p.stock_qty != null && Number(p.stock_qty) > 0 && Number(p.stock_qty) <= LOW_STOCK_THRESHOLD ? 1 : 0);
    return count + variants.filter((v) => v.stock_qty != null && Number(v.stock_qty) > 0 && Number(v.stock_qty) <= LOW_STOCK_THRESHOLD).length;
  }, 0);
}
function countLowStockMaterials() {
  return state.materials.filter((m) => m.active && Number(m.stock_qty) > 0 && Number(m.stock_qty) <= LOW_STOCK_THRESHOLD).length;
}

// Detalha (produto/modelo/material + quantidade restante) tudo que está
// "acabando" agora — usado no aviso manual de estoque baixo, pra montar
// a mensagem que vai pro WhatsApp da loja.
function lowStockAlertRows() {
  const rows = [];
  state.products.filter((p) => p.active).forEach((p) => {
    const variants = p.product_variants ?? [];
    if (variants.length === 0) {
      if (p.stock_qty != null && Number(p.stock_qty) > 0 && Number(p.stock_qty) <= LOW_STOCK_THRESHOLD) {
        rows.push({ label: p.name, qty: Number(p.stock_qty) });
      }
    } else {
      variants.forEach((v) => {
        if (v.stock_qty != null && Number(v.stock_qty) > 0 && Number(v.stock_qty) <= LOW_STOCK_THRESHOLD) {
          rows.push({ label: `${p.name} (${v.name})`, qty: Number(v.stock_qty) });
        }
      });
    }
  });
  state.materials.filter((m) => m.active && Number(m.stock_qty) > 0 && Number(m.stock_qty) <= LOW_STOCK_THRESHOLD).forEach((m) => {
    rows.push({ label: `${m.name} (material)`, qty: Number(m.stock_qty) });
  });
  return rows;
}

function buildLowStockWhatsappMessage(rows) {
  const lines = [`⚠ Aviso de estoque baixo — ${STORE_NAME}`, ""];
  if (rows.length === 0) {
    lines.push("Nada com estoque baixo no momento.");
  } else {
    rows.forEach((r) => lines.push(`• ${r.label}: restam ${r.qty}`));
  }
  lines.push("");
  lines.push(`Mensagem gerada pelo painel em ${formatDateTime(new Date().toISOString())}.`);
  return lines.join("\n");
}

// Painel "Histórico de preços" — carregado sob demanda (não faz parte do

// Célula de edição rápida de estoque, direto na lista de produtos —
// sem precisar abrir "Editar produto". Produto sem modelo mostra um
// campo numérico só; com modelos, um campo por modelo (cada um pode ter
// sua própria contagem). Quem ainda não controla por quantidade (o
// booleano manual de sempre) mostra um botão "Ativar controle" em vez
// do número — digitar um valor liga o controle por quantidade
// automaticamente, igual o checkbox faria no formulário completo.
function renderStockQtyCell(p) {
  const variants = p.product_variants ?? [];
  if (variants.length === 0) {
    if (p.stock_qty == null) {
      return `<button type="button" data-stock-activate="${p.id}" class="stock-activate-btn rounded border border-navy-200 px-1.5 py-0.5 text-[10px] font-medium text-navy-500 hover:bg-navy-100">ativar controle</button>`;
    }
    return `
      <span class="inline-flex items-center gap-0.5">
        <input type="number" min="0" step="1" value="${Number(p.stock_qty)}" data-stock-qty-input="${p.id}" class="stock-qty-input w-14 rounded border border-navy-200 px-1 py-0.5 text-center text-[11px] outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-200" />
        <button type="button" data-stock-deactivate="${p.id}" title="Parar de controlar por quantidade (volta pro manual)" class="stock-deactivate-btn rounded px-1 text-[10px] text-navy-400 hover:bg-navy-100 hover:text-red-600">✕</button>
      </span>`;
  }
  return `
    <div class="flex flex-col items-start gap-0.5">
      ${[...variants].sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0)).map((v) => `
        <span class="flex items-center gap-1 text-[10px] text-navy-500">
          <span class="max-w-[70px] truncate" title="${escapeHtml(v.name)}">${escapeHtml(v.name)}</span>
          ${v.stock_qty == null
            ? `<button type="button" data-stock-activate="${p.id}" data-variant-id="${v.id}" class="stock-activate-btn rounded border border-navy-200 px-1 py-0.5 text-[9px] font-medium text-navy-500 hover:bg-navy-100">ativar</button>`
            : `<input type="number" min="0" step="1" value="${Number(v.stock_qty)}" data-stock-qty-input="${p.id}" data-variant-id="${v.id}" class="stock-qty-input w-12 rounded border border-navy-200 px-1 py-0.5 text-center text-[10px] outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-200" />
               <button type="button" data-stock-deactivate="${p.id}" data-variant-id="${v.id}" title="Parar de controlar por quantidade (volta pro manual)" class="stock-deactivate-btn rounded px-0.5 text-[9px] text-navy-400 hover:bg-navy-100 hover:text-red-600">✕</button>`}
        </span>
      `).join("")}
    </div>`;
}

// Salva a nova quantidade em estoque (produto ou modelo), atualizando
// junto in_stock/esgotado — usada pela edição rápida na lista de
// produtos (renderStockQtyCell). Ativar o controle pela primeira vez
// (stock_qty estava null) passa por aqui também, com o valor digitado.
async function salvarEstoqueRapido(productId, variantId, rawValue) {
  const qty = Math.max(0, Math.trunc(Number(String(rawValue).replace(",", "."))));
  if (!Number.isFinite(qty)) return;
  if (variantId) {
    await supabaseClient.from("product_variants").update({ stock_qty: qty, in_stock: qty > 0, esgotado: qty <= 0 }).eq("id", variantId);
  } else {
    await supabaseClient.from("products").update({ stock_qty: qty, in_stock: qty > 0, esgotado: qty <= 0, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", productId);
  }
  await loadProducts();
  renderPrecificacao(document.getElementById("main-content"));
}

// Desliga o controle por quantidade (volta pro booleano manual de
// sempre), preservando o em-estoque/esgotado atual como estavam —
// só para de recalcular sozinho a partir de um número.
async function desativarControleEstoque(productId, variantId) {
  if (variantId) {
    await supabaseClient.from("product_variants").update({ stock_qty: null }).eq("id", variantId);
  } else {
    await supabaseClient.from("products").update({ stock_qty: null, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", productId);
  }
  await loadProducts();
  renderPrecificacao(document.getElementById("main-content"));
}

/* =====================================================================
   CALCULADORA 3D — ferramenta separada de precificação de peças
   impressas em 3D (rolo de filamento, energia, desgaste de bico/
   máquina, mão de obra, taxa de falhas, margem) — baseada na calculadora
   que você já usava separada. A simulação pode ser salva no histórico e
   também enviada para o formulário de Produtos, já com custo por peça,
   preço Pix sugerido e fornecedor "Fabricação própria" pré-preenchidos.
   Histórico de projetos calculados fica salvo neste aparelho
   (localStorage), igual a ferramenta original.
   ===================================================================== */
const CALC3D_STORAGE_KEY = "luz-mariana-calc3d-historico";
function loadCalc3dHistory() {
  try { return JSON.parse(localStorage.getItem(CALC3D_STORAGE_KEY)) || []; } catch (err) { return []; }
}
function saveCalc3dHistory(hist) {
  try { localStorage.setItem(CALC3D_STORAGE_KEY, JSON.stringify(hist)); } catch (err) { /* localStorage indisponível — histórico só dura a sessão atual */ }
}
function calc3dDefaultState() {
  return {
    open: false,
    locked: true, // trava os campos de custos fixos/desgaste e mão de obra/margem, pra não mexer sem querer
    projectName: "Mesa de Chaveiros",
    precoRolo: "100", pesoRolo: "1000", gramasUsadas: "110", desperdicio: "10",
    potencia: "110", energia: "1.20", tempoH: "8", tempoM: "0", unidades: "25",
    bico: "120", vidaBico: "4000", novaMaquina: "5000", horasRenovacao: "10000", despesasFixas: "145", horasProdutivas: "300",
    valorHoraHumana: "20", horasHumanasH: "0", horasHumanasM: "30", falhas: "5", lucro: "40",
  };
}
let calc3dState = { ...calc3dDefaultState(), history: loadCalc3dHistory() };

function calc3dCompute() {
  const num = (v) => { const n = Number(String(v).replace(",", ".")); return Number.isFinite(n) ? n : 0; };
  const precoRolo = num(calc3dState.precoRolo);
  const pesoRolo = num(calc3dState.pesoRolo) || 1;
  const gramasUsadas = num(calc3dState.gramasUsadas);
  const desperdicio = num(calc3dState.desperdicio);
  const potencia = num(calc3dState.potencia);
  // Horas + minutos digitados separadamente (mais natural de preencher
  // do que decimal, ex: 8h30 em vez de "8.5") — convertidos aqui pra
  // decimal, que é o que a fórmula usa por baixo.
  const tempo = num(calc3dState.tempoH) + num(calc3dState.tempoM) / 60;
  const energia = num(calc3dState.energia);
  const unidades = num(calc3dState.unidades) || 1;
  const bico = num(calc3dState.bico);
  const vidaBico = num(calc3dState.vidaBico) || 1;
  const novaMaquina = num(calc3dState.novaMaquina);
  const horasRenovacao = num(calc3dState.horasRenovacao) || 1;
  const despesasFixas = num(calc3dState.despesasFixas);
  const horasProdutivas = num(calc3dState.horasProdutivas) || 1;
  const valorHoraHumana = num(calc3dState.valorHoraHumana);
  const horasHumanas = num(calc3dState.horasHumanasH) + num(calc3dState.horasHumanasM) / 60;
  const falhas = num(calc3dState.falhas);
  const lucro = num(calc3dState.lucro);

  const custoMaterial = (precoRolo / pesoRolo) * gramasUsadas * (1 + desperdicio / 100);
  const custoEnergia = (potencia / 1000) * tempo * energia;
  const custoDesgasteTotal = ((bico / vidaBico) * tempo) + ((novaMaquina / horasRenovacao) * tempo);
  const custoOperacional = (despesasFixas / horasProdutivas) * tempo;
  const custoMaoObra = valorHoraHumana * horasHumanas;

  const subtotal = custoMaterial + custoEnergia + custoDesgasteTotal + custoOperacional + custoMaoObra;
  const custoFalhas = subtotal * (falhas / 100);
  const custoTotalMesa = subtotal + custoFalhas;
  const precoVendaMesa = custoTotalMesa * (1 + lucro / 100);
  const lucroMesa = Math.max(0, precoVendaMesa - custoTotalMesa);
  const percentualGuardar = precoVendaMesa > 0 ? (lucroMesa / precoVendaMesa) * 100 : 0;

  return {
    custoMaterial, custoEnergia, custoDesgasteTotal, custoOperacional, custoMaoObra, custoFalhas,
    custoTotalMesa, precoVendaMesa, lucroMesa, percentualGuardar, unidades,
    custoPeca: custoTotalMesa / unidades, precoPeca: precoVendaMesa / unidades,
    lucroPeca: lucroMesa / unidades,
  };
}

  function saveCurrentCalc3dToHistory() {
    const item = buildCalc3dHistoryItem();
    calc3dState.history = [...calc3dState.history, item];
    saveCalc3dHistory(calc3dState.history);
    return item;
  }

  function calc3dFormattedBRLToNumber(value) {
    if (typeof value === "number") return value;
    const clean = String(value ?? "").replace(/[^0-9,.-]/g, "").replace(/\./g, "").replace(",", ".");
    const n = Number(clean);
    return Number.isFinite(n) ? n : 0;
  }

  function openProductFromCalc3d(item) {
    const ownSupplier = state.suppliers.find((s) => String(s.name || "").trim().toLocaleLowerCase("pt-BR") === "fabricação própria");
    const cost = Number(item.custoPecaRaw ?? calc3dFormattedBRLToNumber(item.custoPeca));
    const suggested = Number(item.precoPecaRaw ?? calc3dFormattedBRLToNumber(item.unitario));
    precifState.draftFromCalc3d = {
      name: item.nome && item.nome !== "Sem nome" ? item.nome : "Produto 3D",
      baseCost: round2(cost),
      promoManualPrice: round2(suggested),
      supplierId: ownSupplier?.id ?? null,
      createOwnSupplier: !ownSupplier,
      supplierName: "Fabricação própria",
      supplierPhone: "Interno",
    };
    precifState.editingId = null;
    precifState.formOpen = true;
    calc3dState.open = false;
    renderPrecificacao(document.getElementById("main-content"));
    const form = document.getElementById("product-form");
    if (form) form.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("calc3d-save-btn").addEventListener("click", () => {
    saveCurrentCalc3dToHistory();
    renderCalc3dOverlay();
  });

  document.getElementById("calc3d-launch-product-btn").addEventListener("click", () => {
    const item = saveCurrentCalc3dToHistory();
    openProductFromCalc3d(item);
  });
  const copyBtn = document.getElementById("calc3d-copy-cost-btn");
  if (copyBtn) {
    copyBtn.addEventListener("click", async () => {
      const res = calc3dCompute();
      try {
        await navigator.clipboard.writeText(res.custoPeca.toFixed(2).replace(".", ","));
        copyBtn.textContent = "✓ Copiado!";
        setTimeout(() => { copyBtn.textContent = "📋 Copiar custo"; }, 1500);
      } catch (err) {
        alert("Não foi possível copiar automaticamente. Custo por peça: " + formatBRL(res.custoPeca));
      }
    });
  }
  const clearHistBtn = document.getElementById("calc3d-clear-hist-btn");
  if (clearHistBtn) {
    clearHistBtn.addEventListener("click", () => {
      if (!confirm("Apagar todo o histórico de projetos da Calculadora 3D?")) return;
      calc3dState.history = [];
      saveCalc3dHistory(calc3dState.history);
      renderCalc3dOverlay();
    });
  }
  slot.querySelectorAll("[data-calc3d-launch-hist]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const item = calc3dState.history[Number(btn.dataset.calc3dLaunchHist)];
      if (item) openProductFromCalc3d(item);
    });
  });
  slot.querySelectorAll("[data-calc3d-remove-hist]").forEach((btn) => {
    btn.addEventListener("click", () => {
      calc3dState.history.splice(Number(btn.dataset.calc3dRemoveHist), 1);
      saveCalc3dHistory(calc3dState.history);
      renderCalc3dOverlay();
    });
  });
}

  const priceTableGenerateBtn = document.getElementById("price-table-generate-btn");

        console.error("Erro ao gerar tabela de preços:", err);
        alert("Não foi possível gerar a tabela de preços. Tente novamente ou avise o suporte.");
      }
    });
  }
  const bulkApplyBtn = document.getElementById("bulk-cost-apply");
  if (bulkApplyBtn) {
    bulkApplyBtn.addEventListener("click", async () => {
      const msgEl = document.getElementById("bulk-cost-msg");
      const percent = Number(document.getElementById("bulk-cost-percent").value.replace(",", "."));
      if (!Number.isFinite(percent) || percent === 0) { msgEl.textContent = "Informe um percentual diferente de zero."; msgEl.className = "mt-2 text-xs text-red-600"; return; }
      const category = document.getElementById("bulk-cost-category").value;
      const targets = state.products.filter((p) => p.active && (!category || p.category === category));
      if (targets.length === 0) { msgEl.textContent = "Nenhum produto ativo encontrado com esse filtro."; msgEl.className = "mt-2 text-xs text-red-600"; return; }
      if (!confirm(`Reajustar o custo de ${targets.length} produto(s) ativo(s) em ${percent > 0 ? "+" : ""}${percent}%? Os preços de Crédito e Promo/Pix recalculam automaticamente a partir do novo custo.`)) return;

        if (!(newCost >= 0)) { errCount++; continue; }
        // Mesma regra do formulário de produto individual: se o
        // Promo/Pix é manual, o Crédito segue a proporção fixa a partir
        // dele; senão os dois preços vêm direto do custo.
        const pricing = p.promo_manual_price != null
          ? calculatePricingFromManualPromo(newCost, Number(p.promo_manual_price))
          : calculatePricing(newCost);
        const { error } = await supabaseClient.from("products").update({
          base_cost: newCost, cost: pricing.cost,
          credit_price: pricing.creditPrice, credit_net: pricing.creditNet, credit_profit: pricing.creditProfit,
          credit_markup: pricing.creditMarkup, credit_margin: pricing.creditMargin,
          promo_price: pricing.promoPrice, promo_profit: pricing.promoProfit, promo_margin: pricing.promoMargin,
          updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
        }).eq("id", p.id);
        if (error) errCount++; else okCount++;
      }
      await loadProducts();
      renderPrecificacao(container);
      // A mensagem não sobrevive ao re-render acima (o painel de reajuste
      // é reconstruído do zero) — por isso o resumo final vai num alert,
      // não no <p> de mensagem.
      alert(errCount === 0 ? `Custo reajustado em ${okCount} produto(s).` : `Custo reajustado em ${okCount} produto(s). ${errCount} falharam — confira e tente de novo se precisar.`);
    });
  }

  if (precifState.formOpen) renderProductForm();
  if (calc3dState.open) renderCalc3dOverlay();
}

// Duplica um produto: copia preço/custo/categoria/fornecedor/materiais/
// modelos, mas SEMPRE com estoque zerado e fora do catálogo até o admin
// revisar (nome, foto, o que fizer sentido) e publicar de propósito —
// evita duas fichas iguais aparecerem sozinhas na loja.
async function duplicarProduto(product) {
  const payload = {
    name: `${product.name} (cópia)`,
    base_cost: Number(product.base_cost), cost: Number(product.cost),
    credit_price: Number(product.credit_price), credit_net: Number(product.credit_net), credit_profit: Number(product.credit_profit),
    credit_markup: Number(product.credit_markup), credit_margin: Number(product.credit_margin),
    promo_price: Number(product.promo_price), promo_profit: Number(product.promo_profit), promo_margin: Number(product.promo_margin),
    promo_manual_price: product.promo_manual_price != null ? Number(product.promo_manual_price) : null,
    photo_url: product.photo_url ?? null,
    show_in_catalog: false, featured: false, active: true,
    category: product.category ?? null, material_tag: product.material_tag ?? null,
    description: product.description ?? null, supplier_id: product.supplier_id ?? null,
    lead_time_days: product.lead_time_days ?? null,
    in_stock: false, esgotado: true,
    stock_qty: product.stock_qty != null ? 0 : null,
    created_by: state.currentUser.id,
  };
  const { data: inserted, error } = await supabaseClient.from("products").insert(payload).select("id").single();
  if (error) throw error;
  const newProductId = inserted.id;

  const materials = product.product_materials ?? [];
  if (materials.length > 0) {
    const rows = materials.map((m) => ({ product_id: newProductId, material_id: m.material_id, quantity: m.quantity }));
    const { error: matError } = await supabaseClient.from("product_materials").insert(rows);
    if (matError) throw matError;
  }

  const variants = product.product_variants ?? [];
  if (variants.length > 0) {
    const variantRows = variants.map((v) => ({
      product_id: newProductId, name: v.name, photo_url: v.photo_url ?? null, sort_order: v.sort_order ?? 0,
      in_stock: false, esgotado: true,
      stock_qty: v.stock_qty != null ? 0 : null,
      cost: v.cost != null ? Number(v.cost) : null,
      promo_manual_price: v.promo_manual_price != null ? Number(v.promo_manual_price) : null,
      credit_price: v.credit_price != null ? Number(v.credit_price) : null,
      promo_price: v.promo_price != null ? Number(v.promo_price) : null,
    }));
    const { error: varError } = await supabaseClient.from("product_variants").insert(variantRows);
    if (varError) throw varError;
  }

  const photos = product.product_photos ?? [];
  if (photos.length > 0) {
    const photoRows = photos.map((p, idx) => ({ product_id: newProductId, url: p.url, sort_order: p.sort_order ?? idx }));
    const { error: photoError } = await supabaseClient.from("product_photos").insert(photoRows);
    if (photoError) throw photoError;
  }
}

  const galleryListEl = document.getElementById("pf-gallery-list");
  const galleryAddInput = document.getElementById("pf-gallery-add-input");
  const galleryStatus = document.getElementById("pf-gallery-status");

  // Estado local da foto: null = não mexeu, "remove" = tirar a foto atual,
  // ou um Blob já redimensionado/comprimido, pronto pra enviar.
  let pendingPhoto = null;

  categoryNewField.classList.toggle("hidden", categorySelect.value !== "__new__");
  categorySelect.addEventListener("change", () => {
    categoryNewField.classList.toggle("hidden", categorySelect.value !== "__new__");
    if (categorySelect.value === "__new__") {
      categoryNewField.focus();
    } else {
      categoryNewField.value = "";
    }
  });

  materialTagNewField.classList.toggle("hidden", materialTagSelect.value !== "__new__");
  materialTagSelect.addEventListener("change", () => {
    materialTagNewField.classList.toggle("hidden", materialTagSelect.value !== "__new__");
    if (materialTagSelect.value === "__new__") {
      materialTagNewField.focus();
    } else {
      materialTagNewField.value = "";
    }
  });

  supplierNewBlock.classList.toggle("hidden", supplierSelect.value !== "__new__");
  if (supplierSelect.value === "__new__") supplierNewBlock.classList.add("flex");
  supplierSelect.addEventListener("change", () => {
    const isNew = supplierSelect.value === "__new__";
    supplierNewBlock.classList.toggle("hidden", !isNew);
    supplierNewBlock.classList.toggle("flex", isNew);
    if (isNew) {
      document.getElementById("pf-supplier-new-name").focus();
    } else {
      document.getElementById("pf-supplier-new-name").value = "";
      document.getElementById("pf-supplier-new-phone").value = "";
      document.getElementById("pf-supplier-new-instagram").value = "";
      document.getElementById("pf-supplier-new-address").value = "";
    }
  });

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files?.[0];
    if (!file) return;
    photoStatus.textContent = "Processando imagem...";
    try {
      const originalKB = file.size;
      const blob = await resizeImageToBlob(file);
      pendingPhoto = blob;
      photoPreview.src = URL.createObjectURL(blob);
      photoPreview.classList.remove("hidden");
      photoRemoveBtn.classList.remove("hidden");
      photoStatus.textContent = `Pronta pra enviar: ${formatKB(originalKB)} → ${formatKB(blob.size)} depois de comprimida.`;
    } catch (err) {
      photoStatus.textContent = "Não foi possível processar essa imagem: " + err.message;
      pendingPhoto = null;
    }
  });

  photoRemoveBtn.addEventListener("click", () => {
    pendingPhoto = "remove";
    photoInput.value = "";
    photoPreview.classList.add("hidden");
    photoRemoveBtn.classList.add("hidden");
    photoStatus.textContent = "A foto será removida ao salvar.";
  });

  const inStockBlock = document.getElementById("pf-in-stock-block");
  const inStockVariantNote = document.getElementById("pf-in-stock-variant-note");

  // Controle por quantidade (produto sem modelo): quando marcado, esconde
  // os checkboxes manuais e mostra o campo numérico — "em estoque"/
  // "esgotado" passam a ser calculados a partir dele (o banco garante
  // isso via trigger, mas já mostra a prévia aqui também).
  const stockTrackedCheckbox = document.getElementById("pf-stock-tracked");
  const stockQtyBlock = document.getElementById("pf-stock-qty-block");
  const manualStockBlock = document.getElementById("pf-manual-stock-block");
  const stockQtyField = document.getElementById("pf-stock-qty");
  const stockQtyDerivedEl = document.getElementById("pf-stock-qty-derived");
  function updateStockQtyDerived() {
    const n = Math.trunc(Number(stockQtyField.value));
    if (!Number.isFinite(n)) { stockQtyDerivedEl.textContent = ""; return; }
    stockQtyDerivedEl.textContent = n > 0 ? "→ Em estoque (pronta entrega)" : "→ Esgotado";
    stockQtyDerivedEl.className = "mt-1 text-xs " + (n > 0 ? "text-emerald-700" : "text-red-600");
  }
  stockTrackedCheckbox.addEventListener("change", () => {
    stockQtyBlock.classList.toggle("hidden", !stockTrackedCheckbox.checked);
    manualStockBlock.classList.toggle("hidden", stockTrackedCheckbox.checked);
    if (stockTrackedCheckbox.checked) updateStockQtyDerived();
  });
  stockQtyField.addEventListener("input", updateStockQtyDerived);
  if (stockTrackedCheckbox.checked) updateStockQtyDerived();

  // Quando o produto tem modelo cadastrado, o estoque é controlado por
  // modelo (logo abaixo) — o checkbox de estoque do produto some, pra
  // não dar a entender que ele ainda faz alguma coisa.
  function updateInStockBlockVisibility() {
    const hasVariants = formVariants.length > 0;
    inStockBlock.classList.toggle("hidden", hasVariants);
    inStockVariantNote.classList.toggle("hidden", !hasVariants);
  }

  function renderVariantsList() {
    variantsListEl.innerHTML = formVariants.length === 0
      ? `<p class="text-xs text-navy-400">Nenhum modelo cadastrado — deixe em branco se este produto não tiver variações.</p>`
      : formVariants.map((v, idx) => `
          <div class="flex flex-col gap-2 rounded-lg bg-white p-3 shadow-sm sm:flex-row sm:items-center">
            <img data-variant-preview="${idx}" src="${v.photoUrl ?? ""}" class="h-14 w-14 flex-shrink-0 rounded-lg border border-navy-200 bg-cream-50 object-cover ${v.photoUrl ? "" : "hidden"}" />
            <div class="flex-1">
              <input data-variant-name="${idx}" value="${escapeHtml(v.name)}" placeholder="Ex: Azul, Modelo P..."
                class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
              <label class="mt-1.5 flex items-center gap-1.5 text-xs text-navy-700">
                <input type="checkbox" data-variant-stock-tracked="${idx}" ${v.stockTracked ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
                Controlar por quantidade
              </label>
              <div data-variant-qty-block="${idx}" class="mt-1 ${v.stockTracked ? "" : "hidden"}">
                <input type="number" min="0" step="1" data-variant-qty="${idx}" value="${v.stockQty ?? 0}" class="w-24 rounded-lg border border-navy-200 px-2 py-1 text-xs outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                <span data-variant-qty-derived="${idx}" class="ml-1 text-xs ${v.stockQty > 0 ? "text-emerald-700" : "text-red-600"}">${v.stockQty > 0 ? "→ Em estoque" : "→ Esgotado"}</span>
              </div>
              <div data-variant-manual-block="${idx}" class="${v.stockTracked ? "hidden" : ""}">
                <label class="mt-1.5 flex items-center gap-1.5 text-xs text-navy-700">
                  <input type="checkbox" data-variant-in-stock="${idx}" ${v.inStock ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
                  Em estoque (pronta entrega)
                </label>
                <label class="mt-1 flex items-center gap-1.5 text-xs text-navy-700">
                  <input type="checkbox" data-variant-esgotado="${idx}" ${v.esgotado ? "checked" : ""} class="rounded border-navy-300 text-red-600 focus:ring-red-400" />
                  Esgotado
                </label>
              </div>
              <div class="mt-2 border-t border-navy-50 pt-2">
                <label class="flex items-center gap-1.5 text-xs text-navy-700">
                  <input type="checkbox" data-variant-own-price="${idx}" ${v.ownPrice ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
                  Esse modelo tem preço diferente (ex: tamanho maior/menor)
                </label>
                <div data-variant-price-block="${idx}" class="mt-1.5 flex flex-wrap items-end gap-2 ${v.ownPrice ? "" : "hidden"}">
                  <div>
                    <label class="mb-0.5 block text-[10px] font-medium text-navy-500">Custo deste modelo (R$)</label>
                    <input type="number" min="0" step="0.01" data-variant-cost="${idx}" value="${v.cost ?? ""}" class="w-24 rounded-lg border border-navy-200 px-2 py-1 text-xs outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                  </div>
                  <div>
                    <label class="mb-0.5 block text-[10px] font-medium text-navy-500">Pix/à vista manual (opcional)</label>
                    <input type="number" min="0" step="0.01" data-variant-promo-manual="${idx}" value="${v.promoManualPrice ?? ""}" placeholder="auto" class="w-24 rounded-lg border border-navy-200 px-2 py-1 text-xs outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                  </div>
                  <p data-variant-price-preview="${idx}" class="text-xs text-navy-600"></p>
                </div>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <input type="file" data-variant-photo="${idx}" accept="image/*" class="text-xs text-navy-700" />
              <button type="button" data-variant-remove-photo="${idx}" class="text-xs text-red-600 hover:underline ${v.photoUrl ? "" : "hidden"}">remover foto</button>
              <button type="button" data-variant-remove="${idx}" class="rounded border border-red-200 px-2 py-1 text-xs font-medium text-red-600 hover:bg-red-50">Remover modelo</button>
            </div>
          </div>
        `).join("");
    wireVariantRowEvents();
    updateInStockBlockVisibility();
  }

  function wireVariantRowEvents() {
    function updateVariantPricePreview(idx) {
      const v = formVariants[idx];
      const previewEl = variantsListEl.querySelector(`[data-variant-price-preview="${idx}"]`);
      if (!previewEl) return;
      if (!v.ownPrice || v.cost == null || !Number.isFinite(v.cost)) { previewEl.textContent = ""; return; }
      const pricing = v.promoManualPrice != null && Number.isFinite(v.promoManualPrice)
        ? calculatePricingFromManualPromo(v.cost, v.promoManualPrice)
        : calculatePricing(v.cost);
      previewEl.textContent = `→ Crédito ${formatBRL(pricing.creditPrice)} · Pix/à vista ${formatBRL(pricing.promoPrice)}`;
    }
    variantsListEl.querySelectorAll("[data-variant-own-price]").forEach((input) => {
      input.addEventListener("change", () => {
        const idx = Number(input.dataset.variantOwnPrice);
        formVariants[idx].ownPrice = input.checked;
        const block = variantsListEl.querySelector(`[data-variant-price-block="${idx}"]`);
        if (block) block.classList.toggle("hidden", !input.checked);
        updateVariantPricePreview(idx);
      });
    });
    variantsListEl.querySelectorAll("[data-variant-cost]").forEach((input) => {
      input.addEventListener("input", () => {
        const idx = Number(input.dataset.variantCost);
        const n = Number(input.value);
        formVariants[idx].cost = input.value === "" ? null : (Number.isFinite(n) ? n : null);
        updateVariantPricePreview(idx);
      });
    });
    variantsListEl.querySelectorAll("[data-variant-promo-manual]").forEach((input) => {
      input.addEventListener("input", () => {
        const idx = Number(input.dataset.variantPromoManual);
        const n = Number(input.value);
        formVariants[idx].promoManualPrice = input.value === "" ? null : (Number.isFinite(n) ? n : null);
        updateVariantPricePreview(idx);
      });
    });
    formVariants.forEach((v, idx) => { if (v.ownPrice) updateVariantPricePreview(idx); });
    variantsListEl.querySelectorAll("[data-variant-name]").forEach((input) => {
      input.addEventListener("input", () => {
        formVariants[Number(input.dataset.variantName)].name = input.value;
      });
    });
    variantsListEl.querySelectorAll("[data-variant-in-stock]").forEach((input) => {
      input.addEventListener("change", () => {
        formVariants[Number(input.dataset.variantInStock)].inStock = input.checked;
      });
    });
    variantsListEl.querySelectorAll("[data-variant-esgotado]").forEach((input) => {
      input.addEventListener("change", () => {
        formVariants[Number(input.dataset.variantEsgotado)].esgotado = input.checked;
      });
    });
    variantsListEl.querySelectorAll("[data-variant-stock-tracked]").forEach((input) => {
      input.addEventListener("change", () => {
        const idx = Number(input.dataset.variantStockTracked);
        formVariants[idx].stockTracked = input.checked;
        const qtyBlock = variantsListEl.querySelector(`[data-variant-qty-block="${idx}"]`);
        const manualBlock = variantsListEl.querySelector(`[data-variant-manual-block="${idx}"]`);
        if (qtyBlock) qtyBlock.classList.toggle("hidden", !input.checked);
        if (manualBlock) manualBlock.classList.toggle("hidden", input.checked);
      });
    });
    variantsListEl.querySelectorAll("[data-variant-qty]").forEach((input) => {
      input.addEventListener("input", () => {
        const idx = Number(input.dataset.variantQty);
        const n = Math.trunc(Number(input.value));
        formVariants[idx].stockQty = Number.isFinite(n) ? n : 0;
        const derivedEl = variantsListEl.querySelector(`[data-variant-qty-derived="${idx}"]`);
        if (derivedEl) {
          derivedEl.textContent = formVariants[idx].stockQty > 0 ? "→ Em estoque" : "→ Esgotado";
          derivedEl.className = "ml-1 text-xs " + (formVariants[idx].stockQty > 0 ? "text-emerald-700" : "text-red-600");
        }
      });
    });
    variantsListEl.querySelectorAll("[data-variant-photo]").forEach((input) => {
      input.addEventListener("change", async () => {
        const idx = Number(input.dataset.variantPhoto);
        const file = input.files?.[0];
        if (!file) return;
        try {
          const blob = await resizeImageToBlob(file);
          formVariants[idx].pendingPhoto = blob;
          formVariants[idx].photoUrl = URL.createObjectURL(blob);
          const previewImg = variantsListEl.querySelector(`[data-variant-preview="${idx}"]`);
          previewImg.src = formVariants[idx].photoUrl;
          previewImg.classList.remove("hidden");
          variantsListEl.querySelector(`[data-variant-remove-photo="${idx}"]`).classList.remove("hidden");
        } catch (err) {
          document.getElementById("pf-error").textContent = "Não foi possível processar a foto desse modelo: " + err.message;
        }
      });
    });
    variantsListEl.querySelectorAll("[data-variant-remove-photo]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.variantRemovePhoto);
        formVariants[idx].pendingPhoto = "remove";
        formVariants[idx].photoUrl = null;
        renderVariantsList();
      });
    });
    variantsListEl.querySelectorAll("[data-variant-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.variantRemove);
        if (formVariants[idx].originalPhotoUrl) deletedVariantPhotoUrls.push(formVariants[idx].originalPhotoUrl);
        formVariants.splice(idx, 1);
        renderVariantsList();
      });
    });
  }

  renderVariantsList();
  document.getElementById("pf-variant-add").addEventListener("click", () => {
    formVariants.push({ id: null, name: "", photoUrl: null, originalPhotoUrl: null, pendingPhoto: null, inStock: false, esgotado: false, stockTracked: false, stockQty: 0, ownPrice: false, cost: null, promoManualPrice: null });
    renderVariantsList();
  });

  // Galeria: fotos novas ficam só em memória (Blob) até o Salvar — assim
  // não sobra arquivo órfão no Storage se o admin cancelar sem salvar.
  // Não tem reordenar por arrastar: a ordem é a ordem que foi adicionada.
  function renderGalleryList() {
    galleryListEl.innerHTML = formGalleryPhotos.length === 0
      ? `<p class="text-xs text-navy-400">Nenhuma foto extra adicionada ainda.</p>`
      : formGalleryPhotos.map((g, idx) => `
          <div class="relative">
            <img src="${g.url}" class="h-20 w-20 rounded-lg border border-navy-200 bg-white object-cover" />
            <button type="button" data-gallery-remove="${idx}" class="absolute -right-2 -top-2 flex h-6 w-6 items-center justify-center rounded-full border border-red-200 bg-white text-xs font-bold text-red-600 shadow hover:bg-red-50">×</button>
          </div>
        `).join("");
    galleryListEl.querySelectorAll("[data-gallery-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.galleryRemove);
        if (formGalleryPhotos[idx].originalUrl) removedGalleryPhotoUrls.push(formGalleryPhotos[idx].originalUrl);
        formGalleryPhotos.splice(idx, 1);
        renderGalleryList();
      });
    });
  }
  renderGalleryList();

  galleryAddInput.addEventListener("change", async () => {
    const file = galleryAddInput.files?.[0];
    if (!file) return;
    galleryStatus.textContent = "Processando imagem...";
    try {
      const blob = await resizeImageToBlob(file);
      formGalleryPhotos.push({ url: URL.createObjectURL(blob), originalUrl: null, pendingPhoto: blob });
      renderGalleryList();
      galleryStatus.textContent = "Foto adicionada — será enviada ao salvar.";
    } catch (err) {
      galleryStatus.textContent = "Não foi possível processar essa imagem: " + err.message;
    }
    galleryAddInput.value = "";
  });

  function materialsTotal() {
    return formMaterials.reduce((sum, m) => sum + m.unit_cost * m.quantity, 0);
  }

  function renderMaterialsList() {
    materialsListEl.innerHTML = formMaterials.length === 0
      ? `<p class="text-xs text-navy-400">Nenhum material vinculado ainda.</p>`
      : formMaterials.map((m, idx) => `
          <div class="flex items-center justify-between rounded-lg bg-white px-3 py-1.5 text-sm shadow-sm">
            <span>${escapeHtml(m.name)} — ${m.quantity} ${escapeHtml(m.unit)} × ${formatBRL(m.unit_cost)}</span>
            <span class="flex items-center gap-3">
              <b class="text-navy-900">${formatBRL(m.unit_cost * m.quantity)}</b>
              <button type="button" data-remove-idx="${idx}" class="pf-remove-material text-red-600 hover:underline">remover</button>
            </span>
          </div>
        `).join("");
    materialsListEl.querySelectorAll(".pf-remove-material").forEach((btn) => {
      btn.addEventListener("click", () => {
        formMaterials.splice(Number(btn.dataset.removeIdx), 1);
        renderMaterialsList();
        updatePreview();
      });
    });
  }

  function manualPromoValue() {
    const raw = promoManualField.value.trim();
    if (!raw) return null;
    const n = Number(raw.replace(",", "."));
    return Number.isFinite(n) && n >= 0 ? n : null;
  }

  function updatePreview() {
    const baseCost = Number(baseCostField.value.replace(",", "."));
    if (!Number.isFinite(baseCost) || baseCost < 0) { preview.innerHTML = ""; return; }
    const totalCost = round2(baseCost + materialsTotal());
    const manualPromo = manualPromoValue();
    const p = manualPromo != null ? calculatePricingFromManualPromo(totalCost, manualPromo) : calculatePricing(totalCost);
    preview.innerHTML = `
      <span>Custo total: <b class="text-navy-900">${formatBRL(totalCost)}</b></span>
      <span>Crédito: <b class="text-navy-900">${formatBRL(p.creditPrice)}</b> (${formatPercent(p.creditMargin)})</span>
      <span>Promo/Pix: <b class="text-navy-900">${formatBRL(p.promoPrice)}</b> (${formatPercent(p.promoMargin)})${manualPromo != null ? " (manual)" : ""}</span>
    `;
  }

  baseCostField.addEventListener("input", updatePreview);
  promoManualField.addEventListener("input", updatePreview);
  renderMaterialsList();
  updatePreview();

  document.getElementById("pf-material-add").addEventListener("click", () => {
    const materialId = materialSelect.value;
    const qty = Number(materialQtyField.value.replace(",", "."));
    const errorEl = document.getElementById("pf-error");
    if (!materialId) { errorEl.textContent = "Escolha um material."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Informe uma quantidade válida."; return; }
    errorEl.textContent = "";

    const material = state.materials.find((m) => m.id === materialId);
    const existing = formMaterials.find((m) => m.material_id === materialId);
    if (existing) {
      existing.quantity = qty;
    } else {
      formMaterials.push({ material_id: material.id, name: material.name, unit: material.unit, unit_cost: Number(material.unit_cost), quantity: qty });
    }
    materialSelect.value = "";
    materialQtyField.value = "";
    renderMaterialsList();
    updatePreview();
  });

  document.getElementById("pf-cancel").addEventListener("click", () => {
    precifState.formOpen = false;
    precifState.draftFromCalc3d = null;
    renderPrecificacao(document.getElementById("main-content"));
  });

  // "Aplicar a todos": bulk-escreve o prazo digitado (dias) em TODO
  // produto cadastrado — não só o que está sendo editado agora — pra não
  // precisar abrir um por um quando o prazo muda pra loja inteira (ex:
  // fornecedor passou a demorar mais/menos pra fabricar).
  document.getElementById("pf-lead-time-apply-all").addEventListener("click", async () => {
    const msgEl = document.getElementById("pf-lead-time-msg");
    const leadTimeField = document.getElementById("pf-lead-time");
    const raw = leadTimeField.value.trim();
    const days = Math.trunc(Number(raw.replace(",", ".")));
    if (!Number.isFinite(days) || days < 0) {
      msgEl.className = "mt-1 text-xs text-red-600";
      msgEl.textContent = "Informe um número de dias válido (0 ou mais) antes de aplicar a todos.";
      return;
    }
    if (!confirm(`Aplicar ${leadTimeDaysLabel(days)} de prazo a TODOS os produtos? Isso substitui o prazo individual que já estiver configurado em cada um.`)) return;

    const applyBtn = document.getElementById("pf-lead-time-apply-all");
    applyBtn.disabled = true;
    const originalLabel = applyBtn.textContent;
    applyBtn.textContent = "Aplicando...";

    const { data, error } = await supabaseClient.from("products")
      .update({ lead_time_days: days, updated_by: state.currentUser.id, updated_at: new Date().toISOString() })
      .not("id", "is", null)
      .select("id");

    applyBtn.disabled = false;
    applyBtn.textContent = originalLabel;

    if (error) {
      msgEl.className = "mt-1 text-xs text-red-600";
      msgEl.textContent = "Não foi possível aplicar o prazo a todos os produtos: " + error.message;
      return;
    }

    await loadProducts();
    msgEl.className = "mt-1 text-xs text-emerald-700";
    msgEl.textContent = `Prazo de ${leadTimeDaysLabel(days)} aplicado a ${data?.length ?? 0} produto${(data?.length ?? 0) === 1 ? "" : "s"}.`;
  });

  document.getElementById("product-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("pf-name").value.trim();
    const baseCost = Number(baseCostField.value.replace(",", "."));
    const errorEl = document.getElementById("pf-error");
    if (!name) { errorEl.textContent = "Informe o nome do produto."; return; }
    if (!Number.isFinite(baseCost) || baseCost < 0) { errorEl.textContent = "Custo base inválido."; return; }

    const promoManualRaw = promoManualField.value.trim();
    let promoManual = null;
    if (promoManualRaw) {
      promoManual = Number(promoManualRaw.replace(",", "."));
      if (!Number.isFinite(promoManual) || promoManual < 0) { errorEl.textContent = "Promo/Pix manual inválido."; return; }
    }

    const leadTimeDays = Math.trunc(Number(document.getElementById("pf-lead-time").value.replace(",", ".")));
    if (!Number.isFinite(leadTimeDays) || leadTimeDays < 0) { errorEl.textContent = "Prazo (dias) inválido."; return; }

    const totalCost = round2(baseCost + materialsTotal());
    const pricing = promoManual != null ? calculatePricingFromManualPromo(totalCost, promoManual) : calculatePricing(totalCost);
    const showInCatalog = document.getElementById("pf-show-catalog").checked;
    const featured = document.getElementById("pf-featured").checked;

    // Estoque do PRODUTO (só vale quando não tem modelo — com modelo, quem
    // manda é o estoque de cada variação, lá embaixo). Se "controlar por
    // quantidade" estiver marcado, in_stock/esgotado saem calculados do
    // número — o banco confirma isso de novo via trigger, então mesmo se
    // esse cálculo aqui divergir por algum motivo, o valor salvo continua
    // correto.
    let inStock, esgotado, stockQty = null;
    if (formVariants.length === 0 && document.getElementById("pf-stock-tracked").checked) {
      const stockQtyRaw = document.getElementById("pf-stock-qty").value;
      stockQty = Math.trunc(Number(String(stockQtyRaw).replace(",", ".")));
      if (!Number.isFinite(stockQty) || stockQty < 0) { errorEl.textContent = "Quantidade em estoque inválida."; return; }
      inStock = stockQty > 0;
      esgotado = stockQty <= 0;
    } else {
      inStock = document.getElementById("pf-in-stock").checked;
      esgotado = document.getElementById("pf-esgotado").checked;
    }
    const categorySelected = categorySelect.value;
    if (categorySelected === "__new__" && !categoryNewField.value.trim()) {
      errorEl.textContent = "Digite o nome da nova categoria.";
      return;
    }
    const category = categorySelected === "__new__" ? categoryNewField.value.trim() : categorySelected;
    const materialTagSelected = materialTagSelect.value;
    if (materialTagSelected === "__new__" && !materialTagNewField.value.trim()) {
      errorEl.textContent = "Digite o nome da nova tag de material.";
      return;
    }
    const materialTag = materialTagSelected === "__new__" ? materialTagNewField.value.trim() : materialTagSelected;
    const description = document.getElementById("pf-description").value.trim();

    if (formVariants.some((v) => !v.name.trim())) {
      errorEl.textContent = "Preencha o nome de todos os modelos (ou remova a linha vazia).";
      return;
    }
    if (formVariants.some((v) => v.ownPrice && (v.cost == null || !Number.isFinite(v.cost) || v.cost < 0))) {
      errorEl.textContent = "Informe um custo válido pros modelos marcados com preço diferente (ou desmarque a opção).";
      return;
    }

    // Fornecedor: usa o selecionado, ou cadastra um novo antes de salvar o
    // produto (nome e telefone são obrigatórios pro fornecedor).
    let supplierId = supplierSelect.value === "__new__" ? null : (supplierSelect.value || null);
    if (supplierSelect.value === "__new__") {
      const newSupplierName = document.getElementById("pf-supplier-new-name").value.trim();
      const newSupplierPhone = document.getElementById("pf-supplier-new-phone").value.trim();
      const newSupplierInstagram = document.getElementById("pf-supplier-new-instagram").value.trim();
      const newSupplierAddress = document.getElementById("pf-supplier-new-address").value.trim();
      if (!newSupplierName || !newSupplierPhone) {
        errorEl.textContent = "Pro novo fornecedor, informe nome e telefone.";
        return;
      }
      const supplierResult = await supabaseClient.from("suppliers").insert({
        name: newSupplierName, phone: newSupplierPhone,
        instagram: newSupplierInstagram || null, address: newSupplierAddress || null,
        created_by: state.currentUser.id,
      }).select("id").single();
      if (supplierResult.error) { errorEl.textContent = "Não foi possível cadastrar o fornecedor: " + supplierResult.error.message; return; }
      supplierId = supplierResult.data.id;
    }

    // Envia a foto nova (se houver) antes de salvar o produto.
    const oldPhotoUrl = product?.photo_url ?? null;
    let newPhotoUrl = oldPhotoUrl;
    if (pendingPhoto === "remove") {
      newPhotoUrl = null;
    } else if (pendingPhoto instanceof Blob) {
      const path = `${crypto.randomUUID()}.jpg`;
      const { error: uploadError } = await supabaseClient.storage.from("product-photos").upload(path, pendingPhoto, { contentType: "image/jpeg", upsert: false });
      if (uploadError) { errorEl.textContent = "Não foi possível enviar a foto: " + uploadError.message; return; }
      newPhotoUrl = supabaseClient.storage.from("product-photos").getPublicUrl(path).data.publicUrl;
    }

    // Envia as fotos novas dos modelos (se houver) antes de salvar o produto.
    for (const v of formVariants) {
      if (v.pendingPhoto === "remove") {
        v.finalPhotoUrl = null;
      } else if (v.pendingPhoto instanceof Blob) {
        const path = `variante-${crypto.randomUUID()}.jpg`;
        const { error: variantUploadError } = await supabaseClient.storage.from("product-photos").upload(path, v.pendingPhoto, { contentType: "image/jpeg", upsert: false });
        if (variantUploadError) { errorEl.textContent = `Não foi possível enviar a foto do modelo "${v.name}": ` + variantUploadError.message; return; }
        v.finalPhotoUrl = supabaseClient.storage.from("product-photos").getPublicUrl(path).data.publicUrl;
      } else {
        v.finalPhotoUrl = v.originalPhotoUrl;
      }
      if (v.originalPhotoUrl && v.originalPhotoUrl !== v.finalPhotoUrl) {
        deletedVariantPhotoUrls.push(v.originalPhotoUrl);
      }
    }

    // Envia as fotos novas da galeria (se houver) antes de salvar o produto.
    for (const g of formGalleryPhotos) {
      if (g.pendingPhoto instanceof Blob) {
        const path = `galeria-${crypto.randomUUID()}.jpg`;
        const { error: galleryUploadError } = await supabaseClient.storage.from("product-photos").upload(path, g.pendingPhoto, { contentType: "image/jpeg", upsert: false });
        if (galleryUploadError) { errorEl.textContent = "Não foi possível enviar uma foto da galeria: " + galleryUploadError.message; return; }
        g.finalUrl = supabaseClient.storage.from("product-photos").getPublicUrl(path).data.publicUrl;
      } else {
        g.finalUrl = g.originalUrl;
      }
    }

    const payload = {
      name, base_cost: baseCost, cost: pricing.cost,
      credit_price: pricing.creditPrice, credit_net: pricing.creditNet, credit_profit: pricing.creditProfit,
      credit_markup: pricing.creditMarkup, credit_margin: pricing.creditMargin,
      promo_price: pricing.promoPrice, promo_profit: pricing.promoProfit, promo_margin: pricing.promoMargin,
      promo_manual_price: promoManual,
      photo_url: newPhotoUrl, show_in_catalog: showInCatalog, category: category || null, featured,
      in_stock: inStock, esgotado, stock_qty: stockQty, lead_time_days: leadTimeDays,
      description: description || null, material_tag: materialTag || null, supplier_id: supplierId,
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let productId = product?.id;
    if (product) {
      const result = await supabaseClient.from("products").update(payload).eq("id", product.id);
      if (result.error) { errorEl.textContent = result.error.message; return; }
    } else {
      const result = await supabaseClient.from("products").insert({ ...payload, created_by: state.currentUser.id }).select("id").single();
      if (result.error) { errorEl.textContent = result.error.message; return; }
      productId = result.data.id;
    }

    // Se trocou ou removeu a foto, apaga o arquivo antigo do Storage (evita acumular lixo).
    if (oldPhotoUrl && oldPhotoUrl !== newPhotoUrl) {
      const oldPath = oldPhotoUrl.split("/product-photos/")[1];
      if (oldPath) await supabaseClient.storage.from("product-photos").remove([oldPath]);
    }

    // Sincroniza os materiais vinculados: apaga os antigos e grava a lista atual.
    await supabaseClient.from("product_materials").delete().eq("product_id", productId);
    if (formMaterials.length > 0) {
      const rows = formMaterials.map((m) => ({ product_id: productId, material_id: m.material_id, quantity: m.quantity }));
      const { error: linkError } = await supabaseClient.from("product_materials").insert(rows);
      if (linkError) { errorEl.textContent = linkError.message; return; }
    }

    // Sincroniza os modelos/variações: apaga os antigos e grava a lista atual.
    await supabaseClient.from("product_variants").delete().eq("product_id", productId);
    if (formVariants.length > 0) {
      const variantRows = formVariants.map((v, idx) => {
        const qty = v.stockTracked ? Math.max(0, Math.trunc(Number(v.stockQty) || 0)) : null;
        // Igual ao produto: o CUSTO fica só aqui no painel (nunca é
        // exposto ao público), mas o preço de venda JÁ CALCULADO
        // (credit_price/promo_price) é salvo também — é isso que a view
        // pública do Catálogo (catalog_product_variants) vai ler, sem
        // precisar (nem poder) enxergar o custo/margem.
        let variantPricing = null;
        if (v.ownPrice && v.cost != null) {
          variantPricing = v.promoManualPrice != null
            ? calculatePricingFromManualPromo(v.cost, v.promoManualPrice)
            : calculatePricing(v.cost);
        }
        return {
          product_id: productId, name: v.name.trim(), photo_url: v.finalPhotoUrl ?? null, sort_order: idx,
          in_stock: qty != null ? qty > 0 : v.inStock,
          esgotado: qty != null ? qty <= 0 : v.esgotado,
          stock_qty: qty,
          cost: v.ownPrice && v.cost != null ? v.cost : null,
          promo_manual_price: v.ownPrice && v.promoManualPrice != null ? v.promoManualPrice : null,
          credit_price: variantPricing ? variantPricing.creditPrice : null,
          promo_price: variantPricing ? variantPricing.promoPrice : null,
        };
      });
      const { error: variantError } = await supabaseClient.from("product_variants").insert(variantRows);
      if (variantError) { errorEl.textContent = variantError.message; return; }
    }

    // Sincroniza a galeria de fotos extras: apaga as antigas e grava a lista atual.
    await supabaseClient.from("product_photos").delete().eq("product_id", productId);
    if (formGalleryPhotos.length > 0) {
      const galleryRows = formGalleryPhotos.map((g, idx) => ({ product_id: productId, url: g.finalUrl, sort_order: idx }));
      const { error: galleryError } = await supabaseClient.from("product_photos").insert(galleryRows);
      if (galleryError) { errorEl.textContent = galleryError.message; return; }
    }

    // Apaga do Storage as fotos de modelos que foram trocadas ou removidas.
    for (const url of deletedVariantPhotoUrls) {
      const oldPath = url.split("/product-photos/")[1];
      if (oldPath) await supabaseClient.storage.from("product-photos").remove([oldPath]);
    }

    // Apaga do Storage as fotos da galeria que foram removidas.
    for (const url of removedGalleryPhotoUrls) {
      const oldPath = url.split("/product-photos/")[1];
      if (oldPath) await supabaseClient.storage.from("product-photos").remove([oldPath]);
    }

    precifState.formOpen = false;
    precifState.draftFromCalc3d = null;
    if (supplierSelect.value === "__new__") await loadSuppliers();
    await loadProducts();
    renderPrecificacao(document.getElementById("main-content"));
  });
}

async function loadMaterials() {
  const { data, error } = await supabaseClient.from("materials").select("*").order("active", { ascending: false }).order("name", { ascending: true });
  if (!error) state.materials = data;
  noteLoadResult("materiais", error);
}

  function currentTypeValue() {
    return typeSelect.value === "__new__" ? typeNewField.value.trim() : typeSelect.value;
  }
  function updateQtyPerOrderVisibility() {
    qtyPerOrderField.classList.toggle("hidden", !isEssencialTypeText(currentTypeValue()));

  function updateFixedPriceVisibility() {
    fixedPriceField.classList.toggle("hidden", !isEmbalagemTypeText(currentTypeValue()));

  updateFixedPriceVisibility();

    typeNewField.classList.toggle("hidden", typeSelect.value !== "__new__");
    if (typeSelect.value === "__new__") {
      typeNewField.focus();
    } else {
      typeNewField.value = "";
    }
    updateQtyPerOrderVisibility();
    updateFixedPriceVisibility();
    updatePreview();
  });
  typeNewField.addEventListener("input", () => {
    updateQtyPerOrderVisibility();
    updateFixedPriceVisibility();
    updatePreview();
  });

  function updatePreview() {
    const price = Number(priceField.value.replace(",", "."));
    const qty = Number(qtyField.value.replace(",", "."));
    if (!Number.isFinite(price) || !Number.isFinite(qty) || qty <= 0) { preview.innerHTML = ""; return; }
    const unitCost = price / qty;
    let html = `Custo unitário: <b class="text-navy-900">${formatBRL(unitCost)}</b> / ${escapeHtml(unitSelect.value)}`;
    if (isEmbalagemTypeText(currentTypeValue())) {
      const fixedPrice = Number(fixedPriceInput.value.replace(",", "."));
      const customerPrice = Number.isFinite(fixedPrice) && fixedPriceInput.value.trim() ? fixedPrice : unitCost * (1 + GIFT_WRAP_MARKUP);
      html += ` &nbsp;·&nbsp; Preço pro cliente: <b class="text-navy-900">${formatBRL(customerPrice)}</b>${fixedPriceInput.value.trim() ? " (fixo)" : " (calculado: custo + 30%)"}`;
