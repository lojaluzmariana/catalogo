/* =====================================================================
   REGRAS DE PRECIFICAÇÃO (mesma lógica validada contra os 13 produtos
   originais da Luz Mariana — ver scripts/verify_pricing.mjs no projeto)
   ===================================================================== */
const CARD_FEE = 0.05;
const CREDIT_DIVISOR = (1 - 0.45) * (1 - CARD_FEE); // 0.5225 — margem mín. 45% no crédito
const PROMO_DIVISOR = 1 - 0.40; // 0.60 — margem mín. 40% no pix/promo

function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function niceFloor(raw) {
  const base = Math.floor(raw);
  const candidates = [base - 1 + 0.9, base + 0.0, base + 0.5, base + 0.9];
  let best = null;
  for (const c of candidates) if (c <= raw + 1e-9 && (best === null || c > best)) best = c;
  return round2(best);
}

function niceCeil(raw) {
  const base = Math.floor(raw);
  const candidates = [base + 0.0, base + 0.5, base + 0.9, base + 1.0];
  let best = null;
  for (const c of candidates) if (c >= raw - 1e-9 && (best === null || c < best)) best = c;
  return round2(best);
}

function calculatePricing(cost) {
  const creditPrice = niceFloor(cost / CREDIT_DIVISOR);
  const creditNet = round2(creditPrice * (1 - CARD_FEE));
  const creditProfit = round2(creditNet - cost);
  const creditMarkup = cost > 0 ? round2(creditNet / cost) : 0;
  const creditMargin = creditNet > 0 ? round2(creditProfit / creditNet) : 0;

  const promoPrice = niceCeil(cost / PROMO_DIVISOR);
  const promoProfit = round2(promoPrice - cost);
  const promoMargin = promoPrice > 0 ? round2(promoProfit / promoPrice) : 0;

  return {
    cost, creditPrice, creditNet, creditProfit, creditMarkup, creditMargin,
    promoPrice, promoProfit, promoMargin,
  };
}

function formatBRL(v) {
  return (v ?? 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function formatPercent(v) {
  return (v ?? 0).toLocaleString("pt-BR", { style: "percent", minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tz).toISOString().slice(0, 10);
}
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function formatKB(bytes) {
  return `${Math.round(bytes / 1024)} KB`;
}

/* ---------------------------------------------------------------------
   Redimensiona/comprime uma foto no navegador antes de enviar — evita
   fotos de celular de vários MB deixando o catálogo pesado. Reduz pro
   maior lado caber em maxDim (mantendo proporção) e exporta como JPEG.
   --------------------------------------------------------------------- */
function resizeImageToBlob(file, maxDim = 1000, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; // fundo branco (fotos com transparência viram JPEG)
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => {
        if (blob) resolve(blob); else reject(new Error("Não foi possível processar a imagem."));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Não foi possível ler a imagem.")); };
    img.src = url;
  });
}

async function enterApp() {
  const { data: authData } = await supabaseClient.auth.getUser();
  const uid = authData?.user?.id;

  const { data: profile } = await supabaseClient.from("admin_users").select("id, name").eq("id", uid).single();
  state.currentUser = profile ? { id: profile.id, name: profile.name } : { id: uid, name: state.selectedName };

  state.screen = "app";
  state.error = null;
  await Promise.all([loadMaterials(), loadProducts(), loadCustomers(), loadOrders(), loadCashEntries()]);
  render();
}

  const { data, error } = await supabaseClient
    .from("products")
    .select("*, product_materials(id, quantity, material_id, materials(id, name, unit, unit_cost))")
    .order("active", { ascending: false })
    .order("name", { ascending: true });
  if (!error) state.products = data;
  else console.error("loadProducts:", error.message);
}

                <td class="px-3 py-3 text-center">
                  <input type="checkbox" data-visible-toggle="${p.id}" ${p.show_in_catalog ? "checked" : ""} class="visible-toggle-cb h-4 w-4 rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
                </td>
                <td class="px-3 py-3 text-center">
                  <input type="checkbox" data-featured-toggle="${p.id}" ${p.featured ? "checked" : ""} class="featured-toggle-cb h-4 w-4 rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
                </td>
                <td class="px-3 py-3 text-center">
                  <div class="flex justify-center gap-2">
                    <button data-edit="${p.id}" class="edit-product-btn rounded px-2 py-1 text-xs font-medium text-navy-700 hover:bg-navy-100">Editar</button>
                    <button data-toggle="${p.id}" data-active="${p.active}" class="toggle-product-btn rounded px-2 py-1 text-xs font-medium ${p.active ? "text-red-600" : "text-emerald-700"} hover:bg-navy-100">${p.active ? "Desativar" : "Reativar"}</button>
                  </div>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById("show-inactive").addEventListener("change", (e) => {
    precifState.showInactive = e.target.checked;
    renderPrecificacao(container);
  });
  document.getElementById("new-product-btn").addEventListener("click", () => {
    precifState.editingId = null;
    precifState.formOpen = true;
    renderProductForm();
  });
  container.querySelectorAll(".edit-product-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      precifState.editingId = btn.dataset.edit;
      precifState.formOpen = true;
      renderProductForm();
    });
  });
  container.querySelectorAll(".toggle-product-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.toggle;
      const active = btn.dataset.active === "true";
      await supabaseClient.from("products").update({ active: !active, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadProducts();
      renderPrecificacao(container);
    });
  });
  container.querySelectorAll(".visible-toggle-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.visibleToggle;
      cb.disabled = true;
      await supabaseClient.from("products").update({ show_in_catalog: cb.checked, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadProducts();
      renderPrecificacao(container);
    });
  });
  container.querySelectorAll(".featured-toggle-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.featuredToggle;
      cb.disabled = true;
      await supabaseClient.from("products").update({ featured: cb.checked, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadProducts();
      renderPrecificacao(container);
    });
  });

  if (precifState.formOpen) renderProductForm();
}

function renderProductForm() {
  const slot = document.getElementById("product-form-slot");
  const product = precifState.editingId ? state.products.find((p) => p.id === precifState.editingId) : null;

  // Lista de materiais usados neste produto (estado local do formulário).
  const formMaterials = product && product.product_materials
    ? product.product_materials.map((pm) => ({
        material_id: pm.material_id,
        name: pm.materials?.name ?? "(material removido)",
        unit: pm.materials?.unit ?? "un",
        unit_cost: Number(pm.materials?.unit_cost ?? 0),
        quantity: Number(pm.quantity),
      }))
    : [];

  const activeMaterials = state.materials.filter((m) => m.active);

  slot.innerHTML = `
    <form id="product-form" class="flex flex-col gap-4 rounded-xl border border-gold-300 bg-white p-5 shadow">
      <div class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end">
        <div class="min-w-[220px] flex-1">
          <label class="mb-1 block text-sm font-medium text-navy-800">Nome do produto</label>
          <input id="pf-name" value="${product ? escapeHtml(product.name) : ""}" required
            class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
            placeholder="Ex: Chaveiro Nossa Senhora" />
        </div>
        <div class="w-full sm:w-48">
          <label class="mb-1 block text-sm font-medium text-navy-800">Custo base (R$)</label>
          <input id="pf-base-cost" value="${product ? product.base_cost : "0"}" required inputmode="decimal"
            class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
            placeholder="0,00" />
          <p class="mt-1 text-xs text-navy-400">O custo do item em si, sem contar os materiais abaixo.</p>
        </div>
        <div class="w-full sm:w-56">
          <label class="mb-1 block text-sm font-medium text-navy-800">Categoria (opcional)</label>
          <input id="pf-category" list="pf-category-list" value="${product?.category ? escapeHtml(product.category) : ""}"
            class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
            placeholder="Ex: Terços, Imagens, Velas" />
          <datalist id="pf-category-list">
            ${[...new Set(state.products.map((p) => p.category).filter(Boolean))].map((c) => `<option value="${escapeHtml(c)}"></option>`).join("")}
          </datalist>
          <p class="mt-1 text-xs text-navy-400">Usada pra agrupar os produtos no Catálogo público.</p>
        </div>
      </div>

      <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
        <p class="mb-2 text-sm font-medium text-navy-800">Foto (opcional — usada no Catálogo)</p>
        <div class="flex flex-wrap items-center gap-4">
          <img id="pf-photo-preview" src="${product?.photo_url ?? ""}" class="h-20 w-20 rounded-lg border border-navy-200 bg-white object-cover ${product?.photo_url ? "" : "hidden"}" />
          <div class="flex flex-col gap-1">
            <input type="file" id="pf-photo-input" accept="image/*" class="text-sm text-navy-700" />
            <p id="pf-photo-status" class="text-xs text-navy-400">A foto é redimensionada e comprimida automaticamente antes de enviar.</p>
            <button type="button" id="pf-photo-remove" class="self-start text-xs text-red-600 hover:underline ${product?.photo_url ? "" : "hidden"}">remover foto</button>
          </div>
        </div>
        <label class="mt-3 flex items-center gap-2 text-sm text-navy-700">
          <input type="checkbox" id="pf-show-catalog" ${product?.show_in_catalog ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
          Mostrar este produto no Catálogo público
        </label>
        <label class="mt-2 flex items-center gap-2 text-sm text-navy-700">
          <input type="checkbox" id="pf-featured" ${product?.featured ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
          Produto em destaque (aparece numa vitrine especial no topo do Catálogo)
        </label>
      </div>

      <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
        <p class="mb-2 text-sm font-medium text-navy-800">Materiais usados (opcional)</p>
        <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-end">
          <div class="min-w-[200px] flex-1">
            <label class="mb-1 block text-xs font-medium text-navy-700">Material</label>
            <select id="pf-material-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
              <option value="">— selecione —</option>
              ${activeMaterials.map((m) => `<option value="${m.id}">${escapeHtml(m.name)} (${formatBRL(m.unit_cost)}/${escapeHtml(m.unit)})</option>`).join("")}
            </select>
          </div>
          <div class="w-full sm:w-32">
            <label class="mb-1 block text-xs font-medium text-navy-700">Quantidade</label>
            <input id="pf-material-qty" inputmode="decimal" placeholder="1" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
          </div>
          <button type="button" id="pf-material-add" class="w-full rounded-lg border border-navy-300 px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100 sm:w-auto">+ Adicionar</button>
        </div>
        <div id="pf-materials-list" class="mt-3 flex flex-col gap-1"></div>
      </div>

      <div id="pf-preview" class="flex flex-wrap gap-x-6 gap-y-1 rounded-lg bg-cream-50 px-4 py-2 text-xs text-navy-600"></div>
      <div id="pf-error" class="text-sm text-red-600"></div>
      <div class="flex gap-2">
        <button type="submit" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">Salvar</button>
        <button type="button" id="pf-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
      </div>
    </form>
  `;

  const baseCostField = document.getElementById("pf-base-cost");
  const materialSelect = document.getElementById("pf-material-select");
  const materialQtyField = document.getElementById("pf-material-qty");
  const materialsListEl = document.getElementById("pf-materials-list");
  const preview = document.getElementById("pf-preview");
  const photoInput = document.getElementById("pf-photo-input");
  const photoPreview = document.getElementById("pf-photo-preview");
  const photoStatus = document.getElementById("pf-photo-status");
  const photoRemoveBtn = document.getElementById("pf-photo-remove");

  // Estado local da foto: null = não mexeu, "remove" = tirar a foto atual,
  // ou um Blob já redimensionado/comprimido, pronto pra enviar.
  let pendingPhoto = null;

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files?.[0];
    if (!file) return;
    photoStatus.textContent = "Processando imagem...";
    try {
      const originalKB = file.size;
      const blob = await resizeImageToBlob(file);
      pendingPhoto = blob;
      photoPreview.src = URL.createObjectURL(blob);
      photoPreview.classList.remove("hidden");
      photoRemoveBtn.classList.remove("hidden");
      photoStatus.textContent = `Pronta pra enviar: ${formatKB(originalKB)} → ${formatKB(blob.size)} depois de comprimida.`;
    } catch (err) {
      photoStatus.textContent = "Não foi possível processar essa imagem: " + err.message;
      pendingPhoto = null;
    }
  });

  photoRemoveBtn.addEventListener("click", () => {
    pendingPhoto = "remove";
    photoInput.value = "";
    photoPreview.classList.add("hidden");
    photoRemoveBtn.classList.add("hidden");
    photoStatus.textContent = "A foto será removida ao salvar.";
  });

  function materialsTotal() {
    return formMaterials.reduce((sum, m) => sum + m.unit_cost * m.quantity, 0);
  }

  function renderMaterialsList() {
    materialsListEl.innerHTML = formMaterials.length === 0
      ? `<p class="text-xs text-navy-400">Nenhum material vinculado ainda.</p>`
      : formMaterials.map((m, idx) => `
          <div class="flex items-center justify-between rounded-lg bg-white px-3 py-1.5 text-sm shadow-sm">
            <span>${escapeHtml(m.name)} — ${m.quantity} ${escapeHtml(m.unit)} × ${formatBRL(m.unit_cost)}</span>
            <span class="flex items-center gap-3">
              <b class="text-navy-900">${formatBRL(m.unit_cost * m.quantity)}</b>
              <button type="button" data-remove-idx="${idx}" class="pf-remove-material text-red-600 hover:underline">remover</button>
            </span>
          </div>
        `).join("");
    materialsListEl.querySelectorAll(".pf-remove-material").forEach((btn) => {
      btn.addEventListener("click", () => {
        formMaterials.splice(Number(btn.dataset.removeIdx), 1);
        renderMaterialsList();
        updatePreview();
      });
    });
  }

  function updatePreview() {
    const baseCost = Number(baseCostField.value.replace(",", "."));
    if (!Number.isFinite(baseCost) || baseCost < 0) { preview.innerHTML = ""; return; }
    const totalCost = round2(baseCost + materialsTotal());
    const p = calculatePricing(totalCost);
    preview.innerHTML = `
      <span>Custo total: <b class="text-navy-900">${formatBRL(totalCost)}</b></span>
      <span>Crédito: <b class="text-navy-900">${formatBRL(p.creditPrice)}</b> (${formatPercent(p.creditMargin)})</span>
      <span>Promo/Pix: <b class="text-navy-900">${formatBRL(p.promoPrice)}</b> (${formatPercent(p.promoMargin)})</span>
    `;
  }

  baseCostField.addEventListener("input", updatePreview);
  renderMaterialsList();
  updatePreview();

  document.getElementById("pf-material-add").addEventListener("click", () => {
    const materialId = materialSelect.value;
    const qty = Number(materialQtyField.value.replace(",", "."));
    const errorEl = document.getElementById("pf-error");
    if (!materialId) { errorEl.textContent = "Escolha um material."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Informe uma quantidade válida."; return; }
    errorEl.textContent = "";

    const material = state.materials.find((m) => m.id === materialId);
    const existing = formMaterials.find((m) => m.material_id === materialId);
    if (existing) {
      existing.quantity = qty;
    } else {
      formMaterials.push({ material_id: material.id, name: material.name, unit: material.unit, unit_cost: Number(material.unit_cost), quantity: qty });
    }
    materialSelect.value = "";
    materialQtyField.value = "";
    renderMaterialsList();
    updatePreview();
  });

  document.getElementById("pf-cancel").addEventListener("click", () => {
    precifState.formOpen = false;
    renderPrecificacao(document.getElementById("main-content"));
  });

  document.getElementById("product-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("pf-name").value.trim();
    const baseCost = Number(baseCostField.value.replace(",", "."));
    const errorEl = document.getElementById("pf-error");
    if (!name) { errorEl.textContent = "Informe o nome do produto."; return; }
    if (!Number.isFinite(baseCost) || baseCost < 0) { errorEl.textContent = "Custo base inválido."; return; }

    const totalCost = round2(baseCost + materialsTotal());
    const pricing = calculatePricing(totalCost);
    const showInCatalog = document.getElementById("pf-show-catalog").checked;
    const featured = document.getElementById("pf-featured").checked;
    const category = document.getElementById("pf-category").value.trim();

    // Envia a foto nova (se houver) antes de salvar o produto.
    const oldPhotoUrl = product?.photo_url ?? null;
    let newPhotoUrl = oldPhotoUrl;
    if (pendingPhoto === "remove") {
      newPhotoUrl = null;
    } else if (pendingPhoto instanceof Blob) {
      const path = `${crypto.randomUUID()}.jpg`;
      const { error: uploadError } = await supabaseClient.storage.from("product-photos").upload(path, pendingPhoto, { contentType: "image/jpeg", upsert: false });
      if (uploadError) { errorEl.textContent = "Não foi possível enviar a foto: " + uploadError.message; return; }
      newPhotoUrl = supabaseClient.storage.from("product-photos").getPublicUrl(path).data.publicUrl;
    }

    const payload = {
      name, base_cost: baseCost, cost: pricing.cost,
      credit_price: pricing.creditPrice, credit_net: pricing.creditNet, credit_profit: pricing.creditProfit,
      credit_markup: pricing.creditMarkup, credit_margin: pricing.creditMargin,
      promo_price: pricing.promoPrice, promo_profit: pricing.promoProfit, promo_margin: pricing.promoMargin,
      photo_url: newPhotoUrl, show_in_catalog: showInCatalog, category: category || null, featured,
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let productId = product?.id;
    if (product) {
      const result = await supabaseClient.from("products").update(payload).eq("id", product.id);
      if (result.error) { errorEl.textContent = result.error.message; return; }
    } else {
      const result = await supabaseClient.from("products").insert({ ...payload, created_by: state.currentUser.id }).select("id").single();
      if (result.error) { errorEl.textContent = result.error.message; return; }
      productId = result.data.id;
    }

    // Se trocou ou removeu a foto, apaga o arquivo antigo do Storage (evita acumular lixo).
    if (oldPhotoUrl && oldPhotoUrl !== newPhotoUrl) {
      const oldPath = oldPhotoUrl.split("/product-photos/")[1];
      if (oldPath) await supabaseClient.storage.from("product-photos").remove([oldPath]);
    }

    // Sincroniza os materiais vinculados: apaga os antigos e grava a lista atual.
    await supabaseClient.from("product_materials").delete().eq("product_id", productId);
    if (formMaterials.length > 0) {
      const rows = formMaterials.map((m) => ({ product_id: productId, material_id: m.material_id, quantity: m.quantity }));
      const { error: linkError } = await supabaseClient.from("product_materials").insert(rows);
      if (linkError) { errorEl.textContent = linkError.message; return; }
    }

    precifState.formOpen = false;
    await loadProducts();
    renderPrecificacao(document.getElementById("main-content"));
  });
}

async function loadMaterials() {
  const { data, error } = await supabaseClient.from("materials").select("*").order("active", { ascending: false }).order("name", { ascending: true });
  if (!error) state.materials = data;
  else console.error("loadMaterials:", error.message);
}

          placeholder="Ex: 50" />
      </div>
      <div class="w-full sm:w-28">
        <label class="mb-1 block text-sm font-medium text-navy-800">Unidade</label>
        <select id="mf-unit" class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
          ${["un", "g", "m", "cm", "kg", "l"].map((u) => `<option value="${u}" ${material?.unit === u ? "selected" : ""}>${u}</option>`).join("")}
        </select>
      </div>
      <div class="w-full sm:w-32">
        <label class="mb-1 block text-sm font-medium text-navy-800">Estoque atual</label>
        <input id="mf-stock" value="${material ? Number(material.stock_qty) : "0"}" required inputmode="decimal"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="0" />
        <p class="mt-1 text-xs text-navy-400">Some aqui quando comprar mais.</p>
      </div>
      <div id="mf-preview" class="flex flex-1 min-w-[180px] items-center rounded-lg bg-cream-50 px-4 py-2 text-xs text-navy-600"></div>
      <div id="mf-error" class="w-full text-sm text-red-600"></div>
      <div class="flex gap-2">
        <button type="submit" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">Salvar</button>
        <button type="button" id="mf-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
      </div>
    </form>
  `;

  const priceField = document.getElementById("mf-price");
  const qtyField = document.getElementById("mf-qty");
  const preview = document.getElementById("mf-preview");
  const unitSelect = document.getElementById("mf-unit");

  function updatePreview() {
    const price = Number(priceField.value.replace(",", "."));
    const qty = Number(qtyField.value.replace(",", "."));
    if (!Number.isFinite(price) || !Number.isFinite(qty) || qty <= 0) { preview.innerHTML = ""; return; }
    const unitCost = price / qty;
    preview.innerHTML = `Custo unitário: <b class="text-navy-900">${formatBRL(unitCost)}</b> / ${escapeHtml(unitSelect.value)}`;
  }
  priceField.addEventListener("input", updatePreview);
  qtyField.addEventListener("input", updatePreview);
  unitSelect.addEventListener("change", updatePreview);
  updatePreview();

  document.getElementById("mf-cancel").addEventListener("click", () => {
    materiaisState.formOpen = false;
    renderMateriais(document.getElementById("main-content"));
  });

  document.getElementById("material-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("mf-name").value.trim();
    const price = Number(priceField.value.replace(",", "."));
    const qty = Number(qtyField.value.replace(",", "."));
    const unit = unitSelect.value;
    const stock = Number(document.getElementById("mf-stock").value.replace(",", "."));
    const errorEl = document.getElementById("mf-error");
    if (!name) { errorEl.textContent = "Informe o nome do material."; return; }
    if (!Number.isFinite(price) || price < 0) { errorEl.textContent = "Preço inválido."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Quantidade inválida."; return; }
    if (!Number.isFinite(stock) || stock < 0) { errorEl.textContent = "Estoque inválido."; return; }

    const payload = {
      name, package_price: price, package_qty: qty, unit, stock_qty: stock,
      unit_cost: Math.round((price / qty) * 10000) / 10000, // 4 casas de precisão
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let result;
    if (material) {
      result = await supabaseClient.from("materials").update(payload).eq("id", material.id);
    } else {
      result = await supabaseClient.from("materials").insert({ ...payload, created_by: state.currentUser.id });
    }

    if (result.error) { errorEl.textContent = result.error.message; return; }

    materiaisState.formOpen = false;
    await loadMaterials();
    renderMateriais(document.getElementById("main-content"));
  });
}

const ORDER_STATUS_LABELS = { novo: "Novo", em_andamento: "Em andamento", concluido: "Concluído", cancelado: "Cancelado" };
const ORDER_STATUS_CLASSES = {
  novo: "bg-red-100 text-red-700",
  em_andamento: "bg-gold-100 text-gold-800",
  concluido: "bg-emerald-100 text-emerald-800",
  cancelado: "bg-navy-100 text-navy-500",
};

function waLink(phone) {
  const digits = String(phone ?? "").replace(/\D/g, "");
  return digits ? `https://wa.me/${digits}` : null;
}

async function loadOrders() {
  const { data, error } = await supabaseClient.from("orders").select("*").order("created_at", { ascending: false });
  if (error) { console.error("loadOrders:", error.message); return; }

  const { data: items, error: err2 } = await supabaseClient.from("order_items").select("*");
  if (err2) console.error("loadOrders itens:", err2.message);

  const byOrder = {};
  (items || []).forEach((row) => { (byOrder[row.order_id] ||= []).push(row); });
  state.orders = data.map((o) => ({ ...o, items: byOrder[o.id] || [] }));
}

      if (error) { alert("Não foi possível atualizar o status: " + error.message); }

async function loadCashEntries() {
  const { data, error } = await supabaseClient.from("cash_entries_with_balance").select("*").order("entry_date", { ascending: false }).order("created_at", { ascending: false });
  if (error) { console.error("loadCashEntries:", error.message); return; }

  const { data: materialsUsed, error: err2 } = await supabaseClient
    .from("cash_entry_materials")
    .select("cash_entry_id, quantity, unit_cost, materials(id, name, unit)");
  if (err2) console.error("loadCashEntries materiais:", err2.message);

  const byEntry = {};
  (materialsUsed || []).forEach((row) => {
    (byEntry[row.cash_entry_id] ||= []).push(row);
  });
  state.cashEntries = data.map((e) => ({ ...e, materials_used: byEntry[e.id] || [] }));
}

  container.innerHTML = `

        <button id="new-entry-btn" class="rounded-lg bg-gold-500 px-4 py-2 text-sm font-semibold text-navy-900 shadow transition hover:bg-gold-400">${caixaState.formOpen ? "Fechar" : "+ Novo lançamento"}</button>

          <p class="text-xs uppercase tracking-wide opacity-80">Entradas do mês</p>
          <p class="mt-1 text-2xl font-semibold">${formatBRL(monthIn)}</p>
        </div>
        <div class="rounded-xl border border-red-200 bg-red-50 px-5 py-4 text-red-700 shadow">
          <p class="text-xs uppercase tracking-wide opacity-80">Saídas do mês</p>
          <p class="mt-1 text-2xl font-semibold">${formatBRL(monthOut)}</p>
        </div>
      </div>

      <div id="entry-form-slot"></div>

      <div class="overflow-x-auto rounded-xl border border-navy-100 bg-white shadow">
        <table class="w-full min-w-[820px] text-sm">
          <thead>
            <tr class="border-b border-navy-100 bg-navy-900 text-left text-xs uppercase tracking-wide text-cream-50">
              <th class="px-3 py-3">Data</th>
              <th class="px-3 py-3">Tipo</th>
              <th class="px-3 py-3">Categoria</th>
              <th class="px-3 py-3">Descrição</th>
              <th class="px-3 py-3">Pagamento</th>
              <th class="px-3 py-3 text-right">Valor</th>
              <th class="px-3 py-3 text-right">Saldo</th>
              <th class="px-3 py-3 text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            ${entries.length === 0 ? `<tr><td colspan="8" class="px-4 py-8 text-center text-navy-400">Nenhum lançamento ainda.</td></tr>` : entries.map((e) => `
              <tr class="border-b border-navy-50 last:border-0 hover:bg-cream-50">
                <td class="px-3 py-2.5">${formatDate(e.entry_date)}</td>
                <td class="px-3 py-2.5"><span class="rounded-full px-2 py-0.5 text-xs font-medium ${e.entry_type === "entrada" ? "bg-emerald-100 text-emerald-800" : "bg-red-100 text-red-700"}">${e.entry_type === "entrada" ? "Entrada" : "Saída"}</span></td>
                <td class="px-3 py-2.5">${escapeHtml(e.category) || "—"}</td>
                <td class="px-3 py-2.5 text-navy-600">
                  ${escapeHtml(e.description) || "—"}
                  ${e.customer_id ? `<div class="mt-0.5 text-xs font-normal text-navy-400">Cliente: ${escapeHtml(state.customers.find((c) => c.id === e.customer_id)?.name ?? "(removido)")}</div>` : ""}
                  ${e.materials_used && e.materials_used.length > 0 ? `<div class="mt-0.5 text-xs font-normal text-navy-400">Materiais: ${e.materials_used.map((mu) => `${escapeHtml(mu.materials?.name ?? "(material removido)")} (${Number(mu.quantity)} ${escapeHtml(mu.materials?.unit ?? "")})`).join(", ")}</div>` : ""}
                </td>
                <td class="px-3 py-2.5 capitalize">${escapeHtml(e.payment_method) || "—"}</td>
                <td class="px-3 py-2.5 text-right font-medium ${e.entry_type === "entrada" ? "text-emerald-700" : "text-red-700"}">${e.entry_type === "entrada" ? "+" : "-"}${formatBRL(e.amount)}</td>
                <td class="px-3 py-2.5 text-right font-semibold text-navy-900">${formatBRL(e.running_balance)}</td>
                <td class="px-3 py-2.5 text-center">
                  <div class="flex justify-center gap-2">
                    <button data-edit="${e.id}" class="edit-entry-btn rounded px-2 py-1 text-xs font-medium text-navy-700 hover:bg-navy-100">Editar</button>
                    <button data-delete="${e.id}" class="delete-entry-btn rounded px-2 py-1 text-xs font-medium text-red-600 hover:bg-red-50">Excluir</button>
                  </div>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById("new-entry-btn").addEventListener("click", () => {
    caixaState.editingId = null;
    caixaState.formOpen = !caixaState.formOpen;
    renderCaixa(container);
  });
  container.querySelectorAll(".edit-entry-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      caixaState.editingId = btn.dataset.edit;
      caixaState.formOpen = true;
      renderCaixa(container);
    });
  });
  container.querySelectorAll(".delete-entry-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Excluir este lançamento? Se tinha materiais vinculados, eles voltam pro estoque.")) return;
      await supabaseClient.from("cash_entries").delete().eq("id", btn.dataset.delete);
      if (caixaState.editingId === btn.dataset.delete) { caixaState.editingId = null; caixaState.formOpen = false; }
      await Promise.all([loadCashEntries(), loadMaterials()]);
      renderCaixa(container);
    });
  });

  if (caixaState.formOpen) {
    const editingEntry = caixaState.editingId ? entries.find((e) => e.id === caixaState.editingId) : null;
    renderEntryForm(activeProducts, editingEntry);
  }
}

function renderEntryForm(products, editingEntry) {
  const slot = document.getElementById("entry-form-slot");
  const CATEGORY_SUGGESTIONS = ["Venda", "Material/Insumos", "Frete", "Embalagem", "Marketing", "Outros"];
  let entryType = editingEntry?.entry_type ?? "entrada";
  const hideEntrada = entryType !== "entrada" ? "hidden" : "";

  slot.innerHTML = `
    <form id="entry-form" class="flex flex-col gap-4 rounded-xl border border-gold-300 bg-white p-5 shadow">
      ${editingEntry ? `<p class="text-xs font-medium uppercase tracking-wide text-gold-600">Editando lançamento</p>` : ""}
      <div class="flex flex-wrap gap-4">
        <div class="flex gap-2">
          <button type="button" data-type="entrada" class="entry-type-btn rounded-lg px-4 py-2 text-sm font-medium ${entryType === "entrada" ? "bg-emerald-600 text-white" : "border border-navy-200 text-navy-600 hover:bg-navy-50"}">Entrada</button>
          <button type="button" data-type="saida" class="entry-type-btn rounded-lg px-4 py-2 text-sm font-medium ${entryType === "saida" ? "bg-red-600 text-white" : "border border-navy-200 text-navy-600 hover:bg-navy-50"}">Saída</button>
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-navy-700">Data</label>
          <input type="date" id="ef-date" value="${editingEntry?.entry_date ?? todayISO()}" class="rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
        </div>
      </div>

      <div id="ef-entrada-fields" class="flex flex-wrap gap-4 ${hideEntrada}">
        <div class="min-w-[220px] flex-1">
          <label class="mb-1 block text-xs font-medium text-navy-700">Produto (opcional)</label>
          <select id="ef-product" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
            <option value="">— lançamento manual —</option>
            ${products.map((p) => `<option value="${p.id}" ${p.id === editingEntry?.product_id ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-navy-700">Pagamento</label>
          <select id="ef-payment" class="rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
            <option value="pix" ${(editingEntry?.payment_method ?? "pix") === "pix" ? "selected" : ""}>Pix</option>
            <option value="dinheiro" ${editingEntry?.payment_method === "dinheiro" ? "selected" : ""}>Dinheiro</option>
            <option value="credito" ${editingEntry?.payment_method === "credito" ? "selected" : ""}>Crédito</option>
            <option value="outro" ${editingEntry?.payment_method === "outro" ? "selected" : ""}>Outro</option>
          </select>
        </div>
        <p id="ef-suggested" class="self-end pb-2 text-xs text-navy-500"></p>
      </div>

      <div id="ef-customer-box" class="rounded-lg border border-navy-100 bg-cream-50 p-4 ${hideEntrada}">
        <p class="mb-2 text-sm font-medium text-navy-800">Cliente (opcional)</p>
        <div class="flex flex-wrap items-end gap-3">
          <div class="min-w-[220px] flex-1">
            <select id="ef-customer" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
              <option value="">— sem cliente —</option>
              ${state.customers.filter((c) => c.active).map((c) => `<option value="${c.id}" ${c.id === editingEntry?.customer_id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
              <option value="__new__">+ Novo cliente...</option>
            </select>
          </div>
        </div>
        <div id="ef-new-customer-fields" class="mt-3 hidden flex-wrap gap-3 sm:flex">
          <div class="min-w-[180px] flex-1">
            <label class="mb-1 block text-xs font-medium text-navy-700">Nome</label>
            <input id="ef-new-customer-name" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="Nome do cliente" />
          </div>
          <div class="min-w-[150px]">
            <label class="mb-1 block text-xs font-medium text-navy-700">WhatsApp</label>
            <input id="ef-new-customer-whatsapp" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="(11) 91234-5678" />
          </div>
          <div class="min-w-[150px]">
            <label class="mb-1 block text-xs font-medium text-navy-700">Instagram</label>
            <input id="ef-new-customer-instagram" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="@usuario" />
          </div>
        </div>
      </div>

      <div id="ef-materials-box" class="rounded-lg border border-navy-100 bg-cream-50 p-4 ${hideEntrada}">
        <p class="mb-2 text-sm font-medium text-navy-800">Materiais usados nesta venda (opcional)</p>
        <p class="mb-2 text-xs text-navy-500">Além do que já está no produto — some ao valor da venda e desconta do estoque.</p>
        <div class="flex flex-wrap items-end gap-3">
          <div class="min-w-[200px] flex-1">
            <label class="mb-1 block text-xs font-medium text-navy-700">Material</label>
            <select id="ef-material-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
              <option value="">— selecione —</option>
              ${state.materials.filter((m) => m.active).map((m) => `<option value="${m.id}">${escapeHtml(m.name)} (${formatBRL(m.unit_cost)}/${escapeHtml(m.unit)} — estoque: ${Number(m.stock_qty)})</option>`).join("")}
            </select>
          </div>
          <div class="w-full sm:w-32">
            <label class="mb-1 block text-xs font-medium text-navy-700">Quantidade</label>
            <input id="ef-material-qty" inputmode="decimal" placeholder="1" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
          </div>
          <button type="button" id="ef-material-add" class="w-full rounded-lg border border-navy-300 px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100 sm:w-auto">+ Adicionar</button>
        </div>
        <div id="ef-materials-list" class="mt-3 flex flex-col gap-1"></div>
      </div>

      <div class="flex flex-wrap gap-4">
        <div class="w-full sm:w-40">
          <label class="mb-1 block text-xs font-medium text-navy-700">Valor (R$)</label>
          <input id="ef-amount" value="${editingEntry ? Number(editingEntry.amount) : ""}" required inputmode="decimal" placeholder="0,00" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
        </div>
        <div class="min-w-[180px]">
          <label class="mb-1 block text-xs font-medium text-navy-700">Categoria</label>
          <input id="ef-category" value="${editingEntry ? escapeHtml(editingEntry.category || "") : ""}" list="category-suggestions" placeholder="Ex: Venda, Material..." class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
          <datalist id="category-suggestions">${CATEGORY_SUGGESTIONS.map((c) => `<option value="${c}">`).join("")}</datalist>
        </div>
        <div class="min-w-[220px] flex-1">
          <label class="mb-1 block text-xs font-medium text-navy-700">Descrição</label>
          <input id="ef-description" value="${editingEntry ? escapeHtml(editingEntry.description || "") : ""}" placeholder="Detalhe do lançamento" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
        </div>
      </div>

      <div id="ef-error" class="text-sm text-red-600"></div>

      <div class="flex gap-2">
        <button type="submit" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">${editingEntry ? "Salvar alterações" : "Salvar lançamento"}</button>
        <button type="button" id="ef-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
      </div>
    </form>
  `;

  const entradaFields = document.getElementById("ef-entrada-fields");
  const materialsBox = document.getElementById("ef-materials-box");
  const customerBox = document.getElementById("ef-customer-box");
  const productSelect = document.getElementById("ef-product");
  const paymentSelect = document.getElementById("ef-payment");
  const amountField = document.getElementById("ef-amount");
  // Evita sobrescrever um valor que a pessoa já digitou/corrigiu manualmente
  // (importante ao editar um lançamento — não pode "voltar" o valor sozinho).
  let amountTouchedByUser = !!editingEntry;
  amountField.addEventListener("input", () => { amountTouchedByUser = true; });
  const categoryField = document.getElementById("ef-category");
  const descriptionField = document.getElementById("ef-description");
  const suggested = document.getElementById("ef-suggested");
  const materialSelect = document.getElementById("ef-material-select");
  const materialQtyField = document.getElementById("ef-material-qty");
  const materialsListEl = document.getElementById("ef-materials-list");
  const customerSelect = document.getElementById("ef-customer");
  const newCustomerFields = document.getElementById("ef-new-customer-fields");
  const newCustomerNameField = document.getElementById("ef-new-customer-name");

  customerSelect.addEventListener("change", () => {
    newCustomerFields.classList.toggle("hidden", customerSelect.value !== "__new__");
    newCustomerFields.classList.toggle("flex", customerSelect.value === "__new__");
  });

  // Materiais usados nesta venda (estado local do formulário).
  const entryMaterials = (editingEntry?.materials_used ?? []).map((mu) => ({
    material_id: mu.material_id,
    name: mu.materials?.name ?? "(material removido)",
    unit: mu.materials?.unit ?? "un",
    unit_cost: Number(mu.unit_cost),
    quantity: Number(mu.quantity),
  }));

  function materialsTotal() {
    return entryMaterials.reduce((sum, m) => sum + m.unit_cost * m.quantity, 0);
  }

  function renderEntryMaterialsList() {
    materialsListEl.innerHTML = entryMaterials.length === 0
      ? `<p class="text-xs text-navy-400">Nenhum material adicionado ainda.</p>`
      : entryMaterials.map((m, idx) => `
          <div class="flex items-center justify-between rounded-lg bg-white px-3 py-1.5 text-sm shadow-sm">
            <span>${escapeHtml(m.name)} — ${m.quantity} ${escapeHtml(m.unit)} × ${formatBRL(m.unit_cost)}</span>
            <span class="flex items-center gap-3">
              <b class="text-navy-900">${formatBRL(m.unit_cost * m.quantity)}</b>
              <button type="button" data-remove-idx="${idx}" class="ef-remove-material text-red-600 hover:underline">remover</button>
            </span>
          </div>
        `).join("");
    materialsListEl.querySelectorAll(".ef-remove-material").forEach((btn) => {
      btn.addEventListener("click", () => {
        entryMaterials.splice(Number(btn.dataset.removeIdx), 1);
        renderEntryMaterialsList();
        applyProductPrice();
      });
    });
  }

  function applyProductPrice() {
    const product = products.find((p) => p.id === productSelect.value);
    const matTotal = materialsTotal();
    if (!product) {
      suggested.textContent = matTotal > 0 ? `Materiais adicionados: ${formatBRL(matTotal)} — some ao valor acima se ainda não somou.` : "";
      return;
    }
    const price = paymentSelect.value === "credito" ? product.credit_price : product.promo_price;
    const total = round2(price + matTotal);
    if (!amountTouchedByUser) {
      amountField.value = String(total);
      if (!categoryField.value) categoryField.value = "Venda";
      if (!descriptionField.value) descriptionField.value = product.name;
    }
    const suggestionLine = matTotal > 0
      ? `Preço sugerido: <b>${formatBRL(price)}</b> + materiais <b>${formatBRL(matTotal)}</b> = <b>${formatBRL(total)}</b>`
      : `Preço sugerido: <b>${formatBRL(price)}</b>`;
    suggested.innerHTML = amountTouchedByUser
      ? `${suggestionLine} — o valor acima não foi alterado automaticamente porque você já digitou um valor; ajuste manualmente se quiser usar o sugerido.`
      : `${suggestionLine} — ajuste o valor acima se vendeu por outro preço.`;
  }
  productSelect.addEventListener("change", applyProductPrice);
  paymentSelect.addEventListener("change", applyProductPrice);

  document.getElementById("ef-material-add").addEventListener("click", () => {
    const materialId = materialSelect.value;
    const qty = Number(materialQtyField.value.replace(",", "."));
    const errorEl = document.getElementById("ef-error");
    if (!materialId) { errorEl.textContent = "Escolha um material."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Informe uma quantidade válida."; return; }
    errorEl.textContent = "";

    const material = state.materials.find((m) => m.id === materialId);
    const existing = entryMaterials.find((m) => m.material_id === materialId);
    if (existing) {
      existing.quantity = qty;
    } else {
      entryMaterials.push({ material_id: material.id, name: material.name, unit: material.unit, unit_cost: Number(material.unit_cost), quantity: qty });
    }
    materialSelect.value = "";
    materialQtyField.value = "";
    renderEntryMaterialsList();
    applyProductPrice();
  });

  renderEntryMaterialsList();

  container_setEntryTypeButtons();
  function container_setEntryTypeButtons() {
    document.querySelectorAll(".entry-type-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        entryType = btn.dataset.type;
        document.querySelectorAll(".entry-type-btn").forEach((b) => {
          const isActive = b.dataset.type === entryType;
          b.className = `entry-type-btn rounded-lg px-4 py-2 text-sm font-medium ${
            isActive
              ? (entryType === "entrada" ? "bg-emerald-600 text-white" : "bg-red-600 text-white")
              : "border border-navy-200 text-navy-600 hover:bg-navy-50"
          }`;
        });
        entradaFields.classList.toggle("hidden", entryType !== "entrada");
        materialsBox.classList.toggle("hidden", entryType !== "entrada");
        customerBox.classList.toggle("hidden", entryType !== "entrada");
      });
    });
  }

  document.getElementById("ef-cancel").addEventListener("click", () => {
    caixaState.formOpen = false;
    caixaState.editingId = null;
    renderCaixa(document.getElementById("main-content"));
  });

  document.getElementById("entry-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("ef-error");
    const amount = Number(amountField.value.replace(",", "."));
    if (!Number.isFinite(amount) || amount <= 0) { errorEl.textContent = "Informe um valor válido."; return; }

    // Se escolheu "+ Novo cliente...", cadastra ele primeiro.
    let customerId = entryType === "entrada" && customerSelect.value && customerSelect.value !== "__new__" ? customerSelect.value : null;
    if (entryType === "entrada" && customerSelect.value === "__new__") {
      const newName = newCustomerNameField.value.trim();
      if (!newName) { errorEl.textContent = "Informe o nome do novo cliente (ou escolha \"— sem cliente —\")."; return; }
      const newCustomerPayload = {
        name: newName,
        whatsapp: document.getElementById("ef-new-customer-whatsapp").value.trim() || null,
        instagram: document.getElementById("ef-new-customer-instagram").value.trim().replace(/^@/, "") || null,
        created_by: state.currentUser.id,
      };
      const { data: newCustomer, error: customerError } = await supabaseClient.from("customers").insert(newCustomerPayload).select("id").single();
      if (customerError) { errorEl.textContent = "Não foi possível cadastrar o cliente: " + customerError.message; return; }
      customerId = newCustomer.id;
    }

    const basePayload = {
      entry_type: entryType,
      entry_date: document.getElementById("ef-date").value,
      amount,
      category: categoryField.value.trim() || null,
      description: descriptionField.value.trim() || null,
      payment_method: entryType === "entrada" ? paymentSelect.value : null,
      product_id: entryType === "entrada" && productSelect.value ? productSelect.value : null,
      customer_id: customerId,
    };

    const materialsToLink = entryType === "entrada" ? entryMaterials : [];
    let entryId;

    if (editingEntry) {
      const payload = { ...basePayload, updated_by: state.currentUser.id, updated_at: new Date().toISOString() };
      const { error } = await supabaseClient.from("cash_entries").update(payload).eq("id", editingEntry.id);
      if (error) { errorEl.textContent = error.message; return; }
      entryId = editingEntry.id;
    } else {
      const payload = { ...basePayload, created_by: state.currentUser.id };
      const { data: inserted, error } = await supabaseClient.from("cash_entries").insert(payload).select("id").single();
      if (error) { errorEl.textContent = error.message; return; }
      entryId = inserted.id;
    }

    // Sincroniza os materiais vinculados: apaga os antigos (o estoque volta) e grava a lista atual.
    await supabaseClient.from("cash_entry_materials").delete().eq("cash_entry_id", entryId);
    if (materialsToLink.length > 0) {
      const rows = materialsToLink.map((m) => ({
        cash_entry_id: entryId, material_id: m.material_id, quantity: m.quantity, unit_cost: m.unit_cost,
      }));
      const { error: linkError } = await supabaseClient.from("cash_entry_materials").insert(rows);
      if (linkError) { errorEl.textContent = "Lançamento salvo, mas houve um erro ao vincular os materiais: " + linkError.message; }
    }

    caixaState.formOpen = false;
    caixaState.editingId = null;
    await loadCashEntries();
    await loadMaterials();
    await loadCustomers();
    renderCaixa(document.getElementById("main-content"));
  });
}

/* =====================================================================
   START
   ===================================================================== */
render();
</script>
</body>
</html>
