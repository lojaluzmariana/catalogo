function closeSimulateOverlay() {
  simulateState = { open: false, items: [], payment: "pix", _selectedProductId: null, _selectedVariantId: null, _qty: "1" };
  renderSimulateOverlay();
}

function simulateTotals() {
  const resolved = simulateState.items.map((it) => {
    const product = state.products.find((p) => p.id === it.product_id);
    const variant = it.variant_id ? (product?.product_variants ?? []).find((v) => v.id === it.variant_id) : null;
    const unitPrice = salePriceFor(product, simulateState.payment, variant);
    const unitCost = product ? effectiveCost(product, variant) : 0;
    return { ...it, unitPrice, unitCost, lineTotal: round2(unitPrice * it.quantity), lineCost: round2(unitCost * it.quantity) };
  });
  const cost = orderCost({ items: simulateState.items, giftWraps: [] });
  const subtotal = round2(resolved.reduce((s, it) => s + it.lineTotal, 0));
  const profit = round2(subtotal - cost.cost);
  const margin = subtotal > 0 ? round2(profit / subtotal) : 0;
  return { resolved, subtotal, cost, profit, margin };
}

  if (!slot) return;
  if (!simulateState.open) { slot.innerHTML = ""; return; }

  const { resolved, subtotal, cost, profit, margin } = simulateTotals();

  slot.innerHTML = `

              </div>
            </div>

            <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
              <p class="mb-2 text-sm font-medium text-navy-800">Itens da venda simulada</p>
              <div class="flex flex-wrap items-end gap-3">

   Junta vários itens (produto + modelo + quantidade), calcula o total
   pela forma de pagamento e, ao enviar, lança de verdade no Caixa
   (entrada da venda + saída do custo, ambas marcadas com o event_tag) e
   baixa o estoque numérico dos produtos/modelos vendidos — igual uma

function eventoVendaTotals() {
  const resolved = eventoVendaState.items.map((it) => {
    const product = state.products.find((p) => p.id === it.product_id);
    const variant = it.variant_id ? (product?.product_variants ?? []).find((v) => v.id === it.variant_id) : null;
    const unitPrice = salePriceFor(product, eventoVendaState.payment, variant);
    return { ...it, unitPrice, lineTotal: round2(unitPrice * it.quantity) };
  });
  const cost = orderCost({ items: eventoVendaState.items, giftWraps: [] });
  const subtotal = round2(resolved.reduce((s, it) => s + it.lineTotal, 0));
  return { resolved, subtotal, cost };
}

async function submeterVendaEvento(e) {
  e.preventDefault();
  const errorEl = document.getElementById("ev-error");
  const eventName = document.getElementById("ev-event-name").value.trim();
  const date = document.getElementById("ev-date").value;
  if (!eventName) { errorEl.textContent = "Informe o nome do evento."; return; }
  if (!date) { errorEl.textContent = "Informe a data da venda."; return; }
  if (eventoVendaState.items.length === 0) { errorEl.textContent = "Adicione ao menos um item vendido."; return; }
  errorEl.textContent = "";

  const submitBtn = document.getElementById("ev-submit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Registrando...";

  const { subtotal, cost } = eventoVendaTotals();
  const itemsDesc = eventoVendaState.items.map((it) => `${it.quantity}x ${it.product_name}${it.variant_name ? ` (${it.variant_name})` : ""}`).join(", ");

  const vendaPayload = {
    entry_type: "entrada",
    entry_date: date,
    amount: subtotal,
    category: "Venda evento",
    description: `${eventName} — ${itemsDesc}`,
    payment_method: eventoVendaState.payment,
    event_tag: eventName,
    paid_at: new Date().toISOString(),
    created_by: state.currentUser.id,
  };
  const { error: vendaError } = await supabaseClient.from("cash_entries").insert(vendaPayload);
  if (vendaError) {
    errorEl.textContent = "Não foi possível registrar a venda: " + vendaError.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Registrar venda do evento";
    return;
  }

  if (cost.costExcludingEssentials > 0) {
    const custoPayload = {
      entry_type: "saida",
      entry_date: date,
      amount: Math.round(cost.costExcludingEssentials * 100) / 100,
      category: "Custo do evento",
      description: `Custo — ${eventName} — ${itemsDesc}${cost.isApprox ? " (estimado — produto não está mais cadastrado)" : ""}`,
      payment_method: null,
      event_tag: eventName,
      paid_at: new Date().toISOString(),
      created_by: state.currentUser.id,
    };
    const { error: custoError } = await supabaseClient.from("cash_entries").insert(custoPayload);
    if (custoError) console.error("submeterVendaEvento custo:", custoError.message);
  }

  // Baixa o estoque de verdade — igual uma venda normal, só que essa
  // função (ao contrário do "Iniciar venda" do Catálogo) realmente
  // desconta a quantidade de quem tem stock_qty controlado.
  for (const it of eventoVendaState.items) {
    await ajustarEstoqueQtd(it.product_id, it.variant_id, -it.quantity);
  }

  // Se o modo evento estava ativo com esse mesmo nome, mantém ativo pra
  // facilitar lançar a próxima venda do mesmo evento em seguida.
  if (!eventModeState.active || eventModeState.name !== eventName) {
    eventModeState = { active: true, name: eventName };
    saveEventModeToStorage();
  }

  eventoVendaState = { open: false, eventName, date, payment: eventoVendaState.payment, items: [], _selectedProductId: null, _selectedVariantId: null, _qty: "1" };
  await Promise.all([loadCashEntries(), loadProducts()]);
  renderCaixa(document.getElementById("main-content"));
}

// Panorama de um evento: soma tudo que tem esse event_tag, quebrado por
// dia (pra eventos de mais de um dia) e por forma de pagamento — a mesma
// pergunta de "como foi o evento" tanto no dia quanto no total.
function eventoResumo(eventTag, sourceEntries = state.cashEntries) {
  const eventEntries = sourceEntries.filter((e) => e.event_tag === eventTag);
  const totalEntradas = eventEntries.filter((e) => e.entry_type === "entrada").reduce((s, e) => s + Number(e.amount), 0);
  const totalSaidas = eventEntries.filter((e) => e.entry_type === "saida").reduce((s, e) => s + Number(e.amount), 0);
  const lucro = round2(totalEntradas - totalSaidas);

  const porDia = {};
  eventEntries.forEach((e) => {
    if (!porDia[e.entry_date]) porDia[e.entry_date] = { entradas: 0, saidas: 0 };
    if (e.entry_type === "entrada") porDia[e.entry_date].entradas += Number(e.amount);
    else porDia[e.entry_date].saidas += Number(e.amount);
  });
  const diasList = Object.entries(porDia).sort((a, b) => a[0].localeCompare(b[0]));

  const porPagamento = {};
  eventEntries.filter((e) => e.entry_type === "entrada").forEach((e) => {
    const key = e.payment_method || "—";
    porPagamento[key] = (porPagamento[key] || 0) + Number(e.amount);
  });

  return {
    totalEntradas, totalSaidas, lucro,
    diasList, porPagamentoList: Object.entries(porPagamento).sort((a, b) => b[1] - a[1]),
    numDias: diasList.length,
  };
}

function vendaManualResolvedItems() {
  return vendaManualState.items.map((it) => {
    const product = state.products.find((p) => p.id === it.product_id);
    const variant = it.variant_id ? (product?.product_variants ?? []).find((v) => v.id === it.variant_id) : null;

    // Itens trazidos de um orçamento guardam os preços daquele orçamento.
    // Assim, se o preço do cadastro mudar depois, lançar o pedido continua
    // respeitando exatamente o valor que foi passado ao cliente. Também
    // permite levar para o pedido itens manuais, que não têm product_id.
    const fixedPix = it.fixed_unit_price_pix != null ? Number(it.fixed_unit_price_pix) : null;
    const fixedCredit = it.fixed_unit_price_credit != null ? Number(it.fixed_unit_price_credit) : null;
    const hasFixed = Number.isFinite(fixedPix) || Number.isFinite(fixedCredit);
    let unitPrice;
    if (hasFixed) {
      unitPrice = vendaManualState.payment === "credito"
        ? (Number.isFinite(fixedCredit) ? fixedCredit : fixedPix)
        : (Number.isFinite(fixedPix) ? fixedPix : fixedCredit);
    } else {
      unitPrice = salePriceFor(product, vendaManualState.payment, variant);
    }
    unitPrice = Number(unitPrice || 0);
    return { ...it, unitPrice, lineTotal: round2(unitPrice * it.quantity) };
  });
}

// Mesma conta do desconto de cupom do Catálogo (ver discountAmount() em
// index-catalogo.html): percentual ou valor fixo, respeitando o teto em
// R$ quando existe, e nunca passando do próprio subtotal.
function vendaManualTotals() {
  const resolved = vendaManualResolvedItems();
  const subtotal = round2(resolved.reduce((s, it) => s + it.lineTotal, 0));
  const coupon = vendaManualState.appliedCoupon;
  let discount = 0;
  if (coupon) {
    if (coupon.discount_type === "percentual") discount = subtotal * (Number(coupon.discount_value) / 100);
    else if (coupon.discount_type === "valor_fixo") discount = Number(coupon.discount_value);
    if (coupon.max_discount_amount != null) discount = Math.min(discount, Number(coupon.max_discount_amount));
    discount = Math.max(0, Math.min(discount, subtotal));
  }
  const total = round2(Math.max(0, subtotal - discount));
  return { resolved, subtotal, discount: round2(discount), total };
}

async function onApplyCouponVendaManual() {
  const input = document.getElementById("vm-coupon-input");
  const msgEl = document.getElementById("vm-coupon-msg");
  const applyBtn = document.getElementById("vm-coupon-apply");
  const code = input.value.trim();
  vendaManualState.couponCode = code;
  if (!code) { msgEl.textContent = "Informe o código do cupom."; msgEl.className = "mt-1 text-xs text-red-600"; return; }
  const whatsapp = document.getElementById("vm-whatsapp").value.trim();
  if (!whatsapp) { msgEl.textContent = "Informe o WhatsApp do cliente antes de aplicar o cupom."; msgEl.className = "mt-1 text-xs text-red-600"; return; }

  applyBtn.disabled = true;
  applyBtn.textContent = "Verificando...";
  msgEl.textContent = "Verificando cupom...";
  msgEl.className = "mt-1 text-xs text-navy-500";

  const { data, error } = await supabaseClient.rpc("validate_coupon", { p_code: code, p_whatsapp: whatsapp });
  const result = Array.isArray(data) ? data[0] : data;

  if (error || !result || !result.valid) {
    applyBtn.disabled = false;
    applyBtn.textContent = "Aplicar";
    msgEl.textContent = error ? "Não foi possível validar o cupom agora: " + error.message : (result && result.message) || "Cupom inválido.";
    msgEl.className = "mt-1 text-xs text-red-600";
    return;
  }

  vendaManualState.appliedCoupon = {
    id: result.coupon_id,
    code: code.toUpperCase(),
    discount_type: result.discount_type,
    discount_value: Number(result.discount_value),
    max_discount_amount: result.max_discount_amount != null ? Number(result.max_discount_amount) : null,
  };
  vendaManualState.couponCode = code.toUpperCase();
  renderVendaManualOverlay();
}

async function submeterVendaManual(e) {
  e.preventDefault();
  const errorEl = document.getElementById("vm-error");
  const name = document.getElementById("vm-name").value.trim();
  const whatsapp = document.getElementById("vm-whatsapp").value.trim();
  const instagram = document.getElementById("vm-instagram").value.trim().replace(/^@/, "");
  const notes = document.getElementById("vm-notes").value.trim();

  if (!name) { errorEl.textContent = "Informe o nome do cliente."; return; }
  if (!whatsapp) { errorEl.textContent = "Informe o WhatsApp do cliente."; return; }
  if (vendaManualState.items.length === 0) { errorEl.textContent = "Adicione ao menos um item."; return; }
  errorEl.textContent = "";

  const submitBtn = document.getElementById("vm-submit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Registrando...";

  const { resolved, discount, total } = vendaManualTotals();
  const coupon = vendaManualState.appliedCoupon;
  const veioDoOrcamento = !!vendaManualState.sourceOrcamentoId;
  const orderId = crypto.randomUUID();

  const { error: orderError } = await supabaseClient.from("orders").insert({
    id: orderId,
    customer_name: name,
    customer_whatsapp: whatsapp,
    customer_instagram: instagram || null,
    payment_method: vendaManualState.payment,
    notes: notes || null,
    total,
    coupon_id: coupon ? coupon.id : null,
    coupon_code: coupon ? coupon.code : null,
    discount_amount: discount > 0 ? discount : null,
  });
  if (orderError) {
    errorEl.textContent = "Não foi possível registrar o pedido: " + orderError.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Registrar pedido";
    return;
  }

  const itemRows = resolved.map((it) => ({
    order_id: orderId,
    product_id: it.product_id,
    product_name: it.product_name,
    variant_name: it.variant_name,
    unit_price: it.unitPrice,
    quantity: it.quantity,
  }));
  const { error: itemsError } = await supabaseClient.from("order_items").insert(itemRows);
  if (itemsError) {
    errorEl.textContent = "O pedido foi criado, mas não foi possível salvar os itens: " + itemsError.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Registrar pedido";
    return;
  }

  // Igual o Catálogo faz ao fechar uma compra: cadastra/atualiza o
  // cliente e, se um cupom foi usado, marca esse WhatsApp como "já usou"
  // (só tem efeito de verdade em cupons restritos por telefone).
  const { error: customerError } = await supabaseClient.rpc("upsert_customer_from_order", {
    p_name: name, p_whatsapp: whatsapp, p_instagram: instagram || null,
  });
  if (customerError) console.error("venda manual upsert_customer:", customerError.message);

  if (coupon) {
    const { error: markUsedError } = await supabaseClient.rpc("mark_coupon_phone_used", {
      p_coupon_id: coupon.id, p_whatsapp: whatsapp, p_order_id: orderId,
    });
    if (markUsedError) console.error("venda manual mark_coupon_phone_used:", markUsedError.message);
  }

  closeVendaManualOverlay();
  pedidosState.tab = "novo";
  await loadOrders();
  if (veioDoOrcamento) state.tab = "pedidos";
  renderApp();
}


/* =====================================================================
   ORÇAMENTOS — integrado ao painel e persistido no Supabase.
   A numeração oficial vem da coluna IDENTITY da tabela public.orcamentos;
   no painel ela é exibida com 3 dígitos (001, 002, 003...). Excluir um
   orçamento NÃO faz o número voltar — a sequência do PostgreSQL segue em
   frente, evitando reutilização de números.
   ===================================================================== */
const orcamentoState = {
  editingId: null,
  nextNumber: 1,
  generatedText: "",
  saving: false,
};

const ORC_MARGEM_PIX = 0.40;
const ORC_MARGEM_CREDITO = 0.45;
const ORC_TAXA_CREDITO = 0.05;

async function loadOrcamentos() {
  const { data, error } = await supabaseClient
    .from("orcamentos")
    .select("*")
    .order("numero", { ascending: false })
    .limit(100);
  if (!error) state.orcamentos = data || [];
  noteLoadResult("orçamentos", error);
}

async function loadProximoNumeroOrcamento() {
  const { data, error } = await supabaseClient.rpc("proximo_numero_orcamento");
  if (!error && Number.isFinite(Number(data))) {
    orcamentoState.nextNumber = Number(data);
    return;
  }
  // Fallback visual se a função RPC ainda não existir: não afeta a
  // numeração oficial, que continua sendo definida pelo banco no INSERT.
  const maior = Math.max(0, ...state.orcamentos.map((o) => Number(o.numero) || 0));
  orcamentoState.nextNumber = maior + 1;
  if (error) console.error("proximo_numero_orcamento:", error.message);
}

function orcNumeroFormatado(n) {
  return String(Number(n) || 0).padStart(3, "0");
}

function orcNumero(v) {
  if (typeof v === "number") return Number.isFinite(v) ? v : 0;

  // Os campos type="number" do navegador sempre entregam decimais com
  // ponto (ex.: 1.5), mesmo quando a interface mostra 1,5 em pt-BR.
  // A lógica antiga removia TODO ponto por tratá-lo como separador de
  // milhar, transformando 1.5 em 15 e fazendo 12 × 1,50 virar R$ 180,00.
  // Aqui aceitamos tanto o formato do navegador (1.5) quanto o formato
  // brasileiro digitado/formatado (1,5 ou 1.500,50).
  let s = String(v ?? "").trim().replace(/[^0-9,.-]/g, "");
  if (!s) return 0;

  if (s.includes(",")) {
    // Havendo vírgula, ela é o separador decimal brasileiro; pontos antes
    // dela são tratados como separadores de milhar.
    s = s.replace(/\./g, "").replace(",", ".");
  }
  // Sem vírgula, preserva o ponto como separador decimal (type="number").
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

function orcPrecoCreditoAPartirDoPix(valorPix) {
  const pix = orcNumero(valorPix);
  if (pix <= 0) return 0;
  const custoEstimado = pix * (1 - ORC_MARGEM_PIX);
  const brutoCredito = custoEstimado / ((1 - ORC_TAXA_CREDITO) * (1 - ORC_MARGEM_CREDITO));
  return Math.round(brutoCredito);
}

function orcDataISOParaBR(valor) {
  if (!valor) return "—";
  const [ano, mes, dia] = String(valor).slice(0, 10).split("-");
  return `${dia}/${mes}/${ano}`;
}

function orcAdicionarDiasCorridos(dataISO, dias) {
  if (!dataISO) return "";
  const [ano, mes, dia] = dataISO.split("-").map(Number);
  const d = new Date(ano, mes - 1, dia);
  d.setDate(d.getDate() + Number(dias || 0));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function orcAdicionarDiasUteis(dataISO, diasUteis) {
  if (!dataISO) return "";
  const [ano, mes, dia] = dataISO.split("-").map(Number);
  const d = new Date(ano, mes - 1, dia);
  let restantes = Math.max(0, parseInt(diasUteis || 0, 10));
  while (restantes > 0) {
    d.setDate(d.getDate() + 1);
    const diaSemana = d.getDay();
    if (diaSemana !== 0 && diaSemana !== 6) restantes--;
  }
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function orcRowToData(row) {
  return {
    id: row.id,
    numero: orcNumeroFormatado(row.numero),
    nome: row.cliente_nome || "",
    telefone: row.telefone || "",
    dataOrcamento: row.data_orcamento || todayISO(),
    validadeOrcamento: row.validade_orcamento || "",
    prazoDias: Number(row.prazo_dias || 0),
    previsaoEntrega: row.previsao_entrega || "",
    pagamento: row.pagamento || "pix",
    itens: Array.isArray(row.itens) ? row.itens : [],
    subtotal: Number(row.subtotal || 0),
    totalPix: Number(row.total_pix || 0),
    totalCredito: Number(row.total_credito || 0),
    total: Number(row.total_final || 0),
    acrescimo: Number(row.acrescimo || 0),
    criadoEm: row.created_at ? new Date(row.created_at).toLocaleString("pt-BR") : "",
  };
}

function renderOrcamentos(container) {
  const phoneKey = (v) => String(v || "").replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, "");
  const nowIso = todayISO();
  const budgetStatusRows = state.orcamentos.map((row) => {
    const phone = phoneKey(row.cliente_telefone);
    const name = String(row.cliente_nome || "").trim().toLowerCase();
    const convertedOrder = state.orders.find((o) => {
      if (o.status === "cancelado") return false;
      if (row.created_at && o.created_at && new Date(o.created_at) < new Date(row.created_at)) return false;
      const samePhone = phone && phoneKey(o.customer_whatsapp) === phone;
      const sameName = name && String(o.customer_name || "").trim().toLowerCase() === name;
      return samePhone || (!phone && sameName);
    });
    const expired = row.validade_orcamento ? row.validade_orcamento < nowIso : false;
    return { row, convertedOrder, expired };
  });
  const convertedBudgets = budgetStatusRows.filter((x) => x.convertedOrder).length;
  const openBudgets = budgetStatusRows.filter((x) => !x.convertedOrder && !x.expired).length;
  const expiredBudgets = budgetStatusRows.filter((x) => !x.convertedOrder && x.expired).length;
  const quotedValue = round2(state.orcamentos.reduce((s,o) => s + Number(o.total_final || 0), 0));
  const conversionRate = state.orcamentos.length ? Math.round(convertedBudgets / state.orcamentos.length * 100) : 0;

    ? state.orcamentos.find((o) => o.id === orcamentoState.editingId)
    : null;

function orcNormalizarBusca(texto) {
  return String(texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

// ---------------------------------------------------------------------
// CLIENTES NO ORÇAMENTO
// Ao digitar o nome, consulta state.customers e permite escolher um cliente
// já cadastrado. Ao salvar, se não houver correspondência por telefone (ou
// por nome único quando não há telefone), cria o cliente automaticamente.
// ---------------------------------------------------------------------
function orcTelefoneChave(phone) {
  let digits = String(phone ?? "").replace(/\D/g, "");
  if ((digits.length === 12 || digits.length === 13) && digits.startsWith("55")) digits = digits.slice(2);
  return digits;
}

function orcFormatarTelefone(phone) {
  let v = orcTelefoneChave(phone).slice(0, 11);
  if (v.length > 10) return v.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
  if (v.length > 6) return v.replace(/(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
  if (v.length > 2) return v.replace(/(\d{2})(\d+)/, "($1) $2");
  return v;
}

function orcBuscarClientes(termo, limite = 8) {
  const q = orcNormalizarBusca(termo);
  const digits = String(termo || "").replace(/\D/g, "");
  if (!q && !digits) return [];
  return [...state.customers]
    .filter((c) => {
      const nome = orcNormalizarBusca(c.name || "");
      const telefone = orcTelefoneChave(c.whatsapp || "");
      return (q && nome.includes(q)) || (digits && telefone.includes(orcTelefoneChave(digits)));
    })
    .sort((a, b) => {
      if (!!a.active !== !!b.active) return a.active ? -1 : 1;
      return String(a.name || "").localeCompare(String(b.name || ""), "pt-BR");
    })
    .slice(0, limite);
}

function orcAtualizarMetaCliente(texto = "") {
  const meta = document.getElementById("orc-cliente-meta");
  if (meta) meta.innerHTML = texto;
}

function orcLimparVinculoCliente(mostrarNovo = true) {
  const nome = document.getElementById("orc-nome");
  if (!nome) return;
  delete nome.dataset.customerId;
  if (mostrarNovo && nome.value.trim()) {
    orcAtualizarMetaCliente('<span class="text-navy-400">Cliente novo — será cadastrado automaticamente ao salvar.</span>');
  } else if (!nome.value.trim()) {
    orcAtualizarMetaCliente("");
  }
}

function orcVincularCliente(cliente, preencherCampos = true) {
  if (!cliente) return;
  const nome = document.getElementById("orc-nome");
  const telefone = document.getElementById("orc-telefone");
  if (!nome || !telefone) return;
  nome.dataset.customerId = String(cliente.id);
  if (preencherCampos) {
    nome.value = cliente.name || "";
    telefone.value = orcFormatarTelefone(cliente.whatsapp || "");
  }
  const status = cliente.active === false ? ' <span class="text-amber-700">(inativo)</span>' : "";
  orcAtualizarMetaCliente(`<span class="font-medium text-emerald-700">Cliente cadastrado</span>${status}${cliente.whatsapp ? ` · ${escapeHtml(orcFormatarTelefone(cliente.whatsapp))}` : " · sem telefone cadastrado"}`);
  const sugestoes = document.getElementById("orc-cliente-sugestoes");
  if (sugestoes) sugestoes.classList.add("hidden");
}

function orcRenderSugestoesCliente() {
  const nome = document.getElementById("orc-nome");
  const box = document.getElementById("orc-cliente-sugestoes");
  if (!nome || !box) return;
  const termo = nome.value.trim();
  if (!termo) { box.classList.add("hidden"); return; }
  const resultados = orcBuscarClientes(termo);
  box.innerHTML = resultados.length
    ? resultados.map((c) => `
        <button type="button" data-orc-customer-id="${escapeHtml(c.id)}" class="block w-full rounded-lg px-3 py-2 text-left transition hover:bg-navy-50">
          <span class="block text-sm font-medium text-navy-900">${escapeHtml(c.name || "Cliente")}${c.active === false ? ' <span class="text-xs font-normal text-amber-700">(inativo)</span>' : ""}</span>
          <span class="block text-xs text-navy-500">${escapeHtml(c.whatsapp ? orcFormatarTelefone(c.whatsapp) : "Sem telefone cadastrado")}</span>
        </button>`).join("")
    : `<div class="px-3 py-2 text-xs text-navy-500">Nenhum cliente cadastrado com esse nome. Ao salvar o orçamento, ele será cadastrado automaticamente.</div>`;
  box.classList.remove("hidden");
  box.querySelectorAll("[data-orc-customer-id]").forEach((btn) => {
    btn.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const cliente = state.customers.find((c) => String(c.id) === String(btn.dataset.orcCustomerId));
      if (cliente) orcVincularCliente(cliente, true);
    });
  });
}

function orcEncontrarClienteExistente(nome, telefone) {
  const phoneKey = orcTelefoneChave(telefone);
  if (phoneKey) {
    const porTelefone = state.customers.find((c) => orcTelefoneChave(c.whatsapp) === phoneKey);
    if (porTelefone) return porTelefone;
  }

  // Sem telefone, um nome exato e único é suficiente para evitar duplicar
  // o mesmo cliente. Com telefone diferente, não presumimos que seja a
  // mesma pessoa: o usuário pode selecionar explicitamente na lista.
  if (!phoneKey) {
    const nomeKey = orcNormalizarBusca(nome);
    const iguais = state.customers.filter((c) => orcNormalizarBusca(c.name || "") === nomeKey);
    if (iguais.length === 1) return iguais[0];
  }
  return null;
}

function orcTentarVincularClientePorTelefone() {
  const nome = document.getElementById("orc-nome");
  const telefone = document.getElementById("orc-telefone");
  if (!nome || !telefone) return;
  const key = orcTelefoneChave(telefone.value);
  if (key.length < 10) {
    if (nome.value.trim()) orcAtualizarMetaCliente('<span class="text-navy-400">Cliente novo — será cadastrado automaticamente ao salvar.</span>');
    return;
  }
  const cliente = state.customers.find((c) => orcTelefoneChave(c.whatsapp) === key);
  if (cliente) orcVincularCliente(cliente, true);
  else if (nome.value.trim()) orcAtualizarMetaCliente('<span class="text-navy-400">Cliente novo — será cadastrado automaticamente ao salvar.</span>');
}

function orcInicializarClienteOrcamento(d) {
  const nome = document.getElementById("orc-nome");
  if (!nome) return;
  const existente = orcEncontrarClienteExistente(d.nome || "", d.telefone || "")
    || (() => {
      const nomeKey = orcNormalizarBusca(d.nome || "");
      if (!nomeKey) return null;
      const iguais = state.customers.filter((c) => orcNormalizarBusca(c.name || "") === nomeKey);
      return iguais.length === 1 ? iguais[0] : null;
    })();
  if (existente) orcVincularCliente(existente, false);
  else if ((d.nome || "").trim()) orcAtualizarMetaCliente('<span class="text-navy-400">Cliente não cadastrado — será cadastrado automaticamente ao salvar.</span>');
}

async function garantirClienteDoOrcamento(d) {
  const nomeField = document.getElementById("orc-nome");
  const selectedId = nomeField?.dataset.customerId || null;
  if (selectedId) {
    const selecionado = state.customers.find((c) => String(c.id) === String(selectedId));
    if (selecionado) return selecionado;
  }

  const existente = orcEncontrarClienteExistente(d.nome, d.telefone);
  if (existente) {
    if (nomeField) nomeField.dataset.customerId = String(existente.id);
    return existente;
  }

  const payload = {
    name: d.nome.trim(),
    whatsapp: d.telefone.trim() || null,
    instagram: null,
    created_by: state.currentUser?.id || null,
    updated_by: state.currentUser?.id || null,
    updated_at: new Date().toISOString(),
  };
  const { data, error } = await supabaseClient.from("customers").insert(payload).select("*").single();
  if (error) throw new Error("Não foi possível cadastrar o novo cliente: " + error.message);
  state.customers.push(data);
  state.customers.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "pt-BR"));
  if (nomeField) nomeField.dataset.customerId = String(data.id);
  return data;
}

function orcCatalogoPesquisavel() {
  const opcoes = [];
  state.products
    .filter((p) => p.active)
    .sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "pt-BR"))
    .forEach((product) => {
      const variants = [...(product.product_variants || [])]
        .sort((a, b) => ((a.sort_order ?? 0) - (b.sort_order ?? 0)) || String(a.name || "").localeCompare(String(b.name || ""), "pt-BR"));

      if (variants.length === 0) {
        const pricing = effectivePricing(product, null);
        opcoes.push({
          productId: product.id,
          variantId: null,
          productName: product.name || "Produto",
          variantName: null,
          label: product.name || "Produto",
          category: product.category || "",
          pix: Number(pricing.promoPrice || 0),
          credito: Number(pricing.creditPrice || 0),
        });
        return;
      }

      variants.forEach((variant) => {
        const pricing = effectivePricing(product, variant);
        opcoes.push({
          productId: product.id,
          variantId: variant.id,
          productName: product.name || "Produto",
          variantName: variant.name || "",
          label: `${product.name || "Produto"} — ${variant.name || "Modelo"}`,
          category: product.category || "",
          pix: Number(pricing.promoPrice || 0),
          credito: Number(pricing.creditPrice || 0),
        });
      });
    });
  return opcoes;
}

function orcBuscarProdutos(termo, limite = 8) {
  const q = orcNormalizarBusca(termo);
  if (!q) return [];
  return orcCatalogoPesquisavel()
    .filter((op) => orcNormalizarBusca(`${op.label} ${op.category}`).includes(q))
    .slice(0, limite);
}

function orcAtualizarMetaProduto(linha, texto = "") {
  const meta = linha.querySelector(".orc-product-meta");
  if (!meta) return;
  meta.innerHTML = texto;
}

function orcLimparVinculoProduto(linha, mostrarManual = true) {
  delete linha.dataset.productId;
  delete linha.dataset.variantId;
  delete linha.dataset.registeredCredit;
  delete linha.dataset.registeredPix;
  linha.dataset.orcSource = "manual";
  if (mostrarManual) {
    orcAtualizarMetaProduto(linha, '<span class="text-navy-400">Item manual — informe a descrição e o valor.</span>');
  } else {
    orcAtualizarMetaProduto(linha, "");
  }
}

function orcSelecionarProduto(linha, opcao) {
  const pedido = linha.querySelector(".orc-pedido");
  const unitario = linha.querySelector(".orc-unitario");
  const sugestoes = linha.querySelector(".orc-product-suggestions");
  pedido.value = opcao.label;
  unitario.value = Number(opcao.pix || 0).toFixed(2);
  linha.dataset.productId = String(opcao.productId || "");
  if (opcao.variantId) linha.dataset.variantId = String(opcao.variantId);
  else delete linha.dataset.variantId;
  linha.dataset.registeredPix = String(Number(opcao.pix || 0));
  linha.dataset.registeredCredit = String(Number(opcao.credito || 0));
  linha.dataset.orcSource = "catalogo";
  orcAtualizarMetaProduto(
    linha,
    `<span class="font-medium text-emerald-700">Produto cadastrado</span> · Pix ${escapeHtml(formatBRL(opcao.pix))} · Crédito ${escapeHtml(formatBRL(opcao.credito))}`
  );
  if (sugestoes) sugestoes.classList.add("hidden");
  calcularOrcamento();
}

function orcRenderSugestoesProduto(linha) {
  const pedido = linha.querySelector(".orc-pedido");
  const box = linha.querySelector(".orc-product-suggestions");
  if (!pedido || !box) return;
  const termo = pedido.value.trim();
  if (!termo) { box.classList.add("hidden"); box.innerHTML = ""; return; }

  const matches = orcBuscarProdutos(termo);
  const manualLabel = escapeHtml(termo);
  box.innerHTML = `
    ${matches.map((op, idx) => `
      <button type="button" class="orc-product-suggestion" data-orc-suggestion="${idx}">
        <span class="min-w-0">
          <span class="block truncate text-sm font-medium text-navy-900">${escapeHtml(op.label)}</span>
          ${op.category ? `<span class="block truncate text-xs text-navy-400">${escapeHtml(op.category)}</span>` : ""}
        </span>
        <span class="shrink-0 text-right">
          <span class="block text-xs font-semibold text-emerald-700">Pix ${escapeHtml(formatBRL(op.pix))}</span>
          <span class="block text-xs text-navy-500">Crédito ${escapeHtml(formatBRL(op.credito))}</span>
        </span>
      </button>`).join("")}
    <button type="button" class="orc-product-suggestion" data-orc-manual="1">
      <span>
        <span class="block text-sm font-medium text-navy-900">Usar como item manual</span>
        <span class="block text-xs text-navy-400">“${manualLabel}” não precisa existir no cadastro</span>
      </span>
      <span class="shrink-0 text-xs font-semibold text-gold-700">Manual</span>
    </button>`;

  box.classList.remove("hidden");
  box.querySelectorAll("[data-orc-suggestion]").forEach((btn) => {
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const op = matches[Number(btn.dataset.orcSuggestion)];
      if (op) orcSelecionarProduto(linha, op);
    });
  });
  const manualBtn = box.querySelector("[data-orc-manual]");
  if (manualBtn) manualBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    orcLimparVinculoProduto(linha, true);
    box.classList.add("hidden");
    linha.querySelector(".orc-unitario")?.focus();
    calcularOrcamento();
  });
}

function adicionarItemOrcamento(dados = {}) {

  const variantId = dados.variantId || dados.variant_id || "";
  const savedCredit = dados.unitarioCredito != null ? Number(dados.unitarioCredito) : null;
  linha.dataset.orcSource = source;
  if (productId) linha.dataset.productId = String(productId);
  if (variantId) linha.dataset.variantId = String(variantId);
  if (source === "catalogo" && unit !== "") linha.dataset.registeredPix = String(Number(unit));
  if (source === "catalogo" && savedCredit != null && Number.isFinite(savedCredit)) linha.dataset.registeredCredit = String(savedCredit);

  linha.innerHTML = `
    <div class="block">

        <input class="orc-pedido w-full rounded-lg border border-navy-100 bg-white px-3 py-2 text-base text-navy-900 outline-none focus:border-gold-500" autocomplete="off" placeholder="Digite para buscar ou escreva manualmente" value="${escapeHtml(dados.pedido || "")}" />
        <div class="orc-product-suggestions hidden"></div>
      </div>
      <div class="orc-product-meta"></div>
    </div>
    <label class="block">
      <span class="mb-1.5 block text-xs font-medium text-navy-700">Qtd.</span>
      <input class="orc-quantidade w-full rounded-lg border border-navy-100 bg-white px-3 py-2 text-base text-navy-900 outline-none focus:border-gold-500" type="number" min="1" step="1" value="${escapeHtml(dados.quantidade || 1)}" />
    </label>
    <label class="block">
      <span class="mb-1.5 block text-xs font-medium text-navy-700">Valor unitário (Pix / Espécie)</span>
      <input class="orc-unitario w-full rounded-lg border border-navy-100 bg-white px-3 py-2 text-base text-navy-900 outline-none focus:border-gold-500" type="number" min="0" step="0.01" placeholder="0,00" value="${escapeHtml(unit)}" />
    </label>
    <label class="orc-total-wrap block">
      <span class="mb-1.5 block text-xs font-medium text-navy-700">Valor total</span>
      <input class="orc-item-total w-full rounded-lg border border-navy-100 bg-white px-3 py-2 text-base text-navy-900 outline-none" readonly value="R$ 0,00" />
    </label>
    <button type="button" class="orc-remove rounded-lg border border-red-200 bg-white text-lg font-bold text-red-600 hover:bg-red-50" style="height:43px" title="Remover item">×</button>
  `;

  const pedido = linha.querySelector(".orc-pedido");
  const unitario = linha.querySelector(".orc-unitario");
  const quantidade = linha.querySelector(".orc-quantidade");
  const sugestoes = linha.querySelector(".orc-product-suggestions");

  if (source === "catalogo" && productId) {
    const product = state.products.find((p) => String(p.id) === String(productId));
    const variant = variantId ? (product?.product_variants || []).find((v) => String(v.id) === String(variantId)) : null;
    const pricing = product ? effectivePricing(product, variant) : null;
    const pixHistorico = orcNumero(unit);
    const credHistorico = savedCredit != null && Number.isFinite(savedCredit)
      ? savedCredit
      : (pricing ? Number(pricing.creditPrice || 0) : orcPrecoCreditoAPartirDoPix(pixHistorico));
    linha.dataset.registeredPix = String(pixHistorico);
    linha.dataset.registeredCredit = String(credHistorico);
    orcAtualizarMetaProduto(linha, `<span class="font-medium text-emerald-700">Produto cadastrado</span> · preço salvo no orçamento`);

    // o item passa a ser tratado como manual para o crédito acompanhar o
    // novo valor informado, sem ficar preso ao preço antigo do cadastro.
    if (linha.dataset.orcSource === "catalogo") orcLimparVinculoProduto(linha, true);
    calcularOrcamento();
  });
  quantidade.addEventListener("input", calcularOrcamento);
  linha.querySelector(".orc-remove").addEventListener("click", () => { linha.remove(); calcularOrcamento(); });
  itens.appendChild(linha);
}

function calcularOrcamento() {
  let totalPix = 0;
  let totalCredito = 0;
  const pagamento = document.getElementById("orc-pagamento")?.value || "pix";
  document.querySelectorAll("#orc-itens .orc-item-row").forEach((linha) => {
    const qtd = orcNumero(linha.querySelector(".orc-quantidade").value);
    const unitPix = orcNumero(linha.querySelector(".orc-unitario").value);
    const creditoCadastrado = orcNumero(linha.dataset.registeredCredit || 0);
    const unitCredito = linha.dataset.orcSource === "catalogo" && creditoCadastrado > 0
      ? creditoCadastrado
      : orcPrecoCreditoAPartirDoPix(unitPix);
    const itemPix = qtd * unitPix;
    const itemCredito = qtd * unitCredito;
    totalPix += itemPix;
    totalCredito += itemCredito;
    linha.querySelector(".orc-item-total").value = formatBRL(pagamento === "credito" ? itemCredito : itemPix);
  });
  const total = pagamento === "credito" ? totalCredito : totalPix;
  const pixEl = document.getElementById("orc-total-pix");
  const credEl = document.getElementById("orc-total-credito");
  const finalEl = document.getElementById("orc-total-final");
  if (pixEl) pixEl.textContent = formatBRL(totalPix);
  if (credEl) credEl.textContent = formatBRL(totalCredito);
  if (finalEl) finalEl.textContent = formatBRL(total);
  return { subtotal: totalPix, totalPix, totalCredito, total, acrescimo: totalCredito - totalPix };
}

function atualizarDatasOrcamento(recalcular = true) {
  const data = document.getElementById("orc-data")?.value || "";
  const prazo = document.getElementById("orc-prazo")?.value ?? "";
  const validade = document.getElementById("orc-validade");
  const previsao = document.getElementById("orc-previsao");
  if (validade) validade.value = data ? orcAdicionarDiasCorridos(data, 2) : "";
  if (previsao) previsao.value = data && prazo !== "" ? orcAdicionarDiasUteis(data, prazo) : "";
  if (recalcular) calcularOrcamento();
}

function obterDadosOrcamento() {
  const pagamento = document.getElementById("orc-pagamento").value;
  const itens = [...document.querySelectorAll("#orc-itens .orc-item-row")].map((linha) => {
    const quantidade = orcNumero(linha.querySelector(".orc-quantidade").value);
    const unitarioPix = orcNumero(linha.querySelector(".orc-unitario").value);
    const creditoCadastrado = orcNumero(linha.dataset.registeredCredit || 0);
    const source = linha.dataset.orcSource === "catalogo" ? "catalogo" : "manual";
    const unitarioCredito = source === "catalogo" && creditoCadastrado > 0
      ? creditoCadastrado
      : orcPrecoCreditoAPartirDoPix(unitarioPix);
    return {
      pedido: linha.querySelector(".orc-pedido").value.trim(),
      quantidade,
      unitario: unitarioPix,
      unitarioPix,
      unitarioCredito,
      totalPix: quantidade * unitarioPix,
      totalCredito: quantidade * unitarioCredito,
      total: pagamento === "credito" ? quantidade * unitarioCredito : quantidade * unitarioPix,
      source,
      productId: source === "catalogo" ? (linha.dataset.productId || null) : null,
      variantId: source === "catalogo" ? (linha.dataset.variantId || null) : null,
    };
  }).filter((i) => i.pedido || i.unitarioPix > 0);
  const valores = calcularOrcamento();
  return {
    id: orcamentoState.editingId,
    numero: document.getElementById("orc-numero").value.trim(),
    nome: document.getElementById("orc-nome").value.trim(),
    telefone: document.getElementById("orc-telefone").value.trim(),
    dataOrcamento: document.getElementById("orc-data").value,
    validadeOrcamento: document.getElementById("orc-validade").value,
    prazoDias: orcNumero(document.getElementById("orc-prazo").value),
    previsaoEntrega: document.getElementById("orc-previsao").value,
    pagamento,
    itens,
    ...valores,
  };
}

function gerarTextoOrcamento(d) {
  const credito = d.pagamento === "credito";
  const pagamento = credito ? "Cartão de crédito em até 3x" : "Pix / Espécie";
  const itens = d.itens.map((i) => {
    const unit = credito ? i.unitarioCredito : i.unitarioPix;
    const totalItem = credito ? i.totalCredito : i.totalPix;
    return `• ${i.pedido}\n  ${i.quantidade} und x ${formatBRL(unit)} = ${formatBRL(totalItem)}`;
  }).join("\n");
  const valorUnitario = d.itens.length === 1
    ? `\nValor unitário: ${formatBRL(credito ? d.itens[0].unitarioCredito : d.itens[0].unitarioPix)}`
    : "";
  const prazoTexto = `${d.prazoDias || 0} ${d.prazoDias === 1 ? "dia útil" : "dias úteis"}`;
  const previsaoTexto = d.previsaoEntrega ? ` (previsão: ${orcDataISOParaBR(d.previsaoEntrega)})` : "";
  return `*LUZ MARIANA — ORÇAMENTO Nº ${d.numero || "—"}*\n\n` +
    `*Data do orçamento:* ${orcDataISOParaBR(d.dataOrcamento)}\n` +
    `*Validade do orçamento:* ${orcDataISOParaBR(d.validadeOrcamento)}\n\n` +
    `*Cliente:* ${d.nome || "—"}\n` +
    `*Telefone:* ${d.telefone || "N/A"}\n\n` +
    `*Detalhamento do pedido:*\n${itens || "—"}\n` +
    `------------------------------\n` +
    `Subtotal: ${formatBRL(d.total)}${valorUnitario}\n` +
    `*Valor total: ${formatBRL(d.total)}*\n` +
    `------------------------------\n` +
    `*Prazo de entrega:* ${prazoTexto}${previsaoTexto}\n` +
    `*Forma de pagamento:* ${pagamento}\n` +
    `Pix / Espécie possui valor promocional. No crédito, valor calculado para pagamento em até 3x.\n\n` +
    `*Luz Mariana — Artigos Religiosos e Devoção*\n` +
    `Siga nossa loja no Instagram https://instagram.com/luzmariana.art\n` +
    `_Uma empresa da marca Iluminart RN_`;
}

function payloadOrcamento(d) {
  return {
    cliente_nome: d.nome,
    telefone: d.telefone || null,
    data_orcamento: d.dataOrcamento,
    validade_orcamento: d.validadeOrcamento || null,
    prazo_dias: Number(d.prazoDias || 0),
    previsao_entrega: d.previsaoEntrega || null,
    pagamento: d.pagamento,
    itens: d.itens,
    subtotal: round2(d.subtotal),
    total_pix: round2(d.totalPix),
    total_credito: round2(d.totalCredito),
    total_final: round2(d.total),
    acrescimo: round2(d.acrescimo),
  };
}

async function salvarOrcamentoSupabase() {
  if (orcamentoState.saving) return;
  const d = obterDadosOrcamento();
  if (!d.nome) { alert("Informe o nome do cliente."); return; }
  if (!d.itens.length) { alert("Adicione pelo menos um item ao pedido."); return; }
  if (d.itens.some((i) => !i.pedido)) { alert("Informe o nome de todos os itens do pedido."); return; }

  const btn = document.getElementById("orc-save-btn");
  orcamentoState.saving = true;
  if (btn) { btn.disabled = true; btn.textContent = "Salvando..."; }

  try {
    // Cliente do orçamento: se já existir no cadastro, reutiliza. Se for
    // novo, cadastra automaticamente antes de salvar o primeiro orçamento.
    await garantirClienteDoOrcamento(d);

    let saved;
    if (orcamentoState.editingId) {
      const numeroAtual = Number(state.orcamentos.find((o) => o.id === orcamentoState.editingId)?.numero || d.numero);
      const texto = gerarTextoOrcamento({ ...d, numero: orcNumeroFormatado(numeroAtual) });
      const { data, error } = await supabaseClient
        .from("orcamentos")
        .update({ ...payloadOrcamento(d), texto_gerado: texto })
        .eq("id", orcamentoState.editingId)
        .select("*")
        .single();
      if (error) throw error;
      saved = data;
      orcamentoState.generatedText = texto;
    } else {
      // O banco atribui o número oficial por IDENTITY, evitando duplicidade
      // mesmo se Bob e Helena salvarem orçamentos ao mesmo tempo.
      const { data, error } = await supabaseClient
        .from("orcamentos")
        .insert({ ...payloadOrcamento(d), criado_por: state.currentUser?.id || null })
        .select("*")
        .single();
      if (error) throw error;
      saved = data;
      const numeroOficial = orcNumeroFormatado(saved.numero);
      const texto = gerarTextoOrcamento({ ...d, numero: numeroOficial });
      const { data: updated, error: textError } = await supabaseClient
        .from("orcamentos")
        .update({ texto_gerado: texto })
        .eq("id", saved.id)
        .select("*")
        .single();
      if (textError) throw textError;
      saved = updated;
      orcamentoState.generatedText = texto;
      orcamentoState.editingId = saved.id;
    }

    const idx = state.orcamentos.findIndex((o) => o.id === saved.id);
    if (idx >= 0) state.orcamentos[idx] = saved;
    else state.orcamentos.unshift(saved);
    state.orcamentos.sort((a, b) => Number(b.numero) - Number(a.numero));
    await loadProximoNumeroOrcamento();
    renderOrcamentos(document.getElementById("main-content"));
    alert(`Orçamento ${orcNumeroFormatado(saved.numero)} salvo no Supabase.`);
  } catch (err) {
    console.error("Salvar orçamento:", err);
    alert("Não foi possível salvar o orçamento no Supabase: " + (err?.message || "erro desconhecido"));
    if (btn) { btn.disabled = false; btn.textContent = orcamentoState.editingId ? "Salvar alterações" : "Gerar e salvar orçamento"; }
  } finally {
    orcamentoState.saving = false;
  }
}

async function novoOrcamentoPainel() {
  orcamentoState.editingId = null;
  orcamentoState.generatedText = "";
  await loadProximoNumeroOrcamento();

function montarItemVendaManualDoOrcamento(item, pagamento) {
  const source = item.source || item.origem || (item.productId || item.product_id ? "catalogo" : "manual");
  const productId = item.productId || item.product_id || null;
  const variantId = item.variantId || item.variant_id || null;
  const product = productId ? state.products.find((p) => String(p.id) === String(productId)) : null;
  const variant = variantId && product
    ? (product.product_variants ?? []).find((v) => String(v.id) === String(variantId))
    : null;

  // Se o produto foi apagado/desativado depois do orçamento, ele ainda
  // pode virar item manual no pedido, preservando descrição e preço.
  const catalogoValido = source === "catalogo" && !!product;
  const nome = catalogoValido ? product.name : (item.pedido || item.product_name || "Item do orçamento");
  let variantName = catalogoValido && variant ? variant.name : null;
  // Orçamentos antigos podem não ter variantId salvo. Nesse caso a
  // descrição já contém o texto que foi apresentado ao cliente e é
  // mantida como nome do item em vez de tentar adivinhar uma variação.
  if (catalogoValido && !variant && item.variantName) variantName = item.variantName;

  const pix = Number(item.unitarioPix ?? item.unitario ?? 0);
  const credito = Number(item.unitarioCredito ?? (pix > 0 ? orcPrecoCreditoAPartirDoPix(pix) : 0));
  return {
    product_id: catalogoValido ? product.id : null,
    product_name: catalogoValido && variantName ? product.name : nome,
    variant_id: catalogoValido && variant ? variant.id : null,
    variant_name: catalogoValido ? variantName : null,

}

function lancarPedidoDoOrcamentoAberto() {
  const row = orcamentoState.editingId
    ? state.orcamentos.find((o) => String(o.id) === String(orcamentoState.editingId))
    : null;
  if (!row) {
    alert("Abra um orçamento salvo antes de lançar o pedido.");
    return;
  }

  // Usa os valores que estão na tela neste momento. Assim, se a pessoa
  // fez um pequeno ajuste antes de lançar, a Venda manual abre igual ao
  // que ela está vendo. Salvar o orçamento continua sendo uma ação
  // separada — este botão não altera o orçamento automaticamente.
  const d = obterDadosOrcamento();
  if (!d.nome) { alert("Informe o nome do cliente antes de lançar o pedido."); return; }
  if (!d.itens.length) { alert("O orçamento precisa ter pelo menos um item."); return; }

  const phoneKey = orcTelefoneChave(d.telefone);
  const customer = state.customers.find((c) => phoneKey && orcTelefoneChave(c.whatsapp) === phoneKey)
    || state.customers.find((c) => orcNormalizarBusca(c.name) === orcNormalizarBusca(d.nome));

  vendaManualState = {
    open: true,
    items: d.itens.map((it) => montarItemVendaManualDoOrcamento(it, d.pagamento)),
    customerName: d.nome,
    customerWhatsapp: d.telefone || customer?.whatsapp || "",
    customerInstagram: customer?.instagram || "",
    notes: `Originado do orçamento nº ${orcNumeroFormatado(row.numero)}.`,
    payment: d.pagamento === "credito" ? "credito" : "pix",
    couponCode: "",
    appliedCoupon: null,
    sourceOrcamentoId: row.id,
    sourceOrcamentoNumero: row.numero,
    _selectedProductId: null,
    _selectedVariantId: null,
    _qty: "1",
  };

  // A Venda manual já vive na área Caixa. Mudamos para essa aba e o
  // próprio renderCaixa abre o overlay preenchido acima.
  state.tab = "caixa";
  renderApp();
}

function copiarTextoOrcamento(texto) {
  if (!texto) return;
  navigator.clipboard.writeText(texto).then(() => alert("Texto copiado!")).catch(() => prompt("Copie o texto:", texto));
}

function copiarOrcamentoSalvo(id) {
  const row = state.orcamentos.find((o) => String(o.id) === String(id));
  if (!row) return;
  const texto = row.texto_gerado || gerarTextoOrcamento(orcRowToData(row));
  copiarTextoOrcamento(texto);
}

async function excluirOrcamento(id) {
  const row = state.orcamentos.find((o) => String(o.id) === String(id));
  if (!row) return;
  if (!confirm(`Excluir o orçamento ${orcNumeroFormatado(row.numero)}? O número não será reutilizado.`)) return;
  const { error } = await supabaseClient.from("orcamentos").delete().eq("id", row.id);
  if (error) { alert("Não foi possível excluir: " + error.message); return; }
  state.orcamentos = state.orcamentos.filter((o) => o.id !== row.id);
  if (orcamentoState.editingId === row.id) {
    orcamentoState.editingId = null;
    orcamentoState.generatedText = "";
  }
  await loadProximoNumeroOrcamento();
  renderOrcamentos(document.getElementById("main-content"));
}

function cashReservePlan(currentBalance) {
  const settings = caixaState.reserveSettings || loadProfitSplitSettings();
  const ownerPercent = Math.max(0, Math.min(100, Number(settings.ownerPercent ?? 30)));
  const reinvestPercent = 100 - ownerPercent;

  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

  // A divisão considera somente pedidos realmente pagos neste mês.
  // Pedido cancelado e brinde não entram porque não geram lucro disponível.
  const paidOrdersThisMonth = state.orders.filter((o) =>
    o.status !== "cancelado" &&
    o.payment_method !== "brinde" &&
    !!o.paid_at &&
    String(o.paid_at).slice(0, 7) === ym
  );

  let revenue = 0;
  let costs = 0;
  let cardFees = 0;
  let profit = 0;
  let hasApproxCost = false;

  paidOrdersThisMonth.forEach((o) => {
    const c = orderCost(o);
    const split = orderMoneySplit(o, c);
    revenue += Number(o.total || 0);
    costs += Number(split.costToKeep || 0);
    cardFees += Number(split.cardFee || 0);
    profit += Number(split.profit || 0);
    if (c.isApprox) hasApproxCost = true;
  });

  revenue = round2(revenue);
  costs = round2(costs);
  cardFees = round2(cardFees);
  profit = round2(profit);
  const distributableProfit = Math.max(0, profit);

  // Primeiro o custo da venda fica preservado para a operação.
  // Taxa de cartão também é tratada como dinheiro indisponível.
  // Depois, apenas o LUCRO líquido é dividido entre reinvestimento e retirada.
  const ownerTarget = round2(distributableProfit * ownerPercent / 100);
  const reinvestment = round2(distributableProfit - ownerTarget);
  const storeKeepTarget = round2(costs + cardFees + reinvestment);

  // Retiradas efetivamente registradas no Caixa no mês.
  const ownerWithdrawn = round2(
    state.cashEntries
      .filter((e) =>
        e.entry_type === "saida" &&
        e.category === "Retirada do proprietário" &&
        !!e.paid_at &&
        e.entry_date.startsWith(ym)
      )
      .reduce((sum, e) => sum + Number(e.amount || 0), 0)
  );

  const ownerRemainingByRule = round2(Math.max(0, ownerTarget - ownerWithdrawn));

  // Proteção extra: mesmo que a regra permita uma retirada, nunca sugere
  // retirar dinheiro que faria o Caixa cair abaixo de "custo + reinvestimento".
  const freeCashAfterStoreReserve = round2(Math.max(0, Number(currentBalance || 0) - storeKeepTarget));
  const ownerAvailableNow = round2(Math.min(ownerRemainingByRule, freeCashAfterStoreReserve));
  const ownerOverdrawn = round2(Math.max(0, ownerWithdrawn - ownerTarget));

  return {
    settings: { ownerPercent, reinvestPercent },
    paidOrdersCount: paidOrdersThisMonth.length,
    revenue,
    costs,
    cardFees,
    hasApproxCost,
    profit,
    ownerTarget,
    reinvestment,
    storeKeepTarget,
    ownerWithdrawn,
    ownerRemainingByRule,
    ownerAvailableNow,
    freeCashAfterStoreReserve,
    ownerOverdrawn,
  };
}

            <p class="mt-1 text-2xl font-semibold">${formatBRL(periodoTotals.saidas)}</p>
          </div>
          <div class="rounded-xl bg-navy-900 px-5 py-4 text-cream-50 shadow">
            <p class="text-xs uppercase tracking-wide opacity-80">Saldo do período${caixaState.eventFilter ? "" : " selecionado"}</p>
            <p class="mt-1 text-2xl font-semibold ${periodoTotals.saldo >= 0 ? "" : "text-red-300"}">${formatBRL(periodoTotals.saldo)}</p>
          </div>
        </div>
      ` : ""}

      ${eventoResumoData ? `
        <div class="rounded-xl border border-gold-300 bg-white p-4 shadow">
          <h2 class="mb-3 text-sm font-semibold text-navy-900">Panorama do evento — ${escapeHtml(caixaState.eventFilter)}${eventoResumoData.numDias > 1 ? ` (${eventoResumoData.numDias} dias)` : ""}</h2>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div class="rounded-xl bg-navy-900 px-4 py-3 text-cream-50">
              <p class="text-xs uppercase tracking-wide opacity-80">Total vendido</p>
              <p class="mt-1 text-xl font-semibold">${formatBRL(eventoResumoData.totalEntradas)}</p>
            </div>
            <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-red-700">
              <p class="text-xs uppercase tracking-wide opacity-80">Total de custos/saídas</p>
              <p class="mt-1 text-xl font-semibold">${formatBRL(eventoResumoData.totalSaidas)}</p>
            </div>
            <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-emerald-800">
              <p class="text-xs uppercase tracking-wide opacity-80">Lucro do evento</p>
              <p class="mt-1 text-xl font-semibold ${eventoResumoData.lucro >= 0 ? "" : "text-red-700"}">${formatBRL(eventoResumoData.lucro)}</p>
            </div>
          </div>
          ${eventoResumoData.numDias > 1 ? `
            <div class="mt-4">
              <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-navy-500">Por dia</p>
              <ul class="flex flex-col gap-1 text-sm">
                ${eventoResumoData.diasList.map(([dia, v]) => `
                  <li class="flex items-center justify-between border-b border-navy-50 pb-1.5 last:border-0">
                    <span class="text-navy-600">${formatDate(dia)}</span>
                    <span class="text-navy-900">+${formatBRL(v.entradas)} <span class="text-red-600">-${formatBRL(v.saidas)}</span> <b>= ${formatBRL(round2(v.entradas - v.saidas))}</b></span>
                  </li>
                `).join("")}
              </ul>
            </div>
          ` : ""}
          ${eventoResumoData.porPagamentoList.length > 0 ? `
            <div class="mt-4">
              <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-navy-500">Por forma de pagamento</p>
              <ul class="flex flex-col gap-1 text-sm">
                ${eventoResumoData.porPagamentoList.map(([metodo, total]) => `
                  <li class="flex items-center justify-between border-b border-navy-50 pb-1.5 last:border-0">
                    <span class="capitalize text-navy-600">${escapeHtml(metodo)}</span>
                    <span class="font-medium text-navy-900">${formatBRL(total)}</span>
                  </li>
                `).join("")}
              </ul>
            </div>
          ` : ""}
        </div>
      ` : ""}

      <div id="entry-form-slot"></div>

      <div class="overflow-x-auto rounded-xl border border-navy-100 bg-white shadow">
        <table class="w-full min-w-[820px] text-sm">
          <thead>
            <tr class="border-b border-navy-100 bg-navy-900 text-left text-xs uppercase tracking-wide text-cream-50">
              <th class="px-3 py-3">Data</th>
              <th class="px-3 py-3">Tipo</th>
              <th class="px-3 py-3">Categoria</th>
              <th class="px-3 py-3">Descrição</th>
              <th class="px-3 py-3">Pagamento</th>
              <th class="px-3 py-3 text-center">Pago</th>
              <th class="px-3 py-3 text-right">Valor</th>
              <th class="px-3 py-3 text-right">Saldo</th>
              <th class="px-3 py-3 text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            ${filteredEntries.length === 0 ? `<tr><td colspan="9" class="px-4 py-8 text-center text-navy-400">Nenhum lançamento ainda.</td></tr>` : filteredEntries.map((e) => `
              <tr class="border-b border-navy-50 last:border-0 hover:bg-cream-50">
                <td class="px-3 py-2.5">${formatDate(e.entry_date)}</td>
                <td class="px-3 py-2.5"><span class="rounded-full px-2 py-0.5 text-xs font-medium ${e.entry_type === "entrada" ? "bg-emerald-100 text-emerald-800" : "bg-red-100 text-red-700"}">${e.entry_type === "entrada" ? "Entrada" : "Saída"}</span></td>
                <td class="px-3 py-2.5">${escapeHtml(e.category) || "—"}</td>
                <td class="px-3 py-2.5 text-navy-600">
                  ${escapeHtml(e.description) || "—"}
                  ${e.customer_id ? `<div class="mt-0.5 text-xs font-normal text-navy-400">Cliente: ${escapeHtml(state.customers.find((c) => c.id === e.customer_id)?.name ?? "(removido)")}</div>` : ""}
                  ${e.supplier_id ? `<div class="mt-0.5 text-xs font-normal text-navy-400">Fornecedor: ${escapeHtml(state.suppliers.find((s) => s.id === e.supplier_id)?.name ?? "(removido)")}</div>` : ""}
                  ${e.event_tag ? `<div class="mt-0.5"><span class="rounded-full bg-gold-100 px-1.5 py-0.5 text-[10px] font-semibold text-gold-800">📅 ${escapeHtml(e.event_tag)}</span></div>` : ""}
                  ${e.materials_used && e.materials_used.length > 0 ? `<div class="mt-0.5 text-xs font-normal text-navy-400">Materiais: ${e.materials_used.map((mu) => `${escapeHtml(mu.materials?.name ?? "(material removido)")} (${Number(mu.quantity)} ${escapeHtml(mu.materials?.unit ?? "")})`).join(", ")}</div>` : ""}
                  ${adminName(e.created_by) ? `<div class="mt-0.5 text-xs font-normal text-navy-400">${e.entry_type === "entrada" ? "Vendido" : "Registrado"} por: <span class="font-medium text-navy-600">${escapeHtml(adminName(e.created_by))}</span></div>` : ""}
                </td>
                <td class="px-3 py-2.5 capitalize">${escapeHtml(e.payment_method) || "—"}</td>
                <td class="px-3 py-2.5 text-center">
                  <label class="inline-flex items-center gap-1.5" title="${e.paid_at ? `Pago em ${formatDate(e.paid_at.slice(0, 10))}` : "Ainda não foi pago (ex: compra por consignação) — não entra no Saldo atual até ser marcado como pago."}">
                    <input type="checkbox" data-cash-paid-toggle="${e.id}" ${e.paid_at ? "checked" : ""} class="cash-paid-toggle-cb h-3.5 w-3.5 rounded border-navy-300 text-emerald-600 focus:ring-emerald-400" />
                    ${!e.paid_at ? `<span class="rounded-full bg-amber-100 px-1.5 py-0.5 text-[10px] font-medium text-amber-700">Não pago</span>` : ""}
                  </label>
                </td>
                <td class="px-3 py-2.5 text-right font-medium ${e.entry_type === "entrada" ? "text-emerald-700" : "text-red-700"}">${e.entry_type === "entrada" ? "+" : "-"}${formatBRL(e.amount)}</td>
                <td class="px-3 py-2.5 text-right font-semibold text-navy-900">${formatBRL(e.running_balance)}</td>
                <td class="px-3 py-2.5 text-center">
                  <div class="flex justify-center gap-2">
                    <button data-edit="${e.id}" class="edit-entry-btn rounded px-2 py-1 text-xs font-medium text-navy-700 hover:bg-navy-100">Editar</button>
                    <button data-delete="${e.id}" class="delete-entry-btn rounded px-2 py-1 text-xs font-medium text-red-600 hover:bg-red-50">Excluir</button>
                  </div>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const reserveToggleBtn = document.getElementById("cash-reserve-settings-toggle");
  if (reserveToggleBtn) {
    reserveToggleBtn.addEventListener("click", () => {
      caixaState.reserveOpen = !caixaState.reserveOpen;
      renderCaixa(container);
    });
  }

  const ownerPercentInput = document.getElementById("cash-owner-percent");
  if (ownerPercentInput) {
    ownerPercentInput.addEventListener("input", () => {
      const raw = Number(ownerPercentInput.value);
      const owner = Math.max(0, Math.min(100, Number.isFinite(raw) ? raw : 0));
      const preview = document.getElementById("cash-reinvest-preview");
      if (preview) preview.textContent = `${(100 - owner).toLocaleString("pt-BR")}%`;
    });
  }

  const reserveSaveBtn = document.getElementById("cash-reserve-save-settings");
  if (reserveSaveBtn) {
    reserveSaveBtn.addEventListener("click", () => {
      const ownerRaw = Number(document.getElementById("cash-owner-percent")?.value ?? 30);
      const ownerPercent = Math.max(0, Math.min(100, Number.isFinite(ownerRaw) ? ownerRaw : 30));
      caixaState.reserveSettings = { ownerPercent };
      saveProfitSplitSettings(caixaState.reserveSettings);
      renderCaixa(container);
    });
  }

  const reserveResetBtn = document.getElementById("cash-reserve-reset-settings");
  if (reserveResetBtn) {
    reserveResetBtn.addEventListener("click", () => {
      caixaState.reserveSettings = { ownerPercent: 30 };
      saveProfitSplitSettings(caixaState.reserveSettings);
      renderCaixa(container);
    });
  }

  const ownerWithdrawToggle = document.getElementById("cash-owner-withdraw-toggle");
  if (ownerWithdrawToggle) {
    ownerWithdrawToggle.addEventListener("click", () => {
      caixaState.withdrawOpen = !caixaState.withdrawOpen;
      renderCaixa(container);
    });
  }

  const ownerWithdrawSave = document.getElementById("cash-owner-withdraw-save");
  if (ownerWithdrawSave) {
    ownerWithdrawSave.addEventListener("click", async () => {
      const input = document.getElementById("cash-owner-withdraw-amount");
      const errorEl = document.getElementById("cash-owner-withdraw-error");
      const raw = String(input?.value || "").trim().replace(/\./g, "").replace(",", ".");
      const amount = Number(raw);
      const currentPlan = cashReservePlan(entries[0]?.running_balance ?? 0);

      if (!Number.isFinite(amount) || amount <= 0) {
        errorEl.textContent = "Informe um valor válido para a retirada.";
        return;
      }
      if (amount > currentPlan.ownerAvailableNow + 0.009) {
        errorEl.textContent = `Pela divisão atual e pelo saldo do Caixa, o máximo recomendado agora é ${formatBRL(currentPlan.ownerAvailableNow)}.`;
        return;
      }

      ownerWithdrawSave.disabled = true;
      ownerWithdrawSave.textContent = "Registrando...";

      const { error } = await supabaseClient.from("cash_entries").insert({
        entry_type: "saida",
        entry_date: todayISO(),
        amount: round2(amount),
        category: "Retirada do proprietário",
        description: `Retirada do proprietário — ${currentPlan.settings.ownerPercent}% do lucro`,
        payment_method: "pix",
        paid_at: new Date().toISOString(),
        created_by: state.currentUser.id,
      });

      if (error) {
        errorEl.textContent = "Não foi possível registrar a retirada: " + error.message;
        ownerWithdrawSave.disabled = false;
        ownerWithdrawSave.textContent = "Registrar retirada";
        return;
      }

      caixaState.withdrawOpen = false;
      await loadCashEntries();
      renderCaixa(container);
    });
  }

  document.getElementById("new-entry-btn").addEventListener("click", () => {
    caixaState.editingId = null;
    caixaState.formOpen = !caixaState.formOpen;
    renderCaixa(container);
  });
  document.getElementById("new-brinde-btn").addEventListener("click", () => {
    brindeState = { open: true, items: [], giftWraps: [], name: "", whatsapp: "", instagram: "", notes: "" };
    renderBrindeOverlay();
  });
  document.getElementById("vm-open-btn").addEventListener("click", () => {
    vendaManualState = {
      open: true, items: [],
      customerName: "", customerWhatsapp: "", customerInstagram: "", notes: "",
      payment: "pix", couponCode: "", appliedCoupon: null,
      sourceOrcamentoId: null, sourceOrcamentoNumero: null,
      _selectedProductId: null, _selectedVariantId: null, _qty: "1",
    };
    renderVendaManualOverlay();
  });
  document.getElementById("sim-open-btn").addEventListener("click", () => {
    simulateState = { open: true, items: [], payment: "pix", _selectedProductId: null, _selectedVariantId: null, _qty: "1" };
    renderSimulateOverlay();
  });
  document.getElementById("ev-open-btn").addEventListener("click", () => {
    eventoVendaState = { open: true, eventName: eventModeState.name, date: todayISO(), payment: "pix", items: [], _selectedProductId: null, _selectedVariantId: null, _qty: "1" };
    renderEventoVendaOverlay();
  });
  const evModeStopBtn = document.getElementById("ev-mode-stop-btn");
  if (evModeStopBtn) {
    evModeStopBtn.addEventListener("click", () => {
      if (!confirm(`Encerrar o modo evento "${eventModeState.name}"? As vendas já lançadas continuam no Caixa normalmente — isso só para de pré-preencher o nome em novas vendas.`)) return;
      eventModeState = { active: false, name: "" };
      saveEventModeToStorage();
      renderCaixa(container);
    });
  }
  const eventFilterSelect = document.getElementById("caixa-event-filter");
  if (eventFilterSelect) {
    eventFilterSelect.addEventListener("change", () => {
      caixaState.eventFilter = eventFilterSelect.value;
      renderCaixa(container);
    });
  }
  document.getElementById("caixa-start-date").addEventListener("change", (e) => {
    caixaState.startDate = e.target.value;
    renderCaixa(container);
  });
  document.getElementById("caixa-end-date").addEventListener("change", (e) => {
    caixaState.endDate = e.target.value;
    renderCaixa(container);
  });
  const caixaFilterClearBtn = document.getElementById("caixa-filter-clear");
  if (caixaFilterClearBtn) {
    caixaFilterClearBtn.addEventListener("click", () => {
      caixaState.startDate = "";
      caixaState.endDate = "";
      caixaState.eventFilter = "";
      renderCaixa(container);
    });
  }
  container.querySelectorAll(".edit-entry-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      caixaState.editingId = btn.dataset.edit;
      caixaState.formOpen = true;
      renderCaixa(container);
    });
  });
  container.querySelectorAll(".delete-entry-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Excluir este lançamento? Se tinha materiais vinculados, eles voltam pro estoque.")) return;
      await supabaseClient.from("cash_entries").delete().eq("id", btn.dataset.delete);
      if (caixaState.editingId === btn.dataset.delete) { caixaState.editingId = null; caixaState.formOpen = false; }
      await Promise.all([loadCashEntries(), loadMaterials()]);
      renderCaixa(container);
    });
  });
  container.querySelectorAll(".cash-paid-toggle-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.cashPaidToggle;
      cb.disabled = true;
      const { error } = await supabaseClient.from("cash_entries").update({
        paid_at: cb.checked ? new Date().toISOString() : null,
        updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
      }).eq("id", id);
      if (error) { alert("Não foi possível atualizar o pagamento: " + error.message); }
      await loadCashEntries();
      renderCaixa(container);
    });
  });

  if (caixaState.formOpen) {
    const editingEntry = caixaState.editingId ? entries.find((e) => e.id === caixaState.editingId) : null;
    renderEntryForm(activeProducts, editingEntry);
  }
  if (brindeState.open) renderBrindeOverlay();
  if (simulateState.open) renderSimulateOverlay();
  if (eventoVendaState.open) renderEventoVendaOverlay();
  if (vendaManualState.open) renderVendaManualOverlay();
}

/* =====================================================================
   ABA: ESTOQUE (compras de estoque, separado do resto do Caixa)
   ===================================================================== */
function renderEstoque(container) {
  const stockEntries = [...state.cashEntries]
    .filter((e) => e.category === "Compra de estoque")
    .sort((a, b) => (a.entry_date < b.entry_date ? 1 : a.entry_date > b.entry_date ? -1 : 0));

  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const monthTotal = stockEntries.filter((e) => e.entry_date.startsWith(ym)).reduce((s, e) => s + Number(e.amount), 0);

  // Dívida em compras de estoque: junta os lançamentos ainda NÃO PAGOS
  // (consignação) agrupados pela MESMA compra (purchase_batch_id) — pra
  // mostrar, detalhado, quanto falta pagar de cada compra (não só o
  // total solto). Lançamento antigo sem purchase_batch_id (de antes
  // dessa coluna existir) vira seu próprio grupo sozinho, pra não sumir
  // da lista.
  const groupByBatch = {};
  const stockDebtGroups = [];
  stockEntries.filter((e) => !e.paid_at).forEach((e) => {
    const key = e.purchase_batch_id || `sem-lote-${e.id}`;
    if (!groupByBatch[key]) {
      groupByBatch[key] = { key, entries: [], date: e.entry_date, supplierId: e.supplier_id, total: 0 };
      stockDebtGroups.push(groupByBatch[key]);
    }
    groupByBatch[key].entries.push(e);
    groupByBatch[key].total += Number(e.amount);
  });
  stockDebtGroups.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)); // mais recente primeiro
  const stockDebtTotal = stockDebtGroups.reduce((s, g) => s + g.total, 0);

  function stockRowProductName(e) {
    const product = state.products.find((p) => p.id === e.product_id);
    return product ? product.name : (e.product_id ? "(produto removido)" : "—");
  }

  container.innerHTML = `
    <div class="flex flex-col gap-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-xl font-semibold text-navy-900">Estoque</h1>
          <p class="text-sm text-navy-500">Compras de estoque — separado do Caixa, com controle de pago/não pago (consignação).</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="new-pedido-btn" type="button" class="rounded-lg border border-navy-300 bg-white px-4 py-2 text-sm font-semibold text-navy-800 shadow-sm transition hover:bg-navy-50" title="Marque os itens na coluna 📤 da tabela abaixo e clique aqui pra montar o pedido detalhado (com os dados que já estão lançados) e enviar pro fornecedor no WhatsApp — não lança nada no Caixa.">📤 Fazer pedido${estoqueState.pedidoSelection.length > 0 ? ` (${estoqueState.pedidoSelection.length})` : ""}</button>
          <button id="new-stock-purchase-btn" class="rounded-lg bg-gold-500 px-4 py-2 text-sm font-semibold text-navy-900 shadow transition hover:bg-gold-400">📦 Nova compra de estoque</button>
        </div>
      </div>

      <div id="pedido-slot"></div>
      <div id="stock-purchase-slot"></div>
      <div id="stock-entry-edit-slot"></div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="rounded-xl border border-navy-100 bg-white px-5 py-4 shadow">
          <p class="text-xs uppercase tracking-wide text-navy-400">Comprado este mês</p>
          <p class="mt-1 text-2xl font-semibold text-navy-900">${formatBRL(monthTotal)}</p>
        </div>
        <button id="stock-debt-btn" type="button" class="rounded-xl border ${stockDebtTotal > 0 ? "border-amber-300 bg-amber-50" : "border-navy-100 bg-white"} px-5 py-4 text-left shadow transition hover:shadow-md" title="Compras de estoque lançadas como 'não pago' (consignação), ainda sem marcar como pagas. Clique pra ver o detalhe por compra.">
          <p class="text-xs uppercase tracking-wide ${stockDebtTotal > 0 ? "text-amber-700" : "text-navy-400"} opacity-80">Dívida em compras de estoque</p>
          <p class="mt-1 text-2xl font-semibold ${stockDebtTotal > 0 ? "text-amber-800" : "text-navy-400"}">${formatBRL(stockDebtTotal)}</p>
        </button>
      </div>

      ${estoqueState.stockDebtOpen ? `
        <div id="stock-debt-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
          <div class="flex max-h-[85vh] w-full max-w-2xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
            <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">
              <div>
                <h2 class="text-lg font-semibold text-navy-900">Dívida em compras de estoque</h2>
                <p class="text-xs text-navy-500">Compras lançadas como "não pago" (consignação), agrupadas por compra, com todos os itens detalhados.</p>
              </div>
              <button id="close-stock-debt-btn" type="button" class="rounded px-2 py-1 text-navy-500 hover:bg-navy-100">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto px-5 py-4">
              ${stockDebtGroups.length === 0 ? `
                <p class="py-8 text-center text-sm text-navy-400">Nenhuma dívida em compras de estoque no momento.</p>
              ` : `
                <div class="flex flex-col gap-3">
                  ${stockDebtGroups.map((g) => {
                    const groupSupplier = g.supplierId ? state.suppliers.find((s) => s.id === g.supplierId) : null;
                    const canSend = !!groupSupplier && !!waLink(groupSupplier.phone);
                    return `
                    <div class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2.5">
                      <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <span class="text-sm font-semibold text-navy-900">${formatDate(g.date)}${groupSupplier ? ` · ${escapeHtml(groupSupplier.name)}` : g.supplierId ? " · (fornecedor removido)" : ""}</span>
                        <span class="text-sm font-semibold text-amber-800">${formatBRL(g.total)}</span>
                      </div>
                      <div class="mt-1.5 flex flex-col gap-0.5">
                        ${g.entries.map((e) => `
                          <span class="text-xs text-navy-600">• ${escapeHtml(e.description) || "—"} <span class="text-navy-400">(${formatBRL(e.amount)})</span></span>
                        `).join("")}
                      </div>
                      <div class="mt-2 flex flex-wrap gap-2">
                        <button type="button" data-mark-batch-paid data-batch-ids="${g.entries.map((e) => e.id).join(",")}" class="mark-batch-paid-btn rounded-lg border border-emerald-300 bg-white px-3 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-50">Marcar esta compra como paga</button>
                        <button type="button" data-enviar-batch-supplier="${g.supplierId ?? ""}" ${canSend ? "" : "disabled"} class="enviar-batch-fornecedor-btn rounded-lg border px-3 py-1.5 text-xs font-semibold ${canSend ? "border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50" : "cursor-not-allowed border-navy-200 bg-white text-navy-300"}" title="${!g.supplierId ? "Esta compra não tem fornecedor vinculado" : !canSend ? "Cadastre um telefone válido pra esse fornecedor" : "Manda no WhatsApp todos os itens pendentes deste fornecedor (não só desta compra)"}">Enviar pro fornecedor (WhatsApp)</button>
                      </div>
                    </div>
                  `;
                  }).join("")}

  });
  document.getElementById("new-pedido-btn").addEventListener("click", () => {
    // "Fazer pedido" não abre um formulário em branco — ele pega os itens
    // JÁ MARCADOS na coluna "📤" da tabela (dados já lançados: produto,
    // modelo, quantidade, custo) e monta o pedido a partir deles, pra não
    // precisar redigitar nada.
    if (estoqueState.pedidoSelection.length === 0) {
      alert("Marque ao menos um item na coluna \"📤\" da tabela abaixo pra incluir no pedido.");
      return;
    }
    const selectedEntries = stockEntries.filter((e) => estoqueState.pedidoSelection.includes(e.id));
    const supplierIds = [...new Set(selectedEntries.map((e) => e.supplier_id).filter(Boolean))];
    if (supplierIds.length === 0) {
      alert("Nenhum dos itens marcados tem um fornecedor vinculado. Edite o lançamento (botão \"Editar\") e associe um fornecedor antes de fazer o pedido.");
      return;
    }
    if (supplierIds.length > 1) {
      alert("Os itens marcados são de fornecedores diferentes. Marque itens de um só fornecedor por vez pra fazer o pedido.");
      return;
    }
    const supplier = state.suppliers.find((s) => s.id === supplierIds[0]);
    if (!supplier) { alert("Fornecedor não encontrado."); return; }
    if (!waLink(supplier.phone)) {
      alert("Este fornecedor não tem um telefone válido cadastrado — cadastre um telefone antes de fazer o pedido.");
      return;
    }
    pedidoState = {
      open: true,
      supplierId: supplier.id,
      notes: "",
      items: selectedEntries.map((e) => ({
        entryId: e.id,
        productName: stockRowProductName(e),
        variantName: e.variant_name || null,
        quantity: e.quantity != null ? Number(e.quantity) : null,
        unitCost: e.unit_cost != null ? Number(e.unit_cost) : null,
      })),

    renderPedidoOverlay();
