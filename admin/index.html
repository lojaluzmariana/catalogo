/* =====================================================================
   REGRAS DE PRECIFICAÇÃO (mesma lógica validada contra os 13 produtos
   originais da Luz Mariana — ver scripts/verify_pricing.mjs no projeto)
   ===================================================================== */
const CARD_FEE = 0.05;
const CREDIT_DIVISOR = (1 - 0.45) * (1 - CARD_FEE); // 0.5225 — margem mín. 45% no crédito
const PROMO_DIVISOR = 1 - 0.40; // 0.60 — margem mín. 40% no pix/promo

function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function niceFloor(raw) {
  const base = Math.floor(raw);
  const candidates = [base - 1 + 0.9, base + 0.0, base + 0.5, base + 0.9];
  let best = null;
  for (const c of candidates) if (c <= raw + 1e-9 && (best === null || c > best)) best = c;
  return round2(best);
}

function niceCeil(raw) {
  const base = Math.floor(raw);
  const candidates = [base + 0.0, base + 0.5, base + 0.9, base + 1.0];
  let best = null;
  for (const c of candidates) if (c >= raw - 1e-9 && (best === null || c < best)) best = c;
  return round2(best);
}

function calculatePricing(cost) {
  const creditPrice = niceFloor(cost / CREDIT_DIVISOR);
  const creditNet = round2(creditPrice * (1 - CARD_FEE));
  const creditProfit = round2(creditNet - cost);
  const creditMarkup = cost > 0 ? round2(creditNet / cost) : 0;
  const creditMargin = creditNet > 0 ? round2(creditProfit / creditNet) : 0;

  const promoPrice = niceCeil(cost / PROMO_DIVISOR);
  const promoProfit = round2(promoPrice - cost);
  const promoMargin = promoPrice > 0 ? round2(promoProfit / promoPrice) : 0;

  return {
    cost, creditPrice, creditNet, creditProfit, creditMarkup, creditMargin,
    promoPrice, promoProfit, promoMargin,
  };
}

function formatBRL(v) {

function formatPercent(v) {

}
function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tz).toISOString().slice(0, 10);
}
function escapeHtml(str) {

}
function formatKB(bytes) {

}

/* ---------------------------------------------------------------------
   Redimensiona/comprime uma foto no navegador antes de enviar — evita
   fotos de celular de vários MB deixando o catálogo pesado. Reduz pro
   maior lado caber em maxDim (mantendo proporção) e exporta como JPEG.
   --------------------------------------------------------------------- */
function resizeImageToBlob(file, maxDim = 1000, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; // fundo branco (fotos com transparência viram JPEG)
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => {
        if (blob) resolve(blob); else reject(new Error("Não foi possível processar a imagem."));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Não foi possível ler a imagem.")); };
    img.src = url;
  });
}

  const { data: profile } = await supabaseClient.from("admin_users").select("id, name").eq("id", uid).single();

}

                    ${p.description ? `<span title="Tem descrição cadastrada" class="text-[10px]">📝</span>` : ""}
                    ${p.product_variants && p.product_variants.length > 0 ? `<span title="${p.product_variants.length} modelo(s) cadastrado(s)" class="rounded-full bg-gold-100 px-1 py-0.5 text-[9px] font-semibold text-gold-700">${p.product_variants.length} modelo${p.product_variants.length > 1 ? "s" : ""}</span>` : ""}
                    ${p.in_stock ? `<span title="Em estoque — pronta entrega" class="rounded-full bg-emerald-100 px-1 py-0.5 text-[9px] font-semibold text-emerald-700">✓ estoque</span>` : `<span title="Sob encomenda — catálogo avisa prazo de 2 dias" class="rounded-full bg-navy-100 px-1 py-0.5 text-[9px] font-semibold text-navy-500">sob encomenda</span>`}

                  ${p.product_materials && p.product_materials.length > 0 ? `<div class="mt-0.5 text-[10px] font-normal text-navy-400">Inclui: ${p.product_materials.map((pm) => escapeHtml(pm.materials?.name ?? "")).join(", ")}</div>` : ""}

                <td class="px-1 py-1.5 text-right whitespace-nowrap font-semibold text-navy-900">${formatBRL(p.credit_price)}</td>
                <td class="px-1 py-1.5 text-right whitespace-nowrap">${formatBRL(p.credit_net)}</td>
                <td class="px-1 py-1.5 text-right whitespace-nowrap text-emerald-700">${formatBRL(p.credit_profit)}</td>
                <td class="px-1 py-1.5 text-right whitespace-nowrap">${Number(p.credit_markup).toFixed(2)}x</td>
                <td class="px-1 py-1.5 text-right whitespace-nowrap">${formatPercent(p.credit_margin)}</td>
                <td class="px-1 py-1.5 text-right whitespace-nowrap font-semibold text-navy-900">${formatBRL(p.promo_price)}</td>
                <td class="px-1 py-1.5 text-right whitespace-nowrap text-emerald-700">${formatBRL(p.promo_profit)}</td>
                <td class="px-1 py-1.5 text-right whitespace-nowrap">${formatPercent(p.promo_margin)}</td>
                <td class="px-1 py-1.5 text-center">
                  <input type="checkbox" data-visible-toggle="${p.id}" ${p.show_in_catalog ? "checked" : ""} class="visible-toggle-cb h-3.5 w-3.5 rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
                </td>
                <td class="px-1 py-1.5 text-center">
                  <input type="checkbox" data-featured-toggle="${p.id}" ${p.featured ? "checked" : ""} class="featured-toggle-cb h-3.5 w-3.5 rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
                </td>
                <td class="px-1 py-1.5 text-center">
                  <div class="flex justify-center gap-1">
                    <button data-edit="${p.id}" title="Editar produto" class="edit-product-btn rounded px-1 py-0.5 text-sm text-navy-700 hover:bg-navy-100">✎</button>
                    <button data-toggle="${p.id}" data-active="${p.active}" title="${p.active ? "Desativar produto" : "Reativar produto"}" class="toggle-product-btn rounded px-1 py-0.5 text-sm ${p.active ? "text-red-600" : "text-emerald-700"} hover:bg-navy-100">${p.active ? "✕" : "↺"}</button>
                  </div>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById("show-inactive").addEventListener("change", (e) => {
    precifState.showInactive = e.target.checked;
    renderPrecificacao(container);
  });
  document.getElementById("new-product-btn").addEventListener("click", () => {
    precifState.editingId = null;
    precifState.formOpen = true;
    renderProductForm();
  });
  container.querySelectorAll(".edit-product-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      precifState.editingId = btn.dataset.edit;
      precifState.formOpen = true;
      renderProductForm();
    });
  });
  container.querySelectorAll(".toggle-product-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.toggle;
      const active = btn.dataset.active === "true";
      await supabaseClient.from("products").update({ active: !active, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadProducts();
      renderPrecificacao(container);
    });
  });
  container.querySelectorAll(".visible-toggle-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.visibleToggle;
      cb.disabled = true;
      await supabaseClient.from("products").update({ show_in_catalog: cb.checked, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadProducts();
      renderPrecificacao(container);
    });
  });
  container.querySelectorAll(".featured-toggle-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.featuredToggle;
      cb.disabled = true;
      await supabaseClient.from("products").update({ featured: cb.checked, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadProducts();
      renderPrecificacao(container);
    });
  });

  if (precifState.formOpen) renderProductForm();
}

function renderProductForm() {
  const slot = document.getElementById("product-form-slot");
  const product = precifState.editingId ? state.products.find((p) => p.id === precifState.editingId) : null;

  // Lista de materiais usados neste produto (estado local do formulário).
  const formMaterials = product && product.product_materials
    ? product.product_materials.map((pm) => ({
        material_id: pm.material_id,
        name: pm.materials?.name ?? "(material removido)",
        unit: pm.materials?.unit ?? "un",
        unit_cost: Number(pm.materials?.unit_cost ?? 0),
        quantity: Number(pm.quantity),
      }))
    : [];

  // Materiais "Essenciais" NUNCA entram aqui: eles não são uma cobrança
  // ao cliente (são um investimento nosso, já tratado à parte no Caixa e
  // no "Lucro real"/"Despesas"). Se entrassem no custo do produto, o
  // preço sugerido ao cliente (credit_price/promo_price) subiria por
  // causa deles — o que é exatamente o contrário do que foi pedido.
  const activeMaterials = state.materials.filter((m) => m.active && !isEssencial(m));

  // Lista de modelos/variações deste produto (estado local do formulário).
  const formVariants = product && product.product_variants
    ? [...product.product_variants]
        .sort((a, b) => (a.sort_order - b.sort_order) || a.name.localeCompare(b.name, "pt-BR"))
        .map((v) => ({ id: v.id, name: v.name, photoUrl: v.photo_url ?? null, originalPhotoUrl: v.photo_url ?? null, pendingPhoto: null }))
    : [];
  const deletedVariantPhotoUrls = [];

  slot.innerHTML = `
    <form id="product-form" class="flex flex-col gap-4 rounded-xl border border-gold-300 bg-white p-5 shadow">
      <div class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end">

        <div class="w-full sm:w-48">

          <input id="pf-base-cost" value="${product ? product.base_cost : "0"}" required inputmode="decimal"
            class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
            placeholder="0,00" />
          <p class="mt-1 text-xs text-navy-400">O custo do item em si, sem contar os materiais abaixo.</p>
        </div>
        <div class="w-full sm:w-56">
          <label class="mb-1 block text-sm font-medium text-navy-800">Categoria (opcional)</label>
          <select id="pf-category-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
            <option value="">— sem categoria —</option>
            ${[...new Set(state.products.map((p) => p.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR")).map((c) => `<option value="${escapeHtml(c)}" ${product?.category === c ? "selected" : ""}>${escapeHtml(c)}</option>`).join("")}
            <option value="__new__">+ Nova categoria...</option>
          </select>
          <input id="pf-category-new" class="mt-2 hidden w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="Nome da nova categoria" />
          <p class="mt-1 text-xs text-navy-400">Usada pra agrupar os produtos no Catálogo público.</p>
        </div>
        <div class="w-full sm:w-56">
          <label class="mb-1 block text-sm font-medium text-navy-800">Tag de material (opcional)</label>
          <select id="pf-material-tag-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
            <option value="">— sem tag —</option>
            ${[...new Set(state.products.map((p) => p.material_tag).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR")).map((t) => `<option value="${escapeHtml(t)}" ${product?.material_tag === t ? "selected" : ""}>${escapeHtml(t)}</option>`).join("")}
            <option value="__new__">+ Nova tag de material...</option>
          </select>
          <input id="pf-material-tag-new" class="mt-2 hidden w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="Ex: 3D, Plástico, Madeira..." />
          <p class="mt-1 text-xs text-navy-400">Etiqueta extra no Catálogo, ao lado da categoria (ex: "3D", "Plástico").</p>
        </div>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-navy-800">Descrição (opcional)</label>
        <textarea id="pf-description" rows="3"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="O que acompanha, material, tamanho, etc.">${product?.description ? escapeHtml(product.description) : ""}</textarea>
        <p class="mt-1 text-xs text-navy-400">Aparece no Catálogo público, embaixo do produto (o cliente pode expandir pra ler).</p>
      </div>

      <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">

        <div class="flex flex-wrap items-center gap-4">
          <img id="pf-photo-preview" src="${product?.photo_url ?? ""}" class="h-20 w-20 rounded-lg border border-navy-200 bg-white object-cover ${product?.photo_url ? "" : "hidden"}" />
          <div class="flex flex-col gap-1">
            <input type="file" id="pf-photo-input" accept="image/*" class="text-sm text-navy-700" />
            <p id="pf-photo-status" class="text-xs text-navy-400">A foto é redimensionada e comprimida automaticamente antes de enviar.</p>
            <button type="button" id="pf-photo-remove" class="self-start text-xs text-red-600 hover:underline ${product?.photo_url ? "" : "hidden"}">remover foto</button>
          </div>
        </div>
        <label class="mt-3 flex items-center gap-2 text-sm text-navy-700">
          <input type="checkbox" id="pf-show-catalog" ${product?.show_in_catalog ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
          Mostrar este produto no Catálogo público
        </label>
        <label class="mt-2 flex items-center gap-2 text-sm text-navy-700">
          <input type="checkbox" id="pf-featured" ${product?.featured ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
          Produto em destaque (aparece numa vitrine especial no topo do Catálogo)
        </label>
        <label class="mt-2 flex items-center gap-2 text-sm text-navy-700">
          <input type="checkbox" id="pf-in-stock" ${product?.in_stock ? "checked" : ""} class="rounded border-navy-300 text-gold-500 focus:ring-gold-400" />
          Em estoque (pronta entrega)
        </label>
        <p class="mt-1 text-xs text-navy-400">Desmarcado = sob encomenda: o Catálogo avisa o cliente "Prazo de 2 dias para fabricação, a contar da data do pedido".</p>
      </div>

      <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
        <p class="mb-1 text-sm font-medium text-navy-800">Modelos / Variações (opcional)</p>
        <p class="mb-3 text-xs text-navy-400">Se este produto vem em mais de um modelo (cor, tamanho etc.), cadastre cada um com o nome e a foto dele. No Catálogo, o cliente escolhe o modelo antes de comprar.</p>
        <div id="pf-variants-list" class="flex flex-col gap-2"></div>
        <button type="button" id="pf-variant-add" class="mt-3 rounded-lg border border-navy-300 px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100">+ Adicionar modelo</button>
      </div>

      <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
        <p class="mb-2 text-sm font-medium text-navy-800">Materiais usados (opcional)</p>
        <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-end">
          <div class="min-w-[200px] flex-1">
            <label class="mb-1 block text-xs font-medium text-navy-700">Material</label>
            <select id="pf-material-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
              <option value="">— selecione —</option>
              ${activeMaterials.map((m) => `<option value="${m.id}">${escapeHtml(m.name)} (${formatBRL(m.unit_cost)}/${escapeHtml(m.unit)})</option>`).join("")}
            </select>
          </div>
          <div class="w-full sm:w-32">
            <label class="mb-1 block text-xs font-medium text-navy-700">Quantidade</label>
            <input id="pf-material-qty" inputmode="decimal" placeholder="1" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
          </div>
          <button type="button" id="pf-material-add" class="w-full rounded-lg border border-navy-300 px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100 sm:w-auto">+ Adicionar</button>
        </div>
        <div id="pf-materials-list" class="mt-3 flex flex-col gap-1"></div>
      </div>

      <div id="pf-preview" class="flex flex-wrap gap-x-6 gap-y-1 rounded-lg bg-cream-50 px-4 py-2 text-xs text-navy-600"></div>
      <div id="pf-error" class="text-sm text-red-600"></div>
      <div class="flex gap-2">
        <button type="submit" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">Salvar</button>
        <button type="button" id="pf-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
      </div>
    </form>
  `;

  const baseCostField = document.getElementById("pf-base-cost");
  const materialSelect = document.getElementById("pf-material-select");
  const materialQtyField = document.getElementById("pf-material-qty");
  const materialsListEl = document.getElementById("pf-materials-list");
  const preview = document.getElementById("pf-preview");
  const photoInput = document.getElementById("pf-photo-input");
  const photoPreview = document.getElementById("pf-photo-preview");
  const photoStatus = document.getElementById("pf-photo-status");
  const photoRemoveBtn = document.getElementById("pf-photo-remove");
  const categorySelect = document.getElementById("pf-category-select");
  const categoryNewField = document.getElementById("pf-category-new");
  const materialTagSelect = document.getElementById("pf-material-tag-select");
  const materialTagNewField = document.getElementById("pf-material-tag-new");
  const variantsListEl = document.getElementById("pf-variants-list");

  // Estado local da foto: null = não mexeu, "remove" = tirar a foto atual,
  // ou um Blob já redimensionado/comprimido, pronto pra enviar.
  let pendingPhoto = null;

  categoryNewField.classList.toggle("hidden", categorySelect.value !== "__new__");
  categorySelect.addEventListener("change", () => {
    categoryNewField.classList.toggle("hidden", categorySelect.value !== "__new__");
    if (categorySelect.value === "__new__") {
      categoryNewField.focus();
    } else {
      categoryNewField.value = "";
    }
  });

  materialTagNewField.classList.toggle("hidden", materialTagSelect.value !== "__new__");
  materialTagSelect.addEventListener("change", () => {
    materialTagNewField.classList.toggle("hidden", materialTagSelect.value !== "__new__");
    if (materialTagSelect.value === "__new__") {
      materialTagNewField.focus();
    } else {
      materialTagNewField.value = "";
    }
  });

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files?.[0];
    if (!file) return;
    photoStatus.textContent = "Processando imagem...";
    try {
      const originalKB = file.size;
      const blob = await resizeImageToBlob(file);
      pendingPhoto = blob;
      photoPreview.src = URL.createObjectURL(blob);
      photoPreview.classList.remove("hidden");
      photoRemoveBtn.classList.remove("hidden");
      photoStatus.textContent = `Pronta pra enviar: ${formatKB(originalKB)} → ${formatKB(blob.size)} depois de comprimida.`;
    } catch (err) {
      photoStatus.textContent = "Não foi possível processar essa imagem: " + err.message;
      pendingPhoto = null;
    }
  });

  photoRemoveBtn.addEventListener("click", () => {
    pendingPhoto = "remove";
    photoInput.value = "";
    photoPreview.classList.add("hidden");
    photoRemoveBtn.classList.add("hidden");
    photoStatus.textContent = "A foto será removida ao salvar.";
  });

  function renderVariantsList() {
    variantsListEl.innerHTML = formVariants.length === 0
      ? `<p class="text-xs text-navy-400">Nenhum modelo cadastrado — deixe em branco se este produto não tiver variações.</p>`
      : formVariants.map((v, idx) => `
          <div class="flex flex-col gap-2 rounded-lg bg-white p-3 shadow-sm sm:flex-row sm:items-center">
            <img data-variant-preview="${idx}" src="${v.photoUrl ?? ""}" class="h-14 w-14 flex-shrink-0 rounded-lg border border-navy-200 bg-cream-50 object-cover ${v.photoUrl ? "" : "hidden"}" />
            <div class="flex-1">
              <input data-variant-name="${idx}" value="${escapeHtml(v.name)}" placeholder="Ex: Azul, Modelo P..."
                class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <input type="file" data-variant-photo="${idx}" accept="image/*" class="text-xs text-navy-700" />
              <button type="button" data-variant-remove-photo="${idx}" class="text-xs text-red-600 hover:underline ${v.photoUrl ? "" : "hidden"}">remover foto</button>
              <button type="button" data-variant-remove="${idx}" class="rounded border border-red-200 px-2 py-1 text-xs font-medium text-red-600 hover:bg-red-50">Remover modelo</button>
            </div>
          </div>
        `).join("");
    wireVariantRowEvents();
  }

  function wireVariantRowEvents() {
    variantsListEl.querySelectorAll("[data-variant-name]").forEach((input) => {
      input.addEventListener("input", () => {
        formVariants[Number(input.dataset.variantName)].name = input.value;
      });
    });
    variantsListEl.querySelectorAll("[data-variant-photo]").forEach((input) => {
      input.addEventListener("change", async () => {
        const idx = Number(input.dataset.variantPhoto);
        const file = input.files?.[0];
        if (!file) return;
        try {
          const blob = await resizeImageToBlob(file);
          formVariants[idx].pendingPhoto = blob;
          formVariants[idx].photoUrl = URL.createObjectURL(blob);
          const previewImg = variantsListEl.querySelector(`[data-variant-preview="${idx}"]`);
          previewImg.src = formVariants[idx].photoUrl;
          previewImg.classList.remove("hidden");
          variantsListEl.querySelector(`[data-variant-remove-photo="${idx}"]`).classList.remove("hidden");
        } catch (err) {
          document.getElementById("pf-error").textContent = "Não foi possível processar a foto desse modelo: " + err.message;
        }
      });
    });
    variantsListEl.querySelectorAll("[data-variant-remove-photo]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.variantRemovePhoto);
        formVariants[idx].pendingPhoto = "remove";
        formVariants[idx].photoUrl = null;
        renderVariantsList();
      });
    });
    variantsListEl.querySelectorAll("[data-variant-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.variantRemove);
        if (formVariants[idx].originalPhotoUrl) deletedVariantPhotoUrls.push(formVariants[idx].originalPhotoUrl);
        formVariants.splice(idx, 1);
        renderVariantsList();
      });
    });
  }

  renderVariantsList();
  document.getElementById("pf-variant-add").addEventListener("click", () => {
    formVariants.push({ id: null, name: "", photoUrl: null, originalPhotoUrl: null, pendingPhoto: null });
    renderVariantsList();
  });

  function materialsTotal() {
    return formMaterials.reduce((sum, m) => sum + m.unit_cost * m.quantity, 0);
  }

  function renderMaterialsList() {
    materialsListEl.innerHTML = formMaterials.length === 0
      ? `<p class="text-xs text-navy-400">Nenhum material vinculado ainda.</p>`
      : formMaterials.map((m, idx) => `
          <div class="flex items-center justify-between rounded-lg bg-white px-3 py-1.5 text-sm shadow-sm">
            <span>${escapeHtml(m.name)} — ${m.quantity} ${escapeHtml(m.unit)} × ${formatBRL(m.unit_cost)}</span>
            <span class="flex items-center gap-3">
              <b class="text-navy-900">${formatBRL(m.unit_cost * m.quantity)}</b>
              <button type="button" data-remove-idx="${idx}" class="pf-remove-material text-red-600 hover:underline">remover</button>
            </span>
          </div>
        `).join("");
    materialsListEl.querySelectorAll(".pf-remove-material").forEach((btn) => {
      btn.addEventListener("click", () => {
        formMaterials.splice(Number(btn.dataset.removeIdx), 1);
        renderMaterialsList();
        updatePreview();
      });
    });
  }

  function updatePreview() {
    const baseCost = Number(baseCostField.value.replace(",", "."));
    if (!Number.isFinite(baseCost) || baseCost < 0) { preview.innerHTML = ""; return; }
    const totalCost = round2(baseCost + materialsTotal());
    const p = calculatePricing(totalCost);
    preview.innerHTML = `
      <span>Custo total: <b class="text-navy-900">${formatBRL(totalCost)}</b></span>
      <span>Crédito: <b class="text-navy-900">${formatBRL(p.creditPrice)}</b> (${formatPercent(p.creditMargin)})</span>
      <span>Promo/Pix: <b class="text-navy-900">${formatBRL(p.promoPrice)}</b> (${formatPercent(p.promoMargin)})</span>
    `;
  }

  baseCostField.addEventListener("input", updatePreview);
  renderMaterialsList();
  updatePreview();

  document.getElementById("pf-material-add").addEventListener("click", () => {
    const materialId = materialSelect.value;
    const qty = Number(materialQtyField.value.replace(",", "."));
    const errorEl = document.getElementById("pf-error");
    if (!materialId) { errorEl.textContent = "Escolha um material."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Informe uma quantidade válida."; return; }
    errorEl.textContent = "";

    const material = state.materials.find((m) => m.id === materialId);
    const existing = formMaterials.find((m) => m.material_id === materialId);
    if (existing) {
      existing.quantity = qty;
    } else {
      formMaterials.push({ material_id: material.id, name: material.name, unit: material.unit, unit_cost: Number(material.unit_cost), quantity: qty });
    }
    materialSelect.value = "";
    materialQtyField.value = "";
    renderMaterialsList();
    updatePreview();
  });

  document.getElementById("pf-cancel").addEventListener("click", () => {
    precifState.formOpen = false;
    renderPrecificacao(document.getElementById("main-content"));
  });

  document.getElementById("product-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("pf-name").value.trim();
    const baseCost = Number(baseCostField.value.replace(",", "."));
    const errorEl = document.getElementById("pf-error");
    if (!name) { errorEl.textContent = "Informe o nome do produto."; return; }
    if (!Number.isFinite(baseCost) || baseCost < 0) { errorEl.textContent = "Custo base inválido."; return; }

    const totalCost = round2(baseCost + materialsTotal());
    const pricing = calculatePricing(totalCost);
    const showInCatalog = document.getElementById("pf-show-catalog").checked;
    const featured = document.getElementById("pf-featured").checked;
    const inStock = document.getElementById("pf-in-stock").checked;
    const categorySelected = categorySelect.value;
    if (categorySelected === "__new__" && !categoryNewField.value.trim()) {
      errorEl.textContent = "Digite o nome da nova categoria.";
      return;
    }
    const category = categorySelected === "__new__" ? categoryNewField.value.trim() : categorySelected;
    const materialTagSelected = materialTagSelect.value;
    if (materialTagSelected === "__new__" && !materialTagNewField.value.trim()) {
      errorEl.textContent = "Digite o nome da nova tag de material.";
      return;
    }
    const materialTag = materialTagSelected === "__new__" ? materialTagNewField.value.trim() : materialTagSelected;
    const description = document.getElementById("pf-description").value.trim();

    if (formVariants.some((v) => !v.name.trim())) {
      errorEl.textContent = "Preencha o nome de todos os modelos (ou remova a linha vazia).";
      return;
    }

    // Envia a foto nova (se houver) antes de salvar o produto.
    const oldPhotoUrl = product?.photo_url ?? null;
    let newPhotoUrl = oldPhotoUrl;
    if (pendingPhoto === "remove") {
      newPhotoUrl = null;
    } else if (pendingPhoto instanceof Blob) {
      const path = `${crypto.randomUUID()}.jpg`;
      const { error: uploadError } = await supabaseClient.storage.from("product-photos").upload(path, pendingPhoto, { contentType: "image/jpeg", upsert: false });
      if (uploadError) { errorEl.textContent = "Não foi possível enviar a foto: " + uploadError.message; return; }
      newPhotoUrl = supabaseClient.storage.from("product-photos").getPublicUrl(path).data.publicUrl;
    }

    // Envia as fotos novas dos modelos (se houver) antes de salvar o produto.
    for (const v of formVariants) {
      if (v.pendingPhoto === "remove") {
        v.finalPhotoUrl = null;
      } else if (v.pendingPhoto instanceof Blob) {
        const path = `variante-${crypto.randomUUID()}.jpg`;
        const { error: variantUploadError } = await supabaseClient.storage.from("product-photos").upload(path, v.pendingPhoto, { contentType: "image/jpeg", upsert: false });
        if (variantUploadError) { errorEl.textContent = `Não foi possível enviar a foto do modelo "${v.name}": ` + variantUploadError.message; return; }
        v.finalPhotoUrl = supabaseClient.storage.from("product-photos").getPublicUrl(path).data.publicUrl;
      } else {
        v.finalPhotoUrl = v.originalPhotoUrl;
      }
      if (v.originalPhotoUrl && v.originalPhotoUrl !== v.finalPhotoUrl) {
        deletedVariantPhotoUrls.push(v.originalPhotoUrl);
      }
    }

    const payload = {
      name, base_cost: baseCost, cost: pricing.cost,
      credit_price: pricing.creditPrice, credit_net: pricing.creditNet, credit_profit: pricing.creditProfit,
      credit_markup: pricing.creditMarkup, credit_margin: pricing.creditMargin,
      promo_price: pricing.promoPrice, promo_profit: pricing.promoProfit, promo_margin: pricing.promoMargin,
      photo_url: newPhotoUrl, show_in_catalog: showInCatalog, category: category || null, featured,
      in_stock: inStock,
      description: description || null, material_tag: materialTag || null,
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let productId = product?.id;
    if (product) {
      const result = await supabaseClient.from("products").update(payload).eq("id", product.id);
      if (result.error) { errorEl.textContent = result.error.message; return; }
    } else {
      const result = await supabaseClient.from("products").insert({ ...payload, created_by: state.currentUser.id }).select("id").single();
      if (result.error) { errorEl.textContent = result.error.message; return; }
      productId = result.data.id;
    }

    // Se trocou ou removeu a foto, apaga o arquivo antigo do Storage (evita acumular lixo).
    if (oldPhotoUrl && oldPhotoUrl !== newPhotoUrl) {
      const oldPath = oldPhotoUrl.split("/product-photos/")[1];
      if (oldPath) await supabaseClient.storage.from("product-photos").remove([oldPath]);
    }

    // Sincroniza os materiais vinculados: apaga os antigos e grava a lista atual.
    await supabaseClient.from("product_materials").delete().eq("product_id", productId);
    if (formMaterials.length > 0) {
      const rows = formMaterials.map((m) => ({ product_id: productId, material_id: m.material_id, quantity: m.quantity }));
      const { error: linkError } = await supabaseClient.from("product_materials").insert(rows);
      if (linkError) { errorEl.textContent = linkError.message; return; }
    }

    // Sincroniza os modelos/variações: apaga os antigos e grava a lista atual.
    await supabaseClient.from("product_variants").delete().eq("product_id", productId);
    if (formVariants.length > 0) {
      const variantRows = formVariants.map((v, idx) => ({ product_id: productId, name: v.name.trim(), photo_url: v.finalPhotoUrl ?? null, sort_order: idx }));
      const { error: variantError } = await supabaseClient.from("product_variants").insert(variantRows);
      if (variantError) { errorEl.textContent = variantError.message; return; }
    }

    // Apaga do Storage as fotos de modelos que foram trocadas ou removidas.
    for (const url of deletedVariantPhotoUrls) {
      const oldPath = url.split("/product-photos/")[1];
      if (oldPath) await supabaseClient.storage.from("product-photos").remove([oldPath]);
    }

    precifState.formOpen = false;
    await loadProducts();
    renderPrecificacao(document.getElementById("main-content"));
  });
}

          placeholder="Ex: 50" />
      </div>
      <div class="w-full sm:w-28">
        <label class="mb-1 block text-sm font-medium text-navy-800">Unidade</label>
        <select id="mf-unit" class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
          ${["un", "g", "m", "cm", "kg", "l"].map((u) => `<option value="${u}" ${material?.unit === u ? "selected" : ""}>${u}</option>`).join("")}
        </select>
      </div>
      <div class="w-full sm:w-32">
        <label class="mb-1 block text-sm font-medium text-navy-800">Estoque atual</label>
        <input id="mf-stock" value="${material ? Number(material.stock_qty) : "0"}" required inputmode="decimal"
          class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200"
          placeholder="0" />
        <p class="mt-1 text-xs text-navy-400">Some aqui quando comprar mais.</p>
      </div>
      <div class="w-full sm:w-56">
        <label class="mb-1 block text-sm font-medium text-navy-800">Tipo (opcional)</label>
        <select id="mf-type-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
          <option value="">— sem tipo —</option>
          ${[...new Set(state.materials.map((m) => m.type).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR")).map((t) => `<option value="${escapeHtml(t)}" ${material?.type === t ? "selected" : ""}>${escapeHtml(t)}</option>`).join("")}
          <option value="__new__">+ Novo tipo...</option>
        </select>
        <input id="mf-type-new" class="mt-2 hidden w-full rounded-lg border border-navy-200 px-3 py-2 outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="Ex: Embalagem" />
        <p class="mt-1 text-xs text-navy-400">Marque como "Embalagem" pra aparecer como opção de embalagem de presente no Catálogo, ou como "Essencial" pra insumos usados em toda venda (fio, cola, etiqueta...) que não são cobrados à parte do cliente.</p>

          placeholder="Ex: 0,5" />

        <button type="submit" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">Salvar</button>
        <button type="button" id="mf-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
      </div>

  `;

  const priceField = document.getElementById("mf-price");
  const qtyField = document.getElementById("mf-qty");
  const preview = document.getElementById("mf-preview");
  const unitSelect = document.getElementById("mf-unit");
  const typeSelect = document.getElementById("mf-type-select");
  const typeNewField = document.getElementById("mf-type-new");
  const qtyPerOrderField = document.getElementById("mf-qty-per-order-field");

  function currentTypeValue() {
    return typeSelect.value === "__new__" ? typeNewField.value.trim() : typeSelect.value;
  }
  function updateQtyPerOrderVisibility() {
    qtyPerOrderField.classList.toggle("hidden", !isEssencialTypeText(currentTypeValue()));
  }

  typeNewField.classList.toggle("hidden", typeSelect.value !== "__new__");
  updateQtyPerOrderVisibility();
  typeSelect.addEventListener("change", () => {
    typeNewField.classList.toggle("hidden", typeSelect.value !== "__new__");
    if (typeSelect.value === "__new__") {
      typeNewField.focus();
    } else {
      typeNewField.value = "";
    }
    updateQtyPerOrderVisibility();
  });
  typeNewField.addEventListener("input", updateQtyPerOrderVisibility);

  function updatePreview() {
    const price = Number(priceField.value.replace(",", "."));
    const qty = Number(qtyField.value.replace(",", "."));
    if (!Number.isFinite(price) || !Number.isFinite(qty) || qty <= 0) { preview.innerHTML = ""; return; }
    const unitCost = price / qty;
    preview.innerHTML = `Custo unitário: <b class="text-navy-900">${formatBRL(unitCost)}</b> / ${escapeHtml(unitSelect.value)}`;
  }
  priceField.addEventListener("input", updatePreview);
  qtyField.addEventListener("input", updatePreview);
  unitSelect.addEventListener("change", updatePreview);
  updatePreview();

  document.getElementById("mf-cancel").addEventListener("click", () => {
    materiaisState.formOpen = false;
    renderMateriais(document.getElementById("main-content"));
  });

  document.getElementById("material-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("mf-name").value.trim();
    const price = Number(priceField.value.replace(",", "."));
    const qty = Number(qtyField.value.replace(",", "."));
    const unit = unitSelect.value;
    const stock = Number(document.getElementById("mf-stock").value.replace(",", "."));
    const errorEl = document.getElementById("mf-error");
    if (!name) { errorEl.textContent = "Informe o nome do material."; return; }
    if (!Number.isFinite(price) || price < 0) { errorEl.textContent = "Preço inválido."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Quantidade inválida."; return; }
    if (!Number.isFinite(stock) || stock < 0) { errorEl.textContent = "Estoque inválido."; return; }

    const type = typeSelect.value === "__new__" ? typeNewField.value.trim() : typeSelect.value;
    if (typeSelect.value === "__new__" && !type) { errorEl.textContent = "Informe o nome do novo tipo, ou volte pra opção \"— sem tipo —\"."; return; }

    const isEssencialType = isEssencialTypeText(type);
    let qtyPerOrder = null;
    if (isEssencialType) {
      const qtyPerOrderRaw = document.getElementById("mf-qty-per-order").value.trim();
      if (qtyPerOrderRaw) {
        qtyPerOrder = Number(qtyPerOrderRaw.replace(",", "."));
        if (!Number.isFinite(qtyPerOrder) || qtyPerOrder < 0) { errorEl.textContent = "Quantidade usada por venda inválida."; return; }
      }
    }

    const unitCost = Math.round((price / qty) * 10000) / 10000; // 4 casas de precisão
    // Captura o estoque ANTERIOR antes de disparar o update — depois de
    // salvo, "material" não deve mais ser usado pra isso (o registro
    // local pode não refletir mais o valor de antes da edição).
    const previousStock = material ? Number(material.stock_qty) : 0;
    const payload = {
      name, package_price: price, package_qty: qty, unit, stock_qty: stock,
      type: type || null,
      qty_per_order: qtyPerOrder,
      unit_cost: unitCost,
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let result;
    if (material) {
      result = await supabaseClient.from("materials").update(payload).eq("id", material.id);
    } else {
      result = await supabaseClient.from("materials").insert({ ...payload, created_by: state.currentUser.id });
    }

    if (result.error) { errorEl.textContent = result.error.message; return; }

    // Material "Essencial" cujo estoque AUMENTOU: é uma compra nossa (não
    // uma cobrança ao cliente), então lança automaticamente uma "saída"
    // no Caixa no valor da compra. Só quando aumenta — reduzir estoque
    // (uso normal, correção de contagem etc.) não lança nada sozinho.
    const stockIncrease = stock - previousStock;
    if (isEssencialType && stockIncrease > 0) {
      const { error: cashError } = await supabaseClient.from("cash_entries").insert({
        entry_type: "saida",
        entry_date: new Date().toISOString().slice(0, 10),
        amount: Math.round(stockIncrease * unitCost * 100) / 100,
        category: "Material essencial",
        description: `Compra de ${name} (+${stockIncrease} ${unit})`,
        payment_method: null,
        created_by: state.currentUser.id,
      });
      if (cashError) {
        errorEl.textContent = `Material salvo, mas não foi possível lançar a despesa no Caixa: ${cashError.message}`;
      }
    }

    materiaisState.formOpen = false;
    await loadMaterials();
    await loadCashEntries();
    renderMateriais(document.getElementById("main-content"));
  });
}

      const active = btn.dataset.active === "true";
      await supabaseClient.from("customers").update({ active: !active, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadCustomers();
      renderClientes(container);
    });
  });
  container.querySelectorAll(".history-customer-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      clientesState.historyForId = clientesState.historyForId === btn.dataset.history ? null : btn.dataset.history;

      renderClientes(container);
    });
  });
  container.querySelectorAll(".delete-customer-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.delete;
      const customer = state.customers.find((c) => c.id === id);
      const hasSales = state.cashEntries.some((e) => e.customer_id === id);

/* =====================================================================
   ABA: PEDIDOS (feitos pelo Catálogo público)
   ===================================================================== */
const ORDER_STATUS_LABELS = { novo: "Novo", em_andamento: "Em andamento", concluido: "Concluído", cancelado: "Cancelado" };
const ORDER_STATUS_CLASSES = {
  novo: "bg-red-100 text-red-700",
  em_andamento: "bg-gold-100 text-gold-800",
  concluido: "bg-emerald-100 text-emerald-800",
  cancelado: "bg-navy-100 text-navy-500",
};

function waLink(phone) {
  const digits = String(phone ?? "").replace(/\D/g, "");
  return digits ? `https://wa.me/${digits}` : null;
}

// WhatsApp do fabricante que produz os produtos — usado no botão
// "Enviar ao fabricante" dos Pedidos aceitos.
const MANUFACTURER_WHATSAPP_NUMBER = "5584991677070";
// Mesma margem usada na view catalog_gift_wrap_options (preço cobrado =
// custo do material + 30%). Usada aqui só pra "desfazer a conta" quando
// precisamos estimar o custo de uma embalagem cujo material já foi
// apagado do cadastro (nesse caso não tem outro jeito de saber o custo).
const GIFT_WRAP_MARKUP = 0.3;

// Material do tipo "Essencial" (aceita singular ou plural — "Essencial"
// ou "Essenciais", maiúsculo/minúsculo tanto faz — plural em português
// não é só acrescentar "s", "-al" vira "-ais", então comparamos com as
// duas formas certas, não com startsWith) é um insumo usado em (quase)
// toda venda mas que não é cobrado à parte do cliente (ex: fio, cola,
// etiqueta). O custo dele entra como despesa fixa por pedido, e
// aumentar o estoque dele lança uma "saída" automática no Caixa.
function isEssencialTypeText(text) {
  const normalized = (text || "").trim().toLowerCase();
  return normalized === "essencial" || normalized === "essenciais";
}
function isEssencial(material) {
  return isEssencialTypeText(material.type);
}

// Custo real (materiais/insumos) de um pedido — não é o preço cobrado do
// cliente. Devolve o custo dividido em duas partes:
//   - productCost: custo dos produtos em si (produtos.cost, que já
//     inclui o custo base + os materiais que compõem o produto).
//   - materialsCost: custo ADICIONAL de materiais que não fazem parte do
//     produto — hoje, só as embalagens de presente escolhidas no pedido
//     (o custo do material, não o preço com markup de 30% cobrado do
//     cliente).
//
// IMPORTANTE: usa o custo ATUAL cadastrado do produto/material. Se o
// custo mudou desde que o pedido foi feito, o valor aqui reflete o custo
// de HOJE, não o de quando a venda aconteceu — não temos um "retrato"
// histórico do custo salvo no pedido. Quando um produto ou material do
// pedido não é mais encontrado no cadastro, marca a parte afetada como
// aproximada (isProductApprox / isMaterialsApprox) pra deixar isso
// visível pro admin — só na parte que realmente foi estimada.
function orderCost(order) {
  let isProductApprox = false;
  let isMaterialsApprox = false;

  const productCost = (order.items ?? []).reduce((sum, it) => {
    const product = state.products.find((p) => p.id === it.product_id);
    if (!product) { isProductApprox = true; return sum; }
    return sum + Number(product.cost) * it.quantity;
  }, 0);

  const giftWrapCost = (order.giftWraps ?? []).reduce((sum, g) => {
    const material = g.material_id ? state.materials.find((m) => m.id === g.material_id) : null;
    if (material) return sum + Number(material.unit_cost) * g.quantity;
    // Material apagado do cadastro: estima o custo "desfazendo" o markup
    // de 30% em cima do preço que foi cobrado do cliente na hora da venda.
    isMaterialsApprox = true;
    return sum + (Number(g.unit_price) / (1 + GIFT_WRAP_MARKUP)) * g.quantity;
  }, 0);

  // Materiais "Essenciais" (fio, cola, etiqueta...) não são escolhidos
  // pedido a pedido como a embalagem de presente — são um custo fixo que
  // entra em TODA venda, no valor cadastrado em "quantidade usada por
  // venda". Usa o cadastro ATUAL (mesma ressalva de "custo de hoje, não
  // de quando a venda aconteceu" do resto da função).
  const essentialsCost = state.materials
    .filter((m) => m.active && isEssencial(m) && Number(m.qty_per_order) > 0)
    .reduce((sum, m) => sum + Number(m.unit_cost) * Number(m.qty_per_order), 0);

  const materialsCost = giftWrapCost + essentialsCost;

  return {
    productCost, materialsCost, cost: productCost + materialsCost,
    // Custo "sem essenciais" — usado no lançamento de saída do Caixa ao
    // Iniciar venda. O custo do material Essencial já vira uma saída no
    // Caixa quando ele é COMPRADO (estoque aumentado, em Materiais); se
    // lançássemos de novo aqui, a cada venda, estaríamos descontando o
    // mesmo gasto duas vezes do saldo do Caixa. Embalagem de presente
    // não tem esse lançamento na compra, então continua entrando aqui.
    costExcludingEssentials: productCost + giftWrapCost,
    giftWrapCost, essentialsCost,
    isProductApprox, isMaterialsApprox, isApprox: isProductApprox || isMaterialsApprox,
  };
}

// Mesma regra usada no Catálogo público (ver MADE_TO_ORDER_TEXT em
// index.html): produto sob encomenda leva 2 dias corridos a contar da
// data do pedido. Aqui calculamos o prazo de entrega do pedido inteiro:
// se todo item já está "Em estoque", é pronta entrega; se algum item é
// sob encomenda, o prazo do pedido é o do item mais demorado (sempre 2
// dias, já que só existe esse prazo hoje) a contar de quando o pedido
// foi feito. Produto que sumiu do cadastro é tratado como sob encomenda,
// por segurança (não dá pra saber se tinha estoque).
const MADE_TO_ORDER_DAYS = 2;
function orderDeliveryDeadline(order) {
  const items = order.items ?? [];
  if (items.length === 0) return null;
  const anyMadeToOrder = items.some((it) => {
    const product = state.products.find((p) => p.id === it.product_id);
    return !product || !product.in_stock;
  });
  if (!anyMadeToOrder) return { ready: true, date: null };
  const date = new Date(order.created_at);
  date.setDate(date.getDate() + MADE_TO_ORDER_DAYS);
  return { ready: false, date };
}

function formatDateTime(dateLike) {
  const d = new Date(dateLike);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// Prazo de entrega combinado com o fabricante: 2 dias corridos a partir
// da data em que o pedido entrou.
function manufacturerDeadline(order) {
  const created = new Date(order.created_at);
  const deadline = new Date(created.getTime() + 2 * 24 * 60 * 60 * 1000);
  const d = String(deadline.getDate()).padStart(2, "0");
  const m = String(deadline.getMonth() + 1).padStart(2, "0");
  const y = deadline.getFullYear();
  return `${d}/${m}/${y}`;
}

// Foto do item do pedido: usa a foto do modelo/variação escolhido, se
// tiver, senão a foto padrão do produto.
function orderItemPhoto(item) {
  const product = state.products.find((p) => p.id === item.product_id);
  if (!product) return null;
  if (item.variant_name && product.product_variants) {
    const variant = product.product_variants.find((v) => v.name === item.variant_name);
    if (variant && variant.photo_url) return variant.photo_url;
  }
  return product.photo_url || null;
}

// Link de pré-visualização da foto do item: em vez de mandar o link
// direto do Supabase Storage (que o WhatsApp não consegue pré-visualizar),
// passa pela nossa função "product-photo", que gera uma página com as
// tags corretas pra a miniatura aparecer sozinha no balão da conversa.
function orderItemPhotoPreviewUrl(item, order) {
  const photo = orderItemPhoto(item);
  if (!photo) return null;
  const nome = item.variant_name ? `${item.product_name} (${item.variant_name})` : item.product_name;
  const params = new URLSearchParams({
    src: photo,
    nome: nome,
    pedido: String(order.order_number ?? ""),
  });
  return `${SUPABASE_URL}/functions/v1/product-photo?${params.toString()}`;
}

// Mensagem pro fabricante: identificação da loja, nome do produto, a
// variação (cor/modelo) quando tiver, foto (com miniatura automática no
// WhatsApp) e prazo — nunca preço (o fabricante não precisa saber quanto
// o cliente pagou), e não inclui as embalagens de presente (isso a loja
// resolve por conta própria, não é o fabricante que produz).
function buildManufacturerMessage(order) {
  const lines = [];
  lines.push(`${STORE_NAME} - ${STORE_SUBTITLE}`);
  lines.push(`CNPJ: ${STORE_CNPJ}`);
  lines.push("");
  lines.push(`Novo pedido para produção — Nº ${String(order.order_number ?? "").padStart(6, "0")}`);
  lines.push(`Pedido recebido em: ${formatDateTime(order.created_at)}`);
  lines.push(`Prazo para entrega: ${manufacturerDeadline(order)}`);
  lines.push("");
  lines.push("Itens:");
  (order.items ?? []).forEach((it) => {
    lines.push(`• ${it.quantity}x ${it.product_name}`);
    if (it.variant_name) lines.push(`  Variação: ${it.variant_name}`);
    const photoPreview = orderItemPhotoPreviewUrl(it, order);
    if (photoPreview) lines.push(`  Foto: ${photoPreview}`);
  });
  return lines.join("\n");
}

async function loadOrders() {
  const { data, error } = await supabaseClient.from("orders").select("*").order("created_at", { ascending: false });
  if (error) { console.error("loadOrders:", error.message); return; }

  const { data: items, error: err2 } = await supabaseClient.from("order_items").select("*");
  if (err2) console.error("loadOrders itens:", err2.message);

  const { data: giftWraps, error: err3 } = await supabaseClient.from("order_gift_wraps").select("*");
  if (err3) console.error("loadOrders embalagens:", err3.message);

  const byOrder = {};
  (items || []).forEach((row) => { (byOrder[row.order_id] ||= []).push(row); });
  const giftWrapsByOrder = {};
  (giftWraps || []).forEach((row) => { (giftWrapsByOrder[row.order_id] ||= []).push(row); });

  state.orders = data.map((o) => ({ ...o, items: byOrder[o.id] || [], giftWraps: resolveOrderGiftWraps(o, giftWrapsByOrder[o.id]) }));
}

// A embalagem de presente de um pedido pode vir em duas formas: a nova
// (uma linha por embalagem em order_gift_wraps, permite mais de uma) ou,
// só pra pedidos feitos antes dessa tabela existir, os campos antigos
// direto em orders (gift_wrap_material_id/_name/_price, sempre um só).
function resolveOrderGiftWraps(order, rows) {
  if (rows && rows.length > 0) return rows;
  if (order.gift_wrap_material_name) {
    return [{
      material_id: order.gift_wrap_material_id,
      material_name: order.gift_wrap_material_name,
      quantity: 1,
      unit_price: order.gift_wrap_price ?? 0,
    }];
  }
  return [];
}

/* =====================================================================
   COMPROVANTE NÃO FISCAL (PDF) — um "reciboszinho" por pedido, no
   estilo de uma nota de balcão (mas sem valor fiscal — é só uma cópia
   organizada pra você gerenciar os pedidos fora do painel).

   Cada pedido vira uma página no tamanho de um cupom (80mm de largura,
   altura ajustada ao conteúdo daquele pedido especificamente).
   ===================================================================== */
const RECEIPT_PAGE_WIDTH_MM = 80;
const RECEIPT_MARGIN_MM = 5;

function buildReceiptLinePlan(order) {
  const lines = [];
  const push = (text, opts = {}) => lines.push({ text, size: 8, style: "normal", align: "center", gap: 4, ...opts });

  push(STORE_NAME, { size: 13, style: "bold", gap: 5.4 });
  push(STORE_SUBTITLE, { size: 8, gap: 3.8 });
  push(STORE_INSTAGRAM, { size: 8, gap: 3.8 });
  push(`CNPJ: ${STORE_CNPJ}`, { size: 8, gap: 5 });
  lines.push({ divider: true, gap: 4 });

  push(`Comprovante de Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")}`, { size: 9.5, style: "bold", gap: 4.6 });
  push(`Data: ${formatDateTime(order.created_at)}`, { align: "left", gap: 4 });
  push(`Status: ${ORDER_STATUS_LABELS[order.status] ?? order.status}`, { align: "left", gap: 4 });
  lines.push({ divider: true, gap: 4 });

  push(`Cliente: ${order.customer_name}`, { align: "left", gap: 4, wrap: true });
  push(`WhatsApp: ${order.customer_whatsapp}`, { align: "left", gap: 4 });
  if (order.customer_instagram) push(`Instagram: @${order.customer_instagram.replace(/^@/, "")}`, { align: "left", gap: 4 });
  lines.push({ divider: true, gap: 4 });

  push("ITENS", { align: "left", style: "bold", gap: 4.6 });
  (order.items ?? []).forEach((it) => {
    const variantLabel = it.variant_name ? ` (${it.variant_name})` : "";
    push(`${it.quantity}x ${it.product_name}${variantLabel}`, { align: "left", gap: 3.8, wrap: true });
    push(formatBRL(it.unit_price * it.quantity), { align: "right", gap: 4.4 });
  });
  (order.giftWraps ?? []).forEach((g) => {
    push(`${g.quantity}x ${g.material_name} (embalagem p/ presente)`, { align: "left", gap: 3.8, wrap: true });
    push(formatBRL(g.unit_price * g.quantity), { align: "right", gap: 4.4 });
  });
  lines.push({ divider: true, gap: 4 });

  push(`TOTAL: ${formatBRL(order.total)}`, { size: 11, style: "bold", align: "right", gap: 5.6 });
  push(`Forma de pagamento: ${order.payment_method === "credito" ? "Cartão de crédito" : "Pix / à vista"}`, { align: "left", gap: 4, wrap: true });
  if (order.notes) {
    push("Observações:", { align: "left", gap: 3.8 });
    push(order.notes, { align: "left", gap: 3.8, wrap: true });
  }
  lines.push({ divider: true, gap: 4 });

  push("Obrigado pela preferência!", { style: "bold", gap: 4.4 });
  push("Este comprovante não possui valor fiscal.", { size: 6.5, gap: 3 });

  return lines;
}

// Resolve as linhas que precisam quebrar em várias (opts.wrap) em
// entradas simples de texto — assim dá pra medir a altura total ANTES
// de criar a página com o tamanho certo.
function expandReceiptLines(doc, plan, usableWidth) {
  const expanded = [];
  plan.forEach((line) => {
    if (line.divider || !line.wrap) { expanded.push(line); return; }
    doc.setFont("courier", line.style === "bold" ? "bold" : line.style === "italic" ? "italic" : "normal");
    doc.setFontSize(line.size);
    const wrapped = doc.splitTextToSize(String(line.text), usableWidth);
    wrapped.forEach((piece) => expanded.push({ ...line, text: piece, wrap: false }));
  });
  return expanded;
}

function drawReceiptPage(doc, order, pageWidth) {
  const usableWidth = pageWidth - RECEIPT_MARGIN_MM * 2;
  const plan = buildReceiptLinePlan(order);
  const expanded = expandReceiptLines(doc, plan, usableWidth);
  const topMargin = 6;
  const bottomMargin = 4;
  const totalHeight = topMargin + expanded.reduce((sum, l) => sum + l.gap, 0) + bottomMargin;

  doc.internal.pageSize.setWidth(pageWidth);
  doc.internal.pageSize.setHeight(totalHeight);

  let y = topMargin;
  expanded.forEach((line) => {
    if (line.divider) {
      doc.setLineDashPattern([0.6, 0.6], 0);
      doc.setDrawColor(150);
      doc.line(RECEIPT_MARGIN_MM, y - 2.6, pageWidth - RECEIPT_MARGIN_MM, y - 2.6);
      doc.setLineDashPattern([], 0);
      y += line.gap;
      return;
    }
    doc.setFont("courier", line.style === "bold" ? "bold" : line.style === "italic" ? "italic" : "normal");
    doc.setFontSize(line.size);
    doc.setTextColor(20);
    const x = line.align === "left" ? RECEIPT_MARGIN_MM : line.align === "right" ? pageWidth - RECEIPT_MARGIN_MM : pageWidth / 2;
    doc.text(line.text, x, y, { align: line.align });
    y += line.gap;
  });

  return totalHeight;
}

function buildOrdersReceiptPdf(orders) {
  const { jsPDF } = window.jspdf;
  // Cria já com o tamanho certo pro primeiro pedido (o construtor exige
  // um tamanho inicial — ajustamos a altura de cada página na hora de
  // desenhar, inclusive a primeira).
  const doc = new jsPDF({ unit: "mm", format: [RECEIPT_PAGE_WIDTH_MM, 200] });
  orders.forEach((order, idx) => {
    if (idx > 0) doc.addPage([RECEIPT_PAGE_WIDTH_MM, 200]);
    drawReceiptPage(doc, order, RECEIPT_PAGE_WIDTH_MM);
  });
  return doc;
}

// Acha o cliente cadastrado cujo WhatsApp bate com o do pedido, comparando
// só os dígitos (assim funciona mesmo se um tiver "+55" e o outro não).
function findCustomerByPhone(phone) {
  const digits = String(phone ?? "").replace(/\D/g, "");
  if (!digits) return null;
  return state.customers.find((c) => String(c.whatsapp ?? "").replace(/\D/g, "") === digits) ?? null;
}

// "Iniciar venda": gera o lançamento correspondente no Caixa a partir de
// um pedido do Catálogo (evita ter que digitar tudo de novo à mão). Se o
// pedido tinha embalagem de presente escolhida, já vincula o material
// usado também (o que dá baixa automática no estoque).
async function iniciarVenda(order) {
  if (state.cashEntries.some((e) => e.order_id === order.id)) {
    alert("Esse pedido já tem uma venda registrada no Caixa.");
    return;
  }

  const itemsDesc = [
    ...(order.items ?? []).map((it) => `${it.quantity}x ${it.product_name}${it.variant_name ? ` (${it.variant_name})` : ""}`),
    ...(order.giftWraps ?? []).map((g) => `${g.quantity}x ${g.material_name} (embalagem)`),
  ].join(", ");
  const customer = findCustomerByPhone(order.customer_whatsapp);

  const payload = {
    entry_type: "entrada",
    entry_date: new Date().toISOString().slice(0, 10),
    amount: order.total,
    category: "Venda",
    description: `Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")} — ${itemsDesc}`,
    payment_method: order.payment_method,
    customer_id: customer ? customer.id : null,
    order_id: order.id,
    created_by: state.currentUser.id,
  };

  const { data: inserted, error } = await supabaseClient.from("cash_entries").insert(payload).select("id").single();
  if (error) { alert("Não foi possível registrar a venda no Caixa: " + error.message); return; }

  // Junto com a entrada, lança também a saída do custo (produto +
  // embalagem de presente) desse pedido — assim o Caixa reflete o lucro
  // de verdade, não só o valor cobrado do cliente. NÃO inclui o custo de
  // materiais "Essenciais": esse já vira saída no Caixa quando o
  // material é COMPRADO (em Materiais, ao aumentar o estoque) — somar de
  // novo aqui descontaria o mesmo gasto duas vezes do saldo do Caixa.
  // Sem lançar se der zero (a tabela não aceita saída de R$ 0,00).
  const cost = orderCost(order);
  if (cost.costExcludingEssentials > 0) {
    const custoPayload = {
      entry_type: "saida",
      entry_date: new Date().toISOString().slice(0, 10),
      amount: Math.round(cost.costExcludingEssentials * 100) / 100,
      category: "Custo do pedido",
      description: `Custo (produto + embalagem) do Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")}${cost.isApprox ? " (estimado — produto ou material não está mais cadastrado)" : ""}`,
      payment_method: null,
      customer_id: customer ? customer.id : null,
      order_id: order.id,
      created_by: state.currentUser.id,
    };
    const { error: custoError } = await supabaseClient.from("cash_entries").insert(custoPayload);
    if (custoError) console.error("iniciarVenda custo:", custoError.message);
  }

  const giftWrapRows = (order.giftWraps ?? [])
    .filter((g) => g.material_id && state.materials.some((m) => m.id === g.material_id))
    .map((g) => {
      const material = state.materials.find((m) => m.id === g.material_id);
      return { cash_entry_id: inserted.id, material_id: material.id, quantity: g.quantity, unit_cost: material.unit_cost };
    });
  if (giftWrapRows.length > 0) {
    const { error: linkError } = await supabaseClient.from("cash_entry_materials").insert(giftWrapRows);
    if (linkError) console.error("iniciarVenda materiais:", linkError.message);
  }

  if (order.status === "novo") {
    await supabaseClient.from("orders").update({
      status: "em_andamento", updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    }).eq("id", order.id);
  }

  await Promise.all([loadCashEntries(), loadMaterials(), loadOrders()]);
  renderPedidos(document.getElementById("main-content"));
}

function renderPedidos(container) {
  // Ordenação da lista, por aba:
  //   - "Em andamento": ordem CRONOLÓGICA (mais antigo primeiro) — é a
  //     fila de produção/entrega: mostra qual pedido foi recebido
  //     primeiro e, portanto, deve ser entregue primeiro.
  //   - Outras abas: pedidos NÃO pagos ficam em evidência, no topo da
  //     lista — o resto mantém a ordem normal (mais recente primeiro,
  //     como já vem de loadOrders). Array.prototype.sort é estável em
  //     todo navegador moderno, então essa ordenação secundária é
  //     preservada.
  const visible = state.orders
    .filter((o) => o.status === pedidosState.tab)
    .sort((a, b) => pedidosState.tab === "em_andamento"
      ? new Date(a.created_at) - new Date(b.created_at)
      : Number(!!a.paid_at) - Number(!!b.paid_at));
  // Limpa da seleção qualquer pedido que não existe mais na lista atual.
  [...pedidosState.selected].forEach((id) => { if (!state.orders.some((o) => o.id === id)) pedidosState.selected.delete(id); });
  const selectedCount = pedidosState.selected.size;
  const allVisibleSelected = visible.length > 0 && visible.every((o) => pedidosState.selected.has(o.id));

  // Custo (não confundir com o valor cobrado do cliente) de cada pedido
  // visível, calculado uma vez só aqui e reaproveitado tanto no card
  // individual quanto na soma dos pedidos selecionados.
  const orderCosts = new Map(visible.map((o) => [o.id, orderCost(o)]));
  const deliveryDeadlines = new Map(visible.map((o) => [o.id, orderDeliveryDeadline(o)]));
  const selectedIds = [...pedidosState.selected];
  const selectedProductCostTotal = selectedIds.reduce((sum, id) => sum + (orderCosts.get(id)?.productCost ?? 0), 0);
  const selectedMaterialsCostTotal = selectedIds.reduce((sum, id) => sum + (orderCosts.get(id)?.materialsCost ?? 0), 0);
  const selectedCostTotal = selectedProductCostTotal + selectedMaterialsCostTotal;
  const selectedProductHasApprox = selectedIds.some((id) => orderCosts.get(id)?.isProductApprox);
  const selectedMaterialsHasApprox = selectedIds.some((id) => orderCosts.get(id)?.isMaterialsApprox);
  const selectedHasApprox = selectedProductHasApprox || selectedMaterialsHasApprox;
  // "Entrada" = o valor que o pedido gera de receita (o que o cliente
  // paga), pra comparar lado a lado com o custo dos pedidos selecionados.
  const selectedEntradaTotal = selectedIds.reduce((sum, id) => sum + Number(state.orders.find((o) => o.id === id)?.total ?? 0), 0);
  const selectedProfitEstimate = selectedEntradaTotal - selectedCostTotal;

  // ---- Resumo geral (independe de aba/status e de qualquer seleção) ----
  // Pedidos cancelados ficam de fora das quatro contas: não viraram venda
  // real, então não entram em lucro, valor recebido/a receber nem despesas.
  //   - Lucro real: soma de (valor cobrado − custo) só dos pedidos já
  //     PAGOS — dinheiro que já entrou, descontado o custo.
  //   - Valores recebidos: soma do valor cobrado (o.total) dos pedidos já
  //     PAGOS — a entrada PURA, sem descontar custo (diferente do Lucro
  //     real, que já é depois do custo).
  //   - Valores a receber: soma do valor cobrado dos pedidos NÃO pagos —
  //     quanto ainda falta receber dos clientes.
  //   - Despesas: soma do custo (produto + materiais) de TODOS os
  //     pedidos, pagos ou não — o custo já é real assim que o produto é
  //     feito/vendido, independente de o cliente já ter pago. NÃO é o
  //     saldo de saídas do Caixa (que mistura outras coisas, tipo compra
  //     de material essencial em lote antes de virar venda).
  const statsOrders = state.orders.filter((o) => o.status !== "cancelado");
  let lucroReal = 0;
  let lucroRealHasApprox = false;
  let valoresRecebidos = 0;
  let valoresAReceber = 0;
  let despesasTotal = 0;
  let despesasHasApprox = false;
  statsOrders.forEach((o) => {
    const c = orderCost(o);
    despesasTotal += c.cost;
    if (c.isApprox) despesasHasApprox = true;
    if (o.paid_at) {
      valoresRecebidos += Number(o.total);
      lucroReal += Number(o.total) - c.cost;
      if (c.isApprox) lucroRealHasApprox = true;
    } else {
      valoresAReceber += Number(o.total);
    }
  });

  // Quebra de "Valores a receber" por cliente (soma quando o mesmo
  // cliente tem mais de um pedido não pago), do maior valor pro menor.
  const receivablesByCustomer = new Map();
  statsOrders.forEach((o) => {
    if (!o.paid_at) receivablesByCustomer.set(o.customer_name, (receivablesByCustomer.get(o.customer_name) || 0) + Number(o.total));
  });
  const receivablesList = [...receivablesByCustomer.entries()].sort((a, b) => b[1] - a[1]);

  container.innerHTML = `
    <div class="flex flex-col gap-6">
      <div>
        <h1 class="text-xl font-semibold text-navy-900">Pedidos</h1>
        <p class="text-sm text-navy-500">Pedidos feitos pelos clientes no Catálogo público.</p>
      </div>

      <div class="flex flex-wrap gap-3">
        <div class="flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="Soma do valor cobrado (entrada pura, sem descontar custo) dos pedidos já PAGOS, de qualquer status (exceto cancelados).">
          <p class="text-xs font-medium text-navy-500">Valores recebidos (entradas)</p>
          <p class="text-lg font-semibold text-blue-700">${formatBRL(valoresRecebidos)}</p>
        </div>
        <div class="flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="${lucroRealHasApprox ? "Inclui custo aproximado — algum produto ou material de um pedido pago não está mais cadastrado. " : ""}Soma de (valor cobrado − custo) só dos pedidos já PAGOS, de qualquer status (exceto cancelados) — dinheiro que já entrou de verdade.">
          <p class="text-xs font-medium text-navy-500">Lucro real (pedidos pagos)</p>
          <p class="text-lg font-semibold text-emerald-700">${lucroRealHasApprox ? "≈ " : ""}${formatBRL(lucroReal)}</p>
        </div>
        <div class="flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="Soma do valor dos pedidos NÃO pagos ainda, de qualquer status (exceto cancelados) — quanto falta receber dos clientes.">
          <p class="text-xs font-medium text-navy-500">Valores a receber (não pagos)</p>
          <p class="text-lg font-semibold text-red-600">${formatBRL(valoresAReceber)}</p>
          ${receivablesList.length > 0 ? `
            <div class="mt-1.5 flex flex-col gap-0.5 border-t border-navy-50 pt-1.5">
              ${receivablesList.map(([name, amount]) => `
                <span class="flex items-baseline justify-between gap-2 text-[11px] text-navy-400">
                  <span class="truncate">${escapeHtml(name)}</span>
                  <span class="whitespace-nowrap font-medium text-navy-500">${formatBRL(amount)}</span>
                </span>
              `).join("")}
            </div>
          ` : ""}
        </div>
        <div class="flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="${despesasHasApprox ? "Inclui custo aproximado — algum produto ou material de um pedido não está mais cadastrado. " : ""}Soma do custo (produto + materiais) de TODOS os pedidos, pagos ou não (exceto cancelados) — não é o saldo de saídas do Caixa.">
          <p class="text-xs font-medium text-navy-500">Despesas (custo dos produtos)</p>
          <p class="text-lg font-semibold text-orange-600">${despesasHasApprox ? "≈ " : ""}${formatBRL(despesasTotal)}</p>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 border-b border-navy-100">
        ${PEDIDOS_TABS.map((t) => {
          const count = state.orders.filter((o) => o.status === t.key).length;
          const active = pedidosState.tab === t.key;
          return `
            <button data-pedidos-tab="${t.key}" class="pedidos-tab-btn -mb-px rounded-t-lg border-b-2 px-3 py-2 text-sm font-medium transition ${active ? "border-gold-500 text-navy-900" : "border-transparent text-navy-400 hover:text-navy-600"}">
              ${t.label} <span class="ml-1 rounded-full ${active ? "bg-gold-100 text-gold-800" : "bg-navy-100 text-navy-500"} px-1.5 py-0.5 text-xs font-semibold">${count}</span>
            </button>
          `;
        }).join("")}
      </div>

      <div class="flex flex-wrap items-center gap-3 rounded-xl border border-navy-100 bg-white px-4 py-3 shadow">
        <label class="flex items-center gap-2 text-sm text-navy-700">
          <input type="checkbox" id="pedidos-select-all" class="h-4 w-4 rounded border-navy-300" ${visible.length === 0 ? "disabled" : ""} ${allVisibleSelected ? "checked" : ""} />
          Selecionar todos os visíveis
        </label>
        <span class="text-sm text-navy-400">${selectedCount} selecionado${selectedCount === 1 ? "" : "s"}</span>
        ${selectedCount > 0 ? `
          <div class="flex flex-col gap-0.5 rounded-lg bg-cream-50 px-3 py-1.5 text-xs font-medium text-navy-700" title="${selectedHasApprox ? "Inclui custo aproximado — algum produto ou material dos pedidos selecionados não está mais cadastrado" : "Resumo dos pedidos selecionados"}">
            <span>Entrada (pedidos): <b class="text-navy-900">${formatBRL(selectedEntradaTotal)}</b></span>
            <span>Custo do produto: <b class="text-navy-900">${selectedProductHasApprox ? "≈ " : ""}${formatBRL(selectedProductCostTotal)}</b></span>
            <span>Custo adicional (materiais): <b class="text-navy-900">${selectedMaterialsHasApprox ? "≈ " : ""}${formatBRL(selectedMaterialsCostTotal)}</b></span>
            <span class="border-t border-navy-200 pt-0.5">Custo total: <b class="text-navy-900">${selectedHasApprox ? "≈ " : ""}${formatBRL(selectedCostTotal)}</b></span>
            <span>Lucro estimado: <b class="text-emerald-700">${selectedHasApprox ? "≈ " : ""}${formatBRL(selectedProfitEstimate)}</b></span>
          </div>
        ` : ""}
        <div class="ml-auto flex gap-2">
          <button id="pedidos-download-btn" ${selectedCount === 0 ? "disabled" : ""} class="rounded-lg border border-navy-200 px-3 py-2 text-sm font-medium text-navy-700 transition hover:bg-navy-50 disabled:cursor-not-allowed disabled:opacity-40">🧾 Gerar comprovante</button>
          <button id="pedidos-delete-btn" ${selectedCount === 0 ? "disabled" : ""} class="rounded-lg bg-red-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-40">🗑 Excluir selecionados</button>

      <div class="flex flex-col gap-3">

                <div>
                  <p class="font-medium text-navy-900">Pedido Nº ${String(o.order_number ?? "").padStart(6, "0")} — ${escapeHtml(o.customer_name)}
                    ${waLink(o.customer_whatsapp) ? `<a href="${waLink(o.customer_whatsapp)}" target="_blank" rel="noopener" class="ml-1 text-xs font-normal text-emerald-700 hover:underline">WhatsApp ↗</a>` : ""}
                  </p>
                  <p class="text-xs text-navy-500">${formatDate(o.created_at.slice(0, 10))} · ${o.payment_method === "credito" ? "Crédito" : "Pix"} · ${o.items.length} ${o.items.length === 1 ? "item" : "itens"}</p>

              ${o.accepted_at ? `

                  ? `<span class="rounded-full bg-navy-100 px-2 py-1 text-xs font-medium text-navy-500">Cancelado</span>`
                  : o.accepted_at
                    ? `<button data-concluir-pedido="${o.id}" class="concluir-pedido-btn rounded-lg bg-gold-500 px-3 py-1.5 text-xs font-semibold text-navy-900 transition hover:bg-gold-400">Marcar como concluído</button>`
                    : ""}
              ${o.status !== "concluido" && o.status !== "cancelado"
                ? `<button data-cancelar-pedido="${o.id}" class="cancelar-pedido-btn text-xs text-red-600 hover:underline">Cancelar pedido</button>`
                : ""}
              <label class="flex items-center gap-1.5 text-xs font-medium text-navy-700">
                <input type="checkbox" data-paid-toggle="${o.id}" ${o.paid_at ? "checked" : ""} class="paid-toggle-cb h-3.5 w-3.5 rounded border-navy-300 text-emerald-600 focus:ring-emerald-400" />
                Pago${o.paid_at ? ` <span class="text-navy-400">(${formatDate(o.paid_at.slice(0, 10))})</span>` : ""}
              </label>
              <select data-order="${o.id}" class="order-status-select ml-auto rounded-lg border border-navy-200 px-2 py-1.5 text-xs font-medium outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200 ${ORDER_STATUS_CLASSES[o.status]}" title="Trocar status manualmente">
                ${Object.entries(ORDER_STATUS_LABELS).map(([k, label]) => `<option value="${k}" ${o.status === k ? "selected" : ""}>${label}</option>`).join("")}
              </select>
            </div>
            ${pedidosState.expandedId === o.id ? `

                      <span>${it.quantity}× ${escapeHtml(it.product_name)}${it.variant_name ? ` <span class="text-navy-400">(${escapeHtml(it.variant_name)})</span>` : ""}</span>
                    </div>
                    <span>${formatBRL(it.unit_price * it.quantity)}</span>
                  </div>
                `).join("")}
