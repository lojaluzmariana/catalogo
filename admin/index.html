      </div>
    </form>
  `;

  const entradaFields = document.getElementById("ef-entrada-fields");
  const materialsBox = document.getElementById("ef-materials-box");
  const customerBox = document.getElementById("ef-customer-box");
  const productSelect = document.getElementById("ef-product");
  const paymentSelect = document.getElementById("ef-payment");
  const amountField = document.getElementById("ef-amount");
  // Evita sobrescrever um valor que a pessoa já digitou/corrigiu manualmente
  // (importante ao editar um lançamento — não pode "voltar" o valor sozinho).
  let amountTouchedByUser = !!editingEntry;
  amountField.addEventListener("input", () => { amountTouchedByUser = true; });
  const categoryField = document.getElementById("ef-category");
  const descriptionField = document.getElementById("ef-description");
  const suggested = document.getElementById("ef-suggested");
  const materialSelect = document.getElementById("ef-material-select");
  const materialQtyField = document.getElementById("ef-material-qty");
  const materialsListEl = document.getElementById("ef-materials-list");
  const customerSelect = document.getElementById("ef-customer");
  const newCustomerFields = document.getElementById("ef-new-customer-fields");
  const newCustomerNameField = document.getElementById("ef-new-customer-name");

  customerSelect.addEventListener("change", () => {
    newCustomerFields.classList.toggle("hidden", customerSelect.value !== "__new__");
    newCustomerFields.classList.toggle("flex", customerSelect.value === "__new__");
  });

  // Materiais usados nesta venda (estado local do formulário).
  const entryMaterials = (editingEntry?.materials_used ?? []).map((mu) => ({
    material_id: mu.material_id,
    name: mu.materials?.name ?? "(material removido)",
    unit: mu.materials?.unit ?? "un",
    unit_cost: Number(mu.unit_cost),
    quantity: Number(mu.quantity),
  }));

  function materialsTotal() {
    return entryMaterials.reduce((sum, m) => sum + m.unit_cost * m.quantity, 0);
  }

  function renderEntryMaterialsList() {
    materialsListEl.innerHTML = entryMaterials.length === 0
      ? `<p class="text-xs text-navy-400">Nenhum material adicionado ainda.</p>`
      : entryMaterials.map((m, idx) => `
          <div class="flex items-center justify-between rounded-lg bg-white px-3 py-1.5 text-sm shadow-sm">
            <span>${escapeHtml(m.name)} — ${m.quantity} ${escapeHtml(m.unit)} × ${formatBRL(m.unit_cost)}</span>
            <span class="flex items-center gap-3">
              <b class="text-navy-900">${formatBRL(m.unit_cost * m.quantity)}</b>
              <button type="button" data-remove-idx="${idx}" class="ef-remove-material text-red-600 hover:underline">remover</button>
            </span>
          </div>
        `).join("");
    materialsListEl.querySelectorAll(".ef-remove-material").forEach((btn) => {
      btn.addEventListener("click", () => {
        entryMaterials.splice(Number(btn.dataset.removeIdx), 1);
        renderEntryMaterialsList();
        applyProductPrice();
      });
    });
  }

  function applyProductPrice() {
    const product = products.find((p) => p.id === productSelect.value);
    const matTotal = materialsTotal();
    if (!product) {
      suggested.textContent = matTotal > 0 ? `Materiais adicionados: ${formatBRL(matTotal)} — some ao valor acima se ainda não somou.` : "";
      return;
    }
    const price = paymentSelect.value === "credito" ? product.credit_price : product.promo_price;
    const total = round2(price + matTotal);
    if (!amountTouchedByUser) {
      amountField.value = String(total);
      if (!categoryField.value) categoryField.value = "Venda";
      if (!descriptionField.value) descriptionField.value = product.name;
    }
    const suggestionLine = matTotal > 0
      ? `Preço sugerido: <b>${formatBRL(price)}</b> + materiais <b>${formatBRL(matTotal)}</b> = <b>${formatBRL(total)}</b>`
      : `Preço sugerido: <b>${formatBRL(price)}</b>`;
    suggested.innerHTML = amountTouchedByUser
      ? `${suggestionLine} — o valor acima não foi alterado automaticamente porque você já digitou um valor; ajuste manualmente se quiser usar o sugerido.`
      : `${suggestionLine} — ajuste o valor acima se vendeu por outro preço.`;
  }
  productSelect.addEventListener("change", applyProductPrice);
  paymentSelect.addEventListener("change", applyProductPrice);

  document.getElementById("ef-material-add").addEventListener("click", () => {
    const materialId = materialSelect.value;
    const qty = Number(materialQtyField.value.replace(",", "."));
    const errorEl = document.getElementById("ef-error");
    if (!materialId) { errorEl.textContent = "Escolha um material."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Informe uma quantidade válida."; return; }
    errorEl.textContent = "";

    const material = state.materials.find((m) => m.id === materialId);
    const existing = entryMaterials.find((m) => m.material_id === materialId);
    if (existing) {
      existing.quantity = qty;
    } else {
      entryMaterials.push({ material_id: material.id, name: material.name, unit: material.unit, unit_cost: Number(material.unit_cost), quantity: qty });
    }
    materialSelect.value = "";
    materialQtyField.value = "";
    renderEntryMaterialsList();
    applyProductPrice();
  });

  renderEntryMaterialsList();

  container_setEntryTypeButtons();
  function container_setEntryTypeButtons() {
    document.querySelectorAll(".entry-type-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        entryType = btn.dataset.type;
        document.querySelectorAll(".entry-type-btn").forEach((b) => {
          const isActive = b.dataset.type === entryType;
          b.className = `entry-type-btn rounded-lg px-4 py-2 text-sm font-medium ${
            isActive
              ? (entryType === "entrada" ? "bg-emerald-600 text-white" : "bg-red-600 text-white")
              : "border border-navy-200 text-navy-600 hover:bg-navy-50"
          }`;
        });
        entradaFields.classList.toggle("hidden", entryType !== "entrada");
        materialsBox.classList.toggle("hidden", entryType !== "entrada");
        customerBox.classList.toggle("hidden", entryType !== "entrada");
      });
    });
  }

  document.getElementById("ef-cancel").addEventListener("click", () => {
    caixaState.formOpen = false;
    caixaState.editingId = null;
    renderCaixa(document.getElementById("main-content"));
  });

  document.getElementById("entry-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("ef-error");
    const amount = Number(amountField.value.replace(",", "."));
    if (!Number.isFinite(amount) || amount <= 0) { errorEl.textContent = "Informe um valor válido."; return; }

    // Se escolheu "+ Novo cliente...", cadastra ele primeiro.
    let customerId = entryType === "entrada" && customerSelect.value && customerSelect.value !== "__new__" ? customerSelect.value : null;
    if (entryType === "entrada" && customerSelect.value === "__new__") {
      const newName = newCustomerNameField.value.trim();
      if (!newName) { errorEl.textContent = "Informe o nome do novo cliente (ou escolha \"— sem cliente —\")."; return; }
      const newCustomerPayload = {
        name: newName,
        whatsapp: document.getElementById("ef-new-customer-whatsapp").value.trim() || null,
        instagram: document.getElementById("ef-new-customer-instagram").value.trim().replace(/^@/, "") || null,
        created_by: state.currentUser.id,
      };
      const { data: newCustomer, error: customerError } = await supabaseClient.from("customers").insert(newCustomerPayload).select("id").single();
      if (customerError) { errorEl.textContent = "Não foi possível cadastrar o cliente: " + customerError.message; return; }
      customerId = newCustomer.id;
    }

    const basePayload = {
      entry_type: entryType,
      entry_date: document.getElementById("ef-date").value,
      amount,
      category: categoryField.value.trim() || null,
      description: descriptionField.value.trim() || null,
      payment_method: entryType === "entrada" ? paymentSelect.value : null,
      product_id: entryType === "entrada" && productSelect.value ? productSelect.value : null,
      customer_id: customerId,
    };

    const materialsToLink = entryType === "entrada" ? entryMaterials : [];
    let entryId;

    if (editingEntry) {
      const payload = { ...basePayload, updated_by: state.currentUser.id, updated_at: new Date().toISOString() };
      const { error } = await supabaseClient.from("cash_entries").update(payload).eq("id", editingEntry.id);
      if (error) { errorEl.textContent = error.message; return; }
      entryId = editingEntry.id;
    } else {
      // Lançamento manual sempre entra como já pago (mesmo comportamento
      // de sempre) — só a tela de "Compra de estoque" tem a opção de
      // deixar como "não pago" (consignação).
      const payload = { ...basePayload, paid_at: new Date().toISOString(), created_by: state.currentUser.id };
      const { data: inserted, error } = await supabaseClient.from("cash_entries").insert(payload).select("id").single();
      if (error) { errorEl.textContent = error.message; return; }
      entryId = inserted.id;
    }

    // Sincroniza os materiais vinculados: apaga os antigos (o estoque volta) e grava a lista atual.
    await supabaseClient.from("cash_entry_materials").delete().eq("cash_entry_id", entryId);
    if (materialsToLink.length > 0) {
      const rows = materialsToLink.map((m) => ({
        cash_entry_id: entryId, material_id: m.material_id, quantity: m.quantity, unit_cost: m.unit_cost,
      }));
      const { error: linkError } = await supabaseClient.from("cash_entry_materials").insert(rows);
      if (linkError) { errorEl.textContent = "Lançamento salvo, mas houve um erro ao vincular os materiais: " + linkError.message; }
    }

    caixaState.formOpen = false;
    caixaState.editingId = null;
    await loadCashEntries();
    await loadMaterials();
    await loadCustomers();
    renderCaixa(document.getElementById("main-content"));
  });
}

/* =====================================================================
   CAIXA — LANÇAR BRINDE

   Registra um produto (e, opcionalmente, embalagem de presente) dado
   de brinde/cortesia: gera um pedido de verdade — mesma forma que uma
   compra normal (aparece em Pedidos, desconta estoque de embalagem,
   fica registrado pro cliente) — mas com payment_method = 'brinde' e
   total = 0 (nada foi cobrado). No Caixa, só entra o CUSTO (produto +
   embalagem) como saída — nenhuma entrada, já que não houve venda.
   ===================================================================== */
let brindeState = { open: false, items: [], giftWraps: [], name: "", whatsapp: "", instagram: "", notes: "" };

function closeBrindeOverlay() {
  brindeState = { open: false, items: [], giftWraps: [], name: "", whatsapp: "", instagram: "", notes: "" };
  renderBrindeOverlay();
}

// Reaproveita orderCost() passando um "pedido" no mesmo formato que ele
// espera (items com product_id/quantity, giftWraps com
// material_id/quantity/unit_price) — garante que o valor mostrado aqui
// bate exatamente com o que vai ser lançado no Caixa depois.
function brindeCostPreview() {
  return orderCost({ items: brindeState.items, giftWraps: brindeState.giftWraps });
}

function renderBrindeOverlay() {
  const slot = document.getElementById("brinde-overlay-slot");
  if (!slot) return;
  if (!brindeState.open) { slot.innerHTML = ""; return; }

  const activeProducts = state.products.filter((p) => p.active);
  const embalagens = state.materials.filter((m) => m.active && isEmbalagem(m));
  const cost = brindeCostPreview();
  const marketValue = brindeState.items.reduce((s, it) => s + it.unit_price * it.quantity, 0)
    + brindeState.giftWraps.reduce((s, g) => s + g.unit_price * g.quantity, 0);
  const selectedProduct = activeProducts.find((p) => p.id === brindeState._selectedProductId);
  const selectedVariants = selectedProduct?.product_variants ?? [];

  slot.innerHTML = `
    <div id="brinde-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
      <div class="flex max-h-[90vh] w-full max-w-3xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">
          <div>
            <h2 class="text-lg font-semibold text-navy-900">🎁 Lançar brinde</h2>
            <p class="text-xs text-navy-500">Gera um pedido normal (marcado como brinde) e lança no Caixa só o custo do produto + embalagem — sem cobrar nada do cliente.</p>
          </div>
          <button id="brinde-close-btn" type="button" class="rounded px-2 py-1 text-navy-500 hover:bg-navy-100">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-4">
          <form id="brinde-form" class="flex flex-col gap-4">
            <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
              <p class="mb-2 text-sm font-medium text-navy-800">Produto</p>
              <div class="flex flex-wrap items-end gap-3">
                <div class="min-w-[200px] flex-1">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Produto</label>
                  <select id="brinde-product-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                    <option value="">— selecione —</option>
                    ${activeProducts.map((p) => `<option value="${p.id}" ${p.id === brindeState._selectedProductId ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("")}
                  </select>
                </div>
                ${selectedVariants.length > 0 ? `
                  <div class="min-w-[160px]">
                    <label class="mb-1 block text-xs font-medium text-navy-700">Modelo</label>
                    <select id="brinde-variant-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                      <option value="">— selecione —</option>
                      ${[...selectedVariants].sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0)).map((v) => `<option value="${v.id}">${escapeHtml(v.name)}${v.esgotado ? " (esgotado)" : ""}</option>`).join("")}
                    </select>
                  </div>
                ` : ""}
                <div class="w-24">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Qtd.</label>
                  <input id="brinde-item-qty" value="1" inputmode="numeric" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
                <button type="button" id="brinde-item-add" class="rounded-lg border border-navy-300 px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100">+ Adicionar</button>
              </div>
              <div class="mt-3 flex flex-col gap-1">
                ${brindeState.items.length === 0 ? `<p class="text-xs text-navy-400">Nenhum produto adicionado ainda.</p>` : brindeState.items.map((it, idx) => `
                  <div class="flex items-center justify-between rounded-lg bg-white px-3 py-1.5 text-sm shadow-sm">
                    <span>${it.quantity}× ${escapeHtml(it.product_name)}${it.variant_name ? ` <span class="text-navy-400">(${escapeHtml(it.variant_name)})</span>` : ""}</span>
                    <span class="flex items-center gap-3">
                      <b class="text-navy-900">${formatBRL(it.unit_price * it.quantity)}</b>
                      <button type="button" data-remove-item-idx="${idx}" class="brinde-remove-item text-red-600 hover:underline">remover</button>
                    </span>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
              <p class="mb-2 text-sm font-medium text-navy-800">Embalagem de presente (opcional)</p>
              <div class="flex flex-wrap items-end gap-3">
                <div class="min-w-[200px] flex-1">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Embalagem</label>
                  <select id="brinde-giftwrap-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                    <option value="">— selecione —</option>
                    ${embalagens.map((m) => `<option value="${m.id}">${escapeHtml(m.name)} (estoque: ${Number(m.stock_qty)})</option>`).join("")}
                  </select>
                </div>
                <div class="w-24">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Qtd.</label>
                  <input id="brinde-giftwrap-qty" value="1" inputmode="numeric" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
                <button type="button" id="brinde-giftwrap-add" class="rounded-lg border border-navy-300 px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100">+ Adicionar</button>
              </div>
              <div class="mt-3 flex flex-col gap-1">
                ${brindeState.giftWraps.length === 0 ? `<p class="text-xs text-navy-400">Nenhuma embalagem adicionada.</p>` : brindeState.giftWraps.map((g, idx) => `
                  <div class="flex items-center justify-between rounded-lg bg-white px-3 py-1.5 text-sm shadow-sm">
                    <span>🎁 ${g.quantity}× ${escapeHtml(g.material_name)}</span>
                    <span class="flex items-center gap-3">
                      <b class="text-navy-900">${formatBRL(g.unit_price * g.quantity)}</b>
                      <button type="button" data-remove-giftwrap-idx="${idx}" class="brinde-remove-giftwrap text-red-600 hover:underline">remover</button>
                    </span>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
              <p class="mb-2 text-sm font-medium text-navy-800">Quem recebeu o brinde</p>
              <div class="flex flex-wrap gap-3">
                <div class="min-w-[200px] flex-1">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Nome</label>
                  <input id="brinde-name" value="${escapeHtml(brindeState.name)}" required class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="Nome de quem recebeu" />
                </div>
                <div class="min-w-[160px]">
                  <label class="mb-1 block text-xs font-medium text-navy-700">WhatsApp</label>
                  <input id="brinde-whatsapp" value="${escapeHtml(brindeState.whatsapp)}" required class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="(11) 91234-5678" />
                </div>
                <div class="min-w-[160px]">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Instagram (opcional)</label>
                  <input id="brinde-instagram" value="${escapeHtml(brindeState.instagram)}" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="@usuario" />
                </div>
                <div class="min-w-[220px] flex-1">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Motivo/observação (opcional)</label>
                  <input id="brinde-notes" value="${escapeHtml(brindeState.notes)}" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" placeholder="Ex: compensação por atraso na entrega" />
                </div>
              </div>
            </div>

            <div class="rounded-lg bg-navy-900 px-4 py-3 text-cream-50">
              <div class="flex flex-wrap items-center justify-between gap-2 text-sm">
                <span>Valor de mercado (não cobrado): <b>${formatBRL(marketValue)}</b></span>
                <span>Custo que será lançado no Caixa: <b class="text-gold-300">${cost.isApprox ? "≈ " : ""}${formatBRL(cost.costExcludingEssentials)}</b></span>
              </div>
            </div>

            <div id="brinde-error" class="text-sm text-red-600"></div>

            <div class="flex gap-2">
              <button type="submit" id="brinde-submit" class="rounded-lg bg-gold-500 px-4 py-2 text-sm font-semibold text-navy-900 transition hover:bg-gold-400">Registrar brinde</button>
              <button type="button" id="brinde-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;

  document.getElementById("brinde-close-btn").addEventListener("click", closeBrindeOverlay);
  document.getElementById("brinde-cancel").addEventListener("click", closeBrindeOverlay);
  document.getElementById("brinde-overlay").addEventListener("click", (e) => {
    if (e.target.id === "brinde-overlay") closeBrindeOverlay();
  });

  document.getElementById("brinde-name").addEventListener("input", (e) => { brindeState.name = e.target.value; });
  document.getElementById("brinde-whatsapp").addEventListener("input", (e) => { brindeState.whatsapp = e.target.value; });
  document.getElementById("brinde-instagram").addEventListener("input", (e) => { brindeState.instagram = e.target.value; });
  document.getElementById("brinde-notes").addEventListener("input", (e) => { brindeState.notes = e.target.value; });

  const productSelect = document.getElementById("brinde-product-select");
  productSelect.addEventListener("change", () => {
    brindeState._selectedProductId = productSelect.value || null;
    renderBrindeOverlay();
  });

  document.getElementById("brinde-item-add").addEventListener("click", () => {
    const errorEl = document.getElementById("brinde-error");
    const product = activeProducts.find((p) => p.id === productSelect.value);
    if (!product) { errorEl.textContent = "Escolha um produto."; return; }
    const variants = product.product_variants ?? [];
    const variantSelect = document.getElementById("brinde-variant-select");
    if (variants.length > 0 && (!variantSelect || !variantSelect.value)) { errorEl.textContent = "Escolha o modelo do produto."; return; }
    const qty = Math.trunc(Number(document.getElementById("brinde-item-qty").value.replace(",", ".")));
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Informe uma quantidade válida."; return; }
    errorEl.textContent = "";

    const variant = variants.length > 0 ? variants.find((v) => v.id === variantSelect.value) : null;
    brindeState.items.push({
      product_id: product.id,
      product_name: product.name,
      variant_name: variant ? variant.name : null,
      unit_price: Number(product.promo_price),
      quantity: qty,
    });
    brindeState._selectedProductId = null;
    renderBrindeOverlay();
  });

  const giftwrapSelect = document.getElementById("brinde-giftwrap-select");
  document.getElementById("brinde-giftwrap-add").addEventListener("click", () => {
    const errorEl = document.getElementById("brinde-error");
    const material = embalagens.find((m) => m.id === giftwrapSelect.value);
    if (!material) { errorEl.textContent = "Escolha uma embalagem."; return; }
    const qty = Math.trunc(Number(document.getElementById("brinde-giftwrap-qty").value.replace(",", ".")));
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Informe uma quantidade válida."; return; }
    errorEl.textContent = "";

    const price = material.fixed_price != null ? Number(material.fixed_price) : Number(material.unit_cost) * (1 + GIFT_WRAP_MARKUP);
    brindeState.giftWraps.push({
      material_id: material.id,
      material_name: material.name,
      unit_price: round2(price),
      quantity: qty,
    });
    renderBrindeOverlay();
  });

  document.querySelectorAll(".brinde-remove-item").forEach((btn) => {
    btn.addEventListener("click", () => { brindeState.items.splice(Number(btn.dataset.removeItemIdx), 1); renderBrindeOverlay(); });
  });
  document.querySelectorAll(".brinde-remove-giftwrap").forEach((btn) => {
    btn.addEventListener("click", () => { brindeState.giftWraps.splice(Number(btn.dataset.removeGiftwrapIdx), 1); renderBrindeOverlay(); });
  });

  document.getElementById("brinde-form").addEventListener("submit", submeterBrinde);
}

async function submeterBrinde(e) {
  e.preventDefault();
  const errorEl = document.getElementById("brinde-error");
  const name = brindeState.name.trim();
  const whatsapp = brindeState.whatsapp.trim();
  const instagram = brindeState.instagram.trim().replace(/^@/, "");
  const notes = brindeState.notes.trim();

  if (brindeState.items.length === 0) { errorEl.textContent = "Adicione ao menos um produto."; return; }
  if (!name) { errorEl.textContent = "Informe o nome de quem recebeu o brinde."; return; }
  if (!whatsapp) { errorEl.textContent = "Informe um WhatsApp (ou outra referência de contato)."; return; }
  errorEl.textContent = "";

  const submitBtn = document.getElementById("brinde-submit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Registrando...";

  const orderId = crypto.randomUUID();
  const { error: orderError } = await supabaseClient.from("orders").insert({
    id: orderId,
    customer_name: name,
    customer_whatsapp: whatsapp,
    customer_instagram: instagram || null,
    payment_method: "brinde",
    notes: notes || null,
    total: 0,
    status: "concluido",
  });
  if (orderError) {
    errorEl.textContent = "Não foi possível registrar o pedido: " + orderError.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Registrar brinde";
    return;
  }

  const itemRows = brindeState.items.map((it) => ({
    order_id: orderId,
    product_id: it.product_id,
    product_name: it.product_name,
    variant_name: it.variant_name,
    unit_price: it.unit_price,
    quantity: it.quantity,
  }));
  const { error: itemsError } = await supabaseClient.from("order_items").insert(itemRows);
  if (itemsError) console.error("brinde order_items:", itemsError.message);

  if (brindeState.giftWraps.length > 0) {
    const giftWrapRows = brindeState.giftWraps.map((g) => ({
      order_id: orderId,
      material_id: g.material_id,
      material_name: g.material_name,
      quantity: g.quantity,
      unit_price: g.unit_price,
    }));
    const { error: gwError } = await supabaseClient.from("order_gift_wraps").insert(giftWrapRows);
    if (gwError) console.error("brinde order_gift_wraps:", gwError.message);
  }

  // Registra/atualiza o cliente, igual o catálogo público faz ao
  // fechar uma compra — assim quem recebeu o brinde já fica no
  // cadastro de Clientes.
  const { error: customerError } = await supabaseClient.rpc("upsert_customer_from_order", {
    p_name: name, p_whatsapp: whatsapp, p_instagram: instagram || null,
  });
  if (customerError) console.error("brinde upsert_customer:", customerError.message);

  await loadOrders();
  const newOrder = state.orders.find((o) => o.id === orderId);
  const cost = newOrder ? orderCost(newOrder) : brindeCostPreview();

  // Só lança saída se der custo (a tabela não aceita saída de R$ 0,00) —
  // mesma regra do "Iniciar venda" pra vendas normais.
  if (cost.costExcludingEssentials > 0) {
    const itemsDesc = [
      ...brindeState.items.map((it) => `${it.quantity}x ${it.product_name}${it.variant_name ? ` (${it.variant_name})` : ""}`),
      ...brindeState.giftWraps.map((g) => `${g.quantity}x ${g.material_name} (embalagem)`),
    ].join(", ");
    const customer = findCustomerByPhone(whatsapp);
    const custoPayload = {
      entry_type: "saida",
      entry_date: todayISO(),
      amount: Math.round(cost.costExcludingEssentials * 100) / 100,
      category: "Custo do brinde",
      description: `Brinde — Pedido Nº ${String(newOrder?.order_number ?? "").padStart(6, "0")} — ${name} — ${itemsDesc}${cost.isApprox ? " (estimado — produto ou material não está mais cadastrado)" : ""}`,
      payment_method: null,
      customer_id: customer ? customer.id : null,
      order_id: orderId,
      paid_at: new Date().toISOString(),
      created_by: state.currentUser.id,
    };
    const { data: inserted, error: custoError } = await supabaseClient.from("cash_entries").insert(custoPayload).select("id").single();
    if (custoError) {
      alert("O pedido de brinde foi criado, mas não foi possível lançar o custo no Caixa: " + custoError.message);
    } else {
      const giftWrapMaterialRows = brindeState.giftWraps
        .filter((g) => state.materials.some((m) => m.id === g.material_id))
        .map((g) => {
          const material = state.materials.find((m) => m.id === g.material_id);
          return { cash_entry_id: inserted.id, material_id: material.id, quantity: g.quantity, unit_cost: material.unit_cost };
        });
      if (giftWrapMaterialRows.length > 0) {
        const { error: linkError } = await supabaseClient.from("cash_entry_materials").insert(giftWrapMaterialRows);
        if (linkError) console.error("brinde cash_entry_materials:", linkError.message);
      }
    }
  }

  brindeState = { open: false, items: [], giftWraps: [], name: "", whatsapp: "", instagram: "", notes: "" };
  await Promise.all([loadCashEntries(), loadMaterials(), loadOrders(), loadCustomers()]);
  renderCaixa(document.getElementById("main-content"));
}

/* =====================================================================
   CAIXA — COMPRA DE ESTOQUE

   Registra a compra de produtos PRONTOS pra ter em estoque na loja (ex:
   comprar de um fornecedor por atacado) — bem diferente de "Iniciar
   venda" ou "Lançar brinde": aqui NÃO existe pedido/cliente nenhum
   envolvido, só a saída de dinheiro pra abastecer o estoque. Por isso:
     - Soma SÓ o valor do produto (sem embalagem, sem material — isso é
       custo de venda, não de compra de estoque).
     - O custo de cada item é DIGITADO na hora, individualizado por
       compra — não usa o "cost" cadastrado do produto (que é uma média
       usada só pra precificação/relatório de pedidos). O preço pago
       numa compra real varia (promoção, reajuste do fornecedor, etc.),
       então cada compra registra o valor de verdade que saiu do caixa.
     - Cada item vira um lançamento de SAÍDA próprio no Caixa (mesma
       tabela "cash_entries" de sempre, com product_id preenchido) — não
       cria pedido, não mexe em "Despesas" dos Pedidos (que é calculado
       só a partir de orders, não de cash_entries).
     - Compras por consignação: o checkbox "Já paguei" pode ficar
       desmarcado, aí o lançamento sai com paid_at em branco — a despesa
       aparece normalmente na tabela do Caixa (com um selo "Não pago"),
       mas NÃO entra no "Saldo atual" até ser marcada como paga (a
       view cash_entries_with_balance ignora lançamentos não pagos no
       saldo acumulado). Dá pra marcar como paga depois direto na tabela.
     - Fornecedor (opcional) puxa a lista já cadastrada em "Fornecedores"
       (supplier_id) em vez de um campo de texto livre.
   ===================================================================== */
let stockPurchaseState = { open: false, items: [], date: todayISO(), payment: "pix", paid: true, supplierId: "", _selectedProductId: null, _selectedVariantId: null, _qty: "1", _unitCost: "" };

function closeStockPurchaseOverlay() {
  stockPurchaseState = { open: false, items: [], date: todayISO(), payment: "pix", paid: true, supplierId: "", _selectedProductId: null, _selectedVariantId: null, _qty: "1", _unitCost: "" };
  renderStockPurchaseOverlay();
}

function stockPurchaseTotal() {
  return stockPurchaseState.items.reduce((sum, it) => sum + it.unitCost * it.quantity, 0);
}

function renderStockPurchaseOverlay() {
  const slot = document.getElementById("stock-purchase-slot");
  if (!slot) return;
  if (!stockPurchaseState.open) { slot.innerHTML = ""; return; }

  const activeProducts = state.products.filter((p) => p.active);
  const total = stockPurchaseTotal();
  const selectedProduct = activeProducts.find((p) => p.id === stockPurchaseState._selectedProductId);
  const selectedVariants = selectedProduct?.product_variants ?? [];

  slot.innerHTML = `
    <div id="stock-purchase-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
      <div class="flex max-h-[90vh] w-full max-w-2xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">
          <div>
            <h2 class="text-lg font-semibold text-navy-900">📦 Compra de estoque</h2>
            <p class="text-xs text-navy-500">Comprar produtos prontos pra ter em estoque na loja — soma só o valor do produto, com o custo de cada item digitado na hora (não usa o custo cadastrado).</p>
          </div>
          <button id="sp-close-btn" type="button" class="rounded px-2 py-1 text-navy-500 hover:bg-navy-100">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-4">
          <form id="stock-purchase-form" class="flex flex-col gap-4">
            <div class="rounded-lg border border-navy-100 bg-cream-50 p-4">
              <p class="mb-2 text-sm font-medium text-navy-800">Produtos comprados</p>
              <div class="flex flex-wrap items-end gap-3">
                <div class="min-w-[200px] flex-1">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Produto</label>
                  <select id="sp-product-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                    <option value="">— selecione —</option>
                    ${activeProducts.map((p) => `<option value="${p.id}" ${p.id === stockPurchaseState._selectedProductId ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("")}
                  </select>
                </div>
                ${selectedVariants.length > 0 ? `
                  <div class="min-w-[160px]">
                    <label class="mb-1 block text-xs font-medium text-navy-700">Modelo</label>
                    <select id="sp-variant-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                      <option value="">— selecione —</option>
                      ${[...selectedVariants].sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0)).map((v) => `<option value="${v.id}" ${v.id === stockPurchaseState._selectedVariantId ? "selected" : ""}>${escapeHtml(v.name)}${v.esgotado ? " (esgotado)" : ""}</option>`).join("")}
                    </select>
                  </div>
                ` : ""}
                <div class="w-24">
                  <label class="mb-1 block text-xs font-medium text-navy-700">Qtd.</label>
                  <input id="sp-item-qty" value="${escapeHtml(stockPurchaseState._qty ?? "1")}" inputmode="numeric" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
                <div class="w-32">
                  <label class="mb-1 block text-xs font-medium text-navy-700" title="Preço que você realmente pagou por unidade nesta compra — não é o custo cadastrado do produto.">Custo unit. (R$)</label>
                  <input id="sp-item-cost" value="${escapeHtml(stockPurchaseState._unitCost ?? "")}" inputmode="decimal" placeholder="0,00" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
                </div>
                <button type="button" id="sp-item-add" class="rounded-lg border border-navy-300 px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100">+ Adicionar</button>
              </div>
              <p id="sp-cost-hint" class="mt-1.5 text-[11px] text-navy-400">${selectedProduct ? `Custo cadastrado deste produto: ${formatBRL(selectedProduct.cost)} — já preenchemos como sugestão, ajuste pro valor real desta compra se for diferente.` : ""}</p>
              <div class="mt-3 flex flex-col gap-1">
                ${stockPurchaseState.items.length === 0 ? `<p class="text-xs text-navy-400">Nenhum produto adicionado ainda.</p>` : stockPurchaseState.items.map((it, idx) => `
                  <div class="flex items-center justify-between rounded-lg bg-white px-3 py-1.5 text-sm shadow-sm">
                    <span>${it.quantity}× ${escapeHtml(it.productName)}${it.variantName ? ` <span class="text-navy-400">(${escapeHtml(it.variantName)})</span>` : ""} <span class="text-navy-400">(${formatBRL(it.unitCost)}/un.)</span></span>
                    <span class="flex items-center gap-3">
                      <b class="text-navy-900">${formatBRL(it.unitCost * it.quantity)}</b>
                      <button type="button" data-remove-item-idx="${idx}" class="sp-remove-item text-red-600 hover:underline">remover</button>
                    </span>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="flex flex-wrap items-end gap-4">
              <div>
                <label class="mb-1 block text-xs font-medium text-navy-700">Data</label>
                <input type="date" id="sp-date" value="${stockPurchaseState.date}" class="rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200" />
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium text-navy-700">Pagamento</label>
                <select id="sp-payment" class="rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                  <option value="pix" ${stockPurchaseState.payment === "pix" ? "selected" : ""}>Pix</option>
                  <option value="dinheiro" ${stockPurchaseState.payment === "dinheiro" ? "selected" : ""}>Dinheiro</option>
                  <option value="credito" ${stockPurchaseState.payment === "credito" ? "selected" : ""}>Crédito</option>
                  <option value="outro" ${stockPurchaseState.payment === "outro" ? "selected" : ""}>Outro</option>
                </select>
              </div>
              <div>
                <label class="flex items-center gap-2 rounded-lg border border-navy-200 bg-white px-3 py-2 text-sm font-medium text-navy-700" title="Desmarque pra compras por consignação, onde você recebe o produto mas só paga o fornecedor depois. A despesa é lançada mesmo assim, mas só entra no Saldo atual quando você marcar como paga.">
                  <input type="checkbox" id="sp-paid" ${stockPurchaseState.paid ? "checked" : ""} class="h-4 w-4 rounded border-navy-300 text-emerald-600 focus:ring-emerald-400" />
                  Já paguei
                </label>
              </div>
              <div class="min-w-[220px] flex-1">
                <label class="mb-1 block text-xs font-medium text-navy-700">Fornecedor (opcional)</label>
                <select id="sp-supplier-select" class="w-full rounded-lg border border-navy-200 px-3 py-2 text-sm outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
                  <option value="">— nenhum —</option>
                  ${state.suppliers.filter((s) => s.active || s.id === stockPurchaseState.supplierId).sort((a, b) => a.name.localeCompare(b.name, "pt-BR")).map((s) => `<option value="${s.id}" ${stockPurchaseState.supplierId === s.id ? "selected" : ""}>${escapeHtml(s.name)}</option>`).join("")}
                </select>
              </div>
            </div>
            <p id="sp-paid-hint" class="-mt-2 text-[11px] text-navy-400">${stockPurchaseState.paid ? "" : "⚠ Marcada como \"não pago\" — a despesa é lançada, mas só entra no Saldo atual quando você marcar como paga (compra por consignação)."}</p>

            <div class="rounded-lg bg-navy-900 px-4 py-3 text-cream-50">
              <div class="flex flex-wrap items-center justify-between gap-2 text-sm">
                <span>Total desta compra (só produtos):</span>
                <b class="text-gold-300 text-base">${formatBRL(total)}</b>
              </div>
            </div>

            <div id="sp-error" class="text-sm text-red-600"></div>

            <div class="flex gap-2">
              <button type="submit" id="sp-submit" class="rounded-lg bg-gold-500 px-4 py-2 text-sm font-semibold text-navy-900 transition hover:bg-gold-400">Registrar compra</button>
              <button type="button" id="sp-cancel" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 hover:bg-navy-50">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;

  document.getElementById("sp-close-btn").addEventListener("click", closeStockPurchaseOverlay);
  document.getElementById("sp-cancel").addEventListener("click", closeStockPurchaseOverlay);
  document.getElementById("stock-purchase-overlay").addEventListener("click", (e) => {
    if (e.target.id === "stock-purchase-overlay") closeStockPurchaseOverlay();
  });

  document.getElementById("sp-date").addEventListener("input", (e) => { stockPurchaseState.date = e.target.value; });
  document.getElementById("sp-payment").addEventListener("change", (e) => { stockPurchaseState.payment = e.target.value; });
  document.getElementById("sp-supplier-select").addEventListener("change", (e) => { stockPurchaseState.supplierId = e.target.value; });
  document.getElementById("sp-paid").addEventListener("change", (e) => {
    // Só atualiza o estado e o textinho de aviso — sem re-render completo,
    // pra não apagar o que já foi digitado nos outros campos (mesmo
    // cuidado do resto do formulário).
    stockPurchaseState.paid = e.target.checked;
    const hint = document.getElementById("sp-paid-hint");
    if (hint) hint.textContent = stockPurchaseState.paid ? "" : "⚠ Marcada como \"não pago\" — a despesa é lançada, mas só entra no Saldo atual quando você marcar como paga (compra por consignação).";
  });

  const productSelect = document.getElementById("sp-product-select");
  productSelect.addEventListener("change", () => {
    // Precisa de um re-render completo pra mostrar/esconder o seletor de
    // Modelo (que só existe se o produto escolhido tiver variação) — por
    // isso qty/custo são "controlados" (guardados em stockPurchaseState e
    // devolvidos como value="..." no template), senão o re-render
    // apagaria o que a pessoa já tivesse digitado nesses campos (mesmo
    // bug que já foi corrigido aqui antes).
    stockPurchaseState._selectedProductId = productSelect.value || null;
    stockPurchaseState._selectedVariantId = null;
    stockPurchaseState._qty = document.getElementById("sp-item-qty").value;
    // Pré-preenche o custo com o cadastrado do produto, só como ponto de
    // partida — o admin ajusta pro valor real pago nesta compra.
    const product = activeProducts.find((p) => p.id === productSelect.value);
    stockPurchaseState._unitCost = product ? String(Number(product.cost)) : "";
    renderStockPurchaseOverlay();
  });

  const qtyField = document.getElementById("sp-item-qty");
  if (qtyField) qtyField.addEventListener("input", (e) => { stockPurchaseState._qty = e.target.value; });
  const costField = document.getElementById("sp-item-cost");
  if (costField) costField.addEventListener("input", (e) => { stockPurchaseState._unitCost = e.target.value; });
  const variantSelect = document.getElementById("sp-variant-select");
  if (variantSelect) variantSelect.addEventListener("change", () => { stockPurchaseState._selectedVariantId = variantSelect.value || null; });

  document.getElementById("sp-item-add").addEventListener("click", () => {
    const errorEl = document.getElementById("sp-error");
    const product = activeProducts.find((p) => p.id === productSelect.value);
    if (!product) { errorEl.textContent = "Escolha um produto."; return; }
    const variants = product.product_variants ?? [];
    const variantSel = document.getElementById("sp-variant-select");
    if (variants.length > 0 && (!variantSel || !variantSel.value)) { errorEl.textContent = "Escolha o modelo do produto."; return; }
    const qty = Math.trunc(Number(document.getElementById("sp-item-qty").value.replace(",", ".")));
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Informe uma quantidade válida."; return; }
    const unitCost = Number(document.getElementById("sp-item-cost").value.replace(",", "."));
    if (!Number.isFinite(unitCost) || unitCost <= 0) { errorEl.textContent = "Informe o custo unitário pago nesta compra."; return; }
    errorEl.textContent = "";

    const variant = variants.length > 0 ? variants.find((v) => v.id === variantSel.value) : null;
    stockPurchaseState.items.push({
      productId: product.id,
      productName: product.name,
      variantName: variant ? variant.name : null,
      unitCost: round2(unitCost),
      quantity: qty,
    });
    stockPurchaseState._selectedProductId = null;
    stockPurchaseState._selectedVariantId = null;
    stockPurchaseState._qty = "1";
    stockPurchaseState._unitCost = "";
    renderStockPurchaseOverlay();
  });

  document.querySelectorAll(".sp-remove-item").forEach((btn) => {
    btn.addEventListener("click", () => { stockPurchaseState.items.splice(Number(btn.dataset.removeItemIdx), 1); renderStockPurchaseOverlay(); });
  });

  document.getElementById("stock-purchase-form").addEventListener("submit", submeterCompraEstoque);
}

async function submeterCompraEstoque(e) {
  e.preventDefault();
  const errorEl = document.getElementById("sp-error");
  const date = document.getElementById("sp-date").value;
  const payment = document.getElementById("sp-payment").value;
  const paid = document.getElementById("sp-paid").checked;
  const supplierId = document.getElementById("sp-supplier-select").value || null;

  if (stockPurchaseState.items.length === 0) { errorEl.textContent = "Adicione ao menos um produto."; return; }
  if (!date) { errorEl.textContent = "Informe a data da compra."; return; }
  errorEl.textContent = "";

  const submitBtn = document.getElementById("sp-submit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Registrando...";

  // Cada item vira sua PRÓPRIA saída no Caixa (não uma soma única) —
  // é isso que deixa o custo "individualizado por item": cada produto
  // fica com seu valor real, rastreável, editável/excluível sozinho
  // depois, igual qualquer outro lançamento do Caixa.
  // "paid_at" fica em branco quando a compra é por consignação (ainda
  // não paga) — nesse caso a despesa é lançada mesmo assim, mas só entra
  // no Saldo atual quando for marcada como paga depois (na tabela do
  // Caixa). Todas as linhas dessa mesma compra compartilham um
  // "purchase_batch_id" — é isso que deixa juntar tudo de novo depois
  // (ex: pra somar/mostrar a dívida "por compra" quando não foi paga).
  const purchaseBatchId = crypto.randomUUID();
  const rows = stockPurchaseState.items.map((it) => ({
    entry_type: "saida",
    entry_date: date,
    amount: round2(it.unitCost * it.quantity),
    category: "Compra de estoque",
    description: `Compra de estoque — ${it.quantity}x ${it.productName}${it.variantName ? ` (${it.variantName})` : ""} × ${formatBRL(it.unitCost)}`,
    payment_method: payment,
    product_id: it.productId,
    // Quantidade/custo unitário/modelo também como colunas de verdade
    // (além de já estarem no texto da descrição acima) — é o que deixa
    // a Nota do fornecedor montar a linha do item sem precisar
    // "adivinhar" isso lendo um texto livre.
    quantity: it.quantity,
    unit_cost: it.unitCost,
    variant_name: it.variantName,
    supplier_id: supplierId,
    paid_at: paid ? new Date().toISOString() : null,
    purchase_batch_id: purchaseBatchId,
    created_by: state.currentUser.id,
  }));

  const { error } = await supabaseClient.from("cash_entries").insert(rows);
  if (error) {
    errorEl.textContent = "Não foi possível registrar a compra: " + error.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Registrar compra";
    return;
  }

  stockPurchaseState = { open: false, items: [], date: todayISO(), payment: "pix", paid: true, supplierId: "", _selectedProductId: null, _selectedVariantId: null, _qty: "1", _unitCost: "" };
  await loadCashEntries();
  renderCaixa(document.getElementById("main-content"));
}

// Ao carregar a página (inclusive apertando F5), verifica se já existe uma
// sessão salva pelo navegador — se tiver, entra direto no painel sem pedir
// login de novo. Antes, todo F5 voltava pra tela de login mesmo com a
// sessão ainda válida.
(async function boot() {
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (data?.session) {
      await enterApp();
      return;
    }
  } catch (err) {
    console.error("boot: falha ao checar sessão salva:", err);
  }
  render();
})();

// Atualização automática: recarrega os dados sozinho a cada 60s, sem
// precisar de F5 (que pediria login de novo). Pula quando algum
// formulário está aberto, pra não apagar o que a pessoa está digitando —
// nesse caso ela pode usar o botão "Atualizar" quando terminar.
setInterval(async () => {
  if (state.screen !== "app" || isAnyFormOpen()) return;
  await loadAllData();
  render();
}, 60000);
</script>
</body>
</html>
