/* =====================================================================
   ABA: PEDIDOS (feitos pelo Catálogo público)
   ===================================================================== */
const ORDER_STATUS_LABELS = { novo: "Novo", em_andamento: "Em andamento", concluido: "Concluído", cancelado: "Cancelado" };
const ORDER_STATUS_CLASSES = {
  novo: "bg-red-100 text-red-700",
  em_andamento: "bg-gold-100 text-gold-800",
  concluido: "bg-emerald-100 text-emerald-800",
  cancelado: "bg-navy-100 text-navy-500",
};

function waLink(phone) {
  const digits = String(phone ?? "").replace(/\D/g, "");
  return digits ? `https://wa.me/${digits}` : null;
}

// WhatsApp do fabricante que produz os produtos — usado no botão
// "Enviar ao fabricante" dos Pedidos aceitos.
const MANUFACTURER_WHATSAPP_NUMBER = "5584991677070";
// Mesma margem usada na view catalog_gift_wrap_options (preço cobrado =
// custo do material + 30%). Usada aqui só pra "desfazer a conta" quando
// precisamos estimar o custo de uma embalagem cujo material já foi
// apagado do cadastro (nesse caso não tem outro jeito de saber o custo).
const GIFT_WRAP_MARKUP = 0.3;

// Material do tipo "Essencial" (aceita singular ou plural — "Essencial"
// ou "Essenciais", maiúsculo/minúsculo tanto faz — plural em português
// não é só acrescentar "s", "-al" vira "-ais", então comparamos com as
// duas formas certas, não com startsWith) é um insumo usado em (quase)
// toda venda mas que não é cobrado à parte do cliente (ex: fio, cola,
// etiqueta). O custo dele entra como despesa fixa por pedido, e
// aumentar o estoque dele lança uma "saída" automática no Caixa.
function isEssencialTypeText(text) {
  const normalized = (text || "").trim().toLowerCase();
  return normalized === "essencial" || normalized === "essenciais";
}
function isEssencial(material) {
  return isEssencialTypeText(material.type);
}

// Material do tipo "Embalagem" — mesma regra usada na view SQL
// catalog_gift_wrap_options (comparação sem acento/maiúscula não
// importa). É o tipo que aparece como opção de embalagem de presente
// pro cliente escolher no Catálogo — só esses materiais podem ter um
// preço fixo cobrado do cliente.
function isEmbalagemTypeText(text) {
  return (text || "").trim().toLowerCase() === "embalagem";
}
function isEmbalagem(material) {
  return isEmbalagemTypeText(material.type);
}

// Custo real (materiais/insumos) de um pedido — não é o preço cobrado do
// cliente. Devolve o custo dividido em duas partes:
//   - productCost: custo dos produtos em si (produtos.cost, que já
//     inclui o custo base + os materiais que compõem o produto).
//   - materialsCost: custo ADICIONAL de materiais que não fazem parte do
//     produto — hoje, só as embalagens de presente escolhidas no pedido
//     (o custo do material, não o preço com markup de 30% cobrado do
//     cliente).
//
// IMPORTANTE: usa o custo ATUAL cadastrado do produto/material. Se o
// custo mudou desde que o pedido foi feito, o valor aqui reflete o custo
// de HOJE, não o de quando a venda aconteceu — não temos um "retrato"
// histórico do custo salvo no pedido. Quando um produto ou material do
// pedido não é mais encontrado no cadastro, marca a parte afetada como
// aproximada (isProductApprox / isMaterialsApprox) pra deixar isso
// visível pro admin — só na parte que realmente foi estimada.
function orderCost(order) {
  let isProductApprox = false;
  let isMaterialsApprox = false;

  const productCost = (order.items ?? []).reduce((sum, it) => {
    const product = state.products.find((p) => p.id === it.product_id);
    if (!product) { isProductApprox = true; return sum; }
    return sum + Number(product.cost) * it.quantity;
  }, 0);

  const giftWrapCost = (order.giftWraps ?? []).reduce((sum, g) => {
    const material = g.material_id ? state.materials.find((m) => m.id === g.material_id) : null;
    if (material) return sum + Number(material.unit_cost) * g.quantity;
    // Material apagado do cadastro: estima o custo "desfazendo" o markup
    // de 30% em cima do preço que foi cobrado do cliente na hora da venda.
    isMaterialsApprox = true;
    return sum + (Number(g.unit_price) / (1 + GIFT_WRAP_MARKUP)) * g.quantity;
  }, 0);

  // Materiais "Essenciais" (fio, cola, etiqueta...) não são escolhidos
  // pedido a pedido como a embalagem de presente — são um custo fixo que
  // entra em TODA venda, no valor cadastrado em "quantidade usada por
  // venda". Usa o cadastro ATUAL (mesma ressalva de "custo de hoje, não
  // de quando a venda aconteceu" do resto da função).
  const essentialsCost = state.materials
    .filter((m) => m.active && isEssencial(m) && Number(m.qty_per_order) > 0)
    .reduce((sum, m) => sum + Number(m.unit_cost) * Number(m.qty_per_order), 0);

  const materialsCost = giftWrapCost + essentialsCost;

  return {
    productCost, materialsCost, cost: productCost + materialsCost,
    // Custo "sem essenciais" — usado no lançamento de saída do Caixa ao
    // Iniciar venda. O custo do material Essencial já vira uma saída no
    // Caixa quando ele é COMPRADO (estoque aumentado, em Materiais); se
    // lançássemos de novo aqui, a cada venda, estaríamos descontando o
    // mesmo gasto duas vezes do saldo do Caixa. Embalagem de presente
    // não tem esse lançamento na compra, então continua entrando aqui.
    costExcludingEssentials: productCost + giftWrapCost,
    giftWrapCost, essentialsCost,
    isProductApprox, isMaterialsApprox, isApprox: isProductApprox || isMaterialsApprox,
  };
}

// Produto com modelo cadastrado tem o estoque controlado por modelo (e
// não pelo produto inteiro) — ver product_variants.in_stock. Essa função
// resolve o estoque certo pro item de um pedido: se o produto tem
// modelos, procura o modelo pelo nome salvo no pedido (variant_name é só
// um "retrato" do nome na hora da compra, não uma referência); se o
// modelo não existir mais no cadastro (renomeado/apagado), trata como
// sob encomenda por segurança, do mesmo jeito que produto removido.
function itemIsInStock(item, product) {
  if (!product) return false;
  const variants = product.product_variants ?? [];
  if (variants.length > 0) {
    if (!item.variant_name) return false;
    const variant = variants.find((v) => v.name === item.variant_name);
    return variant ? !!variant.in_stock : false;
  }
  return !!product.in_stock;
}

// Mesma regra usada no Catálogo público (ver MADE_TO_ORDER_TEXT em
// index.html): produto sob encomenda leva 2 dias corridos a contar da
// data do pedido. Aqui calculamos o prazo de entrega do pedido inteiro:
// se todo item já está "Em estoque", é pronta entrega; se algum item é
// sob encomenda, o prazo do pedido é o do item mais demorado (sempre 2
// dias, já que só existe esse prazo hoje) a contar de quando o pedido
// foi feito. Produto que sumiu do cadastro é tratado como sob encomenda,
// por segurança (não dá pra saber se tinha estoque).
const MADE_TO_ORDER_DAYS = 2;
function orderDeliveryDeadline(order) {
  const items = order.items ?? [];
  if (items.length === 0) return null;
  const anyMadeToOrder = items.some((it) => {
    const product = state.products.find((p) => p.id === it.product_id);
    return !itemIsInStock(it, product);
  });
  if (!anyMadeToOrder) return { ready: true, date: null };
  const date = new Date(order.created_at);
  date.setDate(date.getDate() + MADE_TO_ORDER_DAYS);
  return { ready: false, date };
}

function formatDateTime(dateLike) {
  const d = new Date(dateLike);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// Prazo de entrega combinado com o fabricante: 2 dias corridos a partir
// da data em que o pedido entrou.
function manufacturerDeadline(order) {
  const created = new Date(order.created_at);
  const deadline = new Date(created.getTime() + 2 * 24 * 60 * 60 * 1000);
  const d = String(deadline.getDate()).padStart(2, "0");
  const m = String(deadline.getMonth() + 1).padStart(2, "0");
  const y = deadline.getFullYear();
  return `${d}/${m}/${y}`;
}

// Foto do item do pedido: usa a foto do modelo/variação escolhido, se
// tiver, senão a foto padrão do produto.
function orderItemPhoto(item) {
  const product = state.products.find((p) => p.id === item.product_id);
  if (!product) return null;
  if (item.variant_name && product.product_variants) {
    const variant = product.product_variants.find((v) => v.name === item.variant_name);
    if (variant && variant.photo_url) return variant.photo_url;
  }
  return product.photo_url || null;
}

// Link de pré-visualização da foto do item: em vez de mandar o link
// direto do Supabase Storage (que o WhatsApp não consegue pré-visualizar),
// passa pela nossa função "product-photo", que gera uma página com as
// tags corretas pra a miniatura aparecer sozinha no balão da conversa.
function orderItemPhotoPreviewUrl(item, order) {
  const photo = orderItemPhoto(item);
  if (!photo) return null;
  const nome = item.variant_name ? `${item.product_name} (${item.variant_name})` : item.product_name;
  const params = new URLSearchParams({
    src: photo,
    nome: nome,
    pedido: String(order.order_number ?? ""),
  });
  return `${SUPABASE_URL}/functions/v1/product-photo?${params.toString()}`;
}

// Mensagem pro fabricante: identificação da loja, nome do produto, a
// variação (cor/modelo) quando tiver, foto (com miniatura automática no
// WhatsApp) e prazo — nunca preço (o fabricante não precisa saber quanto
// o cliente pagou), e não inclui as embalagens de presente (isso a loja
// resolve por conta própria, não é o fabricante que produz).
function buildManufacturerMessage(order) {
  const lines = [];
  lines.push(`${STORE_NAME} - ${STORE_SUBTITLE}`);
  lines.push(`CNPJ: ${STORE_CNPJ}`);
  lines.push("");
  lines.push(`Novo pedido para produção — Nº ${String(order.order_number ?? "").padStart(6, "0")}`);
  lines.push(`Pedido recebido em: ${formatDateTime(order.created_at)}`);
  lines.push(`Prazo para entrega: ${manufacturerDeadline(order)}`);
  lines.push("");
  lines.push("Itens:");
  (order.items ?? []).forEach((it) => {
    lines.push(`• ${it.quantity}x ${it.product_name}`);
    if (it.variant_name) lines.push(`  Variação: ${it.variant_name}`);
    const photoPreview = orderItemPhotoPreviewUrl(it, order);
    if (photoPreview) lines.push(`  Foto: ${photoPreview}`);
  });
  return lines.join("\n");
}

async function loadOrders() {
  const { data, error } = await supabaseClient.from("orders").select("*").order("created_at", { ascending: false });
  if (error) { console.error("loadOrders:", error.message); return; }

  const { data: items, error: err2 } = await supabaseClient.from("order_items").select("*");
  if (err2) console.error("loadOrders itens:", err2.message);

  const { data: giftWraps, error: err3 } = await supabaseClient.from("order_gift_wraps").select("*");
  if (err3) console.error("loadOrders embalagens:", err3.message);

  const byOrder = {};
  (items || []).forEach((row) => { (byOrder[row.order_id] ||= []).push(row); });
  const giftWrapsByOrder = {};
  (giftWraps || []).forEach((row) => { (giftWrapsByOrder[row.order_id] ||= []).push(row); });

  state.orders = data.map((o) => ({ ...o, items: byOrder[o.id] || [], giftWraps: resolveOrderGiftWraps(o, giftWrapsByOrder[o.id]) }));
}

// A embalagem de presente de um pedido pode vir em duas formas: a nova
// (uma linha por embalagem em order_gift_wraps, permite mais de uma) ou,
// só pra pedidos feitos antes dessa tabela existir, os campos antigos
// direto em orders (gift_wrap_material_id/_name/_price, sempre um só).
function resolveOrderGiftWraps(order, rows) {
  if (rows && rows.length > 0) return rows;
  if (order.gift_wrap_material_name) {
    return [{
      material_id: order.gift_wrap_material_id,
      material_name: order.gift_wrap_material_name,
      quantity: 1,
      unit_price: order.gift_wrap_price ?? 0,
    }];
  }
  return [];
}

let pedidosState = { tab: "novo", expandedId: null, selected: new Set(), produtosAReceberOpen: false };

// Abas dos Pedidos — cada pedido mora numa aba de acordo com o status
// atual dele. "novo" é sempre o ponto de entrada (todo pedido sobe assim);
// "Aceitar" empurra pra "em_andamento"; "Marcar como concluído" empurra
// pra "concluido". "cancelado" fica numa aba própria pra não sumir.
const PEDIDOS_TABS = [
  { key: "novo", label: "Novos" },
  { key: "em_andamento", label: "Em andamento" },
  { key: "concluido", label: "Concluídos" },
  { key: "cancelado", label: "Cancelados" },

/* =====================================================================
   COMPROVANTE NÃO FISCAL (PDF) — um "reciboszinho" por pedido, no
   estilo de uma nota de balcão (mas sem valor fiscal — é só uma cópia
   organizada pra você gerenciar os pedidos fora do painel).

   Cada pedido vira uma página no tamanho de um cupom (80mm de largura,
   altura ajustada ao conteúdo daquele pedido especificamente).
   ===================================================================== */
// Formato pensado pra imprimir direto na bobina de 57mm da maquininha
// (ex: Ton T3 Smart) — bobinas de cartão costumam ser mais estreitas que
// as impressoras de recibo "de balcão" (que geralmente usam 80mm).
const RECEIPT_PAGE_WIDTH_MM = 57;
const RECEIPT_MARGIN_MM = 3;

function buildReceiptLinePlan(order) {
  const lines = [];
  // "wrap: true" por padrão pra NENHUMA linha correr o risco de ficar
  // cortada pela borda do papel — numa bobina estreita (57mm) até texto
  // relativamente curto pode não caber numa linha só, então cada linha
  // quebra sozinha em mais linhas quando precisar (ver expandReceiptLines).
  const push = (text, opts = {}) => lines.push({ text, size: 8, style: "normal", align: "center", gap: 4, wrap: true, ...opts });

  push(STORE_NAME, { size: 13, style: "bold", gap: 5.4 });
  push(STORE_SUBTITLE, { size: 8, gap: 3.8 });
  push(STORE_INSTAGRAM, { size: 8, gap: 3.8 });
  push(`CNPJ: ${STORE_CNPJ}`, { size: 8, gap: 5 });
  lines.push({ divider: true, gap: 4 });

  push(`Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")}`, { size: 9.5, style: "bold", gap: 4.6 });
  push(`Data: ${formatDateTime(order.created_at)}`, { align: "left", gap: 4 });
  push(`Status: ${ORDER_STATUS_LABELS[order.status] ?? order.status}`, { align: "left", gap: 4 });
  lines.push({ divider: true, gap: 4 });

  push(`Cliente: ${order.customer_name}`, { align: "left", gap: 4, wrap: true });
  push(`WhatsApp: ${order.customer_whatsapp}`, { align: "left", gap: 4 });
  if (order.customer_instagram) push(`Instagram: @${order.customer_instagram.replace(/^@/, "")}`, { align: "left", gap: 4 });
  lines.push({ divider: true, gap: 4 });

  push("ITENS", { align: "left", style: "bold", gap: 4.6 });
  (order.items ?? []).forEach((it) => {
    const variantLabel = it.variant_name ? ` (${it.variant_name})` : "";
    push(`${it.quantity}x ${it.product_name}${variantLabel}`, { align: "left", gap: 3.8, wrap: true });
    push(formatBRL(it.unit_price * it.quantity), { align: "right", gap: 4.4 });
  });
  (order.giftWraps ?? []).forEach((g) => {
    push(`${g.quantity}x ${g.material_name} (embalagem p/ presente)`, { align: "left", gap: 3.8, wrap: true });
    push(formatBRL(g.unit_price * g.quantity), { align: "right", gap: 4.4 });
  });
  lines.push({ divider: true, gap: 4 });

  push(`TOTAL: ${formatBRL(order.total)}`, { size: 11, style: "bold", align: "right", gap: 5.6 });
  push(`Forma de pagamento: ${order.payment_method === "brinde" ? "Brinde (cortesia)" : order.payment_method === "credito" ? "Cartão de crédito" : "Pix / à vista"}`, { align: "left", gap: 4, wrap: true });
  if (order.notes) {
    push("Observações:", { align: "left", gap: 3.8 });
    push(order.notes, { align: "left", gap: 3.8, wrap: true });
  }
  lines.push({ divider: true, gap: 4 });

  push("Obrigado pela preferência!", { style: "bold", gap: 4.4 });
  push("Este comprovante não possui valor fiscal.", { size: 6.5, gap: 3 });

  return lines;
}

// Resolve as linhas que precisam quebrar em várias (opts.wrap) em
// entradas simples de texto — assim dá pra medir a altura total ANTES
// de criar a página com o tamanho certo.
function expandReceiptLines(doc, plan, usableWidth) {
  const expanded = [];
  plan.forEach((line) => {
    if (line.divider || !line.wrap) { expanded.push(line); return; }
    doc.setFont("courier", line.style === "bold" ? "bold" : line.style === "italic" ? "italic" : "normal");
    doc.setFontSize(line.size);
    const wrapped = doc.splitTextToSize(String(line.text), usableWidth);
    wrapped.forEach((piece) => expanded.push({ ...line, text: piece, wrap: false }));
  });
  return expanded;
}

function drawReceiptPage(doc, order, pageWidth) {
  const usableWidth = pageWidth - RECEIPT_MARGIN_MM * 2;
  const plan = buildReceiptLinePlan(order);
  const expanded = expandReceiptLines(doc, plan, usableWidth);
  const topMargin = 6;
  const bottomMargin = 4;
  const totalHeight = topMargin + expanded.reduce((sum, l) => sum + l.gap, 0) + bottomMargin;

  doc.internal.pageSize.setWidth(pageWidth);
  doc.internal.pageSize.setHeight(totalHeight);

  let y = topMargin;
  expanded.forEach((line) => {
    if (line.divider) {
      doc.setLineDashPattern([0.6, 0.6], 0);
      doc.setDrawColor(150);
      doc.line(RECEIPT_MARGIN_MM, y - 2.6, pageWidth - RECEIPT_MARGIN_MM, y - 2.6);
      doc.setLineDashPattern([], 0);
      y += line.gap;
      return;
    }
    doc.setFont("courier", line.style === "bold" ? "bold" : line.style === "italic" ? "italic" : "normal");
    doc.setFontSize(line.size);
    doc.setTextColor(20);
    const x = line.align === "left" ? RECEIPT_MARGIN_MM : line.align === "right" ? pageWidth - RECEIPT_MARGIN_MM : pageWidth / 2;
    doc.text(line.text, x, y, { align: line.align });
    y += line.gap;
  });

  return totalHeight;
}

function buildOrdersReceiptPdf(orders) {
  const { jsPDF } = window.jspdf;
  // Cria já com o tamanho certo pro primeiro pedido (o construtor exige
  // um tamanho inicial — ajustamos a altura de cada página na hora de
  // desenhar, inclusive a primeira).
  const doc = new jsPDF({ unit: "mm", format: [RECEIPT_PAGE_WIDTH_MM, 200] });
  orders.forEach((order, idx) => {
    if (idx > 0) doc.addPage([RECEIPT_PAGE_WIDTH_MM, 200]);
    drawReceiptPage(doc, order, RECEIPT_PAGE_WIDTH_MM);
  });
  return doc;
}

/* =====================================================================
   NOTA DE FORNECEDOR (PDF) — pra um fornecedor específico, lista os
   itens de todos os pedidos ainda não marcados como "Fornecedor pago"
   que usam produto(s) dele, com custo unitário e total — documento
   pronto pra mandar pro fornecedor (WhatsApp/e-mail) cobrando ou
   conferindo o que está pendente.
   ===================================================================== */
// Junta, pra um fornecedor, os itens de todos os pedidos não cancelados
// e ainda não marcados "Fornecedor pago" cujo produto está vinculado a
// esse fornecedor — com o custo (produtos.cost, o valor que a loja paga
// pro fornecedor, não o preço cobrado do cliente).
// OBS: se um produto foi apagado do cadastro depois da venda, não dá
// pra saber mais a qual fornecedor ele pertencia (o pedido só guarda o
// NOME do produto na hora da venda, não o fornecedor) — esse item fica
// de fora da nota e do total (isApprox avisa quando isso acontece, pra
// não fingir que a nota é 100% completa).
function pendingSupplierItems(supplierId) {
  const rows = [];
  let isApprox = false;
  state.orders
    .filter((o) => o.status !== "cancelado" && !o.fornecedor_pago_at)
    .forEach((o) => {
      (o.items ?? []).forEach((it) => {
        const product = state.products.find((p) => p.id === it.product_id);
        if (!product) { isApprox = true; return; }
        if (product.supplier_id !== supplierId) return;
        rows.push({
          kind: "pedido",
          orderNumber: o.order_number,
          // Normaliza pra "AAAA-MM-DD" (fuso do Brasil) já aqui — o
          // resto do código (Nota em PDF/imagem) só formata, sem
          // precisar reconverter fuso na hora de desenhar.
          date: toLocalISODate(new Date(o.created_at)),
          productName: it.product_name,
          variantName: it.variant_name,
          quantity: it.quantity,
          unitCost: Number(product.cost),
          subtotal: Number(product.cost) * it.quantity,
          fornecedorEntregou: !!o.fornecedor_entregue_at,
        });
      });
    });

  // Compras de estoque (consignação) lançadas pra esse fornecedor e
  // ainda não marcadas como pagas — juntam na MESMA nota: pro
  // fornecedor tanto faz se a dívida veio de um pedido de cliente ou de
  // uma compra de estoque, é tudo que a loja deve pra ele.
  state.cashEntries
    .filter((e) => e.category === "Compra de estoque" && !e.paid_at && e.supplier_id === supplierId)
    .forEach((e) => {
      const product = state.products.find((p) => p.id === e.product_id);
      if (!product) { isApprox = true; return; }
      rows.push({
        kind: "estoque",
        orderNumber: null,
        date: e.entry_date, // já é "AAAA-MM-DD" (coluna date do Postgres, sem fuso envolvido)
        productName: product.name,
        variantName: e.variant_name,
        quantity: e.quantity != null ? Number(e.quantity) : null,
        unitCost: e.unit_cost != null ? Number(e.unit_cost) : null,
        subtotal: Number(e.amount),
        fornecedorEntregou: null, // não se aplica — já está na loja, só falta pagar
      });
    });

  rows.sort((a, b) => new Date(a.date) - new Date(b.date));
  const total = rows.reduce((sum, r) => sum + r.subtotal, 0);
  return { rows, total, isApprox };
}

function buildSupplierNotePdf(supplier, pending) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const pageWidth = 210;
  const pageHeight = 297;
  const margin = 15;
  const usableWidth = pageWidth - margin * 2;

    pedido: { x: margin, w: 18 },
    data: { x: margin + 18, w: 18 },

  pending.rows.forEach((r, idx) => {

    doc.setFont("helvetica", "normal");

    const wrapped = doc.splitTextToSize(itemLabel, cols.item.w - 2);
    const rowHeight = Math.max(6, wrapped.length * 3.8 + 2.2);

    // Quebra de página: deixa espaço extra pro rodapé/total na última página.
    if (y + rowHeight > pageHeight - margin - 16) {
      doc.addPage();
      y = margin;
      drawTableHeader();
    }

    if (idx % 2 === 1) {
      doc.setFillColor(244, 245, 249);
      doc.rect(margin, y - 4, usableWidth, rowHeight, "F");
    }
    doc.setTextColor(20);
    doc.text(r.kind === "estoque" ? "Estoque" : `Nº ${String(r.orderNumber ?? "").padStart(6, "0")}`, cols.pedido.x + 1, y);

    doc.text(r.quantity != null ? String(r.quantity) : "—", cols.qtd.x + cols.qtd.w - 1, y, { align: "right" });

  doc.line(margin, y, margin + usableWidth, y);

  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);

  if (pending.isApprox) {
    y += 8;

    doc.setFontSize(7.5);
    doc.setTextColor(120);
    doc.text(
      doc.splitTextToSize("* Pode haver itens (de pedidos ou de compras de estoque) cujo produto foi removido do cadastro depois — esses não entram nesta nota nem no total acima.", usableWidth),
      margin, y
    );
  }

  return doc;
}

// Nome de arquivo a partir do nome do fornecedor (sem acento, sem
// espaço) — usado tanto na nota em PDF quanto na nota em imagem.
function supplierFileSlug(supplier) {
  return supplier.name.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // tira acento
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "fornecedor";
}

// Quebra um texto em várias linhas pra caber numa largura máxima (em
// px) — mesma ideia do doc.splitTextToSize() do jsPDF, só que pro
// Canvas 2D (que não tem esse helper pronto).
function wrapCanvasText(ctx, text, maxWidth) {
  const words = String(text).split(" ");
  const lines = [];
  let current = "";
  words.forEach((word) => {
    const test = current ? `${current} ${word}` : word;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });
  lines.push(current);
  return lines;
}

// Mesma nota de fornecedor (pendências pra ele), só que desenhada num
// <canvas> em vez de um PDF — gera uma IMAGEM (JPG), bem mais fácil de
// mandar pelo WhatsApp direto do celular do que um PDF (abre direto
// como foto, sem precisar de app de leitor de PDF).
function buildSupplierNoteCanvas(supplier, pending) {
  const width = 900;
  const margin = 40;
  const usableWidth = width - margin * 2;
  const cols = {
    pedido: { x: margin, w: 80 },
    data: { x: margin + 80, w: 80 },
    item: { x: margin + 160, w: 330 },
    qtd: { x: margin + 490, w: 50 },
    entregue: { x: margin + 540, w: 70 },
    unit: { x: margin + 610, w: 100 },
    subtotal: { x: margin + 710, w: 100 },
  };
  const tableHeaderHeight = 40;
  // A legenda do "Entreg." ganha uma segunda linha só quando existe pelo
  // menos um item de compra de estoque (fornecedorEntregou === null) —
  // por isso a altura reservada pra ela varia (1 ou 2 linhas), e isso
  // PRECISA entrar certinho no cálculo da altura total do canvas abaixo
  // (senão o texto fica cortado, já que o canvas não "cresce sozinho").
  const hasEstoqueRows = pending.rows.some((r) => r.fornecedorEntregou === null);
  const legendHeight = pending.rows.length > 0 ? (hasEstoqueRows ? 42 : 22) : 0;

  // Usa um canvas provisório só pra medir o texto (fonte precisa bater
  // com a usada no desenho final) — o Canvas 2D não tem como calcular a
  // altura total ANTES de existir um canvas com contexto configurado.
  const measure = document.createElement("canvas").getContext("2d");
  measure.font = "13px Arial, sans-serif";
  const rowsLayout = pending.rows.map((r) => {
    const itemLabel = `${r.productName}${r.variantName ? ` (${r.variantName})` : ""}`;
    const wrapped = wrapCanvasText(measure, itemLabel, cols.item.w - 12);
    const rowHeight = Math.max(36, wrapped.length * 18 + 14);
    return { ...r, wrapped, rowHeight };
  });
  measure.font = "italic 12px Arial, sans-serif";
  const approxLines = pending.isApprox
    ? wrapCanvasText(measure, "* Pode haver itens (de pedidos ou de compras de estoque) cujo produto foi removido do cadastro depois — esses não entram nesta nota nem no total acima.", usableWidth)
    : [];

  const headerBlockHeight = 150 + (supplier.phone ? 24 : 0);
  const rowsHeight = rowsLayout.length > 0 ? rowsLayout.reduce((sum, r) => sum + r.rowHeight, 0) : 44;
  const footerHeight = 70 + legendHeight + (approxLines.length ? approxLines.length * 16 + 10 : 0);
  const height = Math.round(margin + headerBlockHeight + tableHeaderHeight + rowsHeight + footerHeight);

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, height);

  let y = margin;
  ctx.fillStyle = "#0f1a3c";
  ctx.font = "bold 28px Arial, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(STORE_NAME, margin, y + 22);
  y += 38;
  ctx.fillStyle = "#444444";
  ctx.font = "15px Arial, sans-serif";
  ctx.fillText(`${STORE_SUBTITLE} · CNPJ ${STORE_CNPJ}`, margin, y + 12);
  y += 34;

  ctx.fillStyle = "#0f1a3c";
  ctx.font = "bold 21px Arial, sans-serif";
  ctx.fillText(`Nota de itens pendentes — ${supplier.name}`, margin, y + 16);
  y += 32;
  ctx.fillStyle = "#444444";
  ctx.font = "14px Arial, sans-serif";
  ctx.fillText(`Gerado em ${formatDateTime(new Date().toISOString())}`, margin, y + 12);
  y += 22;
  if (supplier.phone) {
    ctx.fillText(`Telefone: ${supplier.phone}`, margin, y + 12);
    y += 24;
  }
  y += 14;

  function drawTableHeader() {
    ctx.fillStyle = "#141e46";
    ctx.fillRect(margin, y, usableWidth, tableHeaderHeight);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13px Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Origem", cols.pedido.x + 8, y + 25);
    ctx.fillText("Data", cols.data.x + 8, y + 25);
    ctx.fillText("Item", cols.item.x + 8, y + 25);
    ctx.textAlign = "right";
    ctx.fillText("Qtd", cols.qtd.x + cols.qtd.w - 8, y + 25);
    ctx.textAlign = "center";
    ctx.fillText("Entreg.", cols.entregue.x + cols.entregue.w / 2, y + 25);
    ctx.textAlign = "right";
    ctx.fillText("Custo unit.", cols.unit.x + cols.unit.w - 8, y + 25);
    ctx.fillText("Subtotal", cols.subtotal.x + cols.subtotal.w - 8, y + 25);
    y += tableHeaderHeight;
  }

  drawTableHeader();

  if (rowsLayout.length === 0) {
    ctx.fillStyle = "#555555";
    ctx.font = "italic 14px Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Nenhum item pendente pra este fornecedor no momento.", margin, y + 26);
    y += 44;
  }

  rowsLayout.forEach((r, idx) => {
    if (idx % 2 === 1) {
      ctx.fillStyle = "#f4f5f9";
      ctx.fillRect(margin, y, usableWidth, r.rowHeight);
    }
    const textY = y + 24;
    ctx.fillStyle = "#141414";
    ctx.font = "13px Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(r.kind === "estoque" ? "Estoque" : `Nº ${String(r.orderNumber ?? "").padStart(6, "0")}`, cols.pedido.x + 8, textY);
    ctx.fillText(formatDate(r.date), cols.data.x + 8, textY);
    r.wrapped.forEach((line, i) => ctx.fillText(line, cols.item.x + 8, textY + i * 18));
    ctx.textAlign = "right";
    ctx.fillText(r.quantity != null ? String(r.quantity) : "—", cols.qtd.x + cols.qtd.w - 8, textY);
    ctx.textAlign = "center";
    ctx.font = "bold 13px Arial, sans-serif";
    ctx.fillStyle = r.fornecedorEntregou === null ? "#8a8a8a" : (r.fornecedorEntregou ? "#107a4a" : "#b42828");
    ctx.fillText(r.fornecedorEntregou === null ? "—" : (r.fornecedorEntregou ? "S" : "N"), cols.entregue.x + cols.entregue.w / 2, textY);
    ctx.fillStyle = "#141414";
    ctx.font = "13px Arial, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(r.unitCost != null ? formatBRL(r.unitCost) : "—", cols.unit.x + cols.unit.w - 8, textY);
    ctx.fillText(formatBRL(r.subtotal), cols.subtotal.x + cols.subtotal.w - 8, textY);
    y += r.rowHeight;
  });

  y += 16;
  ctx.strokeStyle = "#999999";
  ctx.beginPath();
  ctx.moveTo(margin, y);
  ctx.lineTo(margin + usableWidth, y);
  ctx.stroke();
  y += 30;
  ctx.fillStyle = "#141414";
  ctx.font = "bold 19px Arial, sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(`TOTAL: ${formatBRL(pending.total)}`, margin + usableWidth, y);
  ctx.textAlign = "left";

  if (rowsLayout.length > 0) {
    y += 24;
    ctx.fillStyle = "#777777";
    ctx.font = "12px Arial, sans-serif";
    ctx.fillText('"Entreg." = fornecedor já entregou o item pra loja: S = sim, N = ainda não.', margin, y);
    if (hasEstoqueRows) {
      y += 20;
      ctx.fillText('"—" = item de compra de estoque (já está na loja, só falta pagar).', margin, y);
    }
  }

  if (approxLines.length > 0) {
    y += 22;
    ctx.fillStyle = "#777777";
    ctx.font = "italic 12px Arial, sans-serif";
    approxLines.forEach((line, i) => ctx.fillText(line, margin, y + i * 16));
  }

  return canvas;
}

// Acha o cliente cadastrado cujo WhatsApp bate com o do pedido, comparando
// só os dígitos (assim funciona mesmo se um tiver "+55" e o outro não).
function findCustomerByPhone(phone) {
  const digits = String(phone ?? "").replace(/\D/g, "");
  if (!digits) return null;
  return state.customers.find((c) => String(c.whatsapp ?? "").replace(/\D/g, "") === digits) ?? null;
}

// "Iniciar venda": gera o lançamento correspondente no Caixa a partir de
// um pedido do Catálogo (evita ter que digitar tudo de novo à mão). Se o
// pedido tinha embalagem de presente escolhida, já vincula o material
// usado também (o que dá baixa automática no estoque).
async function iniciarVenda(order) {
  if (state.cashEntries.some((e) => e.order_id === order.id)) {
    alert("Esse pedido já tem uma venda registrada no Caixa.");
    return;
  }

  const itemsDesc = [
    ...(order.items ?? []).map((it) => `${it.quantity}x ${it.product_name}${it.variant_name ? ` (${it.variant_name})` : ""}`),
    ...(order.giftWraps ?? []).map((g) => `${g.quantity}x ${g.material_name} (embalagem)`),
  ].join(", ");
  const customer = findCustomerByPhone(order.customer_whatsapp);

  const payload = {
    entry_type: "entrada",
    entry_date: todayISO(),
    amount: order.total,
    category: "Venda",
    description: `Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")} — ${itemsDesc}`,
    payment_method: order.payment_method,
    customer_id: customer ? customer.id : null,
    order_id: order.id,
    paid_at: new Date().toISOString(),
    created_by: state.currentUser.id,
  };

  const { data: inserted, error } = await supabaseClient.from("cash_entries").insert(payload).select("id").single();
  if (error) { alert("Não foi possível registrar a venda no Caixa: " + error.message); return; }

  // Junto com a entrada, lança também a saída do custo (produto +
  // embalagem de presente) desse pedido — assim o Caixa reflete o lucro
  // de verdade, não só o valor cobrado do cliente. NÃO inclui o custo de
  // materiais "Essenciais": esse já vira saída no Caixa quando o
  // material é COMPRADO (em Materiais, ao aumentar o estoque) — somar de
  // novo aqui descontaria o mesmo gasto duas vezes do saldo do Caixa.
  // Sem lançar se der zero (a tabela não aceita saída de R$ 0,00).
  const cost = orderCost(order);
  if (cost.costExcludingEssentials > 0) {
    const custoPayload = {
      entry_type: "saida",
      entry_date: todayISO(),
      amount: Math.round(cost.costExcludingEssentials * 100) / 100,
      category: "Custo do pedido",
      description: `Custo (produto + embalagem) do Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")}${cost.isApprox ? " (estimado — produto ou material não está mais cadastrado)" : ""}`,
      payment_method: null,
      customer_id: customer ? customer.id : null,
      order_id: order.id,
      paid_at: new Date().toISOString(),
      created_by: state.currentUser.id,
    };
    const { error: custoError } = await supabaseClient.from("cash_entries").insert(custoPayload);
    if (custoError) console.error("iniciarVenda custo:", custoError.message);
  }

  const giftWrapRows = (order.giftWraps ?? [])
    .filter((g) => g.material_id && state.materials.some((m) => m.id === g.material_id))
    .map((g) => {
      const material = state.materials.find((m) => m.id === g.material_id);
      return { cash_entry_id: inserted.id, material_id: material.id, quantity: g.quantity, unit_cost: material.unit_cost };
    });
  if (giftWrapRows.length > 0) {
    const { error: linkError } = await supabaseClient.from("cash_entry_materials").insert(giftWrapRows);
    if (linkError) console.error("iniciarVenda materiais:", linkError.message);
  }

  // "Iniciar venda" já registra o recebimento no Caixa — nesse ponto o
  // pedido está finalizado, então também marca como "Concluído" na hora
  // (não precisa mais clicar em "Marcar como concluído" à parte depois).
  // IMPORTANTE: checa o erro aqui (igual os outros botões de status) —
  // sem isso, se essa atualização falhar (ex: sessão expirada), o Caixa
  // recebe o lançamento normalmente mas o pedido fica preso em "Novo"
  // sem nenhum aviso na tela.
  const { error: statusError } = await supabaseClient.from("orders").update({
    status: "concluido", updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
  }).eq("id", order.id);
  if (statusError) {
    console.error("iniciarVenda status:", statusError.message);
    alert("A venda foi registrada no Caixa, mas não foi possível marcar o pedido como 'Concluído': " + statusError.message + "\n\nUse o campo de status do pedido pra marcar manualmente.");
  }

  await Promise.all([loadCashEntries(), loadMaterials(), loadOrders()]);
  renderPedidos(document.getElementById("main-content"));
}

function renderPedidos(container) {
  // Ordenação da lista, por aba:
  //   - "Em andamento": ordem CRONOLÓGICA (mais antigo primeiro) — é a
  //     fila de produção/entrega: mostra qual pedido foi recebido
  //     primeiro e, portanto, deve ser entregue primeiro.
  //   - Outras abas: pedidos NÃO pagos ficam em evidência, no topo da
  //     lista — o resto mantém a ordem normal (mais recente primeiro,
  //     como já vem de loadOrders). Array.prototype.sort é estável em
  //     todo navegador moderno, então essa ordenação secundária é
  //     preservada.
  const visible = state.orders
    .filter((o) => o.status === pedidosState.tab)
    .sort((a, b) => pedidosState.tab === "em_andamento"
      ? new Date(a.created_at) - new Date(b.created_at)
      : Number(!!a.paid_at) - Number(!!b.paid_at));
  // Limpa da seleção qualquer pedido que não existe mais na lista atual.
  [...pedidosState.selected].forEach((id) => { if (!state.orders.some((o) => o.id === id)) pedidosState.selected.delete(id); });
  const selectedCount = pedidosState.selected.size;
  const allVisibleSelected = visible.length > 0 && visible.every((o) => pedidosState.selected.has(o.id));

  // Custo (não confundir com o valor cobrado do cliente) de cada pedido
  // visível, calculado uma vez só aqui e reaproveitado tanto no card
  // individual quanto na soma dos pedidos selecionados.
  const orderCosts = new Map(visible.map((o) => [o.id, orderCost(o)]));
  const deliveryDeadlines = new Map(visible.map((o) => [o.id, orderDeliveryDeadline(o)]));
  const selectedIds = [...pedidosState.selected];
  const selectedProductCostTotal = selectedIds.reduce((sum, id) => sum + (orderCosts.get(id)?.productCost ?? 0), 0);
  const selectedMaterialsCostTotal = selectedIds.reduce((sum, id) => sum + (orderCosts.get(id)?.materialsCost ?? 0), 0);
  const selectedCostTotal = selectedProductCostTotal + selectedMaterialsCostTotal;
  const selectedProductHasApprox = selectedIds.some((id) => orderCosts.get(id)?.isProductApprox);
  const selectedMaterialsHasApprox = selectedIds.some((id) => orderCosts.get(id)?.isMaterialsApprox);
  const selectedHasApprox = selectedProductHasApprox || selectedMaterialsHasApprox;
  // "Entrada" = o valor que o pedido gera de receita (o que o cliente
  // paga), pra comparar lado a lado com o custo dos pedidos selecionados.
  const selectedEntradaTotal = selectedIds.reduce((sum, id) => sum + Number(state.orders.find((o) => o.id === id)?.total ?? 0), 0);
  const selectedProfitEstimate = selectedEntradaTotal - selectedCostTotal;

  // ---- Resumo geral (independe de aba/status e de qualquer seleção) ----
  // Pedidos cancelados ficam de fora das quatro contas: não viraram venda
  // real, então não entram em lucro, valor recebido/a receber nem despesas.
  //   - Lucro real: soma de (valor cobrado − custo) só dos pedidos já
  //     PAGOS — dinheiro que já entrou, descontado o custo.
  //   - Valores recebidos: soma do valor cobrado (o.total) dos pedidos já
  //     PAGOS — a entrada PURA, sem descontar custo (diferente do Lucro
  //     real, que já é depois do custo).
  //   - Valores a receber: soma do valor cobrado dos pedidos NÃO pagos —
  //     quanto ainda falta receber dos clientes.
  //   - Despesas: soma do custo (produto + materiais) de TODOS os
  //     pedidos, pagos ou não — o custo já é real assim que o produto é
  //     feito/vendido, independente de o cliente já ter pago. NÃO é o
  //     saldo de saídas do Caixa (que mistura outras coisas, tipo compra
  //     de material essencial em lote antes de virar venda).
  //   - Falta pagar (fornecedor): soma só do custo do PRODUTO (sem
  //     materiais — embalagem/essencial são gasto interno da loja, não
  //     do fornecedor) dos pedidos cujo "Fornecedor pago" ainda não foi
  //     marcado. Independe de o cliente já ter pago ou não.
  const statsOrders = state.orders.filter((o) => o.status !== "cancelado");
  let lucroReal = 0;
  let lucroRealHasApprox = false;
  let valoresRecebidos = 0;
  let valoresAReceber = 0;
  // "Despesas" é seccionada em 3 números: só produto, só materiais
  // (embalagem de presente + essenciais como fio/cola/etiqueta), e o
  // total (soma dos dois) — cada seção com sua própria flag de "≈"
  // (custo aproximado), já que um pedido pode ter só o produto
  // descadastrado, só o material, os dois, ou nenhum.
  let despesasProductTotal = 0;
  let despesasProductHasApprox = false;
  let despesasMaterialsTotal = 0;
  let despesasMaterialsHasApprox = false;
  let despesasTotal = 0;
  let despesasHasApprox = false;
  let faltaPagarFornecedor = 0;
  let faltaPagarHasApprox = false;
  statsOrders.forEach((o) => {
    const c = orderCost(o);
    // Custo (despesas/falta-pagar-fornecedor) continua contando mesmo
    // pra pedidos-brinde — o gasto é real independente de o produto ter
    // sido cobrado do cliente ou dado de presente.
    despesasProductTotal += c.productCost;
    if (c.isProductApprox) despesasProductHasApprox = true;
    despesasMaterialsTotal += c.materialsCost;
    if (c.isMaterialsApprox) despesasMaterialsHasApprox = true;
    despesasTotal += c.cost;
    if (c.isApprox) despesasHasApprox = true;
    if (!o.fornecedor_pago_at) {
      faltaPagarFornecedor += c.productCost;
      if (c.isProductApprox) faltaPagarHasApprox = true;
    }
    // Já os valores de receita (recebidos/a receber/lucro) ficam de fora
    // pra pedidos-brinde: nada foi cobrado do cliente (total = 0), então
    // não faz sentido entrar aqui nem aparecer como "a receber".
    if (o.payment_method === "brinde") return;
    if (o.paid_at) {
      valoresRecebidos += Number(o.total);
      lucroReal += Number(o.total) - c.cost;
      if (c.isApprox) lucroRealHasApprox = true;
    } else {
      valoresAReceber += Number(o.total);
    }
  });

  // Quebra de "Valores a receber" por cliente (soma quando o mesmo
  // cliente tem mais de um pedido não pago), do maior valor pro menor.
  const receivablesByCustomer = new Map();
  statsOrders.forEach((o) => {
    if (!o.paid_at && o.payment_method !== "brinde") receivablesByCustomer.set(o.customer_name, (receivablesByCustomer.get(o.customer_name) || 0) + Number(o.total));
  });
  const receivablesList = [...receivablesByCustomer.entries()].sort((a, b) => b[1] - a[1]);

  // "Produtos a receber (fornecedor)": pedidos cujo fornecedor/fabricante
  // ainda NÃO entregou o produto pra loja (checkbox "Fornecedor entregou"
  // desmarcada) — do mais antigo pro mais novo, pra destacar o que está
  // esperando há mais tempo primeiro.
  const produtosAReceberOrders = statsOrders
    .filter((o) => !o.fornecedor_entregue_at)
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  container.innerHTML = `
    <div class="flex flex-col gap-6">
      <div>
        <h1 class="text-xl font-semibold text-navy-900">Pedidos</h1>
        <p class="text-sm text-navy-500">Pedidos feitos pelos clientes no Catálogo público.</p>
      </div>

      <div class="flex flex-wrap gap-3">
        <div class="flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="Soma do valor cobrado (entrada pura, sem descontar custo) dos pedidos já PAGOS, de qualquer status (exceto cancelados).">
          <p class="text-xs font-medium text-navy-500">Valores recebidos (entradas)</p>
          <p class="text-lg font-semibold text-blue-700">${formatBRL(valoresRecebidos)}</p>
        </div>
        <div class="flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="${lucroRealHasApprox ? "Inclui custo aproximado — algum produto ou material de um pedido pago não está mais cadastrado. " : ""}Soma de (valor cobrado − custo) só dos pedidos já PAGOS, de qualquer status (exceto cancelados) — dinheiro que já entrou de verdade.">
          <p class="text-xs font-medium text-navy-500">Lucro real (pedidos pagos)</p>
          <p class="text-lg font-semibold text-emerald-700">${lucroRealHasApprox ? "≈ " : ""}${formatBRL(lucroReal)}</p>
        </div>
        <div class="flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="Soma do valor dos pedidos NÃO pagos ainda, de qualquer status (exceto cancelados) — quanto falta receber dos clientes.">
          <p class="text-xs font-medium text-navy-500">Valores a receber (não pagos)</p>
          <p class="text-lg font-semibold text-red-600">${formatBRL(valoresAReceber)}</p>
          ${receivablesList.length > 0 ? `
            <div class="mt-1.5 flex flex-col gap-0.5 border-t border-navy-50 pt-1.5">
              ${receivablesList.map(([name, amount]) => `
                <span class="flex items-baseline justify-between gap-2 text-[11px] text-navy-400">
                  <span class="truncate">${escapeHtml(name)}</span>
                  <span class="whitespace-nowrap font-medium text-navy-500">${formatBRL(amount)}</span>
                </span>
              `).join("")}
            </div>
          ` : ""}
        </div>
        <div class="flex-1 min-w-[220px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="${despesasHasApprox ? "Inclui custo aproximado — algum produto ou material de um pedido não está mais cadastrado. " : ""}Soma do custo de TODOS os pedidos, pagos ou não (exceto cancelados) — não é o saldo de saídas do Caixa.">
          <p class="text-xs font-medium text-navy-500">Despesas (custo total)</p>
          <p class="text-lg font-semibold text-orange-600">${despesasHasApprox ? "≈ " : ""}${formatBRL(despesasTotal)}</p>
          <div class="mt-1.5 flex flex-col gap-0.5 border-t border-navy-50 pt-1.5 text-[11px] text-navy-400">
            <span class="flex items-baseline justify-between gap-2" title="${despesasProductHasApprox ? "Inclui custo aproximado — algum produto de um pedido não está mais cadastrado." : "Soma do custo dos produtos em si (produtos.cost)."}">
              <span>Produtos</span>
              <span class="whitespace-nowrap font-medium text-navy-500">${despesasProductHasApprox ? "≈ " : ""}${formatBRL(despesasProductTotal)}</span>
            </span>
            <span class="flex items-baseline justify-between gap-2" title="${despesasMaterialsHasApprox ? "Inclui custo aproximado — algum material de um pedido não está mais cadastrado." : "Soma do custo de embalagem de presente + materiais essenciais (fio, cola, etiqueta...) usados em cada venda."}">
              <span>Materiais e embalagens</span>
              <span class="whitespace-nowrap font-medium text-navy-500">${despesasMaterialsHasApprox ? "≈ " : ""}${formatBRL(despesasMaterialsTotal)}</span>
            </span>
          </div>
        </div>
        <div class="flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 shadow" title="${faltaPagarHasApprox ? "Inclui custo aproximado — algum produto de um pedido não está mais cadastrado. " : ""}Soma só do custo do PRODUTO (sem materiais, tipo embalagem — isso é gasto interno da loja) dos pedidos cujo 'Fornecedor pago' ainda não foi marcado.">
          <p class="text-xs font-medium text-navy-500">Falta pagar (fornecedor)</p>
          <p class="text-lg font-semibold text-red-700">${faltaPagarHasApprox ? "≈ " : ""}${formatBRL(faltaPagarFornecedor)}</p>

        <button id="produtos-a-receber-btn" type="button" class="flex-1 min-w-[200px] rounded-xl border border-navy-100 bg-white px-4 py-3 text-left shadow transition hover:border-gold-300 hover:shadow-md" title="Pedidos cujo fornecedor/fabricante ainda não entregou o produto pra loja (checkbox 'Fornecedor entregou' desmarcada). Clique pra ver a lista.">
          <p class="text-xs font-medium text-navy-500">Produtos a receber (fornecedor)</p>
          <p class="text-lg font-semibold ${produtosAReceberOrders.length > 0 ? "text-gold-700" : "text-navy-400"}">${produtosAReceberOrders.length} ${produtosAReceberOrders.length === 1 ? "pedido" : "pedidos"}</p>
        </button>
      </div>

      ${pedidosState.produtosAReceberOpen ? `
        <div id="produtos-a-receber-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
          <div class="flex max-h-[85vh] w-full max-w-2xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
            <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">
              <div>
                <h2 class="text-lg font-semibold text-navy-900">Produtos a receber (fornecedor)</h2>

              ` : `
                <div class="flex flex-col gap-3">
                  ${produtosAReceberOrders.map((o) => `
                    <div class="rounded-lg border border-navy-100 bg-cream-50 px-3 py-2.5">
                      <div class="flex flex-wrap items-baseline justify-between gap-2">

                        ${(o.items ?? []).map((it) => `

              ${t.label} <span class="ml-1 rounded-full ${active ? "bg-gold-100 text-gold-800" : "bg-navy-100 text-navy-500"} px-1.5 py-0.5 text-xs font-semibold">${count}</span>

      </div>

      <div class="flex flex-wrap items-center gap-3 rounded-xl border border-navy-100 bg-white px-4 py-3 shadow">
        <label class="flex items-center gap-2 text-sm text-navy-700">
          <input type="checkbox" id="pedidos-select-all" class="h-4 w-4 rounded border-navy-300" ${visible.length === 0 ? "disabled" : ""} ${allVisibleSelected ? "checked" : ""} />
          Selecionar todos os visíveis

          <div class="flex flex-col gap-0.5 rounded-lg bg-cream-50 px-3 py-1.5 text-xs font-medium text-navy-700" title="${selectedHasApprox ? "Inclui custo aproximado — algum produto ou material dos pedidos selecionados não está mais cadastrado" : "Resumo dos pedidos selecionados"}">

      else pedidosState.selected.delete(id);

  const downloadBtn = document.getElementById("pedidos-download-btn");
  if (downloadBtn) {
    downloadBtn.addEventListener("click", () => {
      try {
        const selectedOrders = state.orders

          .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

        if (!window.jspdf || !window.jspdf.jsPDF) {
          alert("Não foi possível gerar o comprovante: a biblioteca de PDF não carregou. Recarregue a página e tente novamente.");
          return;
        }
        const doc = buildOrdersReceiptPdf(selectedOrders);
        const now = new Date();
        const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        doc.save(`pedidos-luz-mariana-${stamp}.pdf`);
      } catch (err) {
        console.error("Erro ao gerar comprovante:", err);
        alert("Não foi possível gerar o comprovante. Tente novamente ou avise o suporte.");
      }
    });
  }

  const deleteBtn = document.getElementById("pedidos-delete-btn");
  if (deleteBtn) {
    deleteBtn.addEventListener("click", async () => {
      const ids = [...pedidosState.selected];
      if (ids.length === 0) return;
      const confirmMsg = ids.length === 1
        ? "Excluir este pedido definitivamente? Essa ação não pode ser desfeita."
        : `Excluir estes ${ids.length} pedidos definitivamente? Essa ação não pode ser desfeita.`;
      if (!confirm(confirmMsg)) return;

      deleteBtn.disabled = true;
      deleteBtn.textContent = "Excluindo...";

        alert("Não foi possível excluir: " + error.message);

        deleteBtn.textContent = "🗑 Excluir selecionados";
        return;
      }
      pedidosState.selected.clear();
      await loadOrders();
      renderApp();
    });
  }

async function loadCashEntries() {
  const { data, error } = await supabaseClient.from("cash_entries_with_balance").select("*").order("entry_date", { ascending: false }).order("created_at", { ascending: false });
  if (error) { console.error("loadCashEntries:", error.message); return; }

  const { data: materialsUsed, error: err2 } = await supabaseClient
    .from("cash_entry_materials")
    .select("cash_entry_id, quantity, unit_cost, materials(id, name, unit)");
  if (err2) console.error("loadCashEntries materiais:", err2.message);

  const byEntry = {};
  (materialsUsed || []).forEach((row) => {
    (byEntry[row.cash_entry_id] ||= []).push(row);
  });
  state.cashEntries = data.map((e) => ({ ...e, materials_used: byEntry[e.id] || [] }));
}

let caixaState = { formOpen: false, editingId: null, stockDebtOpen: false };

function renderCaixa(container) {
  const entries = state.cashEntries;
  const currentBalance = entries[0]?.running_balance ?? 0;
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  let monthIn = 0, monthOut = 0;
  entries.forEach((e) => {
    if (!e.entry_date.startsWith(ym)) return;
    if (e.entry_type === "entrada") monthIn += Number(e.amount); else monthOut += Number(e.amount);
  });

  // Dívida em compras de estoque: junta os lançamentos de "Compra de
  // estoque" ainda NÃO PAGOS (consignação) agrupados pela MESMA compra
  // (purchase_batch_id) — pra mostrar, detalhado, quanto falta pagar de
  // cada compra (não só o total solto). Lançamento antigo sem
  // purchase_batch_id (de antes dessa coluna existir) vira seu próprio
  // grupo sozinho, pra não sumir da lista.
  const groupByBatch = {};
  const stockDebtGroups = [];
  entries.filter((e) => e.category === "Compra de estoque" && !e.paid_at).forEach((e) => {
    const key = e.purchase_batch_id || `sem-lote-${e.id}`;
    if (!groupByBatch[key]) {
      groupByBatch[key] = { key, entries: [], date: e.entry_date, supplierId: e.supplier_id, total: 0 };
      stockDebtGroups.push(groupByBatch[key]);
    }
    groupByBatch[key].entries.push(e);
    groupByBatch[key].total += Number(e.amount);
  });
  stockDebtGroups.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)); // mais recente primeiro
  const stockDebtTotal = stockDebtGroups.reduce((s, g) => s + g.total, 0);

  const activeProducts = state.products.filter((p) => p.active);

  container.innerHTML = `
    <div class="flex flex-col gap-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-xl font-semibold text-navy-900">Controle de Caixa</h1>
          <p class="text-sm text-navy-500">Entradas e saídas, com saldo acumulado.</p>
        </div>
        <div class="flex gap-2">
          <button id="new-stock-purchase-btn" class="rounded-lg border border-navy-300 bg-white px-4 py-2 text-sm font-semibold text-navy-700 shadow transition hover:bg-navy-50">📦 Compra de estoque</button>
          <button id="new-brinde-btn" class="rounded-lg border border-gold-400 bg-white px-4 py-2 text-sm font-semibold text-gold-700 shadow transition hover:bg-gold-50">🎁 Lançar brinde</button>
          <button id="new-entry-btn" class="rounded-lg bg-gold-500 px-4 py-2 text-sm font-semibold text-navy-900 shadow transition hover:bg-gold-400">${caixaState.formOpen ? "Fechar" : "+ Novo lançamento"}</button>
        </div>
      </div>

      <div id="brinde-overlay-slot"></div>
      <div id="stock-purchase-slot"></div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div class="rounded-xl bg-navy-900 px-5 py-4 text-cream-50 shadow">
          <p class="text-xs uppercase tracking-wide opacity-80">Saldo atual</p>
          <p class="mt-1 text-2xl font-semibold">${formatBRL(currentBalance)}</p>
        </div>
        <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-emerald-800 shadow">
          <p class="text-xs uppercase tracking-wide opacity-80">Entradas do mês</p>
          <p class="mt-1 text-2xl font-semibold">${formatBRL(monthIn)}</p>
        </div>
        <div class="rounded-xl border border-red-200 bg-red-50 px-5 py-4 text-red-700 shadow">
          <p class="text-xs uppercase tracking-wide opacity-80">Saídas do mês</p>
          <p class="mt-1 text-2xl font-semibold">${formatBRL(monthOut)}</p>
        </div>
        <button id="stock-debt-btn" type="button" class="rounded-xl border ${stockDebtTotal > 0 ? "border-amber-300 bg-amber-50" : "border-navy-100 bg-white"} px-5 py-4 text-left shadow transition hover:shadow-md" title="Compras de estoque lançadas como 'não pago' (consignação), ainda sem marcar como pagas. Clique pra ver o detalhe por compra.">
          <p class="text-xs uppercase tracking-wide ${stockDebtTotal > 0 ? "text-amber-700" : "text-navy-400"} opacity-80">Dívida em compras de estoque</p>
          <p class="mt-1 text-2xl font-semibold ${stockDebtTotal > 0 ? "text-amber-800" : "text-navy-400"}">${formatBRL(stockDebtTotal)}</p>
        </button>
      </div>

      ${caixaState.stockDebtOpen ? `
        <div id="stock-debt-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/50 p-4">
          <div class="flex max-h-[85vh] w-full max-w-2xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
            <div class="flex items-center justify-between border-b border-navy-100 px-5 py-4">
              <div>
                <h2 class="text-lg font-semibold text-navy-900">Dívida em compras de estoque</h2>
                <p class="text-xs text-navy-500">Compras lançadas como "não pago" (consignação), agrupadas por compra, com todos os itens detalhados.</p>
              </div>
              <button id="close-stock-debt-btn" type="button" class="rounded px-2 py-1 text-navy-500 hover:bg-navy-100">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto px-5 py-4">
              ${stockDebtGroups.length === 0 ? `
                <p class="py-8 text-center text-sm text-navy-400">Nenhuma dívida em compras de estoque no momento.</p>
              ` : `
                <div class="flex flex-col gap-3">
                  ${stockDebtGroups.map((g) => `
                    <div class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2.5">
                      <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <span class="text-sm font-semibold text-navy-900">${formatDate(g.date)}${g.supplierId ? ` · ${escapeHtml(state.suppliers.find((s) => s.id === g.supplierId)?.name ?? "(fornecedor removido)")}` : ""}</span>
                        <span class="text-sm font-semibold text-amber-800">${formatBRL(g.total)}</span>
                      </div>
                      <div class="mt-1.5 flex flex-col gap-0.5">
                        ${g.entries.map((e) => `
                          <span class="text-xs text-navy-600">• ${escapeHtml(e.description) || "—"} <span class="text-navy-400">(${formatBRL(e.amount)})</span></span>
                        `).join("")}
                      </div>
                      <button type="button" data-mark-batch-paid data-batch-ids="${g.entries.map((e) => e.id).join(",")}" class="mark-batch-paid-btn mt-2 rounded-lg border border-emerald-300 bg-white px-3 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-50">Marcar esta compra como paga</button>
                    </div>
                  `).join("")}
                </div>
              `}
            </div>
          </div>
        </div>
      ` : ""}

      <div id="entry-form-slot"></div>

      <div class="overflow-x-auto rounded-xl border border-navy-100 bg-white shadow">
        <table class="w-full min-w-[820px] text-sm">
          <thead>
            <tr class="border-b border-navy-100 bg-navy-900 text-left text-xs uppercase tracking-wide text-cream-50">
              <th class="px-3 py-3">Data</th>
              <th class="px-3 py-3">Tipo</th>
              <th class="px-3 py-3">Categoria</th>
              <th class="px-3 py-3">Descrição</th>
              <th class="px-3 py-3">Pagamento</th>
              <th class="px-3 py-3 text-center">Pago</th>
              <th class="px-3 py-3 text-right">Valor</th>
              <th class="px-3 py-3 text-right">Saldo</th>
              <th class="px-3 py-3 text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            ${entries.length === 0 ? `<tr><td colspan="9" class="px-4 py-8 text-center text-navy-400">Nenhum lançamento ainda.</td></tr>` : entries.map((e) => `
              <tr class="border-b border-navy-50 last:border-0 hover:bg-cream-50">
                <td class="px-3 py-2.5">${formatDate(e.entry_date)}</td>
                <td class="px-3 py-2.5"><span class="rounded-full px-2 py-0.5 text-xs font-medium ${e.entry_type === "entrada" ? "bg-emerald-100 text-emerald-800" : "bg-red-100 text-red-700"}">${e.entry_type === "entrada" ? "Entrada" : "Saída"}</span></td>
                <td class="px-3 py-2.5">${escapeHtml(e.category) || "—"}</td>
                <td class="px-3 py-2.5 text-navy-600">
                  ${escapeHtml(e.description) || "—"}
                  ${e.customer_id ? `<div class="mt-0.5 text-xs font-normal text-navy-400">Cliente: ${escapeHtml(state.customers.find((c) => c.id === e.customer_id)?.name ?? "(removido)")}</div>` : ""}
                  ${e.supplier_id ? `<div class="mt-0.5 text-xs font-normal text-navy-400">Fornecedor: ${escapeHtml(state.suppliers.find((s) => s.id === e.supplier_id)?.name ?? "(removido)")}</div>` : ""}
                  ${e.materials_used && e.materials_used.length > 0 ? `<div class="mt-0.5 text-xs font-normal text-navy-400">Materiais: ${e.materials_used.map((mu) => `${escapeHtml(mu.materials?.name ?? "(material removido)")} (${Number(mu.quantity)} ${escapeHtml(mu.materials?.unit ?? "")})`).join(", ")}</div>` : ""}
                  ${adminName(e.created_by) ? `<div class="mt-0.5 text-xs font-normal text-navy-400">${e.entry_type === "entrada" ? "Vendido" : "Registrado"} por: <span class="font-medium text-navy-600">${escapeHtml(adminName(e.created_by))}</span></div>` : ""}
                </td>
                <td class="px-3 py-2.5 capitalize">${escapeHtml(e.payment_method) || "—"}</td>
                <td class="px-3 py-2.5 text-center">
                  <label class="inline-flex items-center gap-1.5" title="${e.paid_at ? `Pago em ${formatDate(e.paid_at.slice(0, 10))}` : "Ainda não foi pago (ex: compra por consignação) — não entra no Saldo atual até ser marcado como pago."}">
                    <input type="checkbox" data-cash-paid-toggle="${e.id}" ${e.paid_at ? "checked" : ""} class="cash-paid-toggle-cb h-3.5 w-3.5 rounded border-navy-300 text-emerald-600 focus:ring-emerald-400" />
                    ${!e.paid_at ? `<span class="rounded-full bg-amber-100 px-1.5 py-0.5 text-[10px] font-medium text-amber-700">Não pago</span>` : ""}
                  </label>
                </td>
                <td class="px-3 py-2.5 text-right font-medium ${e.entry_type === "entrada" ? "text-emerald-700" : "text-red-700"}">${e.entry_type === "entrada" ? "+" : "-"}${formatBRL(e.amount)}</td>
                <td class="px-3 py-2.5 text-right font-semibold text-navy-900">${formatBRL(e.running_balance)}</td>
                <td class="px-3 py-2.5 text-center">
                  <div class="flex justify-center gap-2">
                    <button data-edit="${e.id}" class="edit-entry-btn rounded px-2 py-1 text-xs font-medium text-navy-700 hover:bg-navy-100">Editar</button>
                    <button data-delete="${e.id}" class="delete-entry-btn rounded px-2 py-1 text-xs font-medium text-red-600 hover:bg-red-50">Excluir</button>
                  </div>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById("new-entry-btn").addEventListener("click", () => {
    caixaState.editingId = null;
    caixaState.formOpen = !caixaState.formOpen;
    renderCaixa(container);
  });
  document.getElementById("new-brinde-btn").addEventListener("click", () => {
    brindeState = { open: true, items: [], giftWraps: [], name: "", whatsapp: "", instagram: "", notes: "" };
    renderBrindeOverlay();
  });
  document.getElementById("new-stock-purchase-btn").addEventListener("click", () => {
    stockPurchaseState = { open: true, items: [], date: todayISO(), payment: "pix", paid: true, supplierId: "", _selectedProductId: null, _selectedVariantId: null, _qty: "1", _unitCost: "" };
    renderStockPurchaseOverlay();
  });
  const stockDebtBtn = document.getElementById("stock-debt-btn");
  if (stockDebtBtn) {
    stockDebtBtn.addEventListener("click", () => {
      caixaState.stockDebtOpen = true;
      renderCaixa(container);
    });
  }
  const closeStockDebtBtn = document.getElementById("close-stock-debt-btn");
  if (closeStockDebtBtn) {
    closeStockDebtBtn.addEventListener("click", () => {
      caixaState.stockDebtOpen = false;
      renderCaixa(container);
    });
  }
  const stockDebtOverlay = document.getElementById("stock-debt-overlay");
  if (stockDebtOverlay) {
    stockDebtOverlay.addEventListener("click", (e) => {
      if (e.target === stockDebtOverlay) {
        caixaState.stockDebtOpen = false;
        renderCaixa(container);
      }
    });
  }
  container.querySelectorAll(".mark-batch-paid-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const ids = btn.dataset.batchIds.split(",");
      btn.disabled = true;
      btn.textContent = "Marcando...";
      const { error } = await supabaseClient.from("cash_entries").update({
        paid_at: new Date().toISOString(),
        updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
      }).in("id", ids);
      if (error) { alert("Não foi possível marcar a compra como paga: " + error.message); }
      await loadCashEntries();
      renderCaixa(container);
    });
  });
  container.querySelectorAll(".edit-entry-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      caixaState.editingId = btn.dataset.edit;
      caixaState.formOpen = true;
      renderCaixa(container);
    });
  });
  container.querySelectorAll(".delete-entry-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Excluir este lançamento? Se tinha materiais vinculados, eles voltam pro estoque.")) return;
      await supabaseClient.from("cash_entries").delete().eq("id", btn.dataset.delete);
      if (caixaState.editingId === btn.dataset.delete) { caixaState.editingId = null; caixaState.formOpen = false; }
      await Promise.all([loadCashEntries(), loadMaterials()]);
      renderCaixa(container);
    });
  });
  container.querySelectorAll(".cash-paid-toggle-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.cashPaidToggle;
      cb.disabled = true;
      const { error } = await supabaseClient.from("cash_entries").update({
        paid_at: cb.checked ? new Date().toISOString() : null,
        updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
      }).eq("id", id);
      if (error) { alert("Não foi possível atualizar o pagamento: " + error.message); }
      await loadCashEntries();
      renderCaixa(container);
    });
  });

  if (caixaState.formOpen) {
    const editingEntry = caixaState.editingId ? entries.find((e) => e.id === caixaState.editingId) : null;
    renderEntryForm(activeProducts, editingEntry);
  }
  if (brindeState.open) renderBrindeOverlay();
  if (stockPurchaseState.open) renderStockPurchaseOverlay();
}

function renderEntryForm(products, editingEntry) {
  const slot = document.getElementById("entry-form-slot");

      </div>

      <div id="ef-entrada-fields" class="flex flex-wrap gap-4 ${hideEntrada}">

            <option value="dinheiro" ${editingEntry?.payment_method === "dinheiro" ? "selected" : ""}>Dinheiro</option>
            <option value="credito" ${editingEntry?.payment_method === "credito" ? "selected" : ""}>Crédito</option>
            <option value="outro" ${editingEntry?.payment_method === "outro" ? "selected" : ""}>Outro</option>
          </select>

      <div id="ef-customer-box" class="rounded-lg border border-navy-100 bg-cream-50 p-4 ${hideEntrada}">

              <option value="">— sem cliente —</option>
              ${state.customers.filter((c) => c.active).map((c) => `<option value="${c.id}" ${c.id === editingEntry?.customer_id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
              <option value="__new__">+ Novo cliente...</option>
            </select>
          </div>
        </div>
        <div id="ef-new-customer-fields" class="mt-3 hidden flex-wrap gap-3 sm:flex">
