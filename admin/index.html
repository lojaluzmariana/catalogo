    preview.innerHTML = html;
  }
  priceField.addEventListener("input", updatePreview);
  qtyField.addEventListener("input", updatePreview);
  unitSelect.addEventListener("change", updatePreview);
  fixedPriceInput.addEventListener("input", updatePreview);
  updatePreview();

  document.getElementById("mf-cancel").addEventListener("click", () => {
    materiaisState.formOpen = false;
    renderMateriais(document.getElementById("main-content"));
  });

  document.getElementById("material-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("mf-name").value.trim();
    const price = Number(priceField.value.replace(",", "."));
    const qty = Number(qtyField.value.replace(",", "."));
    const unit = unitSelect.value;
    const stock = Number(document.getElementById("mf-stock").value.replace(",", "."));
    const errorEl = document.getElementById("mf-error");
    if (!name) { errorEl.textContent = "Informe o nome do material."; return; }
    if (!Number.isFinite(price) || price < 0) { errorEl.textContent = "Preço inválido."; return; }
    if (!Number.isFinite(qty) || qty <= 0) { errorEl.textContent = "Quantidade inválida."; return; }
    if (!Number.isFinite(stock) || stock < 0) { errorEl.textContent = "Estoque inválido."; return; }

    const type = typeSelect.value === "__new__" ? typeNewField.value.trim() : typeSelect.value;
    if (typeSelect.value === "__new__" && !type) { errorEl.textContent = "Informe o nome do novo tipo, ou volte pra opção \"— sem tipo —\"."; return; }

    const isEssencialType = isEssencialTypeText(type);
    let qtyPerOrder = null;
    if (isEssencialType) {
      const qtyPerOrderRaw = document.getElementById("mf-qty-per-order").value.trim();
      if (qtyPerOrderRaw) {
        qtyPerOrder = Number(qtyPerOrderRaw.replace(",", "."));
        if (!Number.isFinite(qtyPerOrder) || qtyPerOrder < 0) { errorEl.textContent = "Quantidade usada por venda inválida."; return; }
      }
    }

    const isEmbalagemType = isEmbalagemTypeText(type);
    let fixedPrice = null;
    if (isEmbalagemType) {
      const fixedPriceRaw = fixedPriceInput.value.trim();
      if (fixedPriceRaw) {
        fixedPrice = Number(fixedPriceRaw.replace(",", "."));
        if (!Number.isFinite(fixedPrice) || fixedPrice < 0) { errorEl.textContent = "Preço fixo pro cliente inválido."; return; }
      }
    }

    const unitCost = Math.round((price / qty) * 10000) / 10000; // 4 casas de precisão
    // Captura o estoque ANTERIOR antes de disparar o update — depois de
    // salvo, "material" não deve mais ser usado pra isso (o registro
    // local pode não refletir mais o valor de antes da edição).
    const previousStock = material ? Number(material.stock_qty) : 0;
    const payload = {
      name, package_price: price, package_qty: qty, unit, stock_qty: stock,
      type: type || null,
      qty_per_order: qtyPerOrder,
      fixed_price: fixedPrice,
      unit_cost: unitCost,
      updated_by: state.currentUser.id, updated_at: new Date().toISOString(),
    };

    let result;
    if (material) {
      result = await supabaseClient.from("materials").update(payload).eq("id", material.id);
    } else {
      result = await supabaseClient.from("materials").insert({ ...payload, created_by: state.currentUser.id });
    }

    if (result.error) { errorEl.textContent = result.error.message; return; }

    // Material "Essencial" cujo estoque AUMENTOU: é uma compra nossa (não
    // uma cobrança ao cliente), então lança automaticamente uma "saída"
    // no Caixa no valor da compra. Só quando aumenta — reduzir estoque
    // (uso normal, correção de contagem etc.) não lança nada sozinho.
    const stockIncrease = stock - previousStock;
    if (isEssencialType && stockIncrease > 0) {
      const { error: cashError } = await supabaseClient.from("cash_entries").insert({
        entry_type: "saida",
        entry_date: todayISO(),
        amount: Math.round(stockIncrease * unitCost * 100) / 100,
        category: "Material essencial",
        description: `Compra de ${name} (+${stockIncrease} ${unit})`,
        payment_method: null,
        paid_at: new Date().toISOString(),
        created_by: state.currentUser.id,
      });
      if (cashError) {
        errorEl.textContent = `Material salvo, mas não foi possível lançar a despesa no Caixa: ${cashError.message}`;
      }
    }

    materiaisState.formOpen = false;
    await loadMaterials();
    await loadCashEntries();
    renderMateriais(document.getElementById("main-content"));
  });
}

async function loadSuppliers() {
  const { data, error } = await supabaseClient.from("suppliers").select("*").order("active", { ascending: false }).order("name", { ascending: true });
  if (!error) state.suppliers = data;
  noteLoadResult("fornecedores", error);
}

let fornecedoresState = { showInactive: false, formOpen: false, editingId: null, historyForId: null };

// Igual a pendingSupplierItems, mas SEM o filtro de "ainda não pago" —
// serve pra ver quanto já foi comprado desse fornecedor ao longo de TODA
// a história, não só o que está em aberto agora (antes, assim que um
// lançamento era pago ele simplesmente sumia de qualquer visão, sem
// deixar histórico consolidado nenhum).
function allSupplierItems(supplierId) {
  const rows = [];
  let isApprox = false;
  state.orders
    .filter((o) => o.status !== "cancelado")
    .forEach((o) => {
      (o.items ?? []).forEach((it) => {
        const product = state.products.find((p) => p.id === it.product_id);
        if (!product) { isApprox = true; return; }
        if (product.supplier_id !== supplierId) return;
        const variant = variantByName(product, it.variant_name);
        const unitCost = effectiveCost(product, variant);
        rows.push({
          kind: "pedido", orderNumber: o.order_number, date: toLocalISODate(new Date(o.created_at)),
          productName: it.product_name, variantName: it.variant_name, quantity: it.quantity,
          unitCost, subtotal: unitCost * it.quantity,
          paid: !!(it.fornecedor_pago_at || o.fornecedor_pago_at),
        });
      });
    });
  state.cashEntries
    .filter((e) => e.category === "Compra de estoque" && e.supplier_id === supplierId)
    .forEach((e) => {
      const product = state.products.find((p) => p.id === e.product_id);
      if (!product) { isApprox = true; return; }
      rows.push({
        kind: "estoque", orderNumber: null, date: e.entry_date,
        productName: product.name, variantName: e.variant_name, quantity: e.quantity != null ? Number(e.quantity) : null,
        unitCost: e.unit_cost != null ? Number(e.unit_cost) : null, subtotal: Number(e.amount),
        paid: !!e.paid_at,
      });
    });
  rows.sort((a, b) => new Date(b.date) - new Date(a.date));
  const total = rows.reduce((sum, r) => sum + r.subtotal, 0);
  return { rows, total, isApprox };
}

/* Resumo legível do desconto pra mostrar na tabela, ex: "5% (máx. R$ 15,00)" ou "R$ 10,00". */
function couponDiscountLabel(c) {
  if (c.discount_type === "percentual") {
    const pct = `${Number(c.discount_value)}%`;
    return c.max_discount_amount != null ? `${pct} (máx. ${formatBRL(c.max_discount_amount)})` : pct;
  }
  return formatBRL(c.discount_value);
}

let cuponsState = { showInactive: false, formOpen: false, editingId: null };
let couponPhonesState = { open: false, couponId: null, phone: "", note: "" };

// Quantas vezes um cupom foi usado de verdade e quanto de desconto ele
// já deu no total — direto de orders.coupon_id/discount_amount (pedidos
// cancelados não contam, já que não viraram venda de fato). Sem isso não
// tinha como saber se um cupom estava sendo usado ou ficando esquecido.
function couponUsageStats(couponId) {
  const orders = state.orders.filter((o) => o.coupon_id === couponId && o.status !== "cancelado");
  const totalDiscount = orders.reduce((sum, o) => sum + Number(o.discount_amount || 0), 0);
  return { count: orders.length, totalDiscount };
}

  return !!c.expires_at && c.expires_at < new Date().toISOString().slice(0, 10);

      code, description: description || null,
      discount_type: discountType, discount_value: discountValue,

    await loadCoupons();
    renderCupons(document.getElementById("main-content"));

async function loadCustomers() {
  const { data, error } = await supabaseClient.from("customers").select("*").order("active", { ascending: false }).order("name", { ascending: true });
  if (!error) state.customers = data;
  noteLoadResult("clientes", error);

let clientesState = { showInactive: false, formOpen: false, editingId: null, historyForId: null, broadcastOpen: false, sumidosOpen: false, sumidosMinDays: 60 };

// Segmenta os clientes ATIVOS por quantidade de compras já feitas (conta
// as entradas no Caixa vinculadas a cada cliente) — pra facilitar montar
// uma lista de transmissão de promoções no WhatsApp por perfil (quem
// comprou só 1 vez, quem já é cliente frequente etc.), sem precisar
// abrir cliente por cliente.
const BROADCAST_SEGMENTS = [
  { key: "1", label: "1 compra", test: (n) => n === 1 },
  { key: "2-4", label: "2 a 4 compras", test: (n) => n >= 2 && n <= 4 },
  { key: "5+", label: "5 compras ou mais", test: (n) => n >= 5 },
];

function customerPurchaseCounts() {
  const counts = new Map();
  state.cashEntries.filter((e) => e.entry_type === "entrada" && e.customer_id).forEach((e) => {
    counts.set(e.customer_id, (counts.get(e.customer_id) || 0) + 1);
  });
  return counts;
}

function customerBroadcastSegments() {
  const counts = customerPurchaseCounts();
  return BROADCAST_SEGMENTS.map((seg) => ({
    ...seg,
    customers: state.customers
      .filter((c) => c.active && c.whatsapp && seg.test(counts.get(c.id) || 0))
      .sort((a, b) => a.name.localeCompare(b.name, "pt-BR")),
  }));
}

// Aniversariantes de HOJE até os próximos 6 dias — só clientes ativos
// com data de nascimento cadastrada. Compara só mês/dia (ignora o ano
// de nascimento) e lida com a virada do ano (ex: hoje 28/dez, a janela
// de 7 dias entra em janeiro sem problema, porque "MM-DD" de cada dia
// da janela é calculado com addDaysISO, não com aritmética de string).
function customersWithBirthdayThisWeek() {
  const today = todayISO();
  const monthDay = (iso) => iso.slice(5, 10); // "MM-DD"
  const windowDays = Array.from({ length: 7 }, (_, i) => monthDay(addDaysISO(today, i)));
  return state.customers
    .filter((c) => c.active && c.birth_date && windowDays.includes(monthDay(c.birth_date)))
    .map((c) => ({ ...c, _daysUntil: windowDays.indexOf(monthDay(c.birth_date)) }))
    .sort((a, b) => a._daysUntil - b._daysUntil);
}

// Data da ÚLTIMA compra (entrada de Caixa vinculada) de cada cliente —
// base tanto pra "lista de sumidos" quanto pra qualquer outro uso futuro
// que precise saber "desde quando esse cliente não compra".
function customerLastPurchaseDates() {
  const lastByCustomer = new Map();
  state.cashEntries
    .filter((e) => e.entry_type === "entrada" && e.customer_id)
    .forEach((e) => {
      const current = lastByCustomer.get(e.customer_id);
      if (!current || e.entry_date > current) lastByCustomer.set(e.customer_id, e.entry_date);
    });
  return lastByCustomer;
}

// "Sumidos": clientes ATIVOS que já compraram pelo menos 2 vezes (ou
// seja, tinham o hábito de voltar) e cuja última compra foi há mais de
// `minDaysSince` dias — candidatos a receber uma mensagem de "sentimos
// sua falta" antes que esqueçam da loja de vez. Cliente que nunca
// comprou ou comprou só 1 vez fica de fora (não "sumiu": nunca teve o
// hábito de voltar, é caso pra lista de transmissão normal, não essa).
function sumidosCustomers(minDaysSince) {
  const counts = customerPurchaseCounts();
  const lastPurchase = customerLastPurchaseDates();
  const today = todayISO();
  return state.customers
    .filter((c) => c.active && c.whatsapp && (counts.get(c.id) || 0) >= 2 && lastPurchase.has(c.id))
    .map((c) => ({ ...c, _lastPurchase: lastPurchase.get(c.id), _daysSince: daysBetweenISO(lastPurchase.get(c.id), today) }))
    .filter((c) => c._daysSince >= minDaysSince)
    .sort((a, b) => b._daysSince - a._daysSince);
}

    if (n >= 5) return { label:"VIP", cls:"good" };
    if (n >= 2 && days != null && days >= 60) return { label:"Inativo", cls:"warning" };
    if (n >= 2) return { label:"Recorrente", cls:"navy" };

          <button id="sumidos-list-btn" class="rounded-lg border border-navy-200 px-4 py-2 text-sm font-medium text-navy-700 transition hover:bg-navy-50">👋 Clientes sumidos</button>
          <button id="new-customer-btn" class="rounded-lg bg-gold-500 px-4 py-2 text-sm font-semibold text-navy-900 shadow transition hover:bg-gold-400">+ Novo cliente</button>
        </div>
      </div>

      <div class="pro-kpi-grid">
        <div class="pro-kpi"><div class="label">Clientes ativos</div><div class="value">${activeCustomers.length}</div><div class="hint">Base ativa de relacionamento.</div></div>
        <div class="pro-kpi"><div class="label">Clientes recorrentes</div><div class="value">${repeatCustomers}</div><div class="hint">Já compraram 2 vezes ou mais.</div></div>
        <div class="pro-kpi"><div class="label">Clientes VIP</div><div class="value">${vipCustomers}</div><div class="hint">5 compras ou mais.</div></div>
        <div class="pro-kpi"><div class="label">Receita da base</div><div class="value">${formatBRL(customerTotalRevenue)}</div><div class="hint">Entradas do Caixa vinculadas a clientes.</div></div>

      <div id="customer-form-slot"></div>
      <div id="customer-history-slot"></div>
      <div id="broadcast-list-slot"></div>
      <div id="sumidos-list-slot"></div>

      <div class="overflow-x-auto rounded-xl border border-navy-100 bg-white shadow">
        <table class="w-full min-w-[700px] text-sm">
          <thead>
            <tr class="border-b border-navy-100 bg-navy-900 text-left text-xs uppercase tracking-wide text-cream-50">

          </thead>

            ${visible.length === 0 ? `<tr><td colspan="7" class="px-4 py-8 text-center text-navy-400">Nenhum cliente cadastrado.</td></tr>` : visible.map((c) => {

      const active = btn.dataset.active === "true";
      await supabaseClient.from("customers").update({ active: !active, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", id);
      await loadCustomers();
      renderClientes(container);
    });
  });
  container.querySelectorAll(".history-customer-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      clientesState.historyForId = clientesState.historyForId === btn.dataset.history ? null : btn.dataset.history;
      clientesState.formOpen = false;
      renderClientes(container);
    });
  });
  container.querySelectorAll(".delete-customer-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.delete;
      const customer = state.customers.find((c) => c.id === id);
      const hasSales = state.cashEntries.some((e) => e.customer_id === id);
      if (hasSales) {
        alert(`"${customer?.name ?? ""}" tem vendas registradas no Caixa — não dá pra excluir sem perder esse histórico. Use "Desativar" pra tirar ele da lista sem apagar nada.`);
        return;
      }
      if (!confirm(`Excluir "${customer?.name ?? ""}" definitivamente? Essa ação não pode ser desfeita.`)) return;
      const { error } = await supabaseClient.from("customers").delete().eq("id", id);
      if (error) { alert("Não foi possível excluir: " + error.message); return; }
      if (clientesState.historyForId === id) clientesState.historyForId = null;
      await loadCustomers();
      renderClientes(container);
    });
  });

  if (clientesState.formOpen) renderCustomerForm();
  if (clientesState.historyForId) renderCustomerHistory();
  if (clientesState.broadcastOpen) renderBroadcastListPanel();
  if (clientesState.sumidosOpen) renderSumidosPanel();
}

function renderCustomerHistory() {
  const slot = document.getElementById("customer-history-slot");
  const customer = state.customers.find((c) => c.id === clientesState.historyForId);
  if (!customer) { slot.innerHTML = ""; return; }

  const purchases = state.cashEntries
    .filter((e) => e.customer_id === customer.id && e.entry_type === "entrada")
    .sort((a, b) => (a.entry_date < b.entry_date ? 1 : -1));
  const total = purchases.reduce((sum, e) => sum + Number(e.amount), 0);

  slot.innerHTML = `
    <div class="rounded-xl border border-navy-100 bg-white p-5 shadow">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="text-sm font-semibold text-navy-900">Compras de ${escapeHtml(customer.name)}</h2>
        <span class="text-sm text-navy-600">Total: <b class="text-navy-900">${formatBRL(total)}</b></span>
      </div>
      ${purchases.length === 0 ? `<p class="text-sm text-navy-400">Nenhuma compra registrada ainda.</p>` : `
        <div class="flex flex-col gap-1">
          ${purchases.map((e) => `
            <div class="flex items-center justify-between rounded-lg bg-cream-50 px-3 py-1.5 text-sm">
              <span>${formatDate(e.entry_date)} — ${escapeHtml(e.description) || "—"}</span>
              <b class="text-navy-900">${formatBRL(e.amount)}</b>
            </div>
          `).join("")}
        </div>
      `}
    </div>
  `;
}

/* =====================================================================
   ABA: PEDIDOS (feitos pelo Catálogo público)
   ===================================================================== */
const ORDER_STATUS_LABELS = { novo: "Novo", em_andamento: "Em andamento", concluido: "Concluído", cancelado: "Cancelado" };
const ORDER_STATUS_CLASSES = {
  novo: "bg-red-100 text-red-700",
  em_andamento: "bg-gold-100 text-gold-800",
  concluido: "bg-emerald-100 text-emerald-800",
  cancelado: "bg-navy-100 text-navy-500",
};

function waLink(phone) {
  const digits = String(phone ?? "").replace(/\D/g, "");
  return digits ? `https://wa.me/${digits}` : null;
}

// WhatsApp do fabricante que produz os produtos — usado no botão
// "Enviar ao fabricante" dos Pedidos aceitos.
const MANUFACTURER_WHATSAPP_NUMBER = "5584991677070";
// Mesma margem usada na view catalog_gift_wrap_options (preço cobrado =
// custo do material + 30%). Usada aqui só pra "desfazer a conta" quando
// precisamos estimar o custo de uma embalagem cujo material já foi
// apagado do cadastro (nesse caso não tem outro jeito de saber o custo).
const GIFT_WRAP_MARKUP = 0.3;

// Material do tipo "Essencial" (aceita singular ou plural — "Essencial"
// ou "Essenciais", maiúsculo/minúsculo tanto faz — plural em português
// não é só acrescentar "s", "-al" vira "-ais", então comparamos com as
// duas formas certas, não com startsWith) é um insumo usado em (quase)
// toda venda mas que não é cobrado à parte do cliente (ex: fio, cola,
// etiqueta). O custo dele entra como despesa fixa por pedido, e
// aumentar o estoque dele lança uma "saída" automática no Caixa.
function isEssencialTypeText(text) {
  const normalized = (text || "").trim().toLowerCase();
  return normalized === "essencial" || normalized === "essenciais";
}
function isEssencial(material) {
  return isEssencialTypeText(material.type);
}

// Material do tipo "Embalagem" — mesma regra usada na view SQL
// catalog_gift_wrap_options (comparação sem acento/maiúscula não
// importa). É o tipo que aparece como opção de embalagem de presente
// pro cliente escolher no Catálogo — só esses materiais podem ter um
// preço fixo cobrado do cliente.
function isEmbalagemTypeText(text) {
  return (text || "").trim().toLowerCase() === "embalagem";
}
function isEmbalagem(material) {
  return isEmbalagemTypeText(material.type);
}

// Custo real (materiais/insumos) de um pedido — não é o preço cobrado do
// cliente. Devolve o custo dividido em duas partes:
//   - productCost: custo dos produtos em si (produtos.cost, que já
//     inclui o custo base + os materiais que compõem o produto).
//   - materialsCost: custo ADICIONAL de materiais que não fazem parte do
//     produto — hoje, só as embalagens de presente escolhidas no pedido
//     (o custo do material, não o preço com markup de 30% cobrado do
//     cliente).
//
// IMPORTANTE: usa o custo ATUAL cadastrado do produto/material. Se o
// custo mudou desde que o pedido foi feito, o valor aqui reflete o custo
// de HOJE, não o de quando a venda aconteceu — não temos um "retrato"
// histórico do custo salvo no pedido. Quando um produto ou material do
// pedido não é mais encontrado no cadastro, marca a parte afetada como
// aproximada (isProductApprox / isMaterialsApprox) pra deixar isso
// visível pro admin — só na parte que realmente foi estimada.
function orderCost(order) {
  let isProductApprox = false;
  let isMaterialsApprox = false;

  const productCost = (order.items ?? []).reduce((sum, it) => {
    const product = state.products.find((p) => p.id === it.product_id);
    if (!product) { isProductApprox = true; return sum; }
    const variant = it.variant_id ? (product.product_variants ?? []).find((v) => v.id === it.variant_id) : variantByName(product, it.variant_name);
    return sum + effectiveCost(product, variant) * it.quantity;
  }, 0);

  // Igual productCost, mas SEM os itens atendidos com o estoque da
  // própria loja (fulfilled_from_stock) — esses nunca geraram um custo
  // de fabricação a pagar pra ninguém (já foram pagos quando o estoque
  // foi comprado). Usado só em "Falta pagar (fornecedor)" e na nota de
  // fornecedor — o resto (Despesas, Lucro real) continua olhando o
  // custo real do produto, venha ele de onde vier.
  let isSupplierProductApprox = false;
  const supplierProductCost = (order.items ?? []).reduce((sum, it) => {
    if (it.fulfilled_from_stock) return sum;
    const product = state.products.find((p) => p.id === it.product_id);
    if (!product) { isSupplierProductApprox = true; return sum; }
    const variant = it.variant_id ? (product.product_variants ?? []).find((v) => v.id === it.variant_id) : variantByName(product, it.variant_name);
    return sum + effectiveCost(product, variant) * it.quantity;
  }, 0);

  const giftWrapCost = (order.giftWraps ?? []).reduce((sum, g) => {
    const material = g.material_id ? state.materials.find((m) => m.id === g.material_id) : null;
    if (material) return sum + Number(material.unit_cost) * g.quantity;
    // Material apagado do cadastro: estima o custo "desfazendo" o markup
    // de 30% em cima do preço que foi cobrado do cliente na hora da venda.
    isMaterialsApprox = true;
    return sum + (Number(g.unit_price) / (1 + GIFT_WRAP_MARKUP)) * g.quantity;
  }, 0);

  // Materiais "Essenciais" (fio, cola, etiqueta...) não são escolhidos
  // pedido a pedido como a embalagem de presente — são um custo fixo que
  // entra em TODA venda, no valor cadastrado em "quantidade usada por
  // venda". Usa o cadastro ATUAL (mesma ressalva de "custo de hoje, não
  // de quando a venda aconteceu" do resto da função).
  const essentialsCost = state.materials
    .filter((m) => m.active && isEssencial(m) && Number(m.qty_per_order) > 0)
    .reduce((sum, m) => sum + Number(m.unit_cost) * Number(m.qty_per_order), 0);

  const materialsCost = giftWrapCost + essentialsCost;

  return {
    productCost, materialsCost, cost: productCost + materialsCost,
    supplierProductCost, isSupplierProductApprox,
    // Custo "sem essenciais" — usado no lançamento de saída do Caixa ao
    // Iniciar venda. O custo do material Essencial já vira uma saída no
    // Caixa quando ele é COMPRADO (estoque aumentado, em Materiais); se
    // lançássemos de novo aqui, a cada venda, estaríamos descontando o
    // mesmo gasto duas vezes do saldo do Caixa. Embalagem de presente
    // não tem esse lançamento na compra, então continua entrando aqui.
    costExcludingEssentials: productCost + giftWrapCost,
    giftWrapCost, essentialsCost,
    isProductApprox, isMaterialsApprox, isApprox: isProductApprox || isMaterialsApprox,
  };
}


// Resumo financeiro individual de um pedido.
// "Guardar" = custo real cadastrado (produto/modelo + materiais).
// "Lucro" = valor líquido recebido menos esse custo.
// No crédito, desconta a taxa de cartão já adotada na regra de precificação.
// Depois o lucro é dividido pela mesma regra configurada no Caixa.
function orderMoneySplit(order, costInfo = null) {
  const c = costInfo || orderCost(order);
  const gross = Number(order?.total || 0);
  const cardFee = order?.payment_method === "credito" ? round2(gross * CARD_FEE) : 0;
  const netRevenue = round2(gross - cardFee);
  const costToKeep = round2(Number(c.cost || 0));
  const profit = round2(netRevenue - costToKeep);

  const settings = caixaState?.reserveSettings || loadProfitSplitSettings();
  const ownerPercent = Math.max(0, Math.min(100, Number(settings.ownerPercent ?? 30)));
  const reinvestPercent = 100 - ownerPercent;
  const positiveProfit = Math.max(0, profit);

  return {
    gross,
    cardFee,
    netRevenue,
    costToKeep,
    profit,
    ownerPercent,
    reinvestPercent,
    ownerShare: round2(positiveProfit * ownerPercent / 100),
    reinvestment: round2(positiveProfit * reinvestPercent / 100),
    storeTotalToKeep: round2(costToKeep + positiveProfit * reinvestPercent / 100),
    isApprox: !!c.isApprox,
  };
}

// Produto com modelo cadastrado tem o estoque controlado por modelo (e
// não pelo produto inteiro) — ver product_variants.in_stock. Essa função
// resolve o estoque certo pro item de um pedido: se o produto tem
// modelos, procura o modelo pelo nome salvo no pedido (variant_name é só
// um "retrato" do nome na hora da compra, não uma referência); se o
// modelo não existir mais no cadastro (renomeado/apagado), trata como
// sob encomenda por segurança, do mesmo jeito que produto removido.
// Ajusta o estoque numérico (stock_qty) de um produto ou modelo em
// `delta` unidades (negativo pra baixar numa venda, positivo pra repor) —
// mesma lógica de "Nova compra de estoque" (que só soma), só que aqui
// generalizada pros dois sentidos. Nunca deixa o estoque negativo (trava
// em 0) e recalcula in_stock/esgotado junto, igual o resto do painel já
// faz. Quem NÃO tem stock_qty preenchido (controle manual por
// checkbox) não é mexido — continua exatamente como já era antes dessa
// função existir.
async function ajustarEstoqueQtd(productId, variantId, delta) {
  const product = state.products.find((p) => p.id === productId);
  if (!product) return;
  if (variantId) {
    const variant = (product.product_variants ?? []).find((v) => v.id === variantId);
    if (!variant || variant.stock_qty == null) return;
    const newQty = Math.max(0, Number(variant.stock_qty) + delta);
    const { error } = await supabaseClient.from("product_variants").update({ stock_qty: newQty, in_stock: newQty > 0, esgotado: newQty <= 0 }).eq("id", variantId);
    if (error) console.error("Não foi possível ajustar o estoque do modelo:", error.message);
  } else {
    if (product.stock_qty == null) return;
    const newQty = Math.max(0, Number(product.stock_qty) + delta);
    const { error } = await supabaseClient.from("products").update({ stock_qty: newQty, in_stock: newQty > 0, esgotado: newQty <= 0, updated_by: state.currentUser.id, updated_at: new Date().toISOString() }).eq("id", productId);
    if (error) console.error("Não foi possível ajustar o estoque do produto:", error.message);
  }
}

// Itens de um pedido que ainda não foram pagos ao fornecedor/fabricante
// — ou seja, NÃO foram atendidos com o estoque da própria loja
// (fulfilled_from_stock, que nunca gera pagamento a fornecedor) e ainda
// não têm pagamento registrado (fornecedor_pago_at, por item). Mesma
// lógica de compatibilidade de orderSupplierPendingItems: pedido antigo
// que já tinha o campo de PEDIDO orders.fornecedor_pago_at marcado conta
// como "nada pendente".
function orderSupplierUnpaidItems(order) {
  if (order.fornecedor_pago_at) return [];
  return (order.items ?? []).filter((it) => !it.fulfilled_from_stock && !it.fornecedor_pago_at);
}

// Itens de um pedido que ainda dependem do fornecedor/fabricante — ou
// seja, NÃO foram atendidos com o estoque da própria loja
// (fulfilled_from_stock) e ainda não têm entrega registrada
// (fornecedor_entregue_at, por item). Pedido antigo (de antes dessa
// separação por item existir) que já tinha o campo de PEDIDO
// orders.fornecedor_entregue_at marcado conta como "nada pendente",
// por compatibilidade — sem isso, todo pedido anterior à migration
// voltaria a aparecer como pendente do fornecedor.
function orderSupplierPendingItems(order) {
  if (order.fornecedor_entregue_at) return [];
  return (order.items ?? []).filter((it) => !it.fulfilled_from_stock && !it.fornecedor_entregue_at);
}

function itemIsInStock(item, product) {
  if (!product) return false;
  const variants = product.product_variants ?? [];
  if (variants.length > 0) {
    if (!item.variant_name) return false;
    const variant = variants.find((v) => v.name === item.variant_name);
    return variant ? !!variant.in_stock : false;
  }
  return !!product.in_stock;
}

// Mesma regra usada no Catálogo público (ver madeToOrderText em
// index.html): produto sob encomenda leva o prazo (dias) configurado
// nele a contar da data do pedido — cada produto pode ter o seu (ver
// productLeadTimeDays mais acima). Maior prazo (dias) entre os itens do
// pedido que estão "sob encomenda" (fora de estoque); null quando nenhum
// item está sob encomenda (pedido inteiro é pronta entrega). Produto que
// sumiu do cadastro é tratado como sob encomenda, por segurança (não dá
// pra saber se tinha estoque), com o prazo padrão.
function orderMadeToOrderDays(order) {
  const items = order.items ?? [];
  let maxDays = null;
  items.forEach((it) => {
    const product = state.products.find((p) => p.id === it.product_id);
    if (!itemIsInStock(it, product)) {
      const days = productLeadTimeDays(product);
      maxDays = maxDays == null ? days : Math.max(maxDays, days);
    }
  });
  return maxDays;
}

// Prazo de entrega do pedido inteiro: se o admin já combinou uma data
// diferente com o cliente (order.custom_deadline_date — ver "Editar
// pedido"), essa data manda e some qualquer cálculo automático. Sem
// isso, cai na regra de sempre: pronta entrega se todo item já está
// em estoque, senão o prazo do item mais demorado, a contar de quando
// o pedido foi feito.
function orderDeliveryDeadline(order) {
  if (order.custom_deadline_date) {
    const [y, m, d] = order.custom_deadline_date.split("-").map(Number);
    return { ready: false, date: new Date(y, m - 1, d), overridden: true };
  }
  const items = order.items ?? [];
  if (items.length === 0) return null;
  const days = orderMadeToOrderDays(order);
  if (days == null) return { ready: true, date: null, overridden: false };
  const date = addBusinessDays(order.created_at, days);
  return { ready: false, date, overridden: false };
}

function formatDateTime(dateLike) {
  const d = new Date(dateLike);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// Prazo de entrega combinado com o fabricante: mesma regra de
// orderDeliveryDeadline (maior prazo entre os itens sob encomenda do
// pedido), a partir da data em que o pedido entrou. Sem nenhum item sob
// encomenda, cai no prazo padrão (mesmo comportamento de sempre).
// Prazo de entrega combinado com o fabricante: se o admin já combinou
// uma data direto com o CLIENTE (order.custom_deadline_date), usa essa
// mesma data aqui também — não faz sentido o fabricante produzir num
// prazo diferente do que já foi prometido. Sem override, cai na regra de
// sempre (maior prazo entre os itens sob encomenda do pedido).
function manufacturerDeadline(order) {
  if (order.custom_deadline_date) {
    const [y, m, d] = order.custom_deadline_date.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    return `${String(dt.getDate()).padStart(2, "0")}/${String(dt.getMonth() + 1).padStart(2, "0")}/${dt.getFullYear()}`;
  }
  const days = orderMadeToOrderDays(order) ?? DEFAULT_LEAD_TIME_DAYS;
  const deadline = addBusinessDays(order.created_at, days);
  const d = String(deadline.getDate()).padStart(2, "0");
  const m = String(deadline.getMonth() + 1).padStart(2, "0");
  const y = deadline.getFullYear();
  return `${d}/${m}/${y}`;
}

// Foto do item do pedido: usa a foto do modelo/variação escolhido, se
// tiver, senão a foto padrão do produto.
function orderItemPhoto(item) {
  const product = state.products.find((p) => p.id === item.product_id);
  if (!product) return null;
  if (item.variant_name && product.product_variants) {
    const variant = product.product_variants.find((v) => v.name === item.variant_name);
    if (variant && variant.photo_url) return variant.photo_url;
  }
  return product.photo_url || null;
}

// Link de pré-visualização da foto do item: em vez de mandar o link
// direto do Supabase Storage (que o WhatsApp não consegue pré-visualizar),
// passa pela nossa função "product-photo", que gera uma página com as
// tags corretas pra a miniatura aparecer sozinha no balão da conversa.
function orderItemPhotoPreviewUrl(item, order) {
  const photo = orderItemPhoto(item);
  if (!photo) return null;
  const nome = item.variant_name ? `${item.product_name} (${item.variant_name})` : item.product_name;
  const params = new URLSearchParams({
    src: photo,
    nome: nome,
    pedido: String(order.order_number ?? ""),
  });
  return `${SUPABASE_URL}/functions/v1/product-photo?${params.toString()}`;
}

// Mensagem pro fabricante: identificação da loja, nome do produto, a
// variação (cor/modelo) quando tiver, foto (com miniatura automática no
// WhatsApp) e prazo — nunca preço (o fabricante não precisa saber quanto
// o cliente pagou), e não inclui as embalagens de presente (isso a loja
// resolve por conta própria, não é o fabricante que produz).
function buildManufacturerMessage(order, pendingItems) {
  const items = pendingItems ?? orderSupplierPendingItems(order);
  const lines = [];
  lines.push(`${STORE_NAME} - ${STORE_SUBTITLE}`);
  lines.push(`CNPJ: ${STORE_CNPJ}`);
  lines.push("");
  lines.push(`Novo pedido para produção — Nº ${String(order.order_number ?? "").padStart(6, "0")}`);
  lines.push(`Pedido recebido em: ${formatDateTime(order.created_at)}`);
  lines.push(`Prazo para entrega: ${manufacturerDeadline(order)}`);
  lines.push("");
  lines.push("Itens:");
  items.forEach((it) => {
    lines.push(`• ${it.quantity}x ${it.product_name}`);
    if (it.variant_name) lines.push(`  Variação: ${it.variant_name}`);
    const photoPreview = orderItemPhotoPreviewUrl(it, order);
    if (photoPreview) lines.push(`  Foto: ${photoPreview}`);
  });
  return lines.join("\n");
}

// Mensagem pronta pro CLIENTE (não pro fabricante) — o texto muda de
// acordo com o status atual do pedido, pra sempre mandar uma
// atualização que faz sentido (não precisa editar nada na mão, mas
// sempre dá pra revisar/ajustar antes de mandar, já que o wa.me só
// preenche o campo de texto, nunca envia sozinho).
function buildCustomerStatusMessage(order) {
  const firstName = String(order.customer_name ?? "").trim().split(/\s+/)[0] || order.customer_name;
  const numero = `Nº ${String(order.order_number ?? "").padStart(6, "0")}`;
  const deadline = orderDeliveryDeadline(order);
  const isLate = deadline && !deadline.ready && deadline.date < new Date();

  // Pedido atrasado tem uma mensagem própria e completa (pedido de
  // desculpas + explicação + cupom de compensação) — bem diferente do
  // resto (que é só um aviso rápido de status), por isso não usa o
  // "Oi ... Aqui é da loja" genérico nem o aviso de pagamento pendente
  // do final da função; a mensagem já é auto-contida. Só entra aqui se
  // o pedido realmente estiver em andamento e atrasado — não se já foi
  // concluído/cancelado (aí o prazo antigo não importa mais).
  if (order.status !== "cancelado" && order.status !== "concluido" && order.accepted_at && isLate) {
    return [
      `Olá, ${firstName}! 💙`,
      "",
      "Queremos te pedir desculpas pelo atraso na entrega do seu pedido. Sabemos que a espera foi maior do que deveria e sentimos muito por isso.",
      "",
      "Durante a produção, tivemos uma intercorrência técnica, que precisou de alguns ajustes e acabou prolongando o prazo. Preferimos aguardar para que sua peça fosse finalizada com todo o cuidado e qualidade que buscamos entregar.",
      "",
      "Como forma de nos desculpar e agradecer pela sua compreensão, preparamos um carinho para você: 🎁",
      "",
      "🎟️ Cupom: COMCARINHO",
      "",
      "Ele garante um desconto especial na sua próxima compra e não possui prazo de validade. Você pode guardá-lo e usar quando quiser.",
      "",
      "Esperamos que você goste do seu pedido e que ele leve até você todo o carinho com que foi preparado.",
      "",
      "Obrigada pela compreensão e por confiar em nosso trabalho. Que Nossa Senhora abençoe você e sua família! 🙏🏻",
      "",
      "*Luz Mariana — Artigos Religiosos e Devoção*",
    ].join("\n");
  }

  const lines = [`Oi ${firstName}! Aqui é da ${STORE_NAME}. 🙏`, ""];

  if (order.status === "cancelado") {
    lines.push(`Seu pedido ${numero} foi cancelado. Qualquer dúvida ou se quiser refazer o pedido, é só chamar por aqui.`);
  } else if (order.status === "concluido") {
    lines.push(`Seu pedido ${numero} foi concluído! Muito obrigada pela confiança e pela preferência. 💙`);
  } else if (!order.accepted_at) {
    lines.push(`Recebemos seu pedido ${numero}, no valor de ${formatBRL(order.total)}. Já vamos começar a preparar e te aviso por aqui assim que sair!`);
  } else if (deadline && deadline.ready) {
    lines.push(`Seu pedido ${numero} está em preparação e é de pronta entrega — deve sair em breve!`);
  } else if (deadline && deadline.date) {
    lines.push(`Seu pedido ${numero} está em produção. Previsão de entrega: até ${formatDate(toLocalISODate(deadline.date))}.`);
  } else {
    lines.push(`Seu pedido ${numero} foi aceito e já está sendo preparado.`);
  }

  if (order.status !== "cancelado" && order.status !== "concluido" && !order.paid_at && order.payment_method !== "brinde") {
    lines.push("");
    lines.push("Lembrando que o pagamento desse pedido ainda está pendente — qualquer dúvida sobre isso, é só chamar.");
  }

  return lines.join("\n");
}

// Mensagem de parabéns pro cliente aniversariante — usada pelo banner
// de aniversário no topo do painel. Fica de propósito sem menção a
// cupom/desconto específico: quem for oferecer algo digita à mão antes
// de mandar (o campo já abre editável no WhatsApp).
function buildBirthdayMessage(customer) {
  const firstName = String(customer.name ?? "").trim().split(/\s+/)[0] || customer.name;
  return `Oi ${firstName}! Passando pra desejar um feliz aniversário, com muita saúde e alegria! 🎂🙏\n\nCom carinho, ${STORE_NAME}.`;
}

async function loadOrders() {
  const { data, error } = await supabaseClient.from("orders").select("*").order("created_at", { ascending: false });
  if (error) { noteLoadResult("pedidos", error); return; }
  noteLoadResult("pedidos", null);

  const { data: items, error: err2 } = await supabaseClient.from("order_items").select("*");
  noteLoadResult("itens dos pedidos", err2);

  const { data: giftWraps, error: err3 } = await supabaseClient.from("order_gift_wraps").select("*");
  noteLoadResult("embalagens dos pedidos", err3);

  const byOrder = {};
  (items || []).forEach((row) => { (byOrder[row.order_id] ||= []).push(row); });
  const giftWrapsByOrder = {};
  (giftWraps || []).forEach((row) => { (giftWrapsByOrder[row.order_id] ||= []).push(row); });

  state.orders = data.map((o) => ({ ...o, items: byOrder[o.id] || [], giftWraps: resolveOrderGiftWraps(o, giftWrapsByOrder[o.id]) }));
}

// A embalagem de presente de um pedido pode vir em duas formas: a nova
// (uma linha por embalagem em order_gift_wraps, permite mais de uma) ou,
// só pra pedidos feitos antes dessa tabela existir, os campos antigos
// direto em orders (gift_wrap_material_id/_name/_price, sempre um só).
function resolveOrderGiftWraps(order, rows) {
  if (rows && rows.length > 0) return rows;
  if (order.gift_wrap_material_name) {
    return [{
      material_id: order.gift_wrap_material_id,
      material_name: order.gift_wrap_material_name,
      quantity: 1,
      unit_price: order.gift_wrap_price ?? 0,
    }];
  }
  return [];
}

/* =====================================================================
   COMPROVANTE NÃO FISCAL (PDF) — um "reciboszinho" por pedido, no
   estilo de uma nota de balcão (mas sem valor fiscal — é só uma cópia
   organizada pra você gerenciar os pedidos fora do painel).

   Cada pedido vira uma página no tamanho de um cupom (80mm de largura,
   altura ajustada ao conteúdo daquele pedido especificamente).
   ===================================================================== */
// Formato pensado pra imprimir direto na bobina de 57mm da maquininha
// (ex: Ton T3 Smart) — bobinas de cartão costumam ser mais estreitas que
// as impressoras de recibo "de balcão" (que geralmente usam 80mm).
const RECEIPT_PAGE_WIDTH_MM = 57;
const RECEIPT_MARGIN_MM = 3;

function buildReceiptLinePlan(order) {
  const lines = [];
  // "wrap: true" por padrão pra NENHUMA linha correr o risco de ficar
  // cortada pela borda do papel — numa bobina estreita (57mm) até texto
  // relativamente curto pode não caber numa linha só, então cada linha
  // quebra sozinha em mais linhas quando precisar (ver expandReceiptLines).
  const push = (text, opts = {}) => lines.push({ text, size: 8, style: "normal", align: "center", gap: 4, wrap: true, ...opts });

  push(STORE_NAME, { size: 13, style: "bold", gap: 5.4 });
  push(STORE_SUBTITLE, { size: 8, gap: 3.8 });
  push(STORE_INSTAGRAM, { size: 8, gap: 3.8 });
  push(`CNPJ: ${STORE_CNPJ}`, { size: 8, gap: 5 });
  lines.push({ divider: true, gap: 4 });

  push(`Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")}`, { size: 9.5, style: "bold", gap: 4.6 });
  push(`Data: ${formatDateTime(order.created_at)}`, { align: "left", gap: 4 });
  push(`Status: ${ORDER_STATUS_LABELS[order.status] ?? order.status}`, { align: "left", gap: 4 });
  lines.push({ divider: true, gap: 4 });

  push(`Cliente: ${order.customer_name}`, { align: "left", gap: 4, wrap: true });
  push(`WhatsApp: ${order.customer_whatsapp}`, { align: "left", gap: 4 });
  if (order.customer_instagram) push(`Instagram: @${order.customer_instagram.replace(/^@/, "")}`, { align: "left", gap: 4 });
  lines.push({ divider: true, gap: 4 });

  push("ITENS", { align: "left", style: "bold", gap: 4.6 });
  (order.items ?? []).forEach((it) => {
    const variantLabel = it.variant_name ? ` (${it.variant_name})` : "";
    push(`${it.quantity}x ${it.product_name}${variantLabel}`, { align: "left", gap: 3.8, wrap: true });
    push(formatBRL(it.unit_price * it.quantity), { align: "right", gap: 4.4 });
  });
  (order.giftWraps ?? []).forEach((g) => {
    push(`${g.quantity}x ${g.material_name} (embalagem p/ presente)`, { align: "left", gap: 3.8, wrap: true });
    push(formatBRL(g.unit_price * g.quantity), { align: "right", gap: 4.4 });
  });
  lines.push({ divider: true, gap: 4 });

  push(`TOTAL: ${formatBRL(order.total)}`, { size: 11, style: "bold", align: "right", gap: 5.6 });
  push(`Forma de pagamento: ${order.payment_method === "brinde" ? "Brinde (cortesia)" : order.payment_method === "credito" ? "Cartão de crédito" : "Pix / à vista"}`, { align: "left", gap: 4, wrap: true });
  const receiptNotes = orderCustomerNotes(order);
  if (receiptNotes) {
    push("Observações:", { align: "left", gap: 3.8 });
    push(receiptNotes, { align: "left", gap: 3.8, wrap: true });
  }
  lines.push({ divider: true, gap: 4 });

  push("Obrigado pela preferência!", { style: "bold", gap: 4.4 });
  push("Este comprovante não possui valor fiscal.", { size: 6.5, gap: 3 });

  return lines;
}

// Resolve as linhas que precisam quebrar em várias (opts.wrap) em
// entradas simples de texto — assim dá pra medir a altura total ANTES
// de criar a página com o tamanho certo.
function expandReceiptLines(doc, plan, usableWidth) {
  const expanded = [];
  plan.forEach((line) => {
    if (line.divider || !line.wrap) { expanded.push(line); return; }
    doc.setFont("courier", line.style === "bold" ? "bold" : line.style === "italic" ? "italic" : "normal");
    doc.setFontSize(line.size);
    const wrapped = doc.splitTextToSize(String(line.text), usableWidth);
    wrapped.forEach((piece) => expanded.push({ ...line, text: piece, wrap: false }));
  });
  return expanded;
}

function drawReceiptPage(doc, order, pageWidth) {
  const usableWidth = pageWidth - RECEIPT_MARGIN_MM * 2;
  const plan = buildReceiptLinePlan(order);
  const expanded = expandReceiptLines(doc, plan, usableWidth);
  const topMargin = 6;
  const bottomMargin = 4;
  const totalHeight = topMargin + expanded.reduce((sum, l) => sum + l.gap, 0) + bottomMargin;

  doc.internal.pageSize.setWidth(pageWidth);
  doc.internal.pageSize.setHeight(totalHeight);

  let y = topMargin;
  expanded.forEach((line) => {
    if (line.divider) {
      doc.setLineDashPattern([0.6, 0.6], 0);
      doc.setDrawColor(150);
      doc.line(RECEIPT_MARGIN_MM, y - 2.6, pageWidth - RECEIPT_MARGIN_MM, y - 2.6);
      doc.setLineDashPattern([], 0);
      y += line.gap;
      return;
    }
    doc.setFont("courier", line.style === "bold" ? "bold" : line.style === "italic" ? "italic" : "normal");
    doc.setFontSize(line.size);
    doc.setTextColor(20);
    const x = line.align === "left" ? RECEIPT_MARGIN_MM : line.align === "right" ? pageWidth - RECEIPT_MARGIN_MM : pageWidth / 2;
    doc.text(line.text, x, y, { align: line.align });
    y += line.gap;
  });

  return totalHeight;
}

function buildOrdersReceiptPdf(orders) {
  const { jsPDF } = window.jspdf;
  // Cria já com o tamanho certo pro primeiro pedido (o construtor exige
  // um tamanho inicial — ajustamos a altura de cada página na hora de
  // desenhar, inclusive a primeira).
  const doc = new jsPDF({ unit: "mm", format: [RECEIPT_PAGE_WIDTH_MM, 200] });
  orders.forEach((order, idx) => {
    if (idx > 0) doc.addPage([RECEIPT_PAGE_WIDTH_MM, 200]);
    drawReceiptPage(doc, order, RECEIPT_PAGE_WIDTH_MM);
  });
  return doc;
}

/* =====================================================================
   LISTA DE SEPARAÇÃO/PRODUÇÃO (PDF) — junta os itens de TODOS os
   pedidos "Em andamento" (aceitos, ainda não concluídos/cancelados) e
   soma as quantidades por produto+modelo. Serve pra separar/produzir em
   lote de uma vez, sem precisar abrir pedido por pedido. Não usa preço
   nenhum (não é um documento financeiro) — só o que precisa ser feito/
   separado e em quais pedidos aquilo entra, pra rastreabilidade.
   ===================================================================== */
function buildPickingListRows() {
  const inProgress = state.orders.filter((o) => o.status === "em_andamento");
  const byKey = new Map();
  inProgress.forEach((o) => {
    (o.items ?? []).forEach((it) => {
      const key = `${it.product_name}::${it.variant_name ?? ""}`;
      if (!byKey.has(key)) {
        byKey.set(key, { productName: it.product_name, variantName: it.variant_name, quantity: 0, orderNumbers: new Set() });
      }
      const row = byKey.get(key);
      row.quantity += Number(it.quantity);
      row.orderNumbers.add(o.order_number);
    });
    (o.giftWraps ?? []).forEach((g) => {
      const key = `embalagem::${g.material_name}`;
      if (!byKey.has(key)) {
        byKey.set(key, { productName: `🎁 Embalagem — ${g.material_name}`, variantName: null, quantity: 0, orderNumbers: new Set() });
      }
      const row = byKey.get(key);
      row.quantity += Number(g.quantity);
      row.orderNumbers.add(o.order_number);
    });
  });
  return [...byKey.values()]
    .map((r) => ({ ...r, orderNumbers: [...r.orderNumbers].sort((a, b) => a - b) }))
    .sort((a, b) => a.productName.localeCompare(b.productName, "pt-BR"));
}

function buildPickingListPdf(rows) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const pageWidth = 210;
  const pageHeight = 297;
  const margin = 15;
  const usableWidth = pageWidth - margin * 2;
  const cols = {
    item: { x: margin, w: 100 },
    qtd: { x: margin + 100, w: 22 },
    pedidos: { x: margin + 122, w: usableWidth - 122 },
  };
  let y = margin;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.text(STORE_NAME, margin, y);
  y += 6;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text(STORE_SUBTITLE, margin, y);
  y += 10;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.text("Lista de separação — Pedidos em andamento", margin, y);
  y += 6;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text(`Gerado em ${formatDateTime(new Date().toISOString())}`, margin, y);
  y += 8;

  function drawTableHeader() {
    doc.setFillColor(20, 30, 70);
    doc.rect(margin, y - 4.5, usableWidth, 7, "F");
    doc.setTextColor(255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    doc.text("Produto / modelo", cols.item.x + 1, y);
    doc.text("Qtd. total", cols.qtd.x + cols.qtd.w - 1, y, { align: "right" });
    doc.text("Pedidos", cols.pedidos.x + 1, y);
    y += 5;
    doc.setTextColor(20);
    doc.setFont("helvetica", "normal");
  }

  drawTableHeader();

  if (rows.length === 0) {
    doc.setFont("helvetica", "italic");
    doc.setFontSize(9);
    doc.text("Nenhum pedido \"Em andamento\" no momento — nada pra separar.", margin, y + 2);
    y += 8;
  }

  rows.forEach((r, idx) => {
    const itemLabel = `${r.productName}${r.variantName ? ` (${r.variantName})` : ""}`;
    const pedidosLabel = r.orderNumbers.map((n) => `Nº${String(n).padStart(6, "0")}`).join(", ");
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    const wrappedItem = doc.splitTextToSize(itemLabel, cols.item.w - 2);
    const wrappedPedidos = doc.splitTextToSize(pedidosLabel, cols.pedidos.w - 2);
    const lineCount = Math.max(wrappedItem.length, wrappedPedidos.length);
    const rowHeight = Math.max(6, lineCount * 3.8 + 2.2);

    if (y + rowHeight > pageHeight - margin) {
      doc.addPage();
      y = margin;
      drawTableHeader();
    }

    if (idx % 2 === 1) {
      doc.setFillColor(244, 245, 249);
      doc.rect(margin, y - 4, usableWidth, rowHeight, "F");
    }
    doc.setTextColor(20);
    wrappedItem.forEach((line, i) => doc.text(line, cols.item.x + 1, y + i * 3.8));
    doc.setFont("helvetica", "bold");
    doc.text(String(r.quantity), cols.qtd.x + cols.qtd.w - 1, y, { align: "right" });
    doc.setFont("helvetica", "normal");
    wrappedPedidos.forEach((line, i) => doc.text(line, cols.pedidos.x + 1, y + i * 3.8));
    y += rowHeight;
  });

  return doc;
}

/* =====================================================================
   TABELA DE PREÇOS (PDF) — pra levar impressa num evento/feira/bazar:
   os produtos escolhidos (todos ou só alguns, via checkbox na tabela da
   Precificação), agrupados por categoria, com preço no crédito e preço
   à vista (Pix/dinheiro). Sem foto de propósito — o pedido foi algo
   simples de ler rápido "na correria" e que coubesse numa folha só, uma
   linha por produto é bem mais compacto que um card com imagem. NÃO
   mostra custo, lucro nem margem — só o que o cliente do evento precisa
   ver. Se a seleção for grande demais pra 1 página, pagina sozinha (não
   trava nem corta produto no meio).
   ===================================================================== */
function buildPriceTablePdf(products) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const pageWidth = 210;
  const pageHeight = 297;
  const margin = 15;
  const usableWidth = pageWidth - margin * 2;
  const cols = {
    nome: { x: margin, w: 95 },
    credito: { x: margin + 98, w: 33 },
    avista: { x: margin + 133, w: usableWidth - 133 },
  };
  const ROW_HEIGHT = 5.2;
  const CATEGORY_HEADER_HEIGHT = 5.2;
  let y = margin;

  function drawStoreHeader() {
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text(`${STORE_NAME} — Tabela de preços`, margin, y);
    y += 4.6;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.5);
    doc.text(`${STORE_SUBTITLE} · Gerado em ${formatDateTime(new Date().toISOString())} · ${products.length} produto${products.length === 1 ? "" : "s"}`, margin, y);
    y += 4;
  }

  function drawColumnHeader() {
    doc.setFillColor(20, 30, 70);
    doc.rect(margin, y, usableWidth, 6, "F");
    doc.setTextColor(255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    doc.text("Produto", cols.nome.x + 1, y + 4.2);
    doc.text("Crédito", cols.credito.x + cols.credito.w - 1, y + 4.2, { align: "right" });
    doc.text("À vista (Pix/dinheiro)", cols.avista.x + cols.avista.w - 1, y + 4.2, { align: "right" });
    y += 6.5;
    doc.setTextColor(20);
    doc.setFont("helvetica", "normal");
  }

  function drawCategoryHeader(label) {
    doc.setFillColor(250, 234, 184);
    doc.rect(margin, y, usableWidth, CATEGORY_HEADER_HEIGHT - 0.7, "F");
    doc.setTextColor(122, 83, 0);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.5);
    doc.text(label, margin + 2, y + 3.2);
    y += CATEGORY_HEADER_HEIGHT;
    doc.setTextColor(20);
    doc.setFont("helvetica", "normal");
  }

  function ensureSpace(neededHeight, categoryLabel) {
    if (y + neededHeight > pageHeight - margin) {
      doc.addPage();
      y = margin;
      drawColumnHeader();
      if (categoryLabel) drawCategoryHeader(`${categoryLabel} (continuação)`);
    }
  }

  drawStoreHeader();
  drawColumnHeader();

  if (products.length === 0) {
    doc.setFont("helvetica", "italic");
    doc.setFontSize(9);
    doc.text("Nenhum produto selecionado.", margin, y + 2);
    return doc;
  }

  let currentCategory = null;
  let rowIdx = 0;
  products.forEach((p) => {
    const category = p.category && p.category.trim() ? p.category.trim() : "Outros";
    if (category !== currentCategory) {
      ensureSpace(CATEGORY_HEADER_HEIGHT + ROW_HEIGHT, null);
      drawCategoryHeader(category);
      currentCategory = category;
      rowIdx = 0;
    } else {
      ensureSpace(ROW_HEIGHT, currentCategory);
    }

    const rowTop = y;
    if (rowIdx % 2 === 1) {
      doc.setFillColor(244, 245, 249);
      doc.rect(margin, rowTop, usableWidth, ROW_HEIGHT, "F");
    }

    doc.setTextColor(20);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    const nameLine = doc.splitTextToSize(p.name, cols.nome.w - 2)[0];
    doc.text(nameLine, cols.nome.x + 1, rowTop + 3.7);

    doc.text(formatBRL(p.credit_price), cols.credito.x + cols.credito.w - 1, rowTop + 3.7, { align: "right" });
    doc.setTextColor(4, 120, 87);
    doc.text(formatBRL(p.promo_price), cols.avista.x + cols.avista.w - 1, rowTop + 3.7, { align: "right" });
    doc.setTextColor(20);

    y = rowTop + ROW_HEIGHT;
    rowIdx++;
  });

  return doc;
}

/* =====================================================================
   ETIQUETA DE ENVIO (PDF) — uma etiqueta por pedido selecionado, numa
   grade de 2x5 numa folha A4 (10 por página), pra imprimir e recortar
   com tesoura na hora de despachar. Usa o campo "Observações" do pedido
   como endereço, já que hoje não existe um campo de endereço separado
   (o combinado de entrega é tratado na conversa do WhatsApp) — se
   estiver vazio, mostra "—" em vez de inventar informação.
   ===================================================================== */
function buildShippingLabelsPdf(orders) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const pageWidth = 210;
  const pageHeight = 297;
  const margin = 10;
  const cols = 2;
  const rows = 5;
  const gap = 4;
  const cellWidth = (pageWidth - margin * 2 - gap * (cols - 1)) / cols;
  const cellHeight = (pageHeight - margin * 2 - gap * (rows - 1)) / rows;
  const perPage = cols * rows;

  function drawLabel(order, x, y) {
    // Guia de corte (linha tracejada) — não é a etiqueta em si, só ajuda
    // a recortar reto.
    doc.setDrawColor(200);
    doc.setLineDashPattern([1, 1], 0);
    doc.rect(x, y, cellWidth, cellHeight);
    doc.setLineDashPattern([], 0);

    const padX = x + 4;
    let ty = y + 6;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    doc.setTextColor(120);
    doc.text(STORE_NAME.toUpperCase(), padX, ty);
    ty += 5;

    doc.setFontSize(11);
    doc.setTextColor(20);
    doc.text(`Pedido Nº ${String(order.order_number ?? "").padStart(6, "0")}`, padX, ty);
    ty += 6;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    const wrappedName = doc.splitTextToSize(order.customer_name || "—", cellWidth - 8);
    wrappedName.slice(0, 2).forEach((line) => { doc.text(line, padX, ty); ty += 4.5; });

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    if (order.customer_whatsapp) {
      doc.text(order.customer_whatsapp, padX, ty);
      ty += 5;
    }

    doc.setFont("helvetica", "italic");
    doc.setFontSize(8);
    doc.setTextColor(90);
    doc.text("Endereço/observações:", padX, ty);
    ty += 4;
    doc.setFont("helvetica", "normal");
    const wrappedNotes = doc.splitTextToSize(orderCustomerNotes(order) || "—", cellWidth - 8);
    wrappedNotes.slice(0, 4).forEach((line) => { doc.text(line, padX, ty); ty += 3.8; });

    doc.setTextColor(20);
  }

  orders.forEach((order, idx) => {
    const pageIdx = Math.floor(idx / perPage);
    const posInPage = idx % perPage;
    if (pageIdx > 0 && posInPage === 0) doc.addPage();
    const col = posInPage % cols;
    const row = Math.floor(posInPage / cols);
    const x = margin + col * (cellWidth + gap);
    const y = margin + row * (cellHeight + gap);
    drawLabel(order, x, y);
  });

  return doc;
}

/* =====================================================================
   NOTA DE FORNECEDOR (PDF) — pra um fornecedor específico, lista os
   itens de todos os pedidos ainda não marcados como "Fornecedor pago"
   que usam produto(s) dele, com custo unitário e total — documento
   pronto pra mandar pro fornecedor (WhatsApp/e-mail) cobrando ou
   conferindo o que está pendente.
   ===================================================================== */
// Junta, pra um fornecedor, os itens de todos os pedidos não cancelados
// e ainda não marcados "Fornecedor pago" cujo produto está vinculado a
// esse fornecedor — com o custo (produtos.cost, o valor que a loja paga
// pro fornecedor, não o preço cobrado do cliente).
// OBS: se um produto foi apagado do cadastro depois da venda, não dá
// pra saber mais a qual fornecedor ele pertencia (o pedido só guarda o
// NOME do produto na hora da venda, não o fornecedor) — esse item fica
// de fora da nota e do total (isApprox avisa quando isso acontece, pra
// não fingir que a nota é 100% completa).
function pendingSupplierItems(supplierId) {
  const rows = [];
  let isApprox = false;
  state.orders
    .filter((o) => o.status !== "cancelado")
    .forEach((o) => {
      orderSupplierUnpaidItems(o).forEach((it) => {
        const product = state.products.find((p) => p.id === it.product_id);
        if (!product) { isApprox = true; return; }
        if (product.supplier_id !== supplierId) return;
        const variant = variantByName(product, it.variant_name);
        const unitCost = effectiveCost(product, variant);
        rows.push({
          kind: "pedido",
          orderNumber: o.order_number,
          // Normaliza pra "AAAA-MM-DD" (fuso do Brasil) já aqui — o
          // resto do código (Nota em PDF/imagem) só formata, sem
          // precisar reconverter fuso na hora de desenhar.
          date: toLocalISODate(new Date(o.created_at)),
          productName: it.product_name,
          variantName: it.variant_name,
          quantity: it.quantity,
          unitCost, subtotal: unitCost * it.quantity,
          fornecedorEntregou: !!(it.fornecedor_entregue_at || o.fornecedor_entregue_at),
        });
      });
    });

  // Compras de estoque (consignação) lançadas pra esse fornecedor e
  // ainda não marcadas como pagas — juntam na MESMA nota: pro
  // fornecedor tanto faz se a dívida veio de um pedido de cliente ou de
  // uma compra de estoque, é tudo que a loja deve pra ele.
  state.cashEntries
    .filter((e) => e.category === "Compra de estoque" && !e.paid_at && e.supplier_id === supplierId)
    .forEach((e) => {
      const product = state.products.find((p) => p.id === e.product_id);
      if (!product) { isApprox = true; return; }
      rows.push({
        kind: "estoque",
        orderNumber: null,
        date: e.entry_date, // já é "AAAA-MM-DD" (coluna date do Postgres, sem fuso envolvido)
        productName: product.name,
        variantName: e.variant_name,
        quantity: e.quantity != null ? Number(e.quantity) : null,
        unitCost: e.unit_cost != null ? Number(e.unit_cost) : null,
        subtotal: Number(e.amount),
        fornecedorEntregou: null, // não se aplica — já está na loja, só falta pagar
      });
    });

  rows.sort((a, b) => new Date(a.date) - new Date(b.date));
  const total = rows.reduce((sum, r) => sum + r.subtotal, 0);
  return { rows, total, isApprox };
}

function buildSupplierNotePdf(supplier, pending) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const pageWidth = 210;
  const pageHeight = 297;
  const margin = 15;
  const usableWidth = pageWidth - margin * 2;
  const cols = {
    pedido: { x: margin, w: 18 },
    data: { x: margin + 18, w: 18 },
    item: { x: margin + 36, w: 64 },
    qtd: { x: margin + 100, w: 10 },
    entregue: { x: margin + 110, w: 14 },
    unit: { x: margin + 124, w: 24 },
    subtotal: { x: margin + 148, w: 28 },
  };
  let y = margin;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);

  y += 6;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text(`${STORE_SUBTITLE} · CNPJ ${STORE_CNPJ}`, margin, y);

  function drawTableHeader() {
    doc.setFillColor(20, 30, 70);

    doc.setFont("helvetica", "bold");

    doc.text("Item", cols.item.x + 1, y);
    doc.text("Qtd", cols.qtd.x + cols.qtd.w - 1, y, { align: "right" });
    doc.text("Entreg.", cols.entregue.x + cols.entregue.w / 2, y, { align: "center" });
    doc.text("Custo unit.", cols.unit.x + cols.unit.w - 1, y, { align: "right" });
    doc.text("Subtotal", cols.subtotal.x + cols.subtotal.w - 1, y, { align: "right" });

    doc.setTextColor(20);

  if (pending.rows.length === 0) {
    doc.setFont("helvetica", "italic");
    doc.setFontSize(9);
    doc.text("Nenhum item pendente pra este fornecedor no momento.", margin, y + 2);
    y += 8;
  }

  pending.rows.forEach((r, idx) => {
    const itemLabel = `${r.productName}${r.variantName ? ` (${r.variantName})` : ""}`;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    const wrapped = doc.splitTextToSize(itemLabel, cols.item.w - 2);
    const rowHeight = Math.max(6, wrapped.length * 3.8 + 2.2);

    // Quebra de página: deixa espaço extra pro rodapé/total na última página.
    if (y + rowHeight > pageHeight - margin - 16) {
      doc.addPage();
      y = margin;
      drawTableHeader();
    }

    if (idx % 2 === 1) {
      doc.setFillColor(244, 245, 249);
      doc.rect(margin, y - 4, usableWidth, rowHeight, "F");
    }
    doc.setTextColor(20);
    doc.text(r.kind === "estoque" ? "Estoque" : `Nº ${String(r.orderNumber ?? "").padStart(6, "0")}`, cols.pedido.x + 1, y);
    doc.text(formatDate(r.date), cols.data.x + 1, y);
    wrapped.forEach((line, i) => doc.text(line, cols.item.x + 1, y + i * 3.8));
    doc.text(r.quantity != null ? String(r.quantity) : "—", cols.qtd.x + cols.qtd.w - 1, y, { align: "right" });
    doc.setFont("helvetica", "bold");

    else if (r.fornecedorEntregou) doc.setTextColor(16, 122, 74);
    else doc.setTextColor(180, 40, 40);
    doc.text(r.fornecedorEntregou === null ? "—" : (r.fornecedorEntregou ? "S" : "N"), cols.entregue.x + cols.entregue.w / 2, y, { align: "center" });
    doc.setTextColor(20);
    doc.setFont("helvetica", "normal");
    doc.text(r.unitCost != null ? formatBRL(r.unitCost) : "—", cols.unit.x + cols.unit.w - 1, y, { align: "right" });
    doc.text(formatBRL(r.subtotal), cols.subtotal.x + cols.subtotal.w - 1, y, { align: "right" });
    y += rowHeight;
  });

  if (y + 20 > pageHeight - margin) {
    doc.addPage();
    y = margin;
  }
  y += 3;
  doc.setDrawColor(150);
  doc.line(margin, y, margin + usableWidth, y);
  y += 7;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.text(`TOTAL: ${formatBRL(pending.total)}`, margin + usableWidth, y, { align: "right" });

  if (pending.rows.length > 0) {
    y += 6;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.5);
    doc.setTextColor(120);
    doc.text('"Entreg." = fornecedor já entregou o item pra loja: S = sim, N = ainda não.', margin, y);
    if (pending.rows.some((r) => r.fornecedorEntregou === null)) {
      y += 4;
      doc.text('"—" = item de compra de estoque (já está na loja, só falta pagar).', margin, y);
    }
  }

  if (pending.isApprox) {
    y += 8;
    doc.setFont("helvetica", "italic");
    doc.setFontSize(7.5);
    doc.setTextColor(120);
    doc.text(
      doc.splitTextToSize("* Pode haver itens (de pedidos ou de compras de estoque) cujo produto foi removido do cadastro depois — esses não entram nesta nota nem no total acima.", usableWidth),
      margin, y
    );
  }

  return doc;
}

// Mesma nota de itens pendentes, só que como texto puro pra mandar direto
// no WhatsApp do fornecedor (link "wa.me" com o texto já pronto) — sem
// precisar baixar/anexar PDF ou imagem. Detalha cada item (origem, data,
// produto, modelo, quantidade, custo unitário e subtotal) pra não sobrar
// dúvida nenhuma pro fornecedor.
function buildSupplierNoteMessage(supplier, pending) {
  const lines = [];
  lines.push(`${STORE_NAME} - ${STORE_SUBTITLE}`);
  lines.push(`CNPJ: ${STORE_CNPJ}`);
  lines.push("");
  lines.push(`Nota de itens pendentes — ${supplier.name}`);
  lines.push(`Gerado em ${formatDateTime(new Date().toISOString())}`);
  lines.push("");
  if (pending.rows.length === 0) {
    lines.push("Nenhum item pendente pra este fornecedor no momento.");
  } else {
    lines.push("Itens:");
    pending.rows.forEach((r) => {
      const originLabel = r.kind === "estoque" ? "Estoque (compra já na loja)" : `Pedido Nº ${String(r.orderNumber ?? "").padStart(6, "0")}`;
      lines.push(`• ${formatDate(r.date)} — ${originLabel}`);
      lines.push(`  ${r.quantity != null ? `${r.quantity}x ` : ""}${r.productName}${r.variantName ? ` (${r.variantName})` : ""}`);
      lines.push(`  Custo unit.: ${r.unitCost != null ? formatBRL(r.unitCost) : "—"} · Subtotal: ${formatBRL(r.subtotal)}`);
      if (r.fornecedorEntregou !== null) lines.push(`  Entregue pra loja: ${r.fornecedorEntregou ? "Sim" : "Ainda não"}`);
    });
