<script>
/* =====================================================================
   CONFIGURAÇÃO — mesmos dados do Supabase usados no index.html, mais o
   número de WhatsApp da loja (só números, com código do país e DDD,
   ex.: 55 11 91234-5678 vira "5511912345678").
   ===================================================================== */
const SUPABASE_URL = "https://xgcsdpqaqxstcfwgwaxw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_7AX1nS3J0mtVkzzzLVsKlg_zYxWFxfk";
const STORE_WHATSAPP_NUMBER = "5584991263907";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function formatBRL(v) {
  return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const app = document.getElementById("app");

const state = {
  loading: true,
  loadError: null,
  products: [],
  variantsByProduct: {}, // { [product_id]: [{id, name, photo_url, sort_order}, ...] }
  cart: {}, // { [cartKey]: quantity } — cartKey é o product_id, ou "product_id::variant_id" quando tem modelo escolhido
  selectedVariant: {}, // { [product_id]: variant_id } — modelo escolhido na página individual do produto
  cardPhotoIndex: {}, // { [product_id]: index } — foto do modelo exibida agora no carrossel automático do card
  detailProductId: null, // produto aberto na página individual
  payment: "pix", // pix | credito
  categoryFilter: "all",
  cartOpen: false,
  screen: "catalog", // catalog | product | checkout | success
  submitting: false,
  submitError: null,
};

async function loadCatalog() {
  const [{ data: products, error: prodError }, { data: variants, error: varError }] = await Promise.all([
    supabaseClient.from("catalog_products").select("*").order("category", { ascending: true, nullsFirst: false }).order("name"),
    supabaseClient.from("catalog_product_variants").select("*").order("sort_order", { ascending: true }).order("name"),
  ]);
  if (prodError) { state.loadError = prodError.message; state.loading = false; render(); return; }
  state.products = products;
  state.variantsByProduct = {};
  (variants || []).forEach((v) => {
    if (!state.variantsByProduct[v.product_id]) state.variantsByProduct[v.product_id] = [];
    state.variantsByProduct[v.product_id].push(v);
  });
  if (varError) console.error("Erro ao carregar modelos/variações:", varError.message);
  state.loading = false;
  render();
}

/* Modelos/variações de um produto (vazio se não tiver). */
function variantsFor(productId) {
  return state.variantsByProduct[productId] || [];
}

/* Modelo atualmente escolhido no card desse produto (o primeiro, por padrão). */
function currentVariant(product) {
  const variants = variantsFor(product.id);
  if (variants.length === 0) return null;
  const selectedId = state.selectedVariant[product.id];
  return variants.find((v) => v.id === selectedId) || variants[0];
}

/* Chave usada no carrinho: junta produto + modelo (quando tiver) num só item. */
function cartKey(productId, variantId) {
  return variantId ? `${productId}::${variantId}` : productId;
}
function parseCartKey(key) {
  const [productId, variantId] = key.split("::");
  return { productId, variantId: variantId || null };
}

/* =====================================================================
   CARROSSEL AUTOMÁTICO DE FOTOS DOS MODELOS (nos cards)
   ===================================================================== */

/* Lista de fotos pra girar no card — só existe quando o produto tem mais
   de um modelo com foto (senão não tem o que "passar automaticamente"). */
function carouselFrames(product) {
  const variants = variantsFor(product.id);
  if (variants.length <= 1) return [];
  const frames = variants.map((v) => v.photo_url || product.photo_url).filter(Boolean);
  return frames.length > 1 ? frames : [];
}

function stepCarousel(productId, direction) {
  const product = state.products.find((p) => p.id === productId);
  if (!product) return;
  const frames = carouselFrames(product);
  if (frames.length === 0) return;
  const current = state.cardPhotoIndex[productId] ?? 0;
  const next = (((current + direction) % frames.length) + frames.length) % frames.length;
  state.cardPhotoIndex[productId] = next;
  // Troca a foto direto no elemento (sem re-renderizar a página toda) —
  // pode ter mais de um card do mesmo produto na tela (grid + destaques).
  document.querySelectorAll(`[data-carousel-img="${productId}"]`).forEach((img) => { img.src = frames[next]; });
}

let carouselTimers = {}; // { [product_id]: intervalId }

function startCarouselTimer(productId) {
  stopCarouselTimer(productId);
  carouselTimers[productId] = setInterval(() => stepCarousel(productId, 1), 3000);
}
function stopCarouselTimer(productId) {
  if (carouselTimers[productId]) {
    clearInterval(carouselTimers[productId]);
    delete carouselTimers[productId];
  }
}

/* Liga os carrosséis automáticos depois de cada render — reaproveita um
   timer só por produto mesmo se ele aparecer em mais de um card na tela
   (grid + carrossel de destaques), e pausa enquanto o dedo/mouse está
   em cima (pra não trocar a foto bem na hora que a pessoa for decidir). */
function setupCarousels() {
  Object.keys(carouselTimers).forEach(stopCarouselTimer);
  const started = new Set();
  document.querySelectorAll("[data-carousel]").forEach((el) => {
    const productId = el.dataset.carousel;
    if (!started.has(productId)) {
      started.add(productId);
      startCarouselTimer(productId);
    }
    el.addEventListener("mouseenter", () => stopCarouselTimer(productId));
    el.addEventListener("mouseleave", () => startCarouselTimer(productId));
  });
}

function groupByCategory(products) {
  const map = new Map();
  products.forEach((p) => {
    const key = p.category && p.category.trim() ? p.category.trim() : "Outros";
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(p);
  });
  const keys = [...map.keys()].sort((a, b) => {
    if (a === "Outros") return b === "Outros" ? 0 : 1;
    if (b === "Outros") return -1;
    return a.localeCompare(b, "pt-BR");
  });
  return keys.map((key) => ({ category: key, products: map.get(key) }));
}

function priceFor(product) {
  return state.payment === "credito" ? Number(product.credit_price) : Number(product.promo_price);
}

function cartItems() {
  return Object.entries(state.cart)
    .map(([key, qty]) => {
      const { productId, variantId } = parseCartKey(key);
      const product = state.products.find((p) => p.id === productId);
      const variant = variantId ? variantsFor(productId).find((v) => v.id === variantId) ?? null : null;
      return { key, product, variant, quantity: qty };
    })
    .filter((it) => it.product && it.quantity > 0);
}

function cartCount() {
  return Object.values(state.cart).reduce((sum, q) => sum + q, 0);
}

function cartTotal() {
  return cartItems().reduce((sum, it) => sum + priceFor(it.product) * it.quantity, 0);
}

function setQty(productId, qty) {
  if (qty <= 0) delete state.cart[productId];
  else state.cart[productId] = qty;
  render();
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render() {
  if (state.loading) {
    app.innerHTML = `<main class="flex min-h-screen items-center justify-center"><p class="text-navy-400">Carregando catálogo...</p></main>`;
    return;
  }
  if (state.loadError) {
    app.innerHTML = `<main class="flex min-h-screen items-center justify-center px-4 text-center"><p class="text-red-600">Não foi possível carregar o catálogo agora. Tente novamente em instantes.</p></main>`;
    return;
  }
  if (state.screen === "success") return renderSuccess();
  if (state.screen === "checkout") return renderCheckout();
  if (state.screen === "product") return renderProductDetail();
  return renderCatalog();
}

function renderHeader() {
  return `
    <header class="bg-navy-900">
      <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
        <div class="flex items-center gap-3">
          <img src="logo-symbol.png" alt="Luz Mariana" class="h-9 w-9" />
          <span class="text-lg font-semibold tracking-wide text-cream-50">Luz Mariana</span>
        </div>
        <span class="text-sm text-cream-100">Catálogo</span>
      </div>
    </header>
  `;
}

function renderHero() {
  // A imagem já traz a logo, a mensagem de boas-vindas e as condições de
  // pagamento desenhadas nela. Em telas estreitas, corta as laterais
  // (que são só decoração) e mantém o miolo com o texto sempre visível
  // e legível — só na tela grande é que aparece a arte inteira.
  return `
    <div class="w-full overflow-hidden bg-navy-900">
      <img src="hero-banner.jpg"
        alt="Bem-vindo(a) à Luz Mariana — Fé que inspira. Presentes que têm significado. Artigos religiosos e peças de devoção para sua casa, seu cantinho de oração ou para presentear alguém especial. Condições especiais para pagamentos via Pix ou à vista."
        class="aspect-[4/3] w-full object-cover object-center sm:aspect-[2/1] lg:aspect-[3/1]" />
    </div>
  `;
}

function renderCategoryBar(categories) {
  if (categories.length === 0) return "";
  const items = [{ value: "all", label: "Todos os produtos" }, ...categories.map((c) => ({ value: c, label: c }))];
  return `
    <div class="border-b border-navy-800 bg-navy-900">
      <div class="mx-auto flex max-w-5xl gap-1 overflow-x-auto px-4 py-2 text-sm">
        ${items.map((it) => `
          <button data-category="${escapeHtml(it.value)}" class="category-bar-btn whitespace-nowrap rounded-full px-3 py-1.5 font-medium transition ${state.categoryFilter === it.value ? "bg-gold-500 text-navy-900" : "text-cream-100 hover:bg-navy-800"}">${escapeHtml(it.label)}</button>
        `).join("")}
      </div>
    </div>
  `;
}

function renderFeaturedCarousel(products) {
  if (products.length === 0) return "";
  // Duplica a lista pra dar loop contínuo sem "pulo" no final.
  const track = [...products, ...products];
  const duration = Math.max(12, products.length * 6);
  return `
    <div class="mb-8">
      <h2 class="mb-3 text-lg font-semibold text-navy-900">✨ Produtos em destaque</h2>
      <div class="featured-carousel-wrap overflow-hidden">
        <div class="featured-carousel-track flex gap-4" style="animation-duration: ${duration}s;">
          ${track.map((p) => `<div class="w-40 flex-shrink-0 sm:w-48">${renderProductCard(p, { hideDescription: true })}</div>`).join("")}
        </div>
      </div>
    </div>
  `;
}

function renderFooter() {
  return `
    <footer class="mx-auto max-w-5xl px-4 py-6 text-center">
      <a href="admin/" class="text-xs text-navy-200 hover:text-navy-400 hover:underline">Acesso Administrador</a>
    </footer>
  `;
}

function renderCatalog() {
  const grouped = groupByCategory(state.products);
  const categories = grouped.map((g) => g.category);
  const featured = state.products.filter((p) => p.featured);
  const visibleProducts = state.categoryFilter === "all"
    ? state.products
    : state.products.filter((p) => (p.category && p.category.trim() ? p.category.trim() : "Outros") === state.categoryFilter);

  app.innerHTML = `
    ${renderHeader()}
    ${renderCategoryBar(categories)}
    ${renderHero()}
    <main class="mx-auto max-w-5xl px-4 py-6">
      ${renderFeaturedCarousel(featured)}

      <div class="mb-5">
        <h2 class="text-xl font-semibold text-navy-900">${state.categoryFilter === "all" ? "Encontre algo especial para sua fé" : escapeHtml(state.categoryFilter)}</h2>
      </div>

      ${state.products.length === 0 ? `
        <p class="rounded-xl border border-navy-100 bg-white px-4 py-10 text-center text-navy-400 shadow">Nenhum produto disponível no catálogo no momento.</p>
      ` : visibleProducts.length === 0 ? `
        <p class="rounded-xl border border-navy-100 bg-white px-4 py-10 text-center text-navy-400 shadow">Nenhum produto nessa categoria.</p>
      ` : `
        <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
          ${visibleProducts.map((p) => renderProductCard(p)).join("")}
        </div>
      `}
    </main>
    ${renderFooter()}
    ${renderCartBar()}
    ${state.cartOpen ? renderCartDrawer() : ""}
  `;
  wireCatalogEvents();
}

function renderProductCard(p, opts = {}) {
  const variants = variantsFor(p.id);
  const frames = carouselFrames(p);
  const hasDescription = !opts.hideDescription && p.description && p.description.trim();

  let photoBlock;
  if (frames.length > 1) {
    // Mais de um modelo com fotos diferentes: mostra em carrossel
    // automático, com setinhas pra passar manualmente.
    const idx = (state.cardPhotoIndex[p.id] ?? 0) % frames.length;
    photoBlock = `
      <div class="relative aspect-square w-full overflow-hidden bg-cream-100" data-carousel="${p.id}">
        <button type="button" data-view-product="${p.id}" class="product-image-btn block h-full w-full border-0 p-0 transition hover:opacity-90">
          <img data-carousel-img="${p.id}" src="${frames[idx]}" alt="${escapeHtml(p.name)}" class="h-full w-full object-cover" loading="lazy" />
        </button>
        <button type="button" data-carousel-prev="${p.id}" aria-label="Modelo anterior" class="carousel-nav-btn absolute left-1 top-1/2 z-10 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded-full bg-white/85 text-lg font-semibold text-navy-900 shadow transition hover:bg-white">‹</button>
        <button type="button" data-carousel-next="${p.id}" aria-label="Próximo modelo" class="carousel-nav-btn absolute right-1 top-1/2 z-10 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded-full bg-white/85 text-lg font-semibold text-navy-900 shadow transition hover:bg-white">›</button>
      </div>
    `;
  } else {
    const photoUrl = variants[0]?.photo_url || p.photo_url;
    photoBlock = `
      <button type="button" data-view-product="${p.id}" class="product-image-btn block aspect-square w-full border-0 bg-cream-100 p-0 transition hover:opacity-90">
        ${photoUrl
          ? `<img src="${photoUrl}" alt="${escapeHtml(p.name)}" class="h-full w-full object-cover" loading="lazy" />`
          : `<div class="flex h-full w-full items-center justify-center text-navy-200"><img src="logo-symbol.png" class="h-10 w-10 opacity-40" /></div>`}
      </button>
    `;
  }

  let addBlock;
  if (variants.length > 0) {
    // Produto com modelos: escolhe o modelo aqui mesmo, na hora de
    // adicionar (a seleção "fixa" fica na página do produto).
    addBlock = `
      <div class="mt-auto flex gap-1.5" data-variant-add-group="${p.id}">
        <select class="variant-add-select min-w-0 flex-1 rounded-lg border border-navy-200 px-2 py-2 text-xs outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-200">
          ${variants.map((v) => `<option value="${v.id}">${escapeHtml(v.name)}</option>`).join("")}
        </select>
        <button type="button" class="add-variant-btn flex-shrink-0 rounded-lg bg-gold-500 px-3 py-2 text-sm font-semibold text-navy-900 transition hover:bg-gold-400">Adicionar</button>
      </div>
    `;
  } else {
    const key = cartKey(p.id, null);
    const qty = state.cart[key] ?? 0;
    addBlock = qty === 0
      ? `<button data-add="${key}" class="add-to-cart-btn mt-auto rounded-lg bg-gold-500 px-3 py-2 text-sm font-semibold text-navy-900 transition hover:bg-gold-400">Adicionar</button>`
      : `
        <div class="mt-auto flex items-center justify-between rounded-lg border border-navy-200">
          <button data-qty-minus="${key}" class="qty-btn px-3 py-1.5 text-lg font-semibold text-navy-700">−</button>
          <span class="text-sm font-semibold text-navy-900">${qty}</span>
          <button data-qty-plus="${key}" class="qty-btn px-3 py-1.5 text-lg font-semibold text-navy-700">+</button>
        </div>
      `;
  }

  return `
    <div class="flex flex-col overflow-hidden rounded-xl border border-navy-100 bg-white shadow">
      ${photoBlock}
      <div class="flex flex-1 flex-col gap-2 p-3">
        <div>
          <p class="text-sm font-medium leading-snug text-navy-900">${escapeHtml(p.name)}</p>
          <div class="mt-0.5 flex flex-wrap items-center gap-1.5">
            <button data-tag-category="${escapeHtml(p.category && p.category.trim() ? p.category.trim() : "Outros")}" class="category-tag-btn text-[11px] text-navy-400 hover:text-gold-600 hover:underline">🏷️ ${escapeHtml(p.category && p.category.trim() ? p.category.trim() : "Outros")}</button>
            ${p.material_tag ? `<span class="rounded-full bg-navy-50 px-1.5 py-0.5 text-[10px] font-medium text-navy-500 ring-1 ring-navy-100">${escapeHtml(p.material_tag)}</span>` : ""}
          </div>
        </div>

        ${hasDescription ? `<p class="text-justify text-[11px] leading-relaxed text-navy-600">${escapeHtml(p.description).replace(/\n/g, "<br>")}</p>` : ""}

        <div class="leading-tight">
          <p class="text-base font-semibold text-navy-900">${formatBRL(p.credit_price)}</p>
          <p class="text-xs text-navy-400">ou ${formatBRL(p.promo_price)} no Pix / à vista</p>
        </div>
        ${addBlock}
      </div>
    </div>
  `;
}

function renderCartBar() {
  const count = cartCount();
  if (count === 0) return "";
  return `
    <div class="fixed inset-x-0 bottom-0 z-20 border-t border-navy-100 bg-white shadow-[0_-4px_12px_rgba(0,0,0,0.08)]">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
        <span class="text-sm text-navy-600">${count} ${count === 1 ? "item" : "itens"} · <b class="text-navy-900">${formatBRL(cartTotal())}</b></span>
        <button id="open-cart-btn" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">Ver carrinho</button>
      </div>
    </div>
  `;
}

function renderCartDrawer() {
  const items = cartItems();
  return `
    <div id="cart-overlay" class="fixed inset-0 z-30 bg-navy-950/40">
      <div class="ml-auto flex h-full w-full max-w-md flex-col bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-navy-100 px-4 py-3">
          <h2 class="text-lg font-semibold text-navy-900">Seu carrinho</h2>
          <button id="close-cart-btn" class="rounded px-2 py-1 text-navy-500 hover:bg-navy-50">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto px-4 py-3">
          ${items.length === 0 ? `<p class="py-8 text-center text-navy-400">Seu carrinho está vazio.</p>` : items.map((it) => `
            <div class="flex items-center gap-3 border-b border-navy-50 py-3 last:border-0">
              <div class="h-14 w-14 flex-shrink-0 overflow-hidden rounded-lg bg-cream-100">
                ${(it.variant?.photo_url || it.product.photo_url) ? `<img src="${it.variant?.photo_url || it.product.photo_url}" class="h-full w-full object-cover" />` : ""}
              </div>
              <div class="flex-1">
                <p class="text-sm font-medium text-navy-900">${escapeHtml(it.product.name)}${it.variant ? ` <span class="font-normal text-navy-400">— ${escapeHtml(it.variant.name)}</span>` : ""}</p>
                <p class="text-xs text-navy-500">${formatBRL(priceFor(it.product))} cada</p>
              </div>
              <div class="flex items-center gap-2">
                <button data-qty-minus="${it.key}" class="qty-btn rounded border border-navy-200 px-2 text-navy-700">−</button>
                <span class="w-5 text-center text-sm font-semibold">${it.quantity}</span>
                <button data-qty-plus="${it.key}" class="qty-btn rounded border border-navy-200 px-2 text-navy-700">+</button>
              </div>
            </div>
          `).join("")}
        </div>
        <div class="border-t border-navy-100 px-4 py-4">
          <div class="mb-3 flex items-center justify-between text-sm">
            <span class="text-navy-600">Total (${state.payment === "credito" ? "cartão de crédito" : "pix / à vista"})</span>
            <span class="text-lg font-semibold text-navy-900">${formatBRL(cartTotal())}</span>
          </div>
          <button id="go-checkout-btn" ${items.length === 0 ? "disabled" : ""} class="w-full rounded-lg bg-gold-500 px-4 py-3 text-sm font-semibold text-navy-900 transition hover:bg-gold-400 disabled:cursor-not-allowed disabled:opacity-50">Continuar pedido</button>
        </div>
      </div>
    </div>
  `;
}

/* =====================================================================
   PÁGINA INDIVIDUAL DO PRODUTO
   ===================================================================== */
function renderProductDetail() {
  const product = state.products.find((p) => p.id === state.detailProductId);

  if (!product) {
    app.innerHTML = `
      ${renderHeader()}
      <main class="mx-auto max-w-3xl px-4 py-16 text-center">
        <p class="mb-4 text-navy-500">Não encontramos esse produto — talvez ele não esteja mais disponível.</p>
        <button id="back-to-catalog-btn" class="rounded-lg bg-navy-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800">&larr; Voltar ao catálogo</button>
      </main>
      ${renderFooter()}
    `;
    document.getElementById("back-to-catalog-btn").addEventListener("click", () => { state.screen = "catalog"; state.detailProductId = null; render(); });
    return;
  }

  const variants = variantsFor(product.id);
  const variant = currentVariant(product);
  const key = cartKey(product.id, variant?.id);
  const qty = state.cart[key] ?? 0;
  const photoUrl = variant?.photo_url || product.photo_url;
  const categoryLabel = product.category && product.category.trim() ? product.category.trim() : "Outros";
  const hasDescription = product.description && product.description.trim();

  app.innerHTML = `
    ${renderHeader()}
    <main class="mx-auto max-w-3xl px-4 py-6">
      <button id="back-to-catalog-btn" class="mb-4 text-sm text-navy-600 hover:underline">&larr; Voltar ao catálogo</button>
      <div class="grid gap-6 sm:grid-cols-2">
        <div>
          <div class="aspect-square w-full overflow-hidden rounded-xl bg-cream-100">
            ${photoUrl
              ? `<img src="${photoUrl}" alt="${escapeHtml(product.name)}" class="h-full w-full object-cover" />`
              : `<div class="flex h-full w-full items-center justify-center text-navy-200"><img src="logo-symbol.png" class="h-16 w-16 opacity-40" /></div>`}
          </div>
          ${variants.length > 0 ? `
            <div class="mt-3 flex flex-wrap gap-1.5">
              ${variants.map((v) => `
                <button data-variant-select="${product.id}" data-variant-id="${v.id}"
                  class="variant-swatch-btn flex items-center gap-1 rounded-full border px-2.5 py-1.5 text-xs font-medium transition ${variant?.id === v.id ? "border-gold-500 bg-gold-50 text-navy-900" : "border-navy-200 text-navy-500 hover:border-navy-300"}">
                  ${v.photo_url ? `<img src="${v.photo_url}" class="h-5 w-5 rounded-full object-cover" />` : ""}
                  ${escapeHtml(v.name)}
                </button>
              `).join("")}
            </div>
          ` : ""}
        </div>
        <div class="flex flex-col gap-3">
          <div>
            <h1 class="text-xl font-semibold text-navy-900">${escapeHtml(product.name)}</h1>
            <div class="mt-1 flex flex-wrap items-center gap-1.5">
              <button data-tag-category="${escapeHtml(categoryLabel)}" class="category-tag-btn text-xs text-navy-400 hover:text-gold-600 hover:underline">🏷️ ${escapeHtml(categoryLabel)}</button>
              ${product.material_tag ? `<span class="rounded-full bg-navy-50 px-2 py-0.5 text-[11px] font-medium text-navy-500 ring-1 ring-navy-100">${escapeHtml(product.material_tag)}</span>` : ""}
            </div>
          </div>

          ${hasDescription ? `<p class="text-justify text-sm leading-relaxed text-navy-600">${escapeHtml(product.description).replace(/\n/g, "<br>")}</p>` : ""}

          <div class="leading-tight">
            <p class="text-2xl font-semibold text-navy-900">${formatBRL(product.credit_price)}</p>
            <p class="text-sm text-navy-400">ou ${formatBRL(product.promo_price)} no Pix / à vista</p>
          </div>

          ${qty === 0 ? `
            <button data-add="${key}" class="add-to-cart-btn mt-2 w-full rounded-lg bg-gold-500 px-4 py-3 text-sm font-semibold text-navy-900 transition hover:bg-gold-400 sm:w-auto">Adicionar</button>
          ` : `
            <div class="mt-2 flex w-full max-w-[180px] items-center justify-between rounded-lg border border-navy-200">
              <button data-qty-minus="${key}" class="qty-btn px-4 py-2.5 text-lg font-semibold text-navy-700">−</button>
              <span class="text-sm font-semibold text-navy-900">${qty}</span>
              <button data-qty-plus="${key}" class="qty-btn px-4 py-2.5 text-lg font-semibold text-navy-700">+</button>
            </div>
          `}
        </div>
      </div>
    </main>
    ${renderFooter()}
    ${renderCartBar()}
    ${state.cartOpen ? renderCartDrawer() : ""}
  `;
  document.getElementById("back-to-catalog-btn").addEventListener("click", () => { state.screen = "catalog"; state.detailProductId = null; render(); });
  wireCatalogEvents();
}

function wireCatalogEvents() {
  document.querySelectorAll(".add-to-cart-btn").forEach((btn) => {
    btn.addEventListener("click", () => setQty(btn.dataset.add, 1));
  });
  document.querySelectorAll("[data-qty-plus]").forEach((btn) => {
    btn.addEventListener("click", () => setQty(btn.dataset.qtyPlus, (state.cart[btn.dataset.qtyPlus] ?? 0) + 1));
  });
  document.querySelectorAll("[data-qty-minus]").forEach((btn) => {
    btn.addEventListener("click", () => setQty(btn.dataset.qtyMinus, (state.cart[btn.dataset.qtyMinus] ?? 0) - 1));
  });
  const openBtn = document.getElementById("open-cart-btn");
  if (openBtn) openBtn.addEventListener("click", () => { state.cartOpen = true; render(); });
  const closeBtn = document.getElementById("close-cart-btn");
  if (closeBtn) closeBtn.addEventListener("click", () => { state.cartOpen = false; render(); });
  const overlay = document.getElementById("cart-overlay");
  if (overlay) overlay.addEventListener("click", (e) => { if (e.target === overlay) { state.cartOpen = false; render(); } });
  const checkoutBtn = document.getElementById("go-checkout-btn");
  if (checkoutBtn) checkoutBtn.addEventListener("click", () => { state.screen = "checkout"; state.cartOpen = false; render(); });
  document.querySelectorAll(".category-bar-btn").forEach((btn) => {
    btn.addEventListener("click", () => { state.categoryFilter = btn.dataset.category; render(); });
  });
  document.querySelectorAll(".category-tag-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.categoryFilter = btn.dataset.tagCategory;
      state.screen = "catalog";
      state.detailProductId = null;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
  document.querySelectorAll(".variant-swatch-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.selectedVariant[btn.dataset.variantSelect] = btn.dataset.variantId;
      render();
    });
  });
  document.querySelectorAll(".product-image-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.screen = "product";
      state.detailProductId = btn.dataset.viewProduct;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
  document.querySelectorAll(".add-variant-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const group = btn.closest("[data-variant-add-group]");
      const productId = group.dataset.variantAddGroup;
      const variantId = group.querySelector(".variant-add-select").value;
      const key = cartKey(productId, variantId);
      setQty(key, (state.cart[key] ?? 0) + 1);
    });
  });
  document.querySelectorAll("[data-carousel-prev]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const productId = btn.dataset.carouselPrev;
      stepCarousel(productId, -1);
      startCarouselTimer(productId);
    });
  });
  document.querySelectorAll("[data-carousel-next]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const productId = btn.dataset.carouselNext;
      stepCarousel(productId, 1);
      startCarouselTimer(productId);
    });
  });
  setupCarousels();
}

async function onSubmitOrder(e) {
  e.preventDefault();
  const errorEl = document.getElementById("ck-error");
  const submitBtn = document.getElementById("ck-submit");
  const name = document.getElementById("ck-name").value.trim();
  const whatsapp = document.getElementById("ck-whatsapp").value.trim();
  const instagram = document.getElementById("ck-instagram").value.trim().replace(/^@/, "");
  const notes = document.getElementById("ck-notes").value.trim();

  if (!name) { errorEl.textContent = "Informe seu nome."; return; }
  if (!whatsapp) { errorEl.textContent = "Informe seu WhatsApp."; return; }
  const items = cartItems();
  if (items.length === 0) { errorEl.textContent = "Seu carrinho está vazio."; return; }

  errorEl.textContent = "";
  submitBtn.disabled = true;
  submitBtn.textContent = "Enviando pedido...";

  // Abre a aba do WhatsApp já agora (síncrono, ligado ao clique) pra não
  // ser bloqueada como pop-up depois do "await" do envio pro Supabase.
  const waWindow = window.open("", "_blank");

  const orderId = crypto.randomUUID();
  const total = cartTotal();

  const { error: orderError } = await supabaseClient.from("orders").insert({
    id: orderId,
    customer_name: name,
    customer_whatsapp: whatsapp,
    customer_instagram: instagram || null,
    payment_method: state.payment,
    notes: notes || null,
    total,
  });

  if (orderError) {
    if (waWindow) waWindow.close();
    errorEl.textContent = "Não foi possível registrar o pedido: " + orderError.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "Confirmar pedido e abrir WhatsApp";
    return;
  }

  const itemRows = items.map((it) => ({
    order_id: orderId,
    product_id: it.product.id,
    product_name: it.product.name,
    variant_name: it.variant ? it.variant.name : null,
    unit_price: priceFor(it.product),
    quantity: it.quantity,
  }));
  const { error: itemsError } = await supabaseClient.from("order_items").insert(itemRows);
  if (itemsError) {
    console.error("Erro ao salvar itens do pedido:", itemsError.message);
    // O pedido em si já foi criado — segue o fluxo mesmo assim, a loja
    // ainda recebe a mensagem completa no WhatsApp.
  }

  const message = buildWhatsAppMessage({ name, whatsapp, instagram, notes, items, total, payment: state.payment });
  const waUrl = `https://wa.me/${STORE_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  if (waWindow) waWindow.location.href = waUrl;
  else window.open(waUrl, "_blank");

  state.cart = {};
  state.screen = "success";
  render();
}

function buildWhatsAppMessage({ name, whatsapp, instagram, notes, items, total, payment }) {
  const lines = [];
  lines.push(`Olá! Gostaria de fazer um pedido pelo Catálogo Luz Mariana:`);
  lines.push("");
  items.forEach((it) => {
    const variantLabel = it.variant ? ` (${it.variant.name})` : "";
    lines.push(`• ${it.quantity}x ${it.product.name}${variantLabel} — ${formatBRL(priceFor(it.product) * it.quantity)}`);
  });
  lines.push("");
  lines.push(`Total: ${formatBRL(total)}`);
  lines.push(`Pagamento: ${payment === "credito" ? "Cartão de crédito" : "Pix / à vista"}`);
  lines.push("");
  lines.push(`Nome: ${name}`);
  lines.push(`WhatsApp: ${whatsapp}`);
  if (instagram) lines.push(`Instagram: @${instagram}`);
  if (notes) lines.push(`Observações: ${notes}`);
  return lines.join("\n");
}
