name: Atualizar previews de compartilhamento

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "share/**"
      - "og-modelos/**"
      - "social-preview-manifest.json"

permissions:
  contents: write

jobs:
  gerar-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Sharp
        run: npm install sharp@^0.34.3 --no-save

      - name: Gerar páginas e imagens de compartilhamento
        run: node generate-social-previews.mjs

      - name: Salvar previews no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add share og-modelos social-preview-manifest.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos previews."
            exit 0
          fi

          git commit -m "Atualiza previews sociais dos produtos"

          # Se a branch main mudou enquanto o workflow estava rodando,
          # incorpora essas alterações antes de enviar o commit.
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
